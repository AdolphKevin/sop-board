[project]
name = "sop-board"
version = "0.1.0"
description = "Flow Board — SOP 场景验收：真实入口执行、按场景复测、守护测试"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "psycopg[binary]>=3.2"]

[project.scripts]
sop-board = "sop_board.cli:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*" }, { git = { commit = true } }]
