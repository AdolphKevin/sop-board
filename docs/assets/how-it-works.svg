<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="710" viewBox="0 0 1280 710" role="img" aria-label="Flow Board 怎么做到的：场景 YAML 经 AI 会话执行，工作台记录证据与状态；失败走修复与独立复验，独立通过的场景沉淀为守护测试，retest 不需要 AI 就能发现代码回归">
  <title>Flow Board 怎么做到的：场景 YAML 经 AI 会话执行，工作台记录证据与状态；失败走修复与独立复验，独立通过的场景沉淀为守护测试，retest 不需要 AI 就能发现代码回归</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a1a"/><stop offset="0.6" stop-color="#0b1230"/><stop offset="1" stop-color="#120a2a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/></pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/></filter>
    <marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="a-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb7185"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <style>
      .sans { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .card { fill: #0b1230; fill-opacity: .94; }
      .flow { stroke-dasharray: 4 12; animation: flow 1.2s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -16; } }
      @keyframes pulse { 0%, 100% { stroke-opacity: .25; } 50% { stroke-opacity: .9; } }
    </style>
  </defs>
  <rect width="1280" height="710" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="710" rx="20" fill="url(#grid)" opacity="0.5"/>
  <circle cx="775" cy="396" r="250" fill="#6d28d9" opacity="0.26" filter="url(#blur)"/><circle cx="300" cy="280" r="180" fill="#0891b2" opacity="0.16" filter="url(#blur)"/>
  <rect x="0.5" y="0.5" width="1279" height="709" rx="20" fill="none" stroke="#334155" stroke-opacity="0.6"/>

<text x="56" y="62" class="mono" font-size="13" letter-spacing="4" fill="#67e8f9">HOW IT WORKS</text><text x="56" y="96" class="sans" font-size="26" font-weight="800" fill="#f8fafc">场景驱动的验收闭环</text>
<g class="sans" font-size="13" fill="#cbd5e1"><circle cx="811.5" cy="80" r="6" fill="none" stroke="#60a5fa" stroke-width="2.5"/><text x="823.5" y="85">产品仓库</text><circle cx="903.5" cy="80" r="6" fill="none" stroke="#a78bfa" stroke-width="2.5"/><text x="915.5" y="85">AI 会话</text><circle cx="992.0" cy="80" r="6" fill="none" stroke="#34d399" stroke-width="2.5"/><text x="1004.0" y="85">看板</text><circle cx="1058.0" cy="80" r="6" fill="none" stroke="#22d3ee" stroke-width="2.5"/><text x="1070.0" y="85">测试同学</text><path d="M1144.0 80 h22" stroke="#fb7185" stroke-width="2" stroke-dasharray="5 4"/><text x="1174.0" y="85">失败回退</text></g>
<path d="M280 396.0 H350" fill="none" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.35" marker-end="url(#a-blue)"/><path d="M280 396.0 H350" fill="none" stroke="#bfdbfe" stroke-width="2" class="flow"/>
<path d="M580 396.0 H660" fill="none" stroke="#a78bfa" stroke-width="2" stroke-opacity="0.35" marker-end="url(#a-violet)"/><path d="M580 396.0 H660" fill="none" stroke="#c4b5fd" stroke-width="2" class="flow"/>
<path d="M890 384.0 H1000" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#a-cyan)"/>
<text x="945.0" y="374.0" text-anchor="middle" class="sans" font-size="11.5" fill="#67e8f9">待人工复核</text>
<path d="M1000 408.0 H890" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#a-cyan)"/>
<text x="945.0" y="430.0" text-anchor="middle" class="sans" font-size="11.5" fill="#67e8f9">标注即结论</text>
<path d="M830.0 340 V248" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a-rose)"/>
<text x="842.0" y="298.0" text-anchor="start" class="sans" font-size="12" fill="#fda4af">失败</text>
<path d="M660 192.0 H465.0 V340" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#a-violet)"/>
<text x="562.5" y="182.0" text-anchor="middle" class="sans" font-size="12" fill="#c4b5fd">另一会话独立复验</text>
<path d="M775.0 452 V544" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.35" marker-end="url(#a-green)"/><path d="M775.0 452 V544" fill="none" stroke="#6ee7b7" stroke-width="2" class="flow"/>
<text x="787.0" y="502.0" text-anchor="start" class="sans" font-size="12" fill="#6ee7b7">独立通过 · 待沉淀</text>
<path d="M660 600.0 H580" fill="none" stroke="#a78bfa" stroke-width="2" stroke-opacity="0.35" marker-end="url(#a-violet)"/><path d="M660 600.0 H580" fill="none" stroke="#c4b5fd" stroke-width="2" class="flow"/>
<path d="M550 544 L690 452" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#a-green)"/>
<text x="566" y="496.0" text-anchor="end" class="sans" font-size="12" fill="#6ee7b7">通过，状态不变</text>
<path d="M440.0 544 V452" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a-rose)"/>
<text x="428.0" y="502.0" text-anchor="end" class="sans" font-size="12" fill="#fda4af">未通过，转待复测</text>
<g transform="translate(50 340)" filter="url(#shadow)" class="sans"><rect class="card" width="230" height="112" rx="16" stroke="#60a5fa" stroke-width="1.5"/><text x="214" y="29" text-anchor="end" class="mono" font-size="11" letter-spacing="1" fill="#bfdbfe">PRODUCT REPO</text><text x="16" y="53.5" font-size="16" font-weight="700" fill="#f1f5f9">场景 YAML</text><text x="16" y="74.5" font-size="13" fill="#94a3b8">放在产品仓库，随分支走</text><text x="16" y="94.5" font-size="13" fill="#94a3b8">会话编辑，开发者审核提交</text></g>
<g transform="translate(350 340)" filter="url(#shadow)" class="sans"><rect class="card" width="230" height="112" rx="16" stroke="#a78bfa" stroke-width="1.5"/><rect x="16" y="13" width="39" height="22" rx="11" fill="#a78bfa" fill-opacity="0.15"/><text x="35.5" y="29" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#c4b5fd">run</text><text x="214" y="29" text-anchor="end" class="mono" font-size="11" letter-spacing="1" fill="#c4b5fd">AGENT</text><text x="16" y="53.5" font-size="16" font-weight="700" fill="#f1f5f9">AI 会话执行场景</text><text x="16" y="74.5" font-size="13" fill="#94a3b8">打开页面、调接口、查数据</text><text x="16" y="94.5" font-size="13" fill="#94a3b8">经真实入口，逐步留证</text></g>
<g transform="translate(660 340)" filter="url(#shadow)" class="sans"><rect x="-4" y="-4" width="238" height="120" rx="21" fill="none" stroke="#34d399" stroke-width="2" class="pulse"/><rect class="card" width="230" height="112" rx="16" stroke="#34d399" stroke-width="1.5"/><rect x="16" y="13" width="57" height="22" rx="11" fill="#34d399" fill-opacity="0.15"/><text x="44.5" y="29" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#6ee7b7">serve</text><text x="214" y="29" text-anchor="end" class="mono" font-size="11" letter-spacing="1" fill="#6ee7b7">BOARD</text><text x="16" y="53.5" font-size="16" font-weight="700" fill="#f1f5f9">工作台</text><text x="16" y="74.5" font-size="13" fill="#94a3b8">证据与状态</text><text x="16" y="94.5" font-size="13" fill="#94a3b8">按场景内容指纹记录</text></g>
<g transform="translate(1000 340)" filter="url(#shadow)" class="sans"><rect class="card" width="230" height="112" rx="16" stroke="#22d3ee" stroke-width="1.5"/><text x="214" y="29" text-anchor="end" class="mono" font-size="11" letter-spacing="1" fill="#67e8f9">HUMAN</text><text x="16" y="53.5" font-size="16" font-weight="700" fill="#f1f5f9">测试同学复测标注</text><text x="16" y="74.5" font-size="13" fill="#94a3b8">复核 Agent 判的通过</text><text x="16" y="94.5" font-size="13" fill="#94a3b8">标不通过即显示为失败</text></g>
<g transform="translate(660 136)" filter="url(#shadow)" class="sans"><rect class="card" width="230" height="112" rx="16" stroke="#a78bfa" stroke-width="1.5"/><rect x="16" y="13" width="39" height="22" rx="11" fill="#a78bfa" fill-opacity="0.15"/><text x="35.5" y="29" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#c4b5fd">fix</text><text x="214" y="29" text-anchor="end" class="mono" font-size="11" letter-spacing="1" fill="#c4b5fd">AGENT</text><text x="16" y="53.5" font-size="16" font-weight="700" fill="#f1f5f9">修复</text><text x="16" y="74.5" font-size="13" fill="#94a3b8">改代码后 fix submit</text><text x="16" y="94.5" font-size="13" fill="#94a3b8">复验通过且已提交才关闭</text></g>
<g transform="translate(660 544)" filter="url(#shadow)" class="sans"><rect class="card" width="230" height="112" rx="16" stroke="#a78bfa" stroke-width="1.5"/><rect x="16" y="13" width="75" height="22" rx="11" fill="#a78bfa" fill-opacity="0.15"/><text x="53.5" y="29" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#c4b5fd">distill</text><text x="214" y="29" text-anchor="end" class="mono" font-size="11" letter-spacing="1" fill="#c4b5fd">AGENT</text><text x="16" y="53.5" font-size="16" font-weight="700" fill="#f1f5f9">沉淀守护测试</text><text x="16" y="74.5" font-size="13" fill="#94a3b8">把场景写成测试</text><text x="16" y="94.5" font-size="13" fill="#94a3b8">登记进 regression.yaml</text></g>
<g transform="translate(350 544)" filter="url(#shadow)" class="sans"><rect class="card" width="230" height="112" rx="16" stroke="#34d399" stroke-width="1.5"/><rect x="16" y="13" width="66" height="22" rx="11" fill="#34d399" fill-opacity="0.15"/><text x="49.0" y="29" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#6ee7b7">retest</text><text x="214" y="29" text-anchor="end" class="mono" font-size="11" letter-spacing="1" fill="#6ee7b7">NO AI</text><text x="16" y="53.5" font-size="16" font-weight="700" fill="#f1f5f9">运行守护测试</text><text x="16" y="74.5" font-size="13" fill="#94a3b8">发现代码回归</text><text x="16" y="94.5" font-size="13" fill="#94a3b8">直接运行，不需要 AI</text></g>
</svg>
