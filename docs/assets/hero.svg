<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Flow Board：SOP 驱动的 AI 验收闭环引擎">
  <title>Flow Board：SOP 驱动的 AI 验收闭环引擎</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a1a"/>
      <stop offset="0.55" stop-color="#0b1230"/>
      <stop offset="1" stop-color="#140b2e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0b1230"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .spin { transform-origin: 1010px 210px; animation: spin 40s linear infinite; }
      .spin-rev { transform-origin: 1010px 210px; animation: spin 60s linear infinite reverse; }
      .pulse { transform-origin: 1010px 210px; animation: pulse 3s ease-in-out infinite; }
      .blink { animation: blink 1.6s steps(2, start) infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(1); } 50% { opacity: .8; transform: scale(1.06); } }
      @keyframes blink { to { visibility: hidden; } }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="20" fill="url(#grid)" opacity="0.55"/>
  <circle cx="1010" cy="210" r="170" fill="#7c3aed" opacity="0.35" filter="url(#blur)"/>
  <circle cx="180" cy="40" r="140" fill="#0891b2" opacity="0.30" filter="url(#blur)"/>
  <rect width="1280" height="420" rx="20" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="20" fill="none" stroke="#334155" stroke-opacity="0.6"/>

  <!-- 左侧文字 -->
  <g class="mono" font-size="15" letter-spacing="4">
    <circle cx="78" cy="78" r="5" fill="#22d3ee" filter="url(#glow)"/>
    <text x="94" y="83" fill="#67e8f9">FLOW BOARD</text>
    <text x="250" y="83" fill="#475569">//</text>
    <text x="282" y="83" fill="#94a3b8">sop-board</text>
  </g>

  <g class="sans" font-weight="800">
    <text x="72" y="168" font-size="58" fill="#f8fafc">SOP 驱动的</text>
    <text x="72" y="240" font-size="58" fill="url(#title)">AI 验收闭环引擎</text>
  </g>
  <rect x="520" y="196" width="4" height="52" fill="#a78bfa" class="blink"/>

  <text x="72" y="290" class="sans" font-size="18" fill="#94a3b8">
    用例上传 <tspan fill="#475569">→</tspan> 智能合并 <tspan fill="#475569">→</tspan> Agent 黑盒验证 <tspan fill="#475569">→</tspan> 人工复核 <tspan fill="#475569">→</tspan> 根因修复 <tspan fill="#475569">→</tspan> 独立复测
  </text>

  <g class="mono" font-size="14">
    <g transform="translate(72 324)">
      <rect width="104" height="32" rx="16" fill="#0e7490" fill-opacity="0.18" stroke="#22d3ee" stroke-opacity="0.6"/>
      <text x="52" y="21" text-anchor="middle" fill="#a5f3fc">SOP-first</text>
    </g>
    <g transform="translate(188 324)">
      <rect width="88" height="32" rx="16" fill="#4c1d95" fill-opacity="0.25" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text x="44" y="21" text-anchor="middle" fill="#ddd6fe">Codex</text>
    </g>
    <g transform="translate(288 324)">
      <rect width="120" height="32" rx="16" fill="#14532d" fill-opacity="0.25" stroke="#4ade80" stroke-opacity="0.6"/>
      <text x="60" y="21" text-anchor="middle" fill="#bbf7d0">Playwright</text>
    </g>
    <g transform="translate(420 324)">
      <rect width="120" height="32" rx="16" fill="#1e3a8a" fill-opacity="0.3" stroke="#60a5fa" stroke-opacity="0.6"/>
      <text x="60" y="21" text-anchor="middle" fill="#bfdbfe">Jira Cloud</text>
    </g>
    <g transform="translate(552 324)">
      <rect width="148" height="32" rx="16" fill="#78350f" fill-opacity="0.25" stroke="#f59e0b" stroke-opacity="0.6"/>
      <text x="74" y="21" text-anchor="middle" fill="#fde68a">Local-first</text>
    </g>
  </g>

  <!-- 右侧闭环轨道 -->
  <circle cx="1010" cy="210" r="160" fill="none" stroke="#1e293b" stroke-width="1"/>
  <g class="spin-rev">
    <circle cx="1010" cy="210" r="160" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2 10"/>
  </g>
  <g class="spin">
    <circle cx="1010" cy="210" r="120" fill="none" stroke="url(#ring)" stroke-width="2.5" stroke-dasharray="180 40 60 40" stroke-linecap="round" opacity="0.9"/>
  </g>
  <circle cx="1010" cy="210" r="82" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.5" class="pulse"/>
  <circle cx="1010" cy="210" r="62" fill="url(#core)" stroke="#818cf8" stroke-width="1.5"/>
  <text x="1010" y="214" text-anchor="middle" class="mono" font-size="28" font-weight="700" fill="#e0e7ff" letter-spacing="2">SOP</text>
  <text x="1010" y="238" text-anchor="middle" class="sans" font-size="12" fill="#a5b4fc">唯一验收标准</text>

  <!-- 轨道上的流动光点 -->
  <circle r="5" fill="#67e8f9" filter="url(#glow)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M1010 90 a120 120 0 1 1 -0.01 0"/>
  </circle>
  <circle r="3.5" fill="#c084fc" filter="url(#glow)">
    <animateMotion dur="8s" begin="-4s" repeatCount="indefinite" path="M1010 90 a120 120 0 1 1 -0.01 0"/>
  </circle>

  <!-- 五个阶段节点：角度 -90, -18, 54, 126, 198，半径 160 -->
  <g class="sans" font-size="13" font-weight="600">
    <g transform="translate(1010 50)">
      <circle r="24" fill="#0b1230" stroke="#22d3ee" stroke-width="2"/>
      <text y="5" text-anchor="middle" class="mono" fill="#67e8f9" font-size="13">01</text>
      <text x="34" y="5" fill="#e2e8f0">上传合并</text>
    </g>
    <g transform="translate(1162 161)">
      <circle r="24" fill="#0b1230" stroke="#a78bfa" stroke-width="2"/>
      <text y="5" text-anchor="middle" class="mono" fill="#c4b5fd" font-size="13">02</text>
      <text x="0" y="46" text-anchor="middle" fill="#e2e8f0">Agent 验证</text>
    </g>
    <g transform="translate(1104 339)">
      <circle r="24" fill="#0b1230" stroke="#22d3ee" stroke-width="2"/>
      <text y="5" text-anchor="middle" class="mono" fill="#67e8f9" font-size="13">03</text>
      <text x="34" y="5" fill="#e2e8f0">人工复核</text>
    </g>
    <g transform="translate(916 339)">
      <circle r="24" fill="#0b1230" stroke="#a78bfa" stroke-width="2"/>
      <text y="5" text-anchor="middle" class="mono" fill="#c4b5fd" font-size="13">04</text>
      <text x="-34" y="5" text-anchor="end" fill="#e2e8f0">根因修复</text>
    </g>
    <g transform="translate(858 161)">
      <circle r="24" fill="#0b1230" stroke="#34d399" stroke-width="2"/>
      <text y="5" text-anchor="middle" class="mono" fill="#6ee7b7" font-size="13">05</text>
      <text x="0" y="46" text-anchor="middle" fill="#e2e8f0">状态回写</text>
    </g>
  </g>
</svg>
