# v10 现行场景：浏览器代理（CfT 安装与启动、身份 profile、真人登录与交还、崩溃记受阻、会话中启动的守护进程、声明的测试账号由会话直接登录）
# 预期依据：docs/design.md（2026-11-10 blur.yin 批准）。版本 1 由未参与实现的审核方在实现前编写；实现与返工会话只读本文件。
#   版本 2 由未参与实现的审核方按 docs/design.md 已定决策 15～17（使用者 2026-11-11 需求）修订：BRW-03 改为真人完成后用 browser release 交还、
#   之后的运行沿用同一浏览器进程与窗口，新增 BRW-03-P02（运行中交给真人再交还）与 BRW-06（声明的测试账号由会话直接登录）。
# 共用前置：演示项目同 setup.yaml 文件头（项目 demo，数据目录 $D，Web 场景 shop#W 使用身份 merchant，即演示项目声明的合成测试账号，凭据只经环境变量）。
#   另需：看板已以 sop-board serve demo --data $D --lan 启动（BRW-05、BRW-06 由会话自己启动或沿用）；用户日常 Google Chrome 以其默认 profile 打开，
#   开始前记录其进程号、profile 目录文件清单与 mtime，以及 ~/Library/Caches/ms-playwright 的清单与 mtime。
#   演示项目没有真实账号、人机验证与二次验证：只能由真人完成的步骤用“真人在窗口中输入合成账号密码”或“未声明的账号”（BRW-06-N01）代替，
#   各场景的 initial_state 注明替代做法与未覆盖范围。
#   版本 3 由未参与实现的审核方按 docs/design.md 已定决策 22（使用者 2026-11-12 决定）修订：等人处理的事（真人登录、人机验证等）由“记受阻”改为“记未执行并登记待人处理”，
#   涉及 BRW-03-P02、BRW-06-P01、BRW-06-N01；浏览器崩溃、启动即中止与 browser may not be secure 仍记受阻。
#   版本 4 由未参与实现的审核方按 docs/design.md 已定决策 24（使用者 2026-11-12 同意）修订：调试端口被占用时顺延到下一个空闲端口，
#   BRW-02 的规则与 BRW-02-P01 的端口预期随之改写，新增 BRW-02-N01。
#   版本 5 由未参与实现的审核方按统一验收（2026-11-12）指出的问题修订 BRW-02 的起点与日常 Chrome 的预期：演示项目的登录态不跨浏览器进程保留，
#   起点改为由执行者用声明的凭据登录；日常 Chrome 开着时它自己会写 profile，预期改为没有 CfT 进程打开或写入它。
#   版本 6 由未参与实现的审核方按 docs/design.md 已定决策 26（使用者 2026-11-13 决定）修订：新增 BRW-07（看板重启后保留有界面的浏览器窗口）。
#   BRW-07 的有界面窗口由执行者用 browser open --headed 打开，并用声明的合成账号登录，不需要真人；窗口会出现在执行机器的屏幕上。
#   版本 7 由未参与实现的审核方按决策 26 独立验收（2026-11-13）的结果修订：有界面的窗口核对不通过时不再结束（新增 BRW-07-N03）；
#   BRW-07-P02 写明环境先停掉、原有运行目录不得被删除。BRW-07-P01、P02 的“不出现登录表单”依赖演示商城的登录会话在商城进程重启后仍然有效。

metadata:
  requirement: "sop-board v10：守护进程用自带运行时安装并启动 Chrome for Testing，按 检出×身份 使用独立持久 profile；真人在有界面的 CfT 窗口完成登录或验证后用 browser release 交还，之后的运行沿用同一浏览器进程与窗口，browser close 才结束浏览器；声明的测试账号由执行会话直接登录，只把真人才能完成的步骤交给人，等人处理的场景记未执行并登记待人处理；浏览器崩溃或启动即中止记为受阻；serve 可在会话中启动；不碰用户日常 Chrome"
  version: 7
  owner: "blur.yin"
  status: confirmed
  sources:
    - ref: "docs/design.md"
      version: "2026-11-10"
      confirmed_by: "blur.yin"
    - ref: "使用者 2026-11-10 对场景集待确认问题的答复"
      version: "2026-11-10"
      confirmed_by: "blur.yin"
    - ref: "使用者 2026-11-11 需求（cw2 实际使用复盘：左栏展开收起与隐藏、真人完成后不关浏览器、声明的测试账号即授权）"
      version: "2026-11-11"
      confirmed_by: "blur.yin"
    - ref: "docs/design.md 已定决策 22：环境按产品来（未执行与受阻的分界：等人处理的事记未执行）"
      version: "2026-11-12"
      confirmed_by: "blur.yin"
    - ref: "docs/design.md 已定决策 24：浏览器调试端口被占用时顺延"
      version: "2026-11-12"
      confirmed_by: "blur.yin"
    - ref: "docs/design.md 已定决策 26：看板重启后保留有界面的浏览器窗口"
      version: "2026-11-13"
      confirmed_by: "blur.yin"
  tags: ["browser", "chrome-for-testing", "identity", "crash", "release", "declared-account"]

sops:
  - id: BRW-01
    title: 安装自带浏览器运行时
    actor: 开发者
    entry: "sop-board browser install、browser status"
    negative_exempt: "安装失败只来自 npm 或网络等外部依赖，不是业务规则；运行时缺失时的提示见 SET-05-N01"
    scenarios:
      - id: BRW-01-P01
        polarity: positive
        title: 安装固定版本的 Playwright 与 CfT，不使用共享缓存
        actor: 开发者
        priority: P0
        verify: cli
        initial_state: ["本机级运行时目录（SOP_BOARD_HOME 或 ~/.sop-board 下的 runtime）尚未安装", "共享缓存 ~/Library/Caches/ms-playwright 中只有其他版本的浏览器"]
        steps: ["运行 sop-board browser install", "运行 sop-board browser status --json", "查看运行时目录下的 runtime.json 与 browsers 目录"]
        expected:
          - "运行时目录中安装了 @playwright/test 1.64.1（来自随包 lock 文件）"
          - "browsers 目录下有 chromium 修订 1248 的 Chrome for Testing 与 ffmpeg，没有 headless shell、WebKit 或 Firefox"
          - "runtime.json 记录 CfT 可执行文件路径与版本，路径位于运行时的 browsers 目录下；browser status 显示相同的路径与版本"
          - "运行时位于 SOP_BOARD_HOME（缺省 ~/.sop-board）下，不在 $D 下"
        forbidden_effects: ["向 ~/Library/Caches/ms-playwright 写入或改动任何文件", "读取或改写 ~/.sop-board/node_modules"]
        refs: ["docs/design.md#浏览器代理（问题 5、6）"]
        evidence_hints: ["安装输出", "runtime.json", "browsers 目录清单", "ms-playwright 缓存前后清单对比"]

  - id: BRW-02
    title: Web 运行使用守护进程启动的 CfT 与独立 profile
    actor: 执行会话
    entry: "sop-board run prepare 写出的 runs/<编号>/run.env，执行者经 CDP 连接"
    must:
      - "每个 检出×身份 一个浏览器，profile 为 <数据目录>/browsers/<检出>/<身份>/profile，缺省端口为 9400 + 槽位×20 + 身份序号"
      - "缺省端口被别的进程占用时顺延到下一个空闲端口，不报错；实际端口写在 run.env 与 browser status 里，不干扰占用缺省端口的进程"
      - "执行者只通过 CDP 连接，不启动浏览器，也不运行 playwright install"
      - "不碰用户日常 Chrome"
    scenarios:
      - id: BRW-02-P01
        polarity: positive
        title: main 与 wt1 的 Web 运行各用一个无头 CfT，日常 Chrome 不受影响
        actor: 执行会话
        priority: P0
        verify: cli
        initial_state: ["浏览器运行时已安装（BRW-01-P01）", "身份 merchant 是声明的测试账号：profile 没有登录态时，由执行者先 identity record 再用声明的凭据登录，登录不录进证据", "没有运行中的 CfT"]
        steps:
          - "在 main 运行 sop-board run prepare --scope shop#W --session S1，读取 runs/<编号>/run.env"
          - "用 ps 查看新出现的浏览器进程的可执行文件、命令行参数与父进程；curl PW_CDP_ENDPOINT 的 /json/version"
          - "执行者用 playwright-acceptance 模板经 PW_CDP_ENDPOINT 执行 shop#W 并 run submit"
          - "在 wt1 重复以上步骤（会话 S2）"
          - "检查日常 Chrome 的进程号、profile 目录清单与 mtime，以及 ms-playwright 缓存清单"
        expected:
          - "run.env 含 PW_CDP_ENDPOINT、PW_IDENTITIES（merchant 带 endpoint）、PLAYWRIGHT_BROWSERS_PATH（运行时的 browsers 目录）、PW_NODE_ROOT，以及取自 adapter ready 输出的入口地址变量"
          - "浏览器可执行文件为 runtime.json 记录的 CfT，父进程是 sop-board serve 守护进程"
          - "main 的参数含 --user-data-dir=$D 下的 browsers/main/merchant/profile、--remote-debugging-port（缺省端口 9400 + merchant 序号；它被别的进程占用时为顺延后的端口，与 run.env 一致）、--no-first-run、--no-default-browser-check、--use-mock-keychain、--headless=new，不含 --enable-automation"
          - "wt1 的 CfT 使用 browsers/wt1/merchant/profile 与缺省端口 9400 + s1×20 + merchant 序号（被占用时为顺延后的端口），两个浏览器同时存在"
          - "/json/version 有应答；shop#W 的结果在两个检出各自登记并附截图证据"
          - "日常 Chrome 进程号不变，没有 CfT 进程打开或写入日常 Chrome 的 profile 目录，ms-playwright 缓存没有变化"
        forbidden_effects:
          - "启动、结束、连接或改动用户日常 Chrome 及其 profile"
          - "执行者自行启动浏览器或运行 playwright install"
          - "使用共享 ms-playwright 缓存或 WebKit"
          - "两个检出共用一个 profile"
        refs: ["docs/design.md#浏览器代理（问题 5、6）", "使用者 2026-11-10 对场景集待确认问题的答复 第 7 条"]
        evidence_hints: ["run.env（凭据脱敏）", "ps 输出", "/json/version 响应", "日常 Chrome 与缓存前后对比"]
      - id: BRW-02-N01
        polarity: negative
        negative_type: concurrency
        title: 缺省调试端口被别的进程占用时顺延到下一个空闲端口，Web 运行照常
        actor: 执行会话
        priority: P0
        verify: cli
        initial_state:
          - "浏览器运行时已安装；没有运行中的 CfT；身份 merchant 是声明的测试账号，profile 没有登录态时由执行者先 identity record 再用声明的凭据登录"
          - "main 检出上 merchant 的缺省调试端口（9400 + merchant 序号）正被一个与项目无关的进程监听，记录它的进程号"
        steps:
          - "在 main 运行 sop-board run prepare --scope shop#W --session S1 --json，读取 runs/<编号>/run.env"
          - "运行 sop-board browser status --json；用 ps 查看 CfT 的 --remote-debugging-port；curl PW_CDP_ENDPOINT 的 /json/version"
          - "执行者经 PW_CDP_ENDPOINT 执行 shop#W 并 run submit"
          - "查看占用缺省端口的那个进程"
        expected:
          - "run prepare 成功，没有因为缺省端口被占用而报错"
          - "CfT 的调试端口是缺省端口之后的一个空闲端口；browser status 显示这个实际端口；run.env 的 PW_CDP_ENDPOINT 与 PW_IDENTITIES 中 merchant 的 endpoint 都指向它"
          - "/json/version 有应答；shop#W 的结果登记成功并附截图证据"
          - "占用缺省端口的进程仍在运行，进程号不变"
        forbidden_effects:
          - "run prepare 或浏览器启动因缺省端口被占用而失败"
          - "结束或干扰占用缺省端口的进程"
          - "run.env 给出的端口与 CfT 实际监听的端口不一致"
        refs: ["docs/design.md#浏览器代理（问题 5、6）", "docs/design.md#已定决策（2026-11-10 用户答复）"]
        evidence_hints: ["占用缺省端口的进程前后的 ps 与 lsof 输出", "run prepare 输出与 run.env（凭据脱敏）", "browser status 输出", "/json/version 响应", "shop#W 的结果与截图"]

  - id: BRW-03
    title: 真人在有界面的 CfT 窗口完成登录或验证，用 browser release 交还
    actor: 开发者
    entry: "sop-board browser open --identity merchant [--headed]、browser release、browser status、browser close"
    must:
      - "有界面窗口与无头运行使用同一份 profile；真人操作期间持有 human 租约，期间该身份的 Web 运行返回 browser-busy"
      - "browser release 只解除 human 租约，窗口与页面保持打开；之后取得租约的运行和不带 --headed 的 browser open 都沿用这个浏览器进程，不重启成无头"
      - "browser close 结束浏览器并释放租约，只在要关掉浏览器时使用"
      - "出现 browser may not be secure 时停止，该身份的场景记为受阻并写明原文；不回退到用户日常 Chrome，也不改 UA 或参数绕过"
    negative_exempt: "窗口已开着时再运行 browser open --headed 只取得 human 租约、不重启，属于确定性分支，验收后沉淀为单元测试；browser may not be secure 无法在演示项目中触发，列为未覆盖范围"
    scenarios:
      - id: BRW-03-P01
        polarity: positive
        title: 真人在有界面窗口登录后用 browser release 交还，之后的运行沿用同一窗口，browser close 才结束浏览器
        actor: 开发者
        priority: P0
        verify: web
        initial_state:
          - "浏览器运行时已安装；没有运行中的 CfT；merchant 的 profile 尚未登录过演示项目"
          - "替代做法：演示项目没有真实账号，本场景由真人在窗口中输入合成账号 merchant 的密码，代表只能由真人登录的账号"
        steps:
          - "在 main 运行 sop-board browser open --identity merchant --headed，用 ps 记录 merchant 的 CfT 进程号与参数"
          - "用户在弹出的 CfT 窗口中输入合成账号的用户名与密码并登录，停留在订单页"
          - "运行 sop-board browser status，再运行 sop-board browser release，再运行 browser status；用 ps 查看 CfT 进程，curl 该 CfT 调试端口的 /json/list"
          - "运行 sop-board run prepare --scope shop#W --session S1，读取 run.env；执行者经 PW_CDP_ENDPOINT 执行 shop#W 并 run submit；期间用 ps 查看 CfT 进程"
          - "运行 sop-board browser open --identity merchant（不带 --headed），再运行 sop-board browser status；用 ps 查看 CfT 进程与窗口"
          - "运行 sop-board browser close，用 ps 与 browser status 查看；再运行 sop-board run prepare --scope shop#W --session S2，用 ps 查看新启动的 CfT 的参数"
        expected:
          - "弹出的是有界面的 Chrome for Testing 窗口（不是日常 Chrome），打开的是演示项目入口地址，参数不含 --headless=new"
          - "release 前 browser status 显示 merchant 由 human 租约持有；release 后 human 租约解除，CfT 进程号不变，窗口仍开着，/json/list 中仍有登录后的订单页"
          - "S1 的 run prepare 成功（不是 browser-busy），没有启动新的浏览器进程：CfT 进程号与 release 前相同，参数仍不含 --headless=new，PW_CDP_ENDPOINT 指向这个窗口的调试端口"
          - "执行者打开入口时已是 merchant 登录状态，不出现登录表单；shop#W 结果登记成功并附截图"
          - "不带 --headed 的 browser open 之后 browser status 显示 merchant 没有 human 租约（holder 为空）；CfT 进程号不变，仍是有界面窗口，订单页仍在"
          - "browser close 后该 CfT 进程结束，browser status 显示 merchant 的浏览器未运行且没有租约"
          - "close 之后 S2 的 run prepare 启动了新的 CfT：参数含 --headless=new，--user-data-dir 与有界面窗口相同"
        forbidden_effects:
          - "browser release 结束浏览器进程，或关闭窗口、页面"
          - "release 之后的运行或不带 --headed 的 browser open 重启浏览器、改成无头，或为 merchant 另起一个 CfT"
          - "看板代填密码"
          - "打开或改动用户日常 Chrome"
          - "为绕过检测修改 UA 或启动参数"
        refs: ["docs/design.md#浏览器代理（问题 5、6）", "docs/design.md#已定决策（2026-11-10 用户答复）", "使用者 2026-11-11 需求（cw2 实际使用复盘）"]
        evidence_hints: ["有界面窗口截图（不含密码）", "各步骤的 ps 输出（进程号、父进程、参数）", "release 前后的 browser status 与 /json/list", "run.env（凭据脱敏）", "订单页截图"]
      - id: BRW-03-P02
        polarity: positive
        title: 运行中遇到只能由真人完成的步骤，真人在同一窗口完成并交还，重跑沿用该窗口，不再重复
        actor: 开发者
        priority: P0
        verify: web
        initial_state:
          - "上一次运行中 shop#W 因 merchant 需要真人登录记为未执行，并有对应的待人处理（按 BRW-06-N01 产生：merchant 未声明为测试账号）；shop#W 的状态为未执行"
          - "merchant 的 CfT 由守护进程无头运行或未运行，没有 human 租约"
          - "替代做法：演示项目没有人机验证，以“未声明账号需要真人登录”代替；演示登录写入的会话 cookie 不带过期时间，与真人在窗口里通过的人机验证、证书例外一样只在同一浏览器进程内有效。真实网站的人机验证、二次验证与证书例外未覆盖，在记录中注明"
        steps:
          - "开发者在工作台 shop#W 的详情看到最近一次未执行及原因、在 sop-board attention list 看到对应的待人处理后，在 main 运行 sop-board browser open --identity merchant --headed"
          - "在弹出的 CfT 窗口中输入 merchant 的用户名与密码并登录，停留在订单页；用 ps 记录 merchant 的 CfT 进程号与参数"
          - "运行 sop-board browser release 与 browser status，用 ps 查看 CfT 进程；运行 sop-board attention resolve <该待人处理编号>"
          - "运行 sop-board run prepare --scope shop#W --session S2，执行者经 PW_CDP_ENDPOINT 重跑 shop#W 并 run submit；期间用 ps 查看 CfT 进程"
          - "在工作台打开 shop#W 并展开历史，运行 sop-board attention list"
        expected:
          - "browser open --headed 弹出有界面的 CfT 窗口并打开演示项目入口；merchant 在 main 只有这一个 CfT 进程，参数不含 --headless=new"
          - "release 后 human 租约解除，CfT 进程号不变，窗口与登录后的订单页仍然打开"
          - "重跑的 run prepare 成功，没有启动新的浏览器进程：CfT 进程号与 release 前相同，仍是有界面窗口"
          - "重跑的执行者直接看到订单页，没有出现登录页；shop#W 登记为通过并附截图"
          - "工作台 shop#W 显示通过，历史中只有这条通过，没有受阻的结果；attention list 中该待人处理已解决"
        forbidden_effects:
          - "browser release 结束浏览器进程，或关闭窗口、页面"
          - "重跑重启浏览器、改成无头，或为 merchant 另起一个 CfT"
          - "重跑时要求真人再次登录或验证"
          - "重跑的执行者自行输入 merchant 的密码登录"
          - "回退到用户日常 Chrome"
        refs: ["docs/design.md#浏览器代理（问题 5、6）", "docs/design.md#已定决策（2026-11-10 用户答复）", "使用者 2026-11-11 需求（cw2 实际使用复盘）"]
        evidence_hints: ["工作台未执行与通过的截图", "attention list 前后输出", "各步骤的 ps 输出", "release 前后的 browser status", "重跑的订单页截图"]
      - id: BRW-03-N01
        polarity: negative
        negative_type: concurrency
        title: 真人占用身份尚未交还时，Web 运行直接返回 browser-busy
        actor: 执行会话
        priority: P1
        verify: cli
        initial_state: ["已运行 browser open --identity merchant --headed，真人尚未运行 browser release，窗口仍开着"]
        steps: ["在 main 运行 sop-board run prepare --scope shop#W --session S1 --json"]
        expected:
          - "以业务失败退出（退出码 1），错误为 browser-busy"
          - "有界面窗口保持打开，human 租约不变"
        forbidden_effects: ["关闭或接管真人正在使用的窗口", "排队等待租约"]
        refs: ["docs/design.md#浏览器代理（问题 5、6）"]

  - id: BRW-04
    title: 浏览器崩溃记为受阻
    actor: 开发者
    entry: "守护进程的浏览器监视、run submit、工作台、sop-board attention list、browser status"
    must:
      - "异常退出记录信号、chrome.log 末尾和启动后写出的 DiagnosticReports；相关场景在提交时记为受阻并加一条待人处理"
      - "租约持有期间不自动重启，下一次取得租约时再启动；30 分钟内异常退出两次记为 crashed，须由人重置"
    scenarios:
      - id: BRW-04-P01
        polarity: positive
        title: kill -ABRT 结束 CfT 后，shop#W 记为受阻并写明信号与日志
        actor: 开发者
        priority: P0
        verify: cli
        initial_state: ["main 已为 shop#W run prepare，CfT 在运行，租约由该运行持有"]
        steps:
          - "用 kill -ABRT 结束该 CfT 主进程，等待 5 秒后用 ps 查看是否有新的 CfT 进程"
          - "执行者按实际情况写出 shop#W 的结果（浏览器已断开）并 run submit"
          - "运行 sop-board attention list 与 browser status，在工作台打开 shop#W"
          - "再次运行 sop-board run prepare --scope shop#W --session S2"
        expected:
          - "提交前没有自动重启的 CfT 进程"
          - "shop#W 的结果为受阻，finding 为“浏览器进程 <时间> 因 SIGABRT 退出，日志 <路径>”，路径指向 chrome.log；启动后出现的 Google Chrome for Testing*.ips 一并引用"
          - "attention list 新增一条与此次崩溃对应的待人处理"
          - "工作台 shop#W 显示受阻及上述原因"
          - "下一次 run prepare 启动了新的 CfT"
        forbidden_effects: ["shop#W 记为通过或失败", "租约持有期间自动重启浏览器", "回退到用户日常 Chrome"]
        refs: ["docs/design.md#浏览器代理（问题 5、6）", "docs/design.md#验证"]
        evidence_hints: ["kill 命令与时间", "提交结果与 finding", "chrome.log 末尾", "attention list 输出", "工作台截图"]
      - id: BRW-04-N01
        polarity: negative
        negative_type: interrupted
        title: 30 分钟内两次异常退出后进入 crashed，run prepare 返回 browser-crashed，由人重置后恢复
        actor: 开发者
        priority: P1
        verify: cli
        initial_state: ["merchant 的 CfT 在 30 分钟内已因 kill -ABRT 异常退出一次（BRW-04-P01）"]
        steps:
          - "在新的 run prepare 启动 CfT 后再次 kill -ABRT，提交该运行"
          - "运行 sop-board browser status，再运行 sop-board run prepare --scope shop#W --session S3 --json"
          - "运行 sop-board browser open --identity merchant --reset-crash，用 ps 查看 CfT 进程参数，再运行一次 run prepare"
        expected:
          - "browser status 显示 merchant 的浏览器状态为 crashed"
          - "reset 前的 run prepare 以业务失败退出，error_code 为 browser-crashed，没有启动 CfT"
          - "--reset-crash 清除 crashed 状态并重新启动 merchant 的 CfT，参数含 --headless=new（未加 --headed）"
          - "reset 后的 run prepare 成功"
        forbidden_effects: ["crashed 状态下自动重启浏览器"]
        refs: ["docs/design.md#浏览器代理（问题 5、6）", "使用者 2026-11-10 对场景集待确认问题的答复 第 4 条"]

  - id: BRW-05
    title: 会话中启动的守护进程也能运行 Web 场景，启动即中止的浏览器记为受阻
