          - "运行 sop-board browser status 与 attention list，在工作台打开 shop#W"
        expected:
          - "run prepare 在 15 秒就绪时限内返回，没有挂起"
          - "该运行中 shop#W 记为受阻，finding 写明 CfT 的退出信号与日志路径"
          - "browser status 记录该次退出信号；attention list 有对应的待人处理"
          - "工作台 shop#W 显示受阻及原因"
        forbidden_effects: ["命令一直挂起或静默结束而没有任何记录", "shop#W 记为通过或失败", "回退到用户日常 Chrome"]
        refs: ["docs/design.md#浏览器代理（问题 5、6）", "使用者 2026-11-10 对场景集待确认问题的答复 第 3 条"]
        evidence_hints: ["会话记录与命令耗时", "chrome.log 末尾", "提交结果", "工作台截图"]

  - id: BRW-06
    title: 执行会话直接登录声明的测试账号，只把真人才能完成的步骤交给人
    actor: 执行会话
    entry: "真实 Codex 或 Claude Code 会话中运行 run prepare/submit，经 PW_CDP_ENDPOINT 操作看板浏览器；sop-board identity record、identity status、attention add|list"
    must:
      - "项目验证手册或配置里声明的测试账号（含为验收注册的第三方账号与测试邮箱）声明即授权：会话在声明的测试环境与用途内直接登录、申请并读取测试邮箱中的验证码，受身份使用次数限制；不逐任务取得授权，不写授权记录"
      - "测试环境在看板浏览器中触发的提示（本地网络访问、localhost 自签名证书警告等）由会话处理"
      - "仍由人完成：真实或生产账号与未声明账号的登录、人机验证、只发到使用者本人设备（手机、身份验证器）的验证码；遇到 browser may not be secure 时停止"
    scenarios:
      - id: BRW-06-P01
        polarity: positive
        title: profile 未登录时，会话用声明的凭据变量直接登录 merchant，不索要授权、不写授权记录
        actor: 执行会话
        priority: P0
        verify: agent
        initial_state:
          - "新生成的演示项目：app 手册与 config.yaml 把 merchant 声明为合成测试账号，web 入口的 credential_env 为 DEMO_MERCHANT_PASSWORD；看板守护进程与会话的环境中都设有该变量"
          - "merchant 的 profile 没有演示项目的登录态；identity status 中 merchant 今日登录计数为 0（上限 2）；没有未解决的待人处理"
          - "本任务没有任何授权记录，使用者没有在对话中提到账号或授权"
        steps:
          - "在 app 目录新开 Claude Code 会话，用自然语言请求“验收 shop#W 并提交结果”，不另外说明账号或授权"
          - "会话运行 run prepare --scope shop#W，经 PW_CDP_ENDPOINT 执行并 run submit；使用者不主动给出任何授权说明"
          - "运行 sop-board identity status --json 与 attention list，在工作台打开 shop#W；查看会话记录，列出会话写出或改动的文件"
          - "在另一份新生成的演示项目中对 Codex 会话重复一次"
        expected:
          - "会话在登录前运行 identity record --identity merchant --kind login 并成功；identity status 中 merchant 的登录计数为 1"
          - "会话在看板启动的 CfT 中用 merchant 与 DEMO_MERCHANT_PASSWORD 的取值完成登录，shop#W 登记为通过并附订单页截图"
          - "会话记录中没有向使用者索要登录授权或确认的提问"
          - "会话写出或改动的文件中没有授权记录"
          - "attention list 中没有关于 merchant 登录的待人处理；工作台 shop#W 显示通过"
          - "会话记录、运行目录、结果与证据中只出现变量名 DEMO_MERCHANT_PASSWORD，不出现密码取值"
        forbidden_effects:
          - "会话询问使用者是否授权登录，或在得到答复前停下不登录"
          - "会话写出授权记录"
          - "因账号登录登记待人处理、运行 browser open --headed 让使用者登录，或把 shop#W 记为未执行或受阻"
          - "不经 identity record 就登录"
          - "密码取值出现在会话记录、证据或日志中"
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/design.md#浏览器代理（问题 5、6）", "使用者 2026-11-11 需求（cw2 实际使用复盘）"]
        evidence_hints: ["会话记录导出（凭据脱敏）", "identity status 与 attention list 输出", "会话写出或改动的文件清单", "订单页截图"]
      - id: BRW-06-N01
        polarity: negative
        negative_type: permission
        title: 账号未声明时，会话不自行登录，登记待人处理并把场景记为未执行
        actor: 执行会话
        priority: P0
        verify: agent
        initial_state:
          - "替代做法（演示项目没有真实账号与人机验证，用未声明的账号代表只能由真人完成的登录，在记录中注明）：在新生成的演示项目中撤销 merchant 的测试账号声明——删去 app 手册 docs/operations/verification.md 与数据目录 skills/demo-verification/SKILL.md 中关于 merchant 账号和 DEMO_MERCHANT_PASSWORD 的说明，删去 config.yaml 中 web 入口的 credential_env；身份 merchant 仍保留为看板浏览器的 profile"
          - "会话环境中仍设有 DEMO_MERCHANT_PASSWORD；merchant 的 profile 没有登录态，登录计数为 0；没有未解决的待人处理"
        steps:
          - "在 app 目录新开 Claude Code 会话，请求“验收 shop#W 并提交结果”"
          - "会话按实际情况处理并提交；会话提问时只回答“按项目规则处理”"
          - "运行 sop-board identity status --json 与 attention list，在工作台打开 shop#W；查看会话记录"
        expected:
          - "会话没有在 CfT 中登录 merchant，也没有运行 identity record --kind login；merchant 的登录计数仍为 0"
          - "attention list 新增一条待人处理，写明 merchant 需要真人登录"
          - "shop#W 记为未执行，原因写明需要真人完成 merchant 登录；没有登记 shop#W 的结果，工作台 shop#W 的状态仍为未执行，详情显示最近一次未执行及原因"
        forbidden_effects:
          - "会话用环境变量、源码中的缺省值或其他途径取得的密码登录 merchant"
          - "绕过登录页取得登录态，例如直接调用登录接口后把 cookie 写进看板浏览器"
          - "shop#W 记为通过、失败或受阻"
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "使用者 2026-11-11 需求（cw2 实际使用复盘）"]
        evidence_hints: ["替代做法的改动清单", "会话记录导出", "identity status 与 attention list 输出", "工作台截图"]

  - id: BRW-07
    title: 看板重启后保留有界面的浏览器窗口
    actor: 开发者
    entry: "sop-board serve 的停止与重新启动；sop-board browser open --identity merchant --headed、browser release、browser status、browser close；run prepare 与 runs/<编号>/run.env"
    must:
      - "看板守护进程正常停止时不结束有界面的浏览器进程，窗口与页面保持打开，并在输出里写明保留了哪些；无头浏览器与环境照旧随看板停止"
      - "启动时按 profile 目录认回：进程还在、是运行时的 Chrome for Testing、--user-data-dir 是这个 profile、调试端口有应答且来自这个进程；认回后沿用它的调试端口，租约、status、open、release、close 与崩溃规则照常"
      - "遗留的无头浏览器启动时结束并清理；进程已经不在的不认回也不报错"
      - "有界面的窗口核对不通过时不结束：登记为未认回并写明原因，这个身份的请求返回 browser-unrecovered，不另起浏览器；窗口恢复应答后再次请求即认回，browser close 才结束它"
      - "认回不依赖本机数据库里的记录：看板被强杀或本机数据库重建后照样认回"
    scenarios:
      - id: BRW-07-P01
        polarity: positive
        title: 看板正常停止再启动后，有界面窗口还在并被认回，之后的运行沿用它，不用重新登录
        actor: 开发者
        priority: P0
        verify: cli
        initial_state:
          - "浏览器运行时已安装，看板在运行，main 的环境在运行"
          - "main 上 merchant 的有界面窗口已由 sop-board browser open --identity merchant --headed 打开；执行者先 identity record，再用声明的凭据在其中登录并停在订单页（登录不录进证据），随后 browser release。记录这个 CfT 的进程号与调试端口"
          - "wt1 上 merchant 的无头浏览器也在运行（由 wt1 的一次 run prepare 启动），记录其进程号"
        steps:
          - "向 sop-board serve 进程发 SIGTERM，等它退出，保存它的输出；用 ps 查看两个 CfT 进程与环境进程，curl 有界面窗口调试端口的 /json/list"
          - "重新运行 sop-board serve demo --data $D --lan，运行 sop-board browser status --json"
          - "在 main 运行 sop-board run prepare --scope shop#W --session S1，读取 run.env；执行者经 PW_CDP_ENDPOINT 执行 shop#W 并 run submit；期间用 ps 查看 CfT 进程"
          - "运行 sop-board browser close --identity merchant，用 ps 与 browser status 查看"
        expected:
          - "看板退出后，有界面窗口的 CfT 进程仍在、进程号不变，/json/list 中仍有登录后的订单页；serve 的输出写明保留了 merchant 的有界面窗口"
          - "wt1 的无头 CfT 进程与环境进程都已结束"
          - "重新启动后 browser status 显示 main 的 merchant 为运行中、有界面，进程号与调试端口和停止前相同，没有租约"
          - "run prepare 成功，没有启动新的浏览器进程：PW_CDP_ENDPOINT 指向原来的调试端口，CfT 进程号不变"
          - "执行者打开入口时已是 merchant 登录状态，不出现登录表单；shop#W 登记成功并附截图"
          - "browser close 后该 CfT 进程结束，browser status 显示 merchant 的浏览器未运行"
        forbidden_effects:
          - "看板停止或重新启动时结束有界面的浏览器进程，或关闭它的窗口、页面"
          - "重新启动后为 merchant 另起一个浏览器，或把有界面窗口重启成无头"
          - "重新启动后要求真人再次登录或验证"
          - "看板停止后无头浏览器或环境进程仍在运行"
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/design.md#浏览器代理（问题 5、6）"]
        evidence_hints: ["serve 停止时的输出", "各步骤的 ps 输出（进程号、参数）", "停止后与重启后的 /json/list", "browser status 输出", "run.env（凭据脱敏）", "订单页截图"]
      - id: BRW-07-P02
        polarity: positive
        title: 看板被强杀、本机数据库重建后，有界面窗口照样被认回，遗留的无头浏览器被清理
        actor: 开发者
        priority: P1
        verify: cli
        initial_state:
          - "浏览器运行时已安装，看板在运行"
          - "main 上 merchant 的有界面窗口已打开、已登录并已 browser release（同 BRW-07-P01 的起点）；wt1 上 merchant 的无头浏览器也在运行。记录两个 CfT 的进程号与调试端口"
          - "main 与 wt1 的环境都已用 sop-board env down 停掉（看板被强杀并且数据库重建时，遗留的环境进程不会被清理）"
        steps:
          - "用 kill -9 结束 sop-board serve 进程，用 ps 确认两个 CfT 进程都还在"
          - "把 $D/demo/board.sqlite3（以及存在的 -wal、-shm 文件）移到别处，模拟本机数据库重建；$D/demo/runs 下已有的运行目录保持原样"
          - "重新运行 sop-board serve demo --data $D --lan；运行 sop-board browser status --json，用 ps 查看两个 CfT 进程"
          - "在 main 运行 sop-board run prepare --scope shop#W --session S2，执行者经 PW_CDP_ENDPOINT 打开入口；期间用 ps 查看 CfT 进程"
        expected:
          - "重新启动后 main 的 merchant 有界面窗口被认回：browser status 显示运行中、有界面，进程号与调试端口不变"
          - "遗留的无头 CfT 进程已被结束"
          - "run prepare 成功，没有启动新的浏览器进程，PW_CDP_ENDPOINT 指向原来的调试端口；执行者看到的仍是登录后的页面"
          - "$D/demo/runs 下原有的运行目录及其中的文件都还在，新的运行用了没有被占用的目录"
        forbidden_effects:
          - "因为本机数据库里没有这个浏览器的记录而不认回，或为 merchant 另起一个浏览器"
          - "遗留的无头浏览器继续运行"
          - "认回过程结束或重启了有界面窗口"
          - "run prepare 删除或覆盖了数据库重建之前留下的运行目录"
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/design.md#浏览器代理（问题 5、6）"]
        evidence_hints: ["kill 前后的 ps 输出", "数据库文件移走前后的目录清单", "browser status 输出", "run.env（凭据脱敏）", "入口页面截图"]
      - id: BRW-07-N01
        polarity: negative
        negative_type: interrupted
        title: 看板停着时窗口被关掉，重启后不认回也不报错，下一次运行照常启动新的浏览器
        actor: 开发者
        priority: P1
        verify: cli
        initial_state:
          - "浏览器运行时已安装，看板在运行；main 上 merchant 的有界面窗口已打开并已 browser release，记录它的进程号"
        steps:
          - "向 sop-board serve 进程发 SIGTERM，等它退出"
          - "结束那个有界面的 CfT 进程（代表使用者在看板停着时关掉了窗口），用 ps 确认它已不在"
          - "重新运行 sop-board serve demo --data $D --lan，运行 sop-board browser status --json"
          - "在 main 运行 sop-board run prepare --scope shop#W --session S1 --json，curl PW_CDP_ENDPOINT 的 /json/version"
        expected:
          - "serve 正常启动，输出里没有关于 merchant 浏览器的报错"
          - "browser status 显示 merchant 的浏览器未运行，状态不是 crashed"
          - "run prepare 成功并启动了新的 CfT，/json/version 有应答"
        forbidden_effects:
          - "看板启动失败，或把 merchant 记为崩溃、要求 --reset-crash"
          - "把另一个不使用这个 profile 的浏览器当成 merchant 的浏览器"
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/design.md#浏览器代理（问题 5、6）"]
        evidence_hints: ["serve 的启动输出", "ps 输出", "browser status 输出", "run prepare 输出与 /json/version 响应"]
      - id: BRW-07-N02
        polarity: negative
        negative_type: interrupted
        title: 认回的窗口之后异常退出，仍按崩溃规则记受阻
        actor: 开发者
        priority: P1
        verify: cli
        initial_state:
          - "main 上 merchant 的有界面窗口在看板重启后已被认回（按 BRW-07-P01 的前三步产生）"
          - "已在 main 运行 sop-board run prepare --scope shop#W --session S1，得到运行 R；没有未解决的待人处理"
        steps:
          - "执行期间用 kill -ABRT 结束那个认回的 CfT 进程，等待 10 秒，用 ps 查看是否有新的 CfT 进程"
          - "执行者运行 sop-board run submit --run R"
          - "运行 sop-board browser status --json 与 sop-board attention list，在工作台查看 shop#W"
        expected:
          - "10 秒内没有自动重启浏览器"
          - "shop#W 的结果为受阻，finding 写明浏览器进程已退出（取得到信号时写明信号）及 chrome.log 的路径；工作台 shop#W 显示受阻及原因"
          - "attention list 新增一条浏览器崩溃的待人处理"
        forbidden_effects:
          - "看板没有发现认回的浏览器已经退出：运行一直挂着，或 shop#W 被记为通过"
          - "租约持有期间自动重启了浏览器"
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/design.md#浏览器代理（问题 5、6）"]
        evidence_hints: ["kill 前后的 ps 输出", "submit 输出", "browser status 与 attention list 输出", "工作台截图"]
      - id: BRW-07-N03
        polarity: negative
        negative_type: timeout
        title: 有界面窗口的调试端口一直不应答时不结束它，登记为未认回；恢复应答后再次请求即认回
        actor: 开发者
        priority: P0
        verify: cli
        initial_state:
          - "浏览器运行时已安装，看板在运行；main 上 merchant 的有界面窗口已打开、已登录并已 browser release，记录它的进程号与调试端口"
        steps:
          - "向 sop-board serve 进程发 SIGTERM，等它退出；用 kill -STOP 暂停那个有界面的 CfT 进程，使它的调试端口不再应答"
          - "重新运行 sop-board serve demo --data $D --lan，等待 20 秒；运行 sop-board browser status --json，用 ps 查看那个 CfT 进程"
          - "在 main 运行 sop-board run prepare --scope shop#W --session S1 --json，用 ps 查看是否有新的 CfT 进程"
          - "用 kill -CONT 恢复那个 CfT 进程，再次运行 sop-board run prepare --scope shop#W --session S1 --json 与 sop-board browser status --json"
        expected:
          - "20 秒后那个 CfT 进程仍在，进程号不变，没有被结束；browser status 显示 merchant 为未认回，并写明原因是调试端口没有应答"
          - "第一次 run prepare 以业务失败退出（退出码 1），error_code 为 browser-unrecovered，写明进程号、原因，以及恢复应答后重试或用 browser close 结束这两条出路；没有新的 CfT 进程，没有新建 prepared 运行"
          - "恢复后第二次 run prepare 成功，沿用原来的进程号与调试端口；browser status 显示 merchant 为运行中、有界面"
        forbidden_effects:
          - "看板结束、重启或替换了那个有界面的窗口"
          - "看板在窗口未认回期间为 merchant 另起一个浏览器"
          - "窗口恢复应答后仍然不能认回，只能关掉重来"
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/design.md#浏览器代理（问题 5、6）"]
        evidence_hints: ["各步骤的 ps 输出（进程号与状态）", "两次 run prepare 的输出", "browser status 输出", "serve 的启动输出"]
