# SOP-BOARD-4：看板发起的执行与回归检查的验收场景
# 预期只依据本仓 docs/proposals/2026-10-19-standalone-sop-verification.md（v8）的 D2、D4、D9、D21、D22、D23、D29 与第 4 节 S2，以及 docs/designs/SOP-BOARD-4.md（修订 2）的 I1–I5、D1；
# 沿用的约定（令牌与错误代码、运行器、轮次规则、产品指纹、执行状态）取自 docs/designs/SOP-BOARD-1.md 至 SOP-BOARD-3.md 的现行修订，不依据当前实现的输出。
# 版本 1（2026-10-20）：Claude 依据上述原文与测试代理 sop-board-4-tester 的 71 条用例编写，经 AdolphKevin 授权由 Claude 代批；用例与方案不一致处以方案为准。
#
# 下文"测试看板"同 SOP-BOARD-1、2 的约定；"开发者令牌"指 SOP_BOARD_ADMIN_TOKEN，"写入令牌"指 SOP_BOARD_TOKEN（两者不同）。
# "演示仓库"指执行者新建的临时 Git 仓库 R（/tmp/<随机>/demo-repo）：git config user.name 为 Alice；已提交 README.md、src/app.py、.gitignore（含 build/）、serve.sh、scripts/junit.sh、scripts/gojson.sh 与 docs/sop/entries.yaml。
# entries.yaml 的入口：cli（surface cli，candidate checkout）、web（surface web，candidate checkout）、api（surface http，candidate start，start ['sh','serve.sh']，address_env APP_URL）、
# live（surface http，candidate in-place，address_env APP_URL），各入口的 operate、observe、evidence、isolation 齐全；顶层 checks：unit（argv ['sh','scripts/junit.sh','{output}']，format junit，
# report '{output}/report.xml'）与 gounit（argv ['sh','scripts/gojson.sh']，format go-json）。场景另有说明时按场景改写入口声明并提交。
# "预设目录"指演示仓库外的 /tmp/<随机>/presets：serve.sh 与两个检查脚本从中读取本次的输出、报告内容、退出码与等待秒数，并向其中追加运行记录（工作目录、环境变量、进程组号、时间）；改预设不改变产品指纹。
# 检查脚本缺省向标准输出与错误输出各写一行，junit.sh 缺省写出声明用例全部通过的 report.xml，gojson.sh 缺省在标准输出写出全部 pass 的 go test -json 行；serve.sh 缺省在 SOP_PORT 上启动一个对所有请求返回 200 的子进程。
# "第二演示仓库"R2（/tmp/<随机>/demo-repo2）与演示仓库结构相同。"未授权项目 Q"指经 PUT scenario-file 推送登记的项目 github.com/demo-org/other-app，本机另有其仓库副本 /tmp/<随机>/other-repo，看板没有获得授权。
# "授权看板"指以 --writable-repo github.com/demo-org/demo-app=<演示仓库路径>、--writable-repo github.com/demo-org/demo-app2=<第二演示仓库路径> 与开发者令牌启动的测试看板，
# 项目键分别为 github-com-demo-org-demo-app 与 github-com-demo-org-demo-app2；启动环境另含 JIRA_URL=<模拟 Jira 地址>、JIRA_EMAIL、JIRA_API_TOKEN 与 MY_SECRET=x，PATH 最前为假 codex，
# 不含 APP_URL 与 SOP_BOARD_SKILLS_DIR（场景另有说明的除外）。
# "模拟 Jira"指执行者在本机启动的 HTTP 服务，记录收到的请求；本需求不读写 Jira，模拟 Jira 只用于核对子进程环境中没有 JIRA_* 且看板没有向其发请求。真实 Jira 站点不在本期。
# "假 codex"指执行者写的可执行脚本：记录收到的参数、工作目录、环境变量（名与值）、标准输入是否为空设备与进程组号；在 events.jsonl 写出 thread.started（每次运行的 thread_id 不同）；
# 合并任务按 SOP-BOARD-3 写出合格的判断字段（verify 取 cli）；执行任务读取 -C 目录中的 scenarios.yaml，按预设为每条场景写一行 results.jsonl（缺省 pass，tw 结果契约字段，不含 fingerprint，
# 证据为 evidence/<编号>.txt 并写出该文件）；可按预设等待、以指定退出码结束或写出不合格的结果。"慢速假 codex"指假 codex 等待 60 秒后才写出结果。假 codex 与模拟服务由执行者在本机实现。
# "演示批次"指演示仓库中已提交的 docs/sop/<批次>.yaml（metadata.batch 为批次名），场景所用入口与回归声明按各场景的初始状态；批次没有用例，场景另有说明的除外。
# 准备演示批次时先暂停自动任务，提交场景文件让看板登记，经 SOP-BOARD-1 的轮次接口登记初始状态所述的已有结果，放弃准备期间自动建立的任务后恢复自动任务；场景中的任务断言只计准备之后新建的任务。
# 有用例的批次由上传用例经合并写入后提交得到场景文件，场景编号即用例编号。"产品已变化"指该结果登记时的产品指纹不同于批次当前的产品指纹（准备时以较早提交的提交号与指纹登记）。
# 浏览器入口的执行由假 codex 代替，不需要真实浏览器；需要本机已登录的真实 Codex 的只有 SOP-42-P17。

metadata:
  requirement: "sop-board 看板发起的执行与回归检查：入口与检查声明、执行任务、候选版本、浏览器独占与暂停与执行状态、回归检查运行器"
  batch: "sop-board-4"
  version: 1
  owner: "AdolphKevin"
  sources:
    - ref: "docs/proposals/2026-10-19-standalone-sop-verification.md 的 D2、D4、D9、D21、D22、D23、D29 与第 4 节 S2"
      version: "v8（2026-10-19）"
      confirmed_by: "AdolphKevin"
    - ref: "docs/designs/SOP-BOARD-4.md 的 I1–I5、D1 节"
      version: "修订 2"
      confirmed_by: "AdolphKevin"
  tags: ["sop-board", "执行任务", "候选版本", "浏览器独占", "回归检查"]

sops:

  - id: SOP-41
    title: 入口与检查声明
    actor: "开发者与看板"
    entry: "GET /api/v1/projects/<项目键>/entries 与批次总览页"
    must:
      - "入口与检查声明按 .tw/config.json 优先、entries.yaml 其次的顺序读取，并回填缺省值"
      - "声明不合格时执行与检查任务都不开始"
    scenarios:

      - id: SOP-41-P01
        polarity: positive
        title: 读取 entries.yaml 的入口与检查声明并回填缺省值
        actor: 开发者
        priority: P0
        refs: ["I1"]
        verify: api
        initial_state: ["授权看板已登记演示仓库，演示仓库没有 .tw/config.json", "entries.yaml 已改写并提交：入口 api（candidate start，start ['./serve.sh']，address_env APP_URL）；入口 cli 未写 candidate", "顶层 checks 的检查 unit 为 argv ['sh','scripts/junit.sh','{output}']、format junit、report '{output}/report.xml'，未写 cwd、timeout、required_env，另带未定义字段 owner: qa"]
        steps: ["不带 Authorization 头请求 GET /api/v1/projects/github-com-demo-org-demo-app/entries"]
        expected: ["返回 200，正文含 ok、source、entries、checks、problems 五项", "ok 为 true，source 为 entries-yaml，problems 为空数组", "entries 中入口 api 的 candidate 为 start、start 为 ['./serve.sh']、address_env 为 APP_URL", "入口 cli 的 candidate 回填为 in-place", "checks 中检查 unit 的 argv、format、report 与声明相同，cwd 为 '.'，timeout 为 900，required_env 为空数组", "未定义字段 owner 没有产生问题"]
        forbidden_effects: ["请求因缺少令牌被拒绝"]
        evidence_hints: ["请求与响应原文", "entries.yaml 内容"]

      - id: SOP-41-P02
        polarity: positive
        title: 有 .tw/config.json 时只读取其 acceptance_entries 与 checks
        actor: 开发者
        priority: P0
        refs: ["I1"]
        verify: api
        initial_state: ["演示仓库另有已提交的 .tw/config.json：acceptance_entries 只含入口 web-ui，checks 只含检查 go-unit（format go-json）", "docs/sop/entries.yaml 仍声明入口 api 与检查 unit", "授权看板已登记演示仓库"]
        steps: ["请求 GET …/projects/github-com-demo-org-demo-app/entries", "删除 .tw/config.json 中的 checks 字段并提交后再次请求"]
        expected: ["第一次 source 为 tw-config，entries 只含 web-ui，checks 只含 go-unit", "第二次 source 仍为 tw-config，checks 为空，entries 仍只含 web-ui"]
        forbidden_effects: ["返回 entries.yaml 中的入口 api 或检查 unit"]
        evidence_hints: ["两次响应原文", ".tw/config.json 前后内容"]

      - id: SOP-41-N01
        polarity: negative
        negative_type: invalid-input
        title: candidate 取值不对或 start 入口缺 start 时声明不合格，开发者发起执行被拒绝
        actor: 开发者
        priority: P0
        refs: ["I1"]
        verify: api
        initial_state: ["授权看板已登记演示批次 B：场景使用入口 api，有待执行场景"]
        steps: ["把 entries.yaml 中入口 api 的 candidate 改为 docker 并保存（不提交）", "请求 GET entries，打开批次 B 总览页", "用开发者令牌请求 POST …/batches/B/executions", "把 candidate 改回 start 并删除 start 字段，再请求 GET entries"]
        expected: ["第一次 GET entries 的 ok 为 false，problems 指出入口 api 的 candidate 取值不合格", "批次 B 总览页显示'入口声明不合格'及该问题", "POST executions 返回 409，error_code 为 entries-invalid，没有新建执行任务", "第二次 GET entries 的 problems 指出入口 api 缺少 start"]
        forbidden_effects: ["假 codex 被调用", "数据目录 worktrees/ 下出现新目录"]
        evidence_hints: ["请求与响应原文", "页面截图", "假 codex 记录", "worktrees/ 目录清单"]

      - id: SOP-41-N02
        polarity: negative
        negative_type: invalid-input
        title: 检查缺 argv、argv 类型不对、format 不对或 junit 缺 report 时声明不合格
        actor: 开发者
        priority: P1
        refs: ["I1"]
        verify: api
        initial_state: ["授权看板已登记演示批次 B：场景 G1 声明 regression: {check: unit, cases: ['pkg.Order::test_create']}"]
        steps: ["依次把检查 unit 改为：删除 argv；argv 为字符串 'pytest -q'；argv 恢复而 format 为 tap；format 为 junit 而删除 report；每次保存后请求 GET entries", "在 format 为 tap 的状态下打开批次 B 总览页，并用开发者令牌请求 POST …/batches/B/checks", "改为 format 为 junit 而删除 report 的状态，再打开批次 B 总览页"]
        expected: ["四次 GET entries 的 ok 都为 false，problems 依次指出检查 unit 缺少 argv、argv 应为字符串数组、format 只能为 junit 或 go-json、format 为 junit 时缺少 report", "两次打开批次 B 总览页都显示'入口声明不合格'及当时的问题（format 只能为 junit 或 go-json；format 为 junit 时缺少 report）", "POST checks 返回 409，error_code 为 entries-invalid，没有新建检查任务"]
        forbidden_effects: ["检查命令被运行", "任何任务目录下出现 checks/unit/output.txt"]
        evidence_hints: ["每次的响应原文", "页面截图", "预设目录的运行记录"]

      - id: SOP-41-N03
        polarity: negative
        negative_type: invalid-input
        title: 场景引用未声明的入口或检查时声明不合格
        actor: 开发者
        priority: P0
        refs: ["I1"]
        verify: api
        initial_state: ["授权看板已登记演示批次 B：入口声明只有 cli 与检查 unit，场景 A1 使用 cli，场景 G1 声明 regression.check 为 unit"]
        steps: ["在 docs/sop/B.yaml 中把 A1 的 verify 改为 ghost-entry、把 G1 的 regression.check 改为 ghost-check，保存后等待看板登记新版本", "请求 GET entries，打开批次 B 总览页", "用开发者令牌依次请求 POST …/batches/B/executions 与 POST …/batches/B/checks"]
        expected: ["problems 分别指出 A1 的 verify 引用了未声明的入口 ghost-entry、G1 的 regression.check 引用了未声明的检查 ghost-check", "批次 B 总览页显示'入口声明不合格'及这两个问题", "两个请求都返回 409，error_code 为 entries-invalid，没有新建任务"]
        forbidden_effects: ["假 codex 被调用", "检查命令被运行"]
        evidence_hints: ["响应原文", "页面截图", "假 codex 与预设目录的记录"]

      - id: SOP-41-N04
        polarity: negative
        negative_type: invalid-input
        title: 排队中的任务在声明不合格时不开始并显示原因，恢复合格后自动开始
        actor: 看板
        priority: P1
        refs: ["I1", "I4"]
        verify: api
        initial_state: ["授权看板已登记演示批次 B：场景使用入口 cli，有待执行场景 N1", "自动任务已暂停"]
        steps: ["用开发者令牌请求 POST …/batches/B/executions，记下任务 T1", "把入口 cli 的 candidate 改为 docker 并保存（不提交）后恢复自动任务，等待 15 秒并请求 T1 的任务接口、打开批次 B 总览页", "把 candidate 改回 checkout 并保存，等待 15 秒后再请求 T1"]
        expected: ["暂停期间 T1 为排队中", "声明不合格期间 T1 仍未开始，任务接口与执行任务列表显示原因'入口声明不合格'", "声明恢复合格后 T1 自动开始并最终为已完成"]
        forbidden_effects: ["声明不合格期间假 codex 为 T1 被调用"]
        evidence_hints: ["按时间记录的任务接口响应", "页面截图", "假 codex 记录"]

      - id: SOP-41-N05
        polarity: negative
        negative_type: stale-input
        title: 执行运行中声明变为不合格时本轮作废，新的执行被拒绝
        actor: 开发者
        priority: P1
        refs: ["I1", "I2"]
        verify: api
        initial_state: ["慢速假 codex", "授权看板已登记演示批次 B：场景都使用入口 cli，有待执行场景 N1"]
        steps: ["用开发者令牌发起执行，等待任务 T1 运行中", "把入口 cli 的 candidate 改为 docker 并保存（不提交），打开批次 B 总览页，再用开发者令牌请求 POST …/batches/B/executions", "等待 T1 结束，请求 T1 的任务接口与批次轮次列表"]
        expected: ["批次 B 总览页显示'入口声明不合格'及问题", "第二次 POST 返回 409，error_code 为 entries-invalid，没有新的执行任务开始", "T1 为已作废，void_reason 写明入口与检查声明变化", "批次没有新增 Agent 轮次"]
        forbidden_effects: ["T1 的结果被登记"]
        evidence_hints: ["请求与响应原文", "页面截图", "任务接口响应", "轮次列表"]

      - id: SOP-41-N06
        polarity: negative
        negative_type: not-found
        title: 项目不存在或未授权时读取声明被拒绝
        actor: 开发者
        priority: P2
        refs: ["I1"]
        verify: api
        initial_state: ["授权看板已启动，未授权项目 Q 已推送登记"]
        steps: ["请求 GET /api/v1/projects/no-such-project/entries", "请求 GET /api/v1/projects/github-com-demo-org-other-app/entries"]
        expected: ["第一次返回 404，error_code 为 project-not-found", "第二次返回 409，error_code 为 repo-not-writable"]
        forbidden_effects: ["读取 other-repo 中的文件"]
        evidence_hints: ["请求与响应原文"]

  - id: SOP-42
    title: 执行任务
    actor: "看板与开发者"
    entry: "合并写入与场景发现的自动触发、POST /api/v1/projects/<项目键>/batches/<批次>/executions 与任务接口"
    must:
      - "执行只针对已提交的代码，工作区有未提交的产品改动时任务待提交"
      - "快照在执行中变化则本轮作废，不登记结果"
      - "结果按契约核对合格后才登记为 Agent 轮次"
    scenarios:

      - id: SOP-42-P01
        polarity: positive
        title: 合并写入后自动执行新增与内容变化的场景，只改 docs/sop/ 不算产品改动
        actor: 看板
        priority: P0
        refs: ["I2"]
        verify: api
        initial_state: ["授权看板中演示批次 B 有用例 TC_DEMO_A_001、TC_DEMO_B_002、TC_DEMO_D_004，场景都使用入口 cli，三条都有 Agent pass，其中 TC_DEMO_D_004 的 pass 之后产品已变化且没有回归声明", "演示仓库工作区干净"]
        steps: ["上传新版用例：TC_DEMO_A_001 不变，修改 TC_DEMO_B_002 的 expected_results，新增 TC_DEMO_C_003", "等待合并任务写入 docs/sop/B.yaml，查看 git status", "请求 GET /api/v1/tasks?project=github-com-demo-org-demo-app&batch=B 与新任务的任务接口，打开批次 B 总览页的执行任务列表"]
        expected: ["git status 只显示 docs/sop/B.yaml 有改动", "出现一个种类为 execute 的任务，触发原因为合并写入", "scope 为 2 条：TC_DEMO_B_002（changed）与 TC_DEMO_C_003（new）", "该任务没有进入待提交，直接开始运行并最终为已完成", "页面没有出现'工作区有未提交的产品改动'", "执行任务列表显示该任务，触发原因为合并写入，范围条数为 2"]
        forbidden_effects: ["TC_DEMO_A_001 或 TC_DEMO_D_004 进入范围", "看板运行 git commit"]
        evidence_hints: ["任务接口响应", "git status 输出", "页面截图"]

      - id: SOP-42-P02
        polarity: positive
        title: 没有用例的批次经发现或推送登记新版本后自动执行新增与内容变化的场景
        actor: 看板
        priority: P1
        refs: ["I2"]
        verify: api
        initial_state: ["授权看板中演示批次 B（没有用例）有场景 N1、N2，均有 Agent pass 且产品未变化，场景使用入口 cli", "演示批次 B2（没有用例）有场景 M1，有 Agent pass"]
        steps: ["修改 B.yaml 中 N1 的 expected 并新增场景 N3，保存（不提交），等待看板登记新版本", "用写入令牌对批次 B2 推送 M1 的 steps 已修改的场景文件（PUT scenario-file）", "请求两个批次的任务列表"]
        expected: ["批次 B 出现一个 execute 任务，触发原因为场景版本，scope 为 N1（changed）与 N3（new），不含 N2", "批次 B2 出现一个 execute 任务，触发原因为场景版本，scope 只含 M1（changed）", "两个任务都最终为已完成"]
        forbidden_effects: ["产生合并任务"]
        evidence_hints: ["任务接口响应", "推送请求与响应"]

      - id: SOP-42-P03
        polarity: positive
        title: 开发者发起执行时范围为 S2 的全部待执行场景
        actor: 开发者
        priority: P0
        refs: ["I2"]
        verify: api
        initial_state: ["授权看板中演示批次 B 的场景都使用入口 cli：N1 没有结果；C1 的 Agent pass 之后内容已变化；R1 的 Agent pass 之后产品已变化且没有回归声明；P1 的 Agent pass 之后产品未变化；G1 声明 regression.check 为 unit 且 Agent pass 之后产品已变化；F1 当前内容的最新 Agent 结果为 fail；X1 最新结果为 blocked；S1 最新结果为 skip"]
        steps: ["用开发者令牌请求 POST /api/v1/projects/github-com-demo-org-demo-app/batches/B/executions", "请求返回任务的任务接口，下载任务目录中的 scenarios.yaml"]
        expected: ["返回 200，正文为 {ok: true, task}", "任务种类为 execute，触发原因为开发者发起", "scope 为 N1（new）、C1（changed）、F1（failed）、R1（source-changed）四条", "scope 不含 P1、G1、X1、S1", "scenarios.yaml 中没有 G1"]
        forbidden_effects: ["最新结果为 blocked 或 skip 的场景进入范围"]
        evidence_hints: ["请求与响应原文", "任务接口响应", "scenarios.yaml"]

      - id: SOP-42-P04
        polarity: positive
        title: 新范围并入同批次待提交的执行任务，开发者再次发起时返回该任务
        actor: 看板
        priority: P1
        refs: ["I2"]
        verify: api
