  - id: SOP-43
    title: 候选版本
    actor: "看板"
    entry: "执行任务的被测对象：checkout 与 start 的 worktree、start 命令、in-place 地址传递"
    must:
      - "checkout 与 start 入口在快照提交的分离 worktree 上执行，任务结束后移除，不建分支"
      - "看板不启动也不停止 in-place 入口的环境"
