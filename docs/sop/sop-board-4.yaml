        expected: ["运行中 git worktree list 含 <数据目录>/worktrees/<任务编号>，为 detached，提交为 snapshot.json 的 commit", "prompt.md 中的被测目录为该检出目录", "完成后该 worktree 不在列表中，目录已删除", "git branch --list 与 git status 与执行前相同"]
