  - id: SOP-223
    title: 合并差异摘要与任务等待
    actor: 开发者与测试同事
    entry: "merge submit、task show/wait、本机和内网合并页任务详情"
    must:
      - "D110：落地任务保存 scenario_diff，task show 顶层和合并页均展示场景数量、编号、并入目标及角色/入口/正反向前后值"
      - "全量改已有场景角色或入口时按场景去重计数提示，不阻挡落地"
      - "task wait 在排队中、运行中、会话处理中、等待合并、等待浏览器以及分析、修复、复验、合入、沉淀等进行中状态继续等待；到其他结束或需要人处理状态退出 0 并输出 task show 同类 JSON；超时退出 3 并输出当前状态，不取消不重排；参数错误或任务不存在退出 2；默认 600 秒，--timeout 0 不限时"
    scenarios:
      - id: SOP-223-P01
        polarity: positive
        title: 全量落地摘要准确列出增删改、并入目标与逐字段变化
        actor: 开发会话
        priority: P0
        verify: cli
        initial_state: ["B0；本场景的演示合并要求已写入仓库外材料：INVITE_004 改为 INVITE_001 的细节，CREATE_001 改由 Admin 经 api 核对，CREATE_002 改为正向字段核对，新建 CREATE_003 反向重名校验"]
        steps:
          - "put 新 CREATE_003；将 CREATE_002 的 negative 标签移除、标题改为“空名称时按钮状态”，步骤与预期改为名称留空时创建按钮不可点击；署名 dev-a 并记录上述演示依据"
          - "prepare --full；完整判断中 INVITE_004 为 detail，merged_into=TC_TEAM_INVITE_001；CREATE_001 actor=Admin、verify=api；CREATE_002 polarity 由新标签决定；其他沿用 B0 判断及非用例 kept，submit"
          - "保存落地前后原文，运行 task show demo-web --task <编号>，与任务 result 中 scenario_diff 逐项核对"
        expected:
          - "scenario_diff 的场景数为 8→8；新增只有 TC_TEAM_CREATE_003、移除只有 TC_TEAM_INVITE_004；改动恰为 TC_TEAM_INVITE_001、TC_TEAM_CREATE_001、TC_TEAM_CREATE_002"
          - "移除项说明 TC_TEAM_INVITE_004 从用例流程改为细节，并入 TC_TEAM_INVITE_001；不会把它记成用例被物理删除"
          - "字段变化列出 TC_TEAM_CREATE_001.actor：Owner→Admin、verify：app→api，以及 TC_TEAM_CREATE_002.polarity：negative→positive；字段名和前后值逐条可见"
          - "task show 的任务对象顶层有同一摘要，判断明细仍在 result；说明为“全量合并改动了 1 个场景的角色或入口”，同一个场景改两个字段只计 1；合并正常落地"
        forbidden_effects: ["把细节用例算作落地场景", "把全部场景列为改动", "角色/入口变化阻止合法全量落地"]
        evidence_hints: ["前后文件与预先确定的差异清单", "完整 task show JSON 与 result", "配对及 final.json"]
      - id: SOP-223-P02
        polarity: positive
        title: 两种地址的合并任务详情显示同一差异摘要
        actor: 测试同事
        priority: P0
        verify: web
        initial_state: ["L；看板以 --lan 运行，已取得真实非回环地址"]
        steps:
          - "本机打开合并页选择 L 的任务，逐项展开或查看差异摘要"
          - "第二个浏览器经实际非回环地址选择同一任务，对照 task show 与本机页面；保存两种地址任务响应"
        expected:
          - "两边均显示 8→8、全部新增/移除/改动编号、细节并入目标与三条字段前后值，与 SOP-223-P01 一致"
          - "两边均显示“全量合并改动了 1 个场景的角色或入口”；判断详情仍可按原入口阅读"
          - "内网摘要保留业务信息，任务会话、本机路径与私有材料仍不公开"
        forbidden_effects: ["内网丢失摘要", "仅在 JSON 有摘要而页面看不到", "暴露本机会话或路径"]
        evidence_hints: ["两浏览器截图、页面文本和地址", "两种地址响应与 task show"]
      - id: SOP-223-P03
        polarity: positive
        title: 等待中的合并完成后退出并输出最终任务
        actor: 开发会话
        priority: P1
        verify: cli
        initial_state: ["从 B0 先按条补齐 LIST_001 为每页 10 条、共 2 页并合并落地，确保没有未解决缺口；B 再 prepare --full，任务会话处理中", "另一个终端准备给全部用例完整判断，LIST_001 为正常流程且 gaps=[]，环境允许两个等待进程与一次提交并行"]
        steps:
          - "运行 task wait --help，核对省略 --timeout 默认 600 秒、--timeout 0 不限时的说明；不实际等待 600 秒"
          - "终端一运行 task wait demo-web --task <编号> --timeout 60；另启同一任务的 task wait --timeout 0，分别记录开始时间和输出位置"
          - "确认两个 wait 尚未返回后，终端二在原认领会话提交完整输出；等待两个 wait 结束"
          - "记录两次 wait 的 stdout、stderr、退出码与耗时，立即运行 task show 对照"
          - "对已完成的同一任务再运行不带 --timeout 的 task wait，记录输出、退出码和返回时机"
        expected:
          - "帮助明确默认 600 秒、0 为不限时；会话处理中两次 wait 都保持等待，--timeout 0 不立即报超时；在 60 秒内提交并完成后，两次 wait 均以 0 退出，输出最终已完成任务 JSON"
          - "任务稳定业务字段、顶层摘要及 result 与 task show 一致；再次不带 --timeout 等待已结束任务直接返回同类最终 JSON，退出码为 0"
        forbidden_effects: ["用只读数据库轮询代替 task wait", "wait 自己提交或重排任务"]
        evidence_hints: ["help 完整输出", "各等待进程与提交的时间线、命令及退出码", "wait 和 show 的完整 JSON"]
      - id: SOP-223-P04
        polarity: positive
        title: 等待任务需要业务补充时及时返回
        actor: 开发会话
        priority: P1
        verify: cli
        initial_state: ["另建 wait-gap 批次，只上传带完整 metadata 的 LIST_001 用例，未指定每页条数，无已有场景；B 已 prepare，另一终端尚未提交全条暂缓输出", "输出只含该用例的流程判断及每页条数业务缺口，不能写入任何可确定流程；不以有部分落地内容的 friction 批次代替"]
        steps:
