# SOP-BOARD-22：会话驱动看板的摩擦整改（第 1～3 期，D108～D113）
# 预期依据：docs/proposals/2026-11-04-session-board-friction.md 方案 1，第四节 D108～D113、第五节第 1～3 期。
# 使用者 2026-11-04 的四项决定原话（方案状态栏）：
#   “1. 手改场景文件，是‘不合并、只提示、可还原’ 2. 从 Git 拉到同事已合并好的场景文件时，跟手改场景一样处理 3. 不把自动合并改用 Claude，默认用 codex，但用户可以选用 Claude 4. 把 cw2 自建的验收层（断言保真检查和审核账本、改 UI 后的只读巡检、spec 复用）收进 `sop-board playwright`。”
# 第 4 项另立方案，本文件不验收第 4 期 playwright；默认 Codex 与可选 Claude 沿用既有约定。
# 版本 1（2026-11-04）：Codex 依据方案在实现前编写，Claude 审核；实现与返工会话只读本文件，与方案不一致处以本文件为准并报告。
# Claude 于 2026-11-04 审核版本 1，提出 4 处修改，按修改定稿。
#
# 演示工作区与前置状态构造：按 docs/verification.md「SOP-BOARD-22」执行；沿用 SOP-BOARD-16/20 的隔离 Web 两仓，
#   工作区 demo-web、入口 app/api、工作批次 friction；所有支持 --data 的命令在实际执行时显式附 --data <本轮演示数据目录>。
#   安装来自被测源码的独立环境，所有数据、Git 仓、客户端目录与证据在仓库外的隔离根目录。自选空闲端口 --lan --paused；
#   不改全局安装，不碰 cw2-live-chat 与 8787。各场景从相应停机副本恢复到原绝对路径，先留证再恢复，不删除现场。
#   A/B/R 是不同真实会话的稳定标识，dev-a/tester-a 是演示署名；本地 owner 登录须有本任务一次授权记录。
#
# B0：先在 web/docs/sop/friction.yaml 写入三个无用例引用的正向场景 NC_KEEP、NC_EDIT、NC_REMOVE，位于人工检查节点，
#   actor=Owner、verify=app、priority=P1；initial_state=[Owner 已登录组织 demo]、steps=[打开成员页]、
#   expected 分别为 [显示成员列表]、[显示 Email 列]、[显示 Role 列]，forbidden_effects=[]；节点说明只读展示的反向豁免。
#   按 SOP-BOARD-20 的 team-cases.yaml 七条用例上传 friction，prepare/submit：INVITE_002 为细节并入 INVITE_001，
#   LIST_001 因每页条数缺失暂缓为 G1，其余为流程，三个非用例场景 kept。完整编号均为 TC_TEAM_ 加上述后缀。
#   基线任务记 M0，落地版本原文记 V0；共 7 条用例、8 条场景、1 条缺口，保存配对与全部合并材料；默认确认人未设置、自动执行关闭。
# E：从 B0 的文件改 CREATE_001.expected 加“手改标记”，删 INVITE_004；改 NC_EDIT.expected 为 [显示手改列]，
#   删 NC_REMOVE，新增 NC_ADD（复制 NC_KEEP，改编号与标题，refs=[]）；其余逐字不变。E 共 7 条场景，不等于任何落地版本。
# H：从 B0 导出并 put CREATE_001，新预期“列表显示完整名称 Customer Success A，名称不被截断”，增量落地为 M1/V1；
#   再仅将 CREATE_002 预期加“刷新后列表仍不变”，增量落地为 M2/V2。保存 V0/V1/V2 原文及各自配对；H 当前为 V2。
# R：从 B0 经真实 app 新建长名称团队，观察截断并 execute submit 登记 CREATE_001 失败；修复会话 R 通过 fix prepare，
#   仅修演示 api 的截断缺陷并 fix submit，真实改动进入待验证。未做复验；此时保存副本。不得伪造失败、修复或独立通过记录。
# L：从 B0 按 SOP-223-P01 完成有增删改与角色/入口变化的全量合并，保存落地前后文件及任务号，用于页面和等待场景。
# 实际操作的 prepare/submit/put/export/reply/exclude/include 分别为 sop-board 对应命令，工作区 demo-web、批次 friction；
#   准备输出返回的 schema.json 是填写输出的格式依据，业务判断依据仍为本文件的演示要求。
# 四处补充结论见手册「已澄清（Claude 审核，2026-11-04）」；不以当前实现输出补齐预期。

metadata:
  requirement: "sop-board：场景手改只提示且可还原，具体缺口答复走增量，合并差异可见，用例先预览再登记，会话交付前报告影响"
  batch: "sop-board-22"
  version: 1
  owner: "blur.yin"
  sources:
    - ref: "docs/proposals/2026-11-04-session-board-friction.md D108～D113、第五节第 1～3 期"
      version: "方案 1（2026-11-04）"
      confirmed_by: "blur.yin"
    - ref: "使用者 2026-11-04 的四项决定原话（方案状态栏；第 4 项另立方案）"
      version: "2026-11-04"
      confirmed_by: "blur.yin"
  tags: ["sop-board", "session-entry", "merge", "cases", "attention", "D108-D113"]

sops:
  - id: SOP-221
    title: 场景文件变化只提示、可还原，人工重新合并保持全量
    actor: 开发者与独立执行者
    entry: "工作区场景文件、场景文件 PUT、本机与内网待处理事项、merge restore/prepare、execute prepare、合并页"
    must:
      - "D108：已有落地合并的批次遇到陌生场景内容，登记版本并按配对分组列明差异，不自动合并"
      - "内容等于任一已落地版本时沿用该版本配对；还原写回最近落地版本，手改历史可追溯"
      - "scenario-edited 期间拒绝执行与修复复验准备；无用例批次保持原行为"
      - "合并在途被改转待同步，不为新内容重排；人发起的重新合并仍全量并预告重建范围"
      - "scenario-edited 期间由用例变化触发的合并以最近落地版本为场景输入基线，模式按 D104 判断；落地覆盖手改，scenario_diff 列出被覆盖的手改场景并解除提示"
    scenarios:
      - id: SOP-221-P01
        polarity: positive
        title: 手改后按用例来源分组列出差异且不排合并
        actor: 开发者
        priority: P0
        verify: cli
        initial_state: ["B0；演示看板运行，已恢复自动任务但自动执行仍关闭", "已保存 task list、上传记录、决定、场景版本与文件摘要"]
        steps:
          - "把 friction.yaml 改成 E，保持 YAML 合格；等待扫描 30 秒"
          - "运行 status --json、task list，查看本机与实际非回环地址的 attention 响应和页面"
          - "再次保存完全相同的 E，等待 30 秒，重复读取版本与任务"
        expected:
          - "E 登记为新场景版本；出现种类 scenario-edited 的待处理事项，指向本批次"
          - "原因的“由用例生成”组：新增为空、删除 TC_TEAM_INVITE_004、改动 TC_TEAM_CREATE_001；“非用例场景”组：新增 NC_ADD、删除 NC_REMOVE、改动 NC_EDIT；NC_KEEP 不在差异中"
          - "原因写明“由用例生成的场景会在下一次合并时按用例重建，手改不会保留；要改措辞或预期，请改用例后按条增改。”"
          - "两次等待后均没有新增合并任务或模型调用；相同 E 不再登记重复版本，磁盘仍为 E"
        forbidden_effects: ["静默覆盖手改", "把所有场景都列为改动", "仅凭 refs 或编号相同制造新配对"]
        evidence_hints: ["E 与 V0 原文及摘要", "前后任务、版本与配对", "两种地址的响应与截图", "看板日志"]
      - id: SOP-221-P02
        polarity: positive
        title: 场景文件 PUT 与磁盘手改遵循同一提示规则
        actor: 开发者
        priority: P0
        verify: api
        initial_state: ["B0；自动任务已恢复、自动执行关闭；已记录版本与任务"]
        steps:
          - "把磁盘 V0 移到场景目录外的本轮证据位置保留，暂不留下可被扫描重新登记的旧文件；不删除已登记版本"
          - "按手册构造合格请求，经真实 PUT /api/v1/workspaces/demo-web/batches/friction/scenario-file 提交 E"
          - "请求成功后将同一 E 原文写入磁盘 friction.yaml，读取当前版本、status、attention 和任务；等待 30 秒再读"
        expected:
          - "请求成功，E 被登记；scenario-edited 的两组新增、删除、改动编号与 SOP-221-P01 完全相同"
          - "提示三种处理方式：还原、人工全量重新合并、改用例后按条增改；没有因 PUT 新增合并任务"
        forbidden_effects: ["PUT 绕开手改提示自动合并", "接受新内容后直接沿用 V0 的配对"]
        evidence_hints: ["完整请求、响应、退出码", "attention 与 task list 前后值"]
      - id: SOP-221-P03
        polarity: positive
        title: 拉取同事在别处合并的陌生内容仍只提示
        actor: 开发者
        priority: P0
        verify: cli
        initial_state: ["B0；演示 web 有本轮专用本地裸仓与同事 clone，均在隔离根目录", "同事 clone 在另一演示数据目录经真实上传、合并生成 E-GIT，提交并推至该本地裸仓；本机从未登记过其内容，保留同事合并与 Git 记录"]
        steps:
          - "在本机演示 web 执行 git pull --ff-only，实际取得 E-GIT，不复制文件冒充拉取"
          - "等待扫描 30 秒，读取 status、attention、版本、task list 与当前文件"
        expected:
          - "拉取所得内容登记为版本，出现 scenario-edited；按相对 V0 的实际编号分组显示差异，差异表由拉取前冻结的两份文件事先列出"
          - "本机不因对方已经合并过而信任其配对，不排合并，不改写 E-GIT；提示与手改相同"
        forbidden_effects: ["把别处合并记录冒充本机已落地版本", "操作任何远程真实产品仓库"]
        evidence_hints: ["本地裸仓地址与 git pull 原始输出", "同事合并任务及 E-GIT 摘要", "本机落地版本清单与 attention"]
      - id: SOP-221-P04
        polarity: positive
        title: 匹配任一已落地旧版本时沿用它自己的配对
        actor: 开发者
        priority: P0
        verify: cli
        initial_state: ["H；已分别保存 V0、V1、V2 的原文、配对与任务号，当前为 V2"]
        steps:
          - "将 V0 原文写回 friction.yaml，等待扫描；读取版本、配对、attention 与任务"
          - "再写回 V1 原文，等待扫描并重复核对；最后写回 V2"
        expected:
          - "每次内容切换均登记新版本，分别沿用 M0、M1、M2 对应的配对与用例内容依据；不是一律复制最新配对"
          - "均不排合并、不出现 scenario-edited；V0 的 CREATE_001 旧预期与 V1 的新预期能追溯到不同来源"
        forbidden_effects: ["只识别最近一次落地", "以相同场景编号代替历史配对核对"]
        evidence_hints: ["三份版本原文与配对前后逐项对照", "status 与任务清单"]
      - id: SOP-221-P05
        polarity: positive
        title: 还原写回最近落地版本并保留手改历史
        actor: 开发者
        priority: P0
        verify: cli
        initial_state: ["H 上构造 E 类改动（以 V2 为底，只改文件头定义的那五个编号），已登记 scenario-edited"]
        steps:
          - "记录陌生版本号与原文；运行 sop-board merge restore demo-web friction"
          - "读取磁盘文件、当前版本配对、status 与 task list，再从历史读取手改版本"
        expected:
          - "命令输出将被覆盖的编号恰为 TC_TEAM_CREATE_001、TC_TEAM_INVITE_004、NC_EDIT、NC_REMOVE、NC_ADD，包含新增与删除造成的覆盖"
          - "写回 V2 而非 V0 或最近一次手改版本，沿用 M2 配对，scenario-edited 消失，不排合并"
          - "手改版本及其原文仍能追溯，用例、决定、历史任务和历史执行结果没有被删除"
        forbidden_effects: ["以还原名义重判用例", "物理删除手改历史"]
        evidence_hints: ["restore 输出及退出码", "文件摘要与配对", "还原前后 attention、任务与历史版本"]
      - id: SOP-221-P06
        polarity: positive
        title: 会话明确全量重新合并时预告手改重建范围
        actor: 开发会话
        priority: P0
        verify: cli
        initial_state: ["B0 改成 E 且 scenario-edited 已出现；看板暂停"]
        steps:
          - "运行 merge prepare demo-web friction --full --session <B>，保留准备输出与 prompt"
          - "按完整七条用例给出判断，仍将 INVITE_002 并入 INVITE_001、LIST_001 暂缓；对非用例场景逐条给出合法去向，再 submit"
        expected:
          - "准备为全量，写明会话要求全量，列出 TC_TEAM_CREATE_001 与 TC_TEAM_INVITE_004 将按用例重建；不把 NC_EDIT 说成由用例生成"
          - "完整输出落地，CREATE_001 的手改标记消失、INVITE_004 按当前用例恢复；非用例场景按本次明确判断处理"
          - "scenario-edited 消失；准备前不发生静默重建"
        forbidden_effects: ["以增量省略其余用例判断", "把预告重建当作已还原"]
        evidence_hints: ["prepare、submit 输出", "final.json、模式与任务目录清单", "文件前后差异"]
      - id: SOP-221-P07
        polarity: positive
        title: 看板按钮由真实 Codex 执行全量重新合并
        actor: 开发者
        priority: P0
        verify: web
        initial_state: ["B0 改成 E 且 scenario-edited 已出现；本机已登录的真实 Codex 可用；agents.merge 未指定或为 codex", "自动执行关闭，自动任务恢复；此前没有因 E 排合并"]
        steps:
          - "从本机合并页点击“重新合并”，记录按钮触发、任务准备信息与重建提示；等待真实模型结束"
          - "核对任务模式、完整判断、文件差异与 attention；从实际非回环页面查看同一任务"
        expected:
          - "这次人的操作才产生全量任务，原因为开发者重新合并；准备信息列出将按用例重建的手改场景"
          - "真实 Codex 给出全批判断并落地，按用例重建的场景不保留手改标记；attention 消失，两种地址可查同一结果"
        forbidden_effects: ["默认切换为 Claude", "用手写 final.json 或模型替身充当此场景通过", "自动执行产品场景"]
        evidence_hints: ["点击前后截图与请求", "真实 Codex 原生会话记录、准备信息与最终判断", "任务与文件差异"]
      - id: SOP-221-P08
        polarity: positive
        title: 只有场景没有用例的批次继续按原规则执行
        actor: 独立执行者
        priority: P1
        verify: cli
        initial_state: ["演示工作区自检通过，另建 nocase 批次，只有 NC_ONLY 正向场景与反向豁免，从未上传用例，也无落地合并", "自动执行关闭；无其他任务占用环境"]
        steps:
          - "修改 NC_ONLY 的预期并等待登记，读取 attention 与 task list"
          - "execute prepare demo-web nocase --scope NC_ONLY --session <A>；仅核对准备范围后取消本次任务"
        expected:
          - "新版本正常登记，不产生 scenario-edited 或合并任务"
          - "执行准备成功，范围是修改后的 NC_ONLY；不被 scenario-file-edited 拒绝"
        forbidden_effects: ["把所有场景文件变化都禁止执行", "隐式创建用例"]
        evidence_hints: ["版本、attention 与任务输出", "准备目录及取消输出"]
      - id: SOP-221-P09
        polarity: positive
        title: 已手改的措辞转成用例增改后由合并重新落地
        actor: 开发会话
        priority: P0
        verify: cli
        initial_state: ["B0；只在 CREATE_001 场景预期增加“名称不被截断”，已出现 scenario-edited；使用者明确要保留该措辞并署名 dev-a"]
        steps:
          - "export --case TC_TEAM_CREATE_001 --out <新文件>，仅在用例 expected_results 补充同一措辞"
          - "先 put --dry-run 并呈报，再按使用者选择正式 put --case TC_TEAM_CREATE_001 --by dev-a --reason “名称不被截断” --session <B>"
          - "正常 prepare，不带 --full；核对场景输入基线与 delta.json，仅给 TC_TEAM_CREATE_001 的变化判断并 submit，再查看 task show、用例、场景、配对和 attention"
        expected:
          - "修改进入有署名依据的用例版本；只有正式 put 才登记上传、决定并触发合并，手改本身未排合并"
          - "mode 为增量，基线任务为 M0，场景输入为 V0；未配对的手改版本不作为场景输入，changed_cases 只有 TC_TEAM_CREATE_001，其余判断沿用"
          - "落地用合并结果覆盖手改文件，CREATE_001 的同一措辞来自当前用例并建立有效配对；scenario_diff 列出被覆盖的手改场景 TC_TEAM_CREATE_001，即使措辞与手改相同也不能漏报；scenario-edited 消失，原手改版本仍可追溯"
        forbidden_effects: ["只把手改文件标成可信而不登记用例", "丢失人的依据", "以手改配对代替合并配对", "仅因已有手改而退为全量", "省略被覆盖的手改场景摘要"]
        evidence_hints: ["export、预览、正式 put 与合并输出", "场景输入原文、delta.json 与 task show 的 scenario_diff", "用例、决定、场景版本和配对前后值"]
      - id: SOP-221-N01
        polarity: negative
        negative_type: stale-input
        title: 手改未处理时拒绝普通执行准备
        actor: 独立执行者
        priority: P0
        verify: cli
        initial_state: ["B0，当前配置自检通过且环境空闲；改成 E，已出现 scenario-edited"]
        steps:
          - "分别运行 execute prepare demo-web friction --scope pending、--scope all、--scope TC_TEAM_CREATE_001，各带同一执行者 --session"
          - "记录三次退出码、错误、轮次、任务和模型活动"
        expected:
          - "三次均拒绝，退出码非 0，错误码 scenario-file-edited，说明还原、人工重新合并或转为用例改动的处理方式"
          - "没有启动执行或登记轮次，E 原文不变；不会通过改选范围绕过该限制"
        forbidden_effects: ["使用旧配对执行陌生内容", "自动恢复场景以继续执行"]
        evidence_hints: ["三组完整命令输出及退出码", "任务、轮次、文件摘要与模型活动"]
      - id: SOP-221-N02
        polarity: negative
        negative_type: stale-input
        title: 手改未处理时拒绝修复后的独立复验准备
        actor: 独立复验者
        priority: P0
        verify: cli
        initial_state: ["R；修复已真实登记待验证，复验者未参与修复，当前自检通过且环境空闲", "只改未涉及修复问题的 NC_EDIT 预期，已出现 scenario-edited"]
        steps:
          - "运行 execute prepare demo-web --fix <修复任务号> --session <独立复验者>"
          - "运行 merge restore demo-web friction，再用同一复验者重新准备；读取范围后取消复验任务"
        expected:
