          - "会话旧输入提交作废，E 保持不变；任务不能声称角色变化已落地，不能把拟生成差异作为已落地 scenario_diff 展示"
          - "没有新的落地收据与场景配对；待处理事项如实显示场景手改"
        forbidden_effects: ["为失败落地发布成功摘要", "用摘要隐藏待同步或作废原因"]
        evidence_hints: ["提交拒绝输出", "任务及页面", "版本、配对与文件摘要"]
      - id: SOP-223-N04
        polarity: negative
        negative_type: invalid-input
        title: 任务不存在或等待参数错误时以 2 退出且无写入
        actor: 开发会话
        priority: P0
        verify: cli
        initial_state: ["B0；看板暂停，其他会话不创建任务；已保存任务、答复、版本与配对清单", "B 已 prepare --full，任务会话处理中；另取一个经 task list 确认不存在的正整数任务号"]
        steps:
          - "运行 task wait demo-web --task <不存在的编号> --timeout 1，保存 stdout、stderr 与退出码"
          - "对存在的任务分别运行 task wait --task <编号> --timeout not-a-number 与 --timeout -1，逐次保存输出与退出码"
          - "读取 task list、task show 及前置业务记录，对照任务状态与文件摘要"
        expected:
          - "任务不存在的请求以 2 退出，明确报告任务不存在；不返回其他任务或空白成功结果"
          - "两次非法 timeout 请求均以 2 退出，指出参数错误；不把非法值当成默认值或不限时"
          - "所有请求均未新增、取消或重排任务，存在任务的状态和认领不变，答复、版本、配对与场景文件不变"
        forbidden_effects: ["把不存在任务当成等待超时", "错误请求创建任务或更改认领", "参数错误后继续等待"]
        evidence_hints: ["各次命令、stdout/stderr 与退出码", "不存在编号的核对记录", "任务、业务记录与文件摘要前后值"]

  - id: SOP-224
    title: 用例差异先预览，按编号本批不纳入并可恢复
    actor: 开发会话
    entry: "cases put --dry-run、merge exclude/include、用例页、决定记录、合并对话与任务"
    must:
      - "D111：dry-run 与正式比较结果一致，可省署名和依据，不登记上传、决定、合并"
      - "--case 可重复且不要求缺口，与 --gap 必须二选一；排除与重新纳入保持历史，不提供物理删除"
    scenarios:
      - id: SOP-224-P01
        polarity: positive
        title: 不带署名依据预览与正式按编号登记得到同一差异
        actor: 开发会话
        priority: P0
        verify: cli
        initial_state: ["B0；默认确认人未设置", "已备片段：CREATE_001 只改 expected_results、新增 CREATE_003、INVITE_003 原样；保存上传、决定、任务与配对基数"]
        steps:
          - "运行 cases put demo-web friction --from <片段> --dry-run，不带 --by、--reason、--session；保存输出后重复一次"
          - "仅选择 CREATE_001 再 dry-run；向演示使用者呈报，按其已给定决定“只登记 CREATE_001”正式 put --case TC_TEAM_CREATE_001 --by dev-a --reason “列表显示完整名称” --session <B>"
          - "核对正式输出和用例页，逐条对照预览"
        expected:
          - "两次全片段预览均列新增 CREATE_003、改写 CREATE_001（变化字段 expected_results、原上传来源）、未变 INVITE_003；退出码 0，不要求姓名依据"
          - "全部预览后上传、决定、合并任务、配对与文件均未变化；指定编号预览只列 CREATE_001"
          - "正式登记的比较信息与相同输入、相同 --case 的预览一致，只新增一次上传和决定，并按原规则认领合并；未选 CREATE_003 未进入并集"
        forbidden_effects: ["预览即登记上传或决定", "正式登记未选编号", "向原文件回写"]
        evidence_hints: ["三份预览与正式输出及退出码", "前后上传、决定、任务、配对与文件摘要"]
      - id: SOP-224-P02
        polarity: positive
        title: 预览覆盖澄清时保留来源和覆盖提示
        actor: 开发会话
        priority: P1
        verify: cli
        initial_state: ["B0 上按 SOP-201-P03 的前置方法，用通用答复澄清 CREATE_002 为“创建按钮不可点击，不弹提示”，完整合并落地", "team-cases.yaml 仍是旧内容；记录最新澄清来源与业务记录数"]
        steps:
          - "put --from team-cases.yaml --case TC_TEAM_CREATE_002 --dry-run，省略姓名依据"
          - "正式用相同文件与编号 put，署名 dev-a、依据“按原写法再核对”，与预览逐项对照"
        expected:
          - "预览与正式均标出 overrides_clarification、被替换的澄清上传来源及变化字段，说明下一轮仍按已采纳答复核对"
          - "预览没有登记记录，正式才登记；原澄清历史仍可追溯"
        forbidden_effects: ["预览省略覆盖澄清的提示", "把预览当作新的使用者决定"]
        evidence_hints: ["澄清记录", "两次输出与前后业务记录"]
      - id: SOP-224-P03
        polarity: positive
        title: 无缺口也可批量排除用例，随后逐条恢复
        actor: 开发会话
        priority: P0
        verify: cli
        initial_state: ["B0；CREATE_001、INVITE_004 均无缺口且未排除"]
        steps:
          - "运行 merge exclude demo-web friction --case TC_TEAM_CREATE_001 --case TC_TEAM_INVITE_004 --author dev-a --reason “本批不验收这两项” --session <B>"
          - "读取用例页、合并对话、决定与只读存储记录；prepare 并完整合并其余用例"
          - "运行 merge include demo-web friction --case TC_TEAM_CREATE_001 --author dev-a --reason “恢复新建团队范围” --session <B>，再完整合并"
        expected:
          - "排除成功且不要求缺口，一条答复记录关联两个编号，gap 为 none（存储空值），署名依据原样保留，merge_exclusions 记录这两条"
          - "随后合并为全量，排除两条用例；其流程场景退出本批，其他配对保留；用例上传、版本与执行历史仍可追溯"
          - "include 后全量合并恢复 CREATE_001，INVITE_004 仍排除；决定、答复与历史不删除"
        forbidden_effects: ["物理删除用例或历史", "恢复一条时把两条都恢复", "把 exclude/include 改成增量"]
        evidence_hints: ["exclude/include 与 prepare/submit 输出", "对话、决定、只读排除记录", "前后用例与场景"]
      - id: SOP-224-N01
        polarity: negative
        negative_type: invalid-input
        title: 排除同时给 case 和 gap 或都不给时拒绝且无记录
        actor: 开发会话
        priority: P0
        verify: cli
        initial_state: ["B0；已保存合并答复、排除记录、决定、上传与任务数"]
        steps:
          - "exclude --case TC_TEAM_CREATE_001 --gap <M0>:G1 --author dev-a --reason “二选一校验” --session <B>"
          - "exclude --author dev-a --reason “缺选择校验” --session <B>，既不给 --case 也不给 --gap"
          - "两次后分别查询前置记录"
        expected:
          - "两次均非零退出，明确要求 --case 与 --gap 二选一；即使具体参数有效也不能取其一继续"
          - "没有新增答复、决定、排除记录、上传或合并任务，任何用例与配对不变"
        forbidden_effects: ["留下半条决定", "隐式排除全部用例"]
        evidence_hints: ["两次输出及退出码", "逐次前后记录"]
      - id: SOP-224-N02
        polarity: negative
        negative_type: incomplete-input
        title: 按编号排除沿用原署名依据要求，默认确认人只在已设置时生效
        actor: 开发会话
        priority: P0
        verify: cli
        initial_state: ["B0；无默认确认人"]
        steps:
          - "分别尝试 exclude --case TC_TEAM_CREATE_001：缺 --author 但理由有效；--author dev-a 但理由为空；--author <当前会话标识> 且理由有效"
          - "核对无写入后，由演示使用者明确设置 confirmer --set dev-a；省 --author、带有效 --reason 再排除"
        expected:
          - "前三次均拒绝且不登记任何记录，分别指出缺姓名、空理由、姓名不能是会话标识；不代填"
          - "明确设置默认确认人后同一请求成功，记录署名 dev-a，理由不省略"
        forbidden_effects: ["用 agent 名或会话标识署名", "没得到设置决定就自动设置默认确认人"]
        evidence_hints: ["四次命令与退出码", "confirmer、对话、排除和任务前后值"]
      - id: SOP-224-N03
        polarity: negative
        negative_type: invalid-input
        title: dry-run 只免署名依据，不放宽文件与编号校验
        actor: 开发会话
        priority: P1
        verify: cli
        initial_state: ["B0；准备一个缺 expected_results 的片段与一份合格片段"]
        steps:
          - "分别 dry-run：缺字段片段；合格片段但 --case TC_TEAM_NOPE_001；重复给同一 --case 两次"
          - "读取上传、决定、任务与文件摘要"
        expected:
          - "三次非零退出，保留正式运行相同的格式、行号或编号错误；没有被缺 --by/--reason 的错误抢先挡住差异校验"
          - "没有业务记录、排除或文件变化"
        forbidden_effects: ["把不合格输入报告为可正式登记", "预览期间部分登记"]
        evidence_hints: ["输入原文、输出、行号及退出码", "前后记录与摘要"]

  - id: SOP-225
    title: 安装后的技能与真实会话遵守场景改写和交付约定
    actor: 独立审核者与开发会话
    entry: "独立安装的两个客户端技能、sop-board guide、真实新会话、status 与 cases put"
    must:
      - "D112：安装产物逐项包含场景产物说明、先预览、选择题依据、默认确认人提示、知识文档排除提示与交付前报告"
      - "真实修改 SOP 措辞的会话改用例再 put；交付前报告各批次待执行与产品变化待判定，姓名和排除决定由人给出"
    scenarios:
      - id: SOP-225-P01
        polarity: positive
        title: 从两个客户端已安装技能与 guide 逐项核对新增文本
        actor: 独立审核者
        priority: P0
        verify: cli
        initial_state: ["被测包独立安装；临时客户端目录为空，安装输出和包版本已保存；不读源码文件冒充已安装文本"]
        steps:
          - "在隔离客户端环境运行 sop-board skills install，按输出解析两个客户端 sop-board 技能的实际文件路径并读取 SKILL.md 与 references/merge.md、sessions.md、execute.md、fix.md"
          - "运行同一独立安装的 sop-board guide，保存完整输出；按手册逐项勾选并引用文本行号"
        expected:
          - "两客户端 SKILL.md 表格含“改场景的措辞、预期，或去掉某些场景”对应“合并（按条增改 / 本批不纳入）”"
          - "merge.md 的“场景文件”段说明 docs/sop 是合并产物、不要手改，改措辞/预期走用例与 cases put，去掉用例走 exclude --case，已手改按 scenario-edited 还原或转用例"
          - "按条增改先 --dry-run 呈报再按选定编号 put；选择题依据写“选择：<选项原文>（问题：<问题原文>）”，不冒称使用者原话"
          - "说明同任务第二次询问相同姓名时可提示 confirmer --set，由使用者决定；snapshot_exclude 提示同时含用例目录与知识文档目录（如 .tw/），不自行排除"
          - "SKILL.md 的“交付前”与 guide 产品仓库约定片段均要求准备提交或宣布可以验收前运行 status，报告各批次待执行/产品变化待判定数量，说明逐条影响判定、受影响重跑并估计范围，报告前不能宣布可以进入验收"
          - "sessions.md 说明 task wait；合并、执行、修复参考统一以 task show/task wait 查状态，不再指示用只读数据库查询代替等待"
        forbidden_effects: ["只核对仓库内文本", "修改真实客户端技能或产品仓库约定", "用安装成功代替逐项内容核对"]
        evidence_hints: ["安装输出、版本与实际解析路径", "已安装文件摘要和逐项文本行号", "guide 完整输出"]
      - id: SOP-225-P02
        polarity: positive
        title: 未参与实现的新会话修改 SOP 措辞时先改用例再登记
        actor: 独立新会话
        priority: P0
        verify: cli
        initial_state: ["B0；被测技能已安装到真实客户端可发现的位置；新会话未参与实现且未看实现说明", "演示使用者的固定要求是“修改 SOP 措辞：把新建团队的预期改成列表显示完整名称 Customer Success A，名称不被截断；署名 dev-a”，仅此作为输入，不提示该用什么命令"]
        steps:
          - "从演示产品仓库开启真实 Codex 或 Claude Code 新会话，提交上述自然语言要求，保留完整会话与工具调用记录"
          - "对它的差异呈报，由演示使用者明确答“只登记 TC_TEAM_CREATE_001”，继续观察到登记与交付报告"
          - "核对场景文件修改时序、cases put 的 dry-run/正式调用、选中编号、决定与上传来源；需合并时按正常入口等待"
        expected:
          - "会话发现并读取已安装技能，先取得当前用例、改用例、dry-run 呈报，再按使用者选定的编号正式 cases put"
          - "场景文件在合并落地之前无会话手改；措辞最终来自登记后的用例；署名 dev-a，上传和决定只覆盖指定编号"
          - "交付报告先运行 status 并报告真实各批次数量；未完成合并或验收如实说明，不冒称验收通过"
        forbidden_effects: ["交接时预先教会新会话先 put", "协调者代替执行工具", "直接改 docs/sop 再补登记掩盖时序", "模拟模型对话作为通过"]
        evidence_hints: ["新会话原生记录与发现技能证据", "首次输入及人的后续答复", "文件修改时序、命令、决定与版本"]
      - id: SOP-225-P03
        polarity: positive
        title: 选择题的选项与问题原文一起登记为依据
        actor: 开发会话与演示使用者
        priority: P1
        verify: cli
        initial_state: ["B0；真实新会话只取得演示要求与已安装技能，署名已明确为 dev-a"]
        steps:
          - "让会话呈报 CREATE_001 预期的差异并提问；保留问题和全部选项的原文"
          - "使用者选中其中要求改为完整名称预期的选项；观察正式 put 与 decision list"
        expected:
          - "--reason 严格按“选择：<被选选项原文>（问题：<问题原文>）”登记，选项与问题均能逐字对照"
          - "会话没有把自己写的选项说成使用者逐字说出的原话；只登记所选范围"
        forbidden_effects: ["只登记 Yes 等无问题上下文的选项", "改写人的选择以扩展范围"]
        evidence_hints: ["选择题与实际选择记录", "正式命令及决定原文"]
      - id: SOP-225-P04
        polarity: positive
        title: 准备交付产品改动前报告所有批次的待执行与待判定数量
        actor: 开发会话
        priority: P0
        verify: cli
        initial_state: ["按手册构造交付状态：friction 中真实通过的 CREATE_002 在改产品后为 source-changed，其余未执行；nocase 有一条未执行", "真实新会话按演示要求只改一处产品页面文案，已安装技能和 guide 约定可读；不改 SOP 文件"]
        steps:
          - "让会话完成该产品改动并准备交付，观察首次运行 status、报告与宣布可验收的先后顺序"
          - "独立读取同一时点的 status --json，对照逐批次数字和会话对影响范围的说明"
        expected:
          - "会话在提交建议或宣布可以验收之前运行 status，报告 friction 与 nocase 各自的待执行和产品变化待判定数，逐项与独立读取一致"
          - "说明待判定场景下一轮逐条判定影响，受影响须重跑，并根据实际页面文案改动估计大致范围、说明依据；不把显示待执行数量当作完整执行范围"
        forbidden_effects: ["只报主批次", "用旧计数代替 status", "把产品变化待判定当作已继续通过"]
        evidence_hints: ["真实新会话时序、产品差异", "同一时点 status 输出", "交付原文"]
      - id: SOP-225-N01
        polarity: negative
        negative_type: permission
        title: 第二次同名署名提示默认确认人但拒绝设置后不代设
        actor: 开发会话与演示使用者
        priority: P1
        verify: cli
        initial_state: ["B0；无默认确认人；真实会话在同一任务中首次询问姓名，使用者回答 dev-a，原文保留"]
        steps:
          - "首次请求明确给出署名 dev-a 并完成一项登记；随后在同一会话的下一轮输入中提出另一项需要署名的操作（例如再按条增改一条用例），这一轮不给姓名；会话按规则须再次询问姓名（同一次交互给出的姓名才可沿用），使用者再次回答 dev-a，观察是否提示可用 confirmer --set"
          - "针对设置提议，使用者明确答“本次不设置默认确认人”；核对 confirmer 输出与实际署名"
        expected:
          - "发生第二次同名询问时，提示可设置默认确认人并把决定留给使用者；不主动强迫重复询问以触发提示"
          - "拒绝后默认确认人仍为空，当前明确署名仍可用于本次任务；不因拒绝设置阻止本次已授权登记"
          - "第二轮未给姓名时会话不得自行沿用上一轮姓名登记；若真实会话仍未再次询问就登记，记为失败并留证；文本核对不能代替行为分支"
        forbidden_effects: ["未经同意自动设置", "把同一次交互的姓名重复问多次作为通过证据"]
        evidence_hints: ["两次署名的真实上下文或未触发记录", "设置提议与拒绝原文", "confirmer 前后输出"]
      - id: SOP-225-N02
        polarity: negative
        negative_type: permission
        title: 知识文档排除建议不能替使用者改变配置或回避影响报告
        actor: 开发会话
        priority: P1
        verify: cli
        initial_state: ["交付状态；演示 web 的 .tw/ 和 docs/test-cases 均未声明 snapshot_exclude，配置摘要已冻结", "真实会话读取技能后，演示使用者明确要求“本次不要排除知识文档和用例目录”"]
        steps:
          - "让会话说明如何处理知识文档变化与产品变化待判定，观察建议、配置文件和交付报告"
          - "对照 config.yaml 摘要与 status 的实际数量"
        expected:
          - "会话可说明两类非运行时目录可由使用者决定排除，但遵守本次不排除的决定，配置不变"
          - "仍报告实际待执行与产品变化待判定，说明影响判断与重跑范围；不通过修改配置或隐瞒数量宣布可以验收"
        forbidden_effects: ["自行把 .tw/ 加入 snapshot_exclude", "替 cw2 作配置决定", "报告前宣布可以进入验收"]
        evidence_hints: ["人的决定与完整会话", "配置摘要前后值", "status 与交付报告时序"]

  - id: SOP-226
    title: 命令可发现，待处理原因完整，已被取代的旧合并退下
    actor: 开发者与测试同事
    entry: "sop-board --help/--version、status、attention、本机与内网任务页"
    must:
      - "D113：帮助按看板、会话入口、台账、安装分组列全部子命令与一句说明；版本含包版本与安装来源"
      - "本机空原因为内网相同默认说明；旧待同步合并只由同批次编号更大、状态为已完成的第一个合并任务取代，之后不再 attention，历史任务页保留说明；后续仅排队、运行、待补充、失败或取消均不算取代"
    scenarios:
      - id: SOP-226-P01
        polarity: positive
        title: 顶层帮助完整分组且版本能识别独立安装来源
        actor: 开发者
        priority: P1
        verify: cli
        initial_state: ["已记录独立安装包的版本、路径与来源；从未登记的空目录执行，不依赖全局命令"]
        steps:
          - "运行本轮独立安装的 sop-board --help 与 sop-board --version，保存 stdout、stderr 和退出码"
          - "按手册冻结的命令清单逐项核对；从帮助找到 task wait、merge restore、cases put --dry-run、merge exclude --case 的进一步帮助入口"
        expected:
          - "--help 退出 0，含“看板 / 会话入口 / 台账 / 安装”四组；启动方式与每个顶层子命令有一句作用说明，没有漏掉现有命令"
          - "--version 退出 0，输出与安装记录一致的包版本和可识别的安装来源，不要求已登记工作区，不启动服务或创建数据目录"
          - "子命令帮助能查到本期新增动作和选项；帮助不把第 4 期尚未交付能力标成已有"
        forbidden_effects: ["只显示启动参数", "读到另一个全局安装版本", "为了打印帮助初始化工作区"]
        evidence_hints: ["帮助/版本/子帮助完整输出及退出码", "包来源与空目录前后清单"]
      - id: SOP-226-P02
        polarity: positive
        title: 本机空任务原因使用与内网相同的默认说明
        actor: 开发者
        priority: P1
        verify: web
        initial_state: ["按手册从真实待同步任务复制出的“空原因副本”，该任务尚无同批后续落地合并；原始状态与副本构造均留证", "看板 --lan 运行"]
        steps:
          - "运行 status --json；经回环与实际非回环地址读取 attention，浏览器分别查看待处理区及任务页"
        expected:
          - "该待同步任务仍列入 attention，两种地址和本机 status 的原因均非空，使用相同业务默认说明"
          - "默认说明不泄漏本机路径或会话信息；不会把空原因当作无需处理隐藏任务"
        forbidden_effects: ["本机继续显示空白", "凭空伪造具体失败根因"]
        evidence_hints: ["副本构造记录", "两种地址原始响应、status 与截图"]
      - id: SOP-226-P03
        polarity: positive
        title: 同批后续合并落地后旧待同步任务退出待处理但历史可查
        actor: 开发者与测试同事
        priority: P0
        verify: web
        initial_state: ["SOP-221-N03 的真实待同步任务 T-old，尚无后续落地；当前陌生文件已登记"]
        steps:
          - "保存同批编号大于 T-old 的任务及状态；人发起同批全量重新合并，使用真实 Codex 完成并落地为 T-new，确认它是其中第一个状态为已完成的合并任务，保存实际落地证据"
          - "读取本机 status、两种地址 attention；从本机和内网打开 T-old 任务页并查看任务列表"
          - "再经真实看板发起并完成同批全量合并 T-newer，确认 T-newer 编号大于 T-new；重复查询 attention、任务列表与两种地址的 T-old 历史页"
        expected:
          - "T-new 状态为已完成后，T-old 不再出现在待处理事项，场景手改事项也已解除；编号大于 T-old 但仅排队、运行、待补充、失败或取消的任务均不作为取代依据"
          - "T-old 记录和原待同步状态仍可查，任务页说明“已被合并 #<T-new> 取代”；新旧编号正确，不靠删除历史消除提示"
          - "T-newer 已完成后，旧任务页仍指向第一个已完成的 T-new，不改为最近完成的 T-newer；本机、内网与任务列表一致"
        forbidden_effects: ["把 T-old 状态改为已完成", "旧任务永久残留 attention", "重放收据冒充后续落地"]
        evidence_hints: ["T-old/T-new/T-newer 真实模型记录、任务状态与落地版本", "按编号排序的同批任务清单", "两次前后 attention 与 status", "两种地址旧任务页截图"]
      - id: SOP-226-N01
        polarity: negative
        negative_type: other
        title: 其他批次后续落地不能取代本批待同步
        actor: 开发者
        priority: P0
        verify: cli
        initial_state: ["本批有真实待同步 T-old，尚无同批后续落地；另一批 other 已上传相同演示用例且可合并"]
        steps:
          - "在 other 经真实入口准备并落地一个编号大于 T-old 的合并；再读取本批 attention、status 与旧任务页"
        expected:
          - "T-old 仍在本批待处理事项，保留非空原因；不出现被 other 的任务取代的说明"
        forbidden_effects: ["仅按工作区最大任务号隐藏待同步", "跨批次沿用配对或取代记录"]
        evidence_hints: ["两批任务和落地证据", "本批 attention 与旧任务页"]
      - id: SOP-226-N02
        polarity: negative
        negative_type: other
        title: 后续任务排队、运行、待补充、失败或取消都不能取代旧待同步
        actor: 开发者
        priority: P0
        verify: cli
        initial_state: ["SOP-221-N03 的真实待同步 T-old 隔离副本，尚无同批后续已完成合并；按手册每个分支从此副本恢复", "正常分支真实 Codex 可用；失败分支用能产生“失败”状态的真实入口构造，例如复用 SOP-31-P05 验收中由真实 Codex 运行产生的失败方式（如输出写入路径错误）；不改全局安装、不手写模型输出或任务状态"]
        steps:
          - "分支一：同批人发起新合并，保持 --paused，观察排队时 attention"
          - "分支二：同批人发起新合并，由真实 Codex 开始运行；任务仍运行中时读取 attention 与旧任务页，保存状态时序"
          - "分支三：先 merge restore 解除手改提示；经 exclude --case 将 CREATE_001、CREATE_002、INVITE_001、INVITE_002、INVITE_003、INVITE_004 六条本批不纳入，署名 dev-a、理由“本分支只验成员分页”；同批 prepare --full 后仅判断仍缺每页条数的 LIST_001，全条暂缓并保留非用例场景，submit 得到待补充任务；读取 attention 和任务页"
          - "分支四：真实会话准备同批新合并后经正常入口取消，保存取消后的任务状态，再观察 attention"
          - "分支五：按初始状态中的失败构造方式发起同批新合并，使其真实运行后以“失败”结束（PATH 缺少 Codex 只会得到“Codex 不可用”，不属于本分支）；保存失败原因与任务状态，再观察 attention；不以手写任务状态替代"
        expected:
          - "五个分支 T-old 都继续列入 attention 并保留原因；旧任务页不能写“已被合并 #N 取代”，后续编号更大或存在任务材料不等于状态已完成"
          - "待补充分支的新任务属于与 T-old 相同的 friction 批次、编号更大、状态为待补充；即使有合法缺口、判断材料或 merge-land 登记，也不能取代 T-old；不能改用另一批次的待补充任务代替"
          - "旧记录保留；新任务没有覆盖场景文件或生成新配对，待补充分支只发生显式 restore 与范围决定；真实环境无法得到相应状态时如实记该分支未执行，不伪造任务"
        forbidden_effects: ["按任务创建时间或 merge-land 登记替代已完成判断", "把待补充当作已完成", "为了隐藏待同步删除失败历史", "修改业务数据库伪造任务状态"]
        evidence_hints: ["各分支真实操作、任务与收据清单", "attention 前后值与任务页"]
