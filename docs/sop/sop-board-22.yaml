          - "任务状态、认领和业务记录未被 wait 改变；之后原会话仍可正常提交"
        forbidden_effects: ["超时取消任务", "输出已完成或空白状态", "自行重试合并"]
        evidence_hints: ["wait stdout/stderr、耗时与退出码", "show 与后续提交结果"]
      - id: SOP-223-N02
        polarity: negative
        negative_type: other
        title: 仅新增角色或只改正反向不计入已有场景角色入口警告
