          - "退出码为 0；具体状态为待补充，由 JSON 区分，不因需要人处理而报超时或命令错误"
        forbidden_effects: ["把待补充报成已完成", "为等待自动生成业务答复"]
        evidence_hints: ["双终端时间线与退出码", "wait/show JSON、缺口原文"]
      - id: SOP-223-N01
        polarity: negative
        negative_type: timeout
        title: 等待超时以 3 退出并输出当前状态，不取消不重排任务
        actor: 开发会话
        priority: P0
        verify: cli
        initial_state: ["B0；B 已 prepare --full，任务会话处理中且没有人提交或取消"]
        steps:
