          - "当前编号答复成功，只登记一次有效答复；随后 prepare 为增量，基线任务为 M1，changed_cases 只有 TC_TEAM_LIST_001；delta.json 保留该答复与 <M1>:G1 的关联"
          - "合法输出落地 LIST_001 并解决缺口，其余判断沿用；拒绝过的旧编号答复始终没有记录"
