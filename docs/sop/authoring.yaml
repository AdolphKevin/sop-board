# v10 现行场景：SOP 编写（含业务交叉）、从 SOP 生成场景时修改交叉的已有场景、草稿批注与确认
# 预期依据：docs/design.md（2026-11-10 blur.yin 批准）。版本 1 由未参与实现的审核方在实现前编写；实现与返工会话只读本文件。
#   版本 3 由未参与实现的审核方按 docs/design.md 已定决策 18 与 docs/sop-guide.md“业务交叉”一节（使用者 2026-11-11 决定）修订：
#   AUT-01-P01 增加写 SOP 时核对已有 SOP、改正口径变化的已有规则并列出交叉；新增 AUT-04（生成场景时修改预期改变的已有场景，预期不变的不改）。
#   版本 4 由未参与实现的审核方按 docs/design.md 已定决策 20（使用者 2026-11-12 决定）修订：AUT-02 改为在工作台审阅草稿（检查清单、SOP 规则原文、
#   批注、同意、本组同意、文件面板），删除草稿批注页，draft confirm 要求全部同意并以同意人为确认人；新增 AUT-02-N02～N04。
#   版本 5 由未参与实现的审核方按 docs/design.md 已定决策 21（使用者 2026-11-12 决定）修订：新增 AUT-02-P03（批注与同意在同一产品的各台机器上可见）。
#   “双机项目”见 setup.yaml 文件头。
# 共用前置：演示项目同 setup.yaml 文件头（项目 demo，数据目录 $D）；看板已以 sop-board serve demo --data $D --lan 启动。
#   “演示 PRD”指 examples/demo-shop 提供的一份需求 Markdown；草稿文件 draft-a、draft-b 是 app 的 scenarios.path 下 metadata.status 为 draft 的场景文件，
#   各有一个节点（DRAFT-A-1、DRAFT-B-1）、两条场景（P01 正向、N01 反向），每条场景的 refs 为 refund.md#R2。
#   “refund.md”指 app 场景目录下已登记的退款 SOP（R1 申请期限、R2 退款金额与次数）；“部分退款 SOP”指由演示 PRD 写成并登记的 SOP。
#   “退款口径答复”指使用者对 refund.md R2 口径变化的答复：不填金额时按实付金额全额退款，退款记录的类型为“全额”；
#   填写金额时按所填金额退款，不能超过实付金额，类型为“部分”；每单只能成功退款一次；商家订单页的显示不变。

metadata:
  requirement: "sop-board v10：会话按 sop prepare 给出的资料写 SOP，先核对已有 SOP 的业务交叉，口径改变的已有规则经使用者确认后一并改正，sop submit 校验结构并写入确认人；从 SOP 生成场景时修改预期随之改变的已有场景（指纹变化回到未执行），预期不变的不改并写明理由，不新增影响面字段或登记文件；草稿是 status: draft 的场景文件，不进入执行；测试同学在工作台对照检查清单与 SOP 规则原文审阅草稿，批注或逐条、按节点同意，会话按批注修订后 draft resolve；每条场景在当前指纹上都已同意且没有未处理批注时，draft confirm 改为 confirmed 并以同意人为确认人"
  version: 5
  owner: "blur.yin"
  status: confirmed
  sources:
    - ref: "docs/design.md"
      version: "2026-11-10"
      confirmed_by: "blur.yin"
    - ref: "使用者 2026-11-10 对场景集待确认问题的答复"
      version: "2026-11-10"
      confirmed_by: "blur.yin"
    - ref: "使用者 2026-11-10 对工作台试用的反馈"
      version: "2026-11-10"
      confirmed_by: "blur.yin"
    - ref: "docs/design.md 已定决策 18：验收范围由业务变化决定（业务交叉在编写时识别）；docs/sop-guide.md 业务交叉一节"
      version: "2026-11-11"
      confirmed_by: "blur.yin"
    - ref: "docs/design.md 已定决策 20：草稿审阅并入工作台（使用者 2026-11-12 决定）"
      version: "2026-11-12"
      confirmed_by: "blur.yin"
    - ref: "docs/design.md 已定决策 21：多人共享验收记录（草稿批注与同意共享）"
      version: "2026-11-12"
      confirmed_by: "blur.yin"
  tags: ["authoring", "sop", "draft", "crossing", "review"]

sops:
  - id: AUT-01
    title: 会话编写业务 SOP
    actor: 开发者
    entry: "真实会话中运行 sop-board sop prepare --source、sop submit"
    must:
      - "sop submit 校验六个标题（业务目标与范围、角色、业务规则、流程图、禁止的副作用、未覆盖范围）和规则编号，并由命令追加确认信息"
      - "动笔前逐份核对场景目录中已有的 SOP；新 SOP 的相关规则写明交叉的已有 SOP 文件名与规则编号及共同作用"
      - "新规则改变已有规则的口径时，先就改变后的口径向使用者提问；确认后改正已有 SOP 的该规则，删去其文末的确认记录，与新 SOP 分别 sop submit"
      - "登记后向使用者列出全部交叉：已有 SOP 与规则编号、口径是否改变、预计要修改的已有场景"
    scenarios:
      - id: AUT-01-P01
        polarity: positive
        title: 从演示 PRD 写出部分退款 SOP，核对出与 refund.md 的交叉，口径改变的 R2 经使用者确认后一并改正并登记
        actor: 开发者
        priority: P1
        verify: agent
        initial_state:
          - "演示 PRD 在临时目录中"
          - "记录 app 的 git status 与 shop.yaml 的 sha256"
        steps:
          - "在 app 目录新开 Claude Code 会话，请求“根据这份 PRD 写业务 SOP”并给出 PRD 路径"
          - "会话运行 sop prepare --source <PRD>；会话就 refund.md R2 的口径变化提问时，按“退款口径答复”回答；就其他业务口径提问时按 PRD 原意回答，PRD 未写明的回答“本次不纳入”"
          - "会话在仓库中写部分退款 SOP、改正 refund.md，并分别运行 sop submit"
          - "阅读会话登记后的交叉说明；查看两份 SOP 的正文与文末、app 的 git diff，以及看板 SOP 原文页"
        expected:
          - "sop prepare 复制了资料并给出提示词"
          - "会话记录显示它在动笔前读了 refund.md，并在改动 refund.md 之前就 R2 的口径变化提问，问题引用 refund.md R2 原文“退款金额等于实付金额”与 PRD 原文“金额不超过实付金额”"
          - "部分退款 SOP 含 业务目标与范围、角色、业务规则、流程图、禁止的副作用、未覆盖范围 六个标题；其业务规则写明与 refund.md 的交叉，引用规则编号 R1 与 R2，并说明申请期限沿用 R1、每单只能成功退款一次与 R2 共同作用"
          - "refund.md 的 R2 按“退款口径答复”改正（不填金额全额退款、类型“全额”；填写金额按所填金额、不超过实付、类型“部分”；每单只能成功退款一次），“不含部分退款”一类表述随之从范围与未覆盖范围中改正；R1 原文不变"
          - "两份 SOP 的 sop submit 都成功；refund.md 原有的确认记录已删去，两份 SOP 文末各只有一节由 sop submit 追加的确认记录，确认人都为操作者 N"
          - "登记后会话列出全部交叉：refund.md R1（口径未变）、refund.md R2（口径已变），以及预计要修改的已有场景，其中包括 shop#A"
          - "看板 SOP 原文页显示这两份 SOP"
          - "shop.yaml 的 sha256 不变；app 中除两份 SOP 外没有新增或改动的文件"
        forbidden_effects:
          - "会话询问确认人是谁"
          - "会话把未答复的业务口径按代码现状写成规则"
          - "会话在使用者答复之前改写 refund.md 的规则"
          - "会话自行在正文中填写确认信息"
          - "新增影响面字段或登记文件"
        refs: ["docs/design.md#保留能力的简化形态", "docs/design.md#署名", "docs/design.md#已定决策（2026-11-10 用户答复）", "docs/sop-guide.md#业务交叉：新需求碰到哪些已有场景", "docs/standard.md#业务变化与回归", "docs/reference.md#业务 SOP", "使用者 2026-11-10 对场景集待确认问题的答复 第 11 条"]
        evidence_hints: ["会话记录", "两份 SOP 文件与 git diff", "SOP 原文页截图"]
      - id: AUT-01-N01
        polarity: negative
        negative_type: incomplete-input
        title: 缺少规定标题的 SOP 不能登记
        actor: 开发者
        priority: P2
        verify: cli
        initial_state: ["已运行 sop prepare，仓库中的 SOP Markdown 没有“流程图”标题，其余五个标题齐全"]
        steps: ["运行 sop-board sop submit --json"]
        expected: ["以业务失败退出，写明缺少“流程图”", "没有追加确认信息"]
        forbidden_effects: ["结构不合格的 SOP 被登记"]
        refs: ["docs/design.md#保留能力的简化形态", "使用者 2026-11-10 对场景集待确认问题的答复 第 11 条"]

  - id: AUT-02
    title: 测试同学在工作台审阅草稿（批注、同意、本组同意、文件面板），全部同意后会话确认
    actor: 测试同学
    entry: "内网与本机工作台“草稿”筛选：草稿场景详情、草稿文件与节点行的「审阅」按钮打开的面板；sop-board draft annotations|resolve|confirm <文件>；sop-board status --json"
    must:
      - "草稿不进入执行；“草稿批注”页与导航项不再提供，/p/<项目>/drafts 不可访问；草稿只在工作台“草稿”筛选中审阅"
      - "草稿场景详情依次为：“文件 › 节点”路径、四要素、refs 指向的 SOP 规则原文、检查清单、批注表单、「同意」按钮；不显示复测表单"
      - "检查清单五项：场景是否忠实于 SOP 规则；预期能否直接观察并带具体值；禁止副作用是否写全；起点数据是否具体；是否漏了反向、边界或与已有业务交叉的场景（核对含义，不限措辞）"
      - "审阅状态只有 待审、有批注、已同意 三种：已同意 = 当前指纹上有同意且该场景没有未处理的批注；有未处理批注时不能同意；指纹变化后原有同意失效"
      - "同意按 文件 + 场景 + 指纹 记在看板数据库，不写场景文件，不区分检出，配了共享库时同一产品的各台机器共用；内网须署名，本机缺省以操作者署名；只能撤销自己的同意"
      - "同意后自动打开同一文件中下一条待审场景，没有时停留并提示"
      - "节点面板完整列出组内场景四要素，“同意本组 N 条待审场景”跳过有未处理批注的场景并列出原因；文件面板显示需求、来源、审阅进度与文件级批注，不提供整份同意"
      - "draft confirm 要求每条场景在当前指纹上已同意且文件没有未处理批注；confirmed_by 写同意人（去重，按首次同意时间排序，用“、”连接）；没有 --as"
    scenarios:
      - id: AUT-02-P01
        polarity: positive
        title: 测试同学看着检查清单与 SOP 规则原文逐条审阅，批注经会话修订后同意，全部同意后会话确认，确认人为同意人
        actor: 测试同学
        priority: P0
        verify: web
        initial_state:
          - "draft-a 的两条场景 DRAFT-A-1-P01、DRAFT-A-1-N01 都没有批注与同意"
          - "内网设备浏览器已存有姓名 张测"
        steps:
          - "在内网设备打开工作台，点“草稿”筛选，查看左栏 draft-a 文件行、DRAFT-A-1 节点行与两条场景的状态点"
          - "打开 DRAFT-A-1-P01，从上到下阅读右栏，展开 SOP 规则原文"
          - "点「同意」"
          - "在随后打开的 DRAFT-A-1-N01 上批注“预期应写明拒绝时的提示：退款金额不能超过实付金额”，查看「同意」按钮"
          - "本机在会话中请求处理草稿批注：会话运行 draft annotations，按批注修订 DRAFT-A-1-N01 的预期，运行 draft resolve"
          - "内网刷新页面，打开 DRAFT-A-1-N01，点「同意」"
          - "点 draft-a 文件行的「审阅」查看文件面板；本机同时打开 draft-a 的文件面板对照"
          - "本机在会话中请求确认 draft-a：会话运行 draft confirm draft-a"
          - "查看 draft-a 文件头、git diff、工作台与 run prepare --scope all 的范围"
        expected:
          - "左栏 draft-a 文件行与 DRAFT-A-1 节点行显示“已同意 0/2”并各有常显的「审阅」按钮；两条场景的状态点为待审"
          - "DRAFT-A-1-P01 的右栏依次为：标题上方的“draft-a › DRAFT-A-1”路径；起点、步骤、预期、禁止；refund.md R2 的原文（含“退款金额等于实付金额”）；五项检查清单；批注表单；「同意」按钮；右栏没有复测表单"
          - "点「同意」后 DRAFT-A-1-P01 为已同意、署名 张测，页面自动打开 DRAFT-A-1-N01；左栏进度为“已同意 1/2”"
          - "批注后 DRAFT-A-1-N01 为有批注，「同意」不可点并说明有未处理的批注"
          - "draft annotations 输出 张测 的批注，并列出 DRAFT-A-1-P01 已同意（张测）、DRAFT-A-1-N01 有批注；批注与同意都不出现在 draft-a 文件中"
          - "resolve 后 DRAFT-A-1-N01 为待审；同意后为已同意，左栏进度为“已同意 2/2”，页面停留在 DRAFT-A-1-N01 并提示 draft-a 没有待审场景"
          - "文件面板显示需求说明、来源、审阅进度（待审 0、有批注 0、已同意 2）与“可以确认”；本机面板附 sop-board draft confirm draft-a 命令，内网面板不显示命令"
          - "confirm 成功；draft-a 的 metadata.status 为 confirmed，sources 首项的 confirmed_by 为 张测"
          - "工作台中 draft-a 的场景离开“草稿”筛选，显示为未执行；run prepare --scope all 的范围包含它们"
        forbidden_effects:
          - "看板把批注或同意写进场景文件"
          - "有未处理批注时仍能同意"
          - "confirmed_by 写成操作者 N 而不是同意人"
          - "会话询问确认人是谁，或使用 --as"
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/design.md#保留能力的简化形态", "使用者 2026-11-12 需求（草稿页与工作台割裂、不知道批注什么、没有快速同意）"]
        evidence_hints: ["内网与本机各步骤截图与页面文本", "会话记录", "draft annotations 输出", "draft-a 的 git diff", "run 目录范围"]
      - id: AUT-02-P02
        polarity: positive
        title: 节点面板同意本组待审场景并跳过有批注的场景，文件面板写文件级批注，同意在内容相同的其他检出中同样有效
        actor: 测试同学
        priority: P1
        verify: web
        initial_state:
          - "draft-b 的两条场景 DRAFT-B-1-P01、DRAFT-B-1-N01 都没有批注与同意"
          - "已用 checkout create wt1 建立检出 wt1，wt1 中 draft-b 的内容与 main 相同"
          - "内网设备浏览器已存有姓名 李测"
        steps:
          - "在内网设备查看看板导航；用浏览器与 curl 分别请求 /p/demo/drafts"
          - "打开工作台，点“草稿”筛选，打开 DRAFT-B-1-N01，批注“预期应写明拒绝时的提示文字”"
          - "点 DRAFT-B-1 节点行的「审阅」，查看节点面板"
          - "点“同意本组待审场景”按钮"
          - "点 DRAFT-B-1-P01 详情标题上方路径中的 draft-b，查看文件面板"
          - "在文件面板提交文件级批注“缺少已全额退款的订单再申请部分退款的反向场景”"
          - "查看左栏 draft-b 文件行、DRAFT-B-1 节点行与两条场景的状态点；用检出切换选 wt1 再查看一次"
          - "本机运行 sop-board draft annotations draft-b"
        expected:
          - "导航中没有“草稿批注”；/p/demo/drafts 返回 404，没有跳转"
          - "节点面板完整列出 DRAFT-B-1-P01 与 DRAFT-B-1-N01 的起点、步骤、预期、禁止；按钮文字为“同意本组 1 条待审场景”"
          - "点击后 DRAFT-B-1-P01 为已同意、署名 李测；DRAFT-B-1-N01 仍为有批注，面板列出它被跳过，原因是有未处理的批注"
          - "文件面板显示 draft-b 的需求说明与来源、审阅进度（待审 0、有批注 1、已同意 1）与文件级批注表单；没有整份同意的按钮，也没有“可以确认”"
          - "文件级批注提交后出现在文件面板的批注列表中；DRAFT-B-1-P01 仍为已同意"
          - "main 与 wt1 的左栏中 draft-b 文件行与 DRAFT-B-1 节点行都显示“已同意 1/2”，DRAFT-B-1-P01 的状态点为已同意，DRAFT-B-1-N01 为有批注"
          - "draft annotations 输出两条批注（一条针对 DRAFT-B-1-N01，一条针对整个文件，均署名 李测），并列出 DRAFT-B-1-P01 已同意（李测）、DRAFT-B-1-N01 有批注"
        forbidden_effects:
          - "本组同意把有批注的 DRAFT-B-1-N01 记为已同意"
          - "页面上出现整份文件一键同意的入口"
          - "/p/demo/drafts 返回草稿页面或跳转到工作台"
          - "看板把批注或同意写进场景文件"
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "使用者 2026-11-12 需求（草稿页与工作台割裂、不知道批注什么、没有快速同意）"]
        evidence_hints: ["内网各步骤截图与页面文本", "/p/demo/drafts 的 curl 响应原文", "draft annotations 输出"]
      - id: AUT-02-P03
        polarity: positive
        title: 测试同学在 B 的看板上批注与同意，A 的会话照样读到并据此修订、确认
        actor: 测试同学
        priority: P1
        verify: web
        initial_state:
          - "双机项目；草稿文件 draft-a 已由 A 提交并推送，B 已拉取，两边内容相同"
          - "draft-a 的两条场景都是待审，没有批注；内网设备的浏览器已存有姓名 张测"
        steps:
