        expected: ["SOP 含业务目标与范围、角色、按节点编号的规则（附来源文件与原文摘录）、mermaid 流程图、禁止的副作用、未覆盖范围与待确认问题", "待确认问题按业务场景格式书写", "雪花算法等实现细节没有成为规则预期"]
