# SOP-BOARD-14 的验收场景
# 预期依据 docs/proposals/2026-10-22-integrated-rework.md（已批准，2026-10-22）的 D72～D83 与附录（D83 及 D79 中注明“D83 修订”的执行环境段由方案负责人于 2026-10-23 补充，AdolphKevin 2026-10-24 确认），以及 docs/reference.md 的开发会话入口（会话准备阻挡、blocked/skip 证据、execution_origin 与会话结束清理）、会话修复与独立复验、跨仓修复中与 D83 对应的约定和放弃修复任务的约定（提交 4831b16、fbbc434、32ea410；AdolphKevin 2026-10-24 确认）；只写业务流程，验收只以本文件、sop-board-12.yaml 的 SOP-127 与 sop-board-13.yaml 的 SOP-131～135 经真实入口执行为准。
# 版本 9（2026-10-24）：交付记录整理时发现 D83 与放弃修复任务的两项约定没有场景，按 docs/verification.md“K4 会话入口返工 1 定点复核”补齐——SOP-142 加 P04、N04（会话登记已有 SOP 原文，与看板上传同一校验）；SOP-144 加 P04、N04（受阻、跳过可不附证据但须写原因，实际执行的通过、失败须有证据）与 P05（按入口准备执行环境）；SOP-145 加 P03（仅排队或等待的看板任务不阻挡会话准备）、N02（运行或切换、占用环境的任务阻挡）、N03（同批次同类排队任务经同意才替换）、N04（已结束的任务不被接管或复活）；SOP-146 加 P03（等待中的看板修复不阻挡会话修复认领与复验准备）；新增节点 SOP-150（会话失败分流与修复任务放弃）。原有场景的编号与内容不变。两类依据（D83；放弃修复任务的约定）经 AdolphKevin 于 2026-10-24 确认，统一验收中按其同意由审核方改写；审核子代理复核后补齐前置、构造方法与执行顺序。SOP-150-N05 的“放弃会话修复不连带取消复验”属依据推断：docs/reference.md 会话修复段把“原修复已不在待验证或待提交时本次复验作废”列在放弃与提交交错的情形下，只有放弃不连带取消复验时该情形才会因放弃出现。补验 R-G8 发现 TC_MEMBER_OPEN_002 需要“已到期会员”前置而演示 app 无法准备，演示 app 能力补上设定会员到期。
# 版本 8（2026-10-24）：复审后补齐——演示 app 的能力说明补上会员开通与增加积分，与入口声明的操作名一致；统一验收中按 AdolphKevin 同意由审核方改写。
# 版本 7（2026-10-24）：审核子代理复核后补齐——入口声明写明演示操作名，与 sop-board-13.yaml 版本 7 一致；统一验收中按 AdolphKevin 同意由审核方改写。
# 版本 6（2026-10-24）：补验 R-G4 发现 SOP-143-P02 的答复“30 天”与“每月 1 日切换”自相矛盾（版本 3 引入），且演示 app 没有积分操作、入口缺口不能靠文字回复消除；统一验收中按 AdolphKevin 同意由审核方改为自然月答复（与 sop-board-13.yaml 版本 6 的 SOP-134-P01 一致），演示工作区补积分操作能力，SOP-143-P01 写明三条各自成为一条场景。
# 版本 5（2026-10-23）：统一验收 G4 后修订——SOP-146-N01 接受准备或提交两处拒绝（复验身份已在准备时核对）；SOP-147-P02、N02 写明退款期限冲突等问题的业务答复。版本 4（2026-10-23）：新增 SOP-149-N02（复验期间输入变化作废、不计入连续三次未通过，依据 docs/designs/SOP-BOARD-5.md 计数规则）。版本 3（2026-10-23）：SOP-143-P02 的答复改用演示用例已有的说法（积分周期、UTC、每月 1 日切换），原答复含用例中没有的概念，按 D68 应先追问，与本条“采纳”预期矛盾。版本 2（2026-10-23）：统一验收中按 AdolphKevin 同意改写 SOP-149-P03——优先级只在资源可用时生效，被互斥阻挡的高优先级任务不阻止不冲突的低优先级任务开始；修复运行时合并等待；状态与原因一致、排队位置与实际开始顺序一致仍为预期。版本 1（2026-10-22）：SOP-141～149。
# “演示工作区”：按 docs/verification.md 以名称 demo 登记的两仓（app 经真实 HTTP 调用 lib，lib 含明确植入的缺陷），入口声明 web 与 api，自检通过；看板以 --lan 启动，真实 Codex。
# app 另提供会员开通（含设定会员等级、发票抬头与会员到期日，可把已有会员置为已到期）、会员积分的查询、设定、增加，以及把演示时间推到指定 UTC 时刻的接口与页面（不实现清零规则），真实验证手册写明这些操作方法；入口声明的 operate 在引用手册章节的同时写明操作名：会员开通（含设定会员等级、发票抬头与到期日）、把会员置为已到期、积分查询、设定与增加、把演示时间推进到指定 UTC 时刻。演示失败后的自动任务处理同 sop-board-13.yaml 文件头。
# “缺陷场景”D1、D2：批次 refund 中经 api 入口执行、因 lib 植入缺陷而失败的两条场景。需要新的失败结果时由执行会话或看板重新执行取得；看板为它们建立的修复任务在本场景核对完成后由 dev-a 在本机放弃（场景另行写明沿用的除外），放弃须在复测通过前完成，不让修复合入 lib；会话修复留在工作区的改动，在下一条场景开始前由执行者在授权范围内还原为植入缺陷的状态。SOP-146-P02 已提交并关闭的修复，在依赖 D1、D2 失败的场景前由执行者在授权范围内以新提交恢复植入缺陷；为构造待提交而做的演示改动在场景结束后还原。
# “会话入口环境”：只装 sop-board（从集成分支安装）并运行 sop-board skills install；Codex 与 Claude Code 各开新会话，工作目录为 app 仓库；触发只用自然语言，不点名技能。
# “使用者”：在会话中扮演开发者并给出业务答复与确认人的验收执行者助手 dev-a；业务答复取自本文件写明的内容，执行者不自行编造答复。
# 测试同事 tester-a 用第二个浏览器以非回环地址访问看板。独立验收串行进行。

metadata:
  requirement: "sop-board：任务内核统一、开发会话中可完成写 SOP、生成草稿、合并用例、执行验收、修复复验，独立性如实登记；两个入口互不干扰，放弃修复任务后如实保留尝试与状态"
  batch: "sop-board-14"
  version: 9
  owner: "AdolphKevin"
  sources:
    - ref: "docs/proposals/2026-10-22-integrated-rework.md 的 D72～D82 与附录"
      version: "已批准（2026-10-22）"
      confirmed_by: "AdolphKevin"
    - ref: "docs/proposals/2026-10-22-integrated-rework.md 的 D83，以及 D79 中注明“D83 修订”的执行环境段"
      version: "方案负责人 2026-10-23 补充（K4 实机冒烟后），AdolphKevin 2026-10-24 确认"
      confirmed_by: "AdolphKevin"
    - ref: "docs/reference.md 的“开发会话入口”（会话准备阻挡、blocked/skip 证据、execution_origin 与会话结束清理）、“会话修复与独立复验”“跨仓修复”中与 D83 对应的约定，以及放弃修复任务的约定（提交 4831b16、fbbc434、32ea410）"
      version: "feat/sop-board-14 90f7675，AdolphKevin 2026-10-24 确认"
      confirmed_by: "AdolphKevin"
  tags: ["sop-board", "kernel", "session-entry"]

sops:
  - id: SOP-141
    title: 开发会话发现入口技能并先核对前置
    actor: 开发者
    entry: Codex 与 Claude Code 会话
    scenarios:
      - id: SOP-141-P01
        polarity: positive
        title: 安装后两个客户端都能解析到 sop-board 技能
        actor: 开发者
        priority: P0
        verify: cli
        initial_state: ["会话入口环境，~/.agents/skills 与 ~/.claude/skills 中没有 sop-board"]
        steps: ["运行 sop-board skills install", "查看两个技能目录"]
        expected: ["输出 sop-board、regression-distill、playwright-acceptance 三条技能在 Codex 与 Claude Code 各自解析到的路径与包版本", "两个目录各有指向本包的 sop-board 链接"]
        forbidden_effects: ["覆盖其他来源的同名技能"]
        evidence_hints: ["命令输出", "ls -l 两个目录"]
      - id: SOP-141-P02
        polarity: positive
        title: 说“为这份 SOP 生成验收场景”时先报告待处理事项
        actor: 开发者
        priority: P0
        verify: agent
        initial_state: ["演示工作区已登记，看板上有一条待开发者处理的事项"]
        steps: ["在 app 仓库的新会话中说“为 docs/refund.md 这份 SOP 生成验收场景”"]
        expected: ["agent 先运行 sop-board status，报告该事项的种类、原因与链接并询问是否先处理", "得到答复后继续生成草稿"]
        forbidden_effects: ["跳过待处理事项直接执行"]
        evidence_hints: ["会话记录", "status 输出"]
      - id: SOP-141-N01
        polarity: negative
        negative_type: not-found
        title: 仓库不属于任何工作区时停止并引导登记
        actor: 开发者
        priority: P1
        verify: agent
        initial_state: ["一个未登记的 Git 仓库"]
        steps: ["在该仓库的新会话中说“为这份 SOP 生成验收场景”"]
        expected: ["agent 说明当前仓库不属于任何工作区，引导按 sop-board guide 运行 sop-board init", "没有新的数据目录或任务记录"]
        forbidden_effects: ["在没有工作区的情况下生成或保存草稿"]
        evidence_hints: ["会话记录", "数据目录列表"]

  - id: SOP-142
    title: 开发会话生成并确认草稿
    actor: 开发者
    entry: Codex 与 Claude Code 会话；看板草稿页
    scenarios:
      - id: SOP-142-P01
        polarity: positive
        title: 会话生成的草稿出现在看板并记录会话
        actor: 开发者
        priority: P0
        verify: agent
        initial_state: ["演示工作区，批次 refund 已上传 SOP 原文"]
        steps: ["在会话中说“为 refund 批次的 SOP 生成验收场景草稿”", "在看板草稿页查看"]
        expected: ["看板草稿页出现新版本，版本记录本会话的标识", "草稿含规则、正反向用例、待确认问题，依据为代码的预期标注了仓库、路径与行号且行号存在", "任务页显示该任务由会话处理"]
        forbidden_effects: ["看板另起 Codex 会话处理同一任务"]
        evidence_hints: ["会话记录", "草稿页截图", "任务接口响应"]
      - id: SOP-142-P02
        polarity: positive
        title: 对话中的答复记为批注并在修订版中处理
        actor: 开发者
        priority: P0
        verify: agent
        initial_state: ["SOP-142-P01 的草稿有待确认问题"]
        steps: ["dev-a 在对话中答复第一个问题“退款在 7 天内可申请”", "说“按答复修订草稿”"]
        expected: ["看板批注作者为 dev-a，内容为答复原文", "修订版处理了该批注，相关用例预期写入 7 天"]
        forbidden_effects: ["批注作者显示为 agent 或会话标识"]
        evidence_hints: ["草稿页批注与版本对比截图"]
      - id: SOP-142-P03
        polarity: positive
        title: 使用者给出确认人后确认草稿
        actor: 开发者
        priority: P0
        verify: agent
        initial_state: ["草稿问题均已答复"]
        steps: ["dev-a 说“确认草稿，确认人 dev-a”"]
        expected: ["草稿确认人为 dev-a，转为 sop-draft 来源的用例", "随后的合并不自动执行"]
        forbidden_effects: []
        evidence_hints: ["用例页", "任务列表"]
      - id: SOP-142-N01
        polarity: negative
        negative_type: tampered-input
        title: 引用不存在代码行的草稿提交被拒
        actor: 开发者
        priority: P1
        verify: cli
        initial_state: ["一次会话草稿任务已准备，最终输出中某条代码依据的行号超出文件行数"]
        steps: ["运行 sop-board draft submit 提交该输出"]
        expected: ["提交被拒并列出该用例与超出的行号", "任务保持会话处理中，可修正后再次提交", "看板草稿版本数不变"]
        forbidden_effects: ["登记引用不存在代码位置的草稿"]
        evidence_hints: ["命令输出", "草稿接口响应"]
      - id: SOP-142-N02
        polarity: negative
        negative_type: incomplete-input
        title: 使用者没有给出确认人时不确认
        actor: 开发者
        priority: P1
        verify: agent
        initial_state: ["草稿问题均已答复"]
        steps: ["dev-a 说“草稿可以了”，不提确认人"]
        expected: ["agent 询问确认人，未运行确认命令", "草稿仍为待确认"]
        forbidden_effects: ["agent 以自己或会话标识作为确认人"]
        evidence_hints: ["会话记录", "草稿页"]
      - id: SOP-142-N03
        polarity: negative
        negative_type: stale-input
        title: 提交前 SOP 原文变化，本次草稿作废
        actor: 开发者
        priority: P1
        verify: cli
        initial_state: ["会话草稿任务已准备"]
        steps: ["在看板重新上传修改过的 SOP 原文", "提交会话草稿输出"]
        expected: ["任务作废，原因写明业务 SOP 已变化", "看板草稿版本数不变"]
        forbidden_effects: ["按旧 SOP 登记草稿"]
        evidence_hints: ["命令输出", "任务接口响应"]
      - id: SOP-142-P04
        polarity: positive
        title: 会话登记已有 SOP 原文，随后的草稿由本会话认领
        actor: 开发者
        priority: P1
        verify: cli
        initial_state: ["演示工作区，看板运行中，批次 refund-up 不存在", "dev-a 提供一份已有的退款 SOP 文件，并在本次请求中给出上传人与确认人 dev-a"]
        steps: ["会话运行 sop-board sop upload demo refund-up <SOP 文件> --uploaded-by dev-a --confirmed-by dev-a --session <本会话标识>", "等待 30 秒，查看看板 SOP 页、任务列表与该草稿任务的任务页", "用同一文件再次运行同一命令", "修改 SOP 文件中的一条规则后再次运行该命令"]
        expected: ["第一次成功：批次 refund-up 登记 SOP 第 1 版，上传人与确认人为 dev-a；同时建立的草稿任务为会话处理中，认领会话为本会话", "30 秒内看板没有为该草稿任务启动 Codex，任务页显示由会话处理", "第二次不新增 SOP 版本，也不新建草稿任务", "第三次登记第 2 版；原草稿任务为已作废，原因写明业务 SOP 已变化；新的草稿任务为会话处理中，仍由本会话认领"]
        forbidden_effects: ["看板接管或调度会话认领的草稿任务", "重复上传产生新的 SOP 版本或第二个草稿任务"]
        evidence_hints: ["四次命令输出", "SOP 页与任务页截图", "任务接口响应"]
      - id: SOP-142-N04
        polarity: negative
        negative_type: invalid-input
        title: 会话登记的 SOP 原文与看板上传遵守同一校验
        actor: 开发者
        priority: P1
        verify: cli
        initial_state: ["批次 refund-up2 不存在", "准备空文件、GBK 编码文件和 1.5 MiB 的 Markdown 文件各一份（同 sop-board-11.yaml 的 SOP-111-N01），以及一份合格的 SOP 文件"]
        steps: ["会话分别以三个不合格文件运行 sop-board sop upload demo refund-up2 <文件> --uploaded-by dev-a --confirmed-by dev-a --session <本会话标识>", "dev-a 在本机以同样三个文件向批次 refund-up2 上传 SOP（看板首页上传，或 POST …/batches/refund-up2/sop；用接口时 GBK 文件按原始字节写入 JSON 正文的 content）", "会话以合格文件运行同一命令，但 --confirmed-by 填本会话的标识", "查看看板 SOP 页、任务列表与场景目录"]
        expected: ["三次命令都退出 1，ok 为 false，原因依次为为空、不是 UTF-8、超过 1 MiB，与看板上传对同一文件给出的原因一致", "以会话标识作确认人被拒，说明确认人须为使用者给出的姓名", "批次 refund-up2 没有 SOP 版本或草稿任务，场景目录没有新文件"]
        forbidden_effects: ["写入场景目录", "建立草稿任务或启动 Codex"]
        evidence_hints: ["命令输出与退出码", "看板上传的提示或响应原文", "任务列表与场景目录列表"]

  - id: SOP-143
    title: 开发会话合并测试同事的用例
    actor: 开发者
    entry: Codex 与 Claude Code 会话；看板合并页与合并对话
    scenarios:
      - id: SOP-143-P01
        polarity: positive
        title: 会话合并结果与看板合并遵守同一规则
        actor: 开发者
        priority: P0
        verify: agent
        initial_state: ["批次 member-cycle 不存在；sop-board-13.yaml 中的“缺口用例”8 条"]
        steps: ["在会话中提供缺口用例文件，说“把这些测试用例合并为验收场景”"]
        expected: ["用例以 dev-a 为上传人登记", "合并页显示该任务由会话处理", "会员开通 3 条各自落地为一条场景（三条用例是三个独立流程，不作为细节并入），积分周期与邀请暂缓，缺口按业务场景格式列出"]
        forbidden_effects: ["为暂缓用例编造预期"]
        evidence_hints: ["会话记录", "合并页与用例页截图", "场景文件"]
      - id: SOP-143-P02
        polarity: positive
        title: 对话中的缺口答复以“会话”来源出现在看板合并对话
        actor: 开发者
        priority: P0
        verify: agent
        initial_state: ["SOP-143-P01 合并后有积分周期缺口"]
        steps: ["agent 在对话中呈报缺口", "dev-a 答复“积分周期为自然月，按 UTC 计日，每月 1 日 00:00 切换并清零”"]
        expected: ["看板合并对话出现该答复，回复人 dev-a，来源为会话", "下一轮合并采纳后用例更新，积分周期场景落地并写入自然月、UTC、每月 1 日 00:00"]
        forbidden_effects: []
        evidence_hints: ["合并对话截图", "用例页对比", "场景文件"]
      - id: SOP-143-N01
        polarity: negative
        negative_type: concurrency
        title: 看板合并运行中时会话不能准备同一批次的合并
        actor: 开发者
        priority: P1
        verify: cli
        initial_state: ["看板对批次 member-cycle 的合并任务正在运行"]
        steps: ["运行 sop-board merge prepare demo member-cycle --session <标识>"]
        expected: ["命令被拒并说明正在运行的任务编号", "没有新任务"]
