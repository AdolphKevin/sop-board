        expected: ["第 1 步不新建任务，D1 只在 #H 中", "第 2 步保存选择并等待", "第 3 步 30 秒内没有建立修复任务：r2 的选择不迁移到 r3，r3 作为未交接的会话失败出现在待处理事项中", "第 4 步返回 409，没有新任务或新的交接选择", "第 5 步被拒，说明该失败已被会话认领，没有新任务"]
        forbidden_effects: ["同一失败出现两个修复任务", "旧选择为后续结果建立修复任务"]
        evidence_hints: ["各次交接请求与响应", "修复接口与任务列表前后", "待处理事项接口响应"]
      - id: SOP-150-N02
        polarity: negative
        negative_type: permission
        title: 内网只能看到交接提示，不能交给看板修复
        actor: 测试同事
        priority: P0
        verify: api
        initial_state: ["D1 有一条未交接、未被会话修复认领的会话失败（在 SOP-150-N01 第 3 步之后、第 5 步之前执行，即 r3）"]
        steps: ["tester-a 以非回环地址打开修复页", "tester-a 以非回环地址请求 POST …/fixes/handoff，正文为该失败记录编号"]
        expected: ["修复页能看到 D1 这次失败的提示，没有“交给看板修复”按钮", "交接请求返回 403 local-only", "修复任务与交接选择都没有变化"]
        forbidden_effects: ["内网请求建立修复任务或保存交接选择"]
        evidence_hints: ["内网修复页原文与截图", "响应原文", "修复接口前后"]
      - id: SOP-150-N03
        polarity: negative
        negative_type: interrupted
        title: 复测期间放弃后，收尾出错也保持已放弃、不改写尝试
        actor: 开发者
        priority: P0
        verify: api
        initial_state: ["看板修复任务 #F3（D2 的新看板失败）已提交修复、处于复测中，复测会话正在运行，第 1 次尝试为待验证"]
        steps: ["#F3 进入复测中且复测会话运行后，在复测通过前 dev-a 在本机放弃 #F3，记录响应时间", "此后 3 分钟内每 5 秒读取 #F3 的任务接口，并检查复测会话进程", "读取修复页的尝试记录与 lib 的基线分支"]
        expected: ["放弃后 #F3 一直为已放弃，没有出现待开发者处理或其他状态", "复测会话进程已退出", "第 1 次尝试保持待验证，没有被改写为未通过、已作废或其他结论", "修复提交留在修复分支，lib 基线分支没有合入"]
        forbidden_effects: ["任务改回待开发者处理", "尝试结论被改写", "修复被合入基线"]
        evidence_hints: ["每 5 秒的任务接口响应序列", "ps 输出", "基线分支与修复分支的 git log", "放弃后复测线程的出错记录（看板日志或任务 error 历史）"]
      - id: SOP-150-N04
        polarity: negative
        negative_type: stale-input
        title: 放弃后再提交会话修复输出被拒，任务不复活
        actor: 开发者
        priority: P0
        verify: cli
        initial_state: ["SOP-150-P06 放弃的 #S1，任务目录中有修复会话写好的、符合格式的根因输出"]
        steps: ["修复会话运行 sop-board fix submit demo --task <#S1> --session <修复会话标识>", "读取任务接口、尝试记录与任务列表"]
        expected: ["命令退出 1，ok 为 false，error_code 为 task-state-invalid，说明任务当前状态不能提交", "#S1 仍为已放弃，没有回到会话处理中或进入待验证", "尝试仍为已放弃，没有登记根因与改动清单", "没有新的复验任务"]
        forbidden_effects: ["已放弃的修复被复活", "登记本次根因输出"]
        evidence_hints: ["命令输出与退出码", "提交前后的任务接口响应"]
      - id: SOP-150-N05
        polarity: negative
        negative_type: stale-input
        title: 复验已取消或原修复已放弃后，复验结果不登记
        actor: 开发者
        priority: P0
        verify: cli
        initial_state: ["会话修复 #S3 认领 D1 的新会话失败、已 fix submit，处于待验证", "未参与修复的复验会话 R1 已用 execute prepare --fix 准备复验任务 #V1，并经真实入口执行写好结果"]
        steps: ["dev-a 运行 sop-board task cancel demo --task <#V1>，读取 #S3", "R1 运行 sop-board execute submit demo --task <#V1>", "未参与修复的新复验会话 R2 准备复验任务 #V2 并实际执行写好结果；R2 提交前，dev-a 运行 sop-board task cancel demo --task <#S3>", "R2 提交前读取 #V2 的任务接口", "R2 运行 sop-board execute submit demo --task <#V2>", "读取 #S3、#V1、#V2、轮次与修复页"]
        expected: ["#V1 为已放弃；#S3 仍为待验证，等待说明不再引用 #V1", "#V1 的提交退出 1，ok 为 false，error_code 为 task-state-invalid，没有登记轮次", "放弃 #S3 后、R2 提交前，#V2 仍为会话处理中（放弃会话修复不连带取消复验）", "#V2 的提交返回 ok 为 false，没有登记轮次；#V2 为已作废，原因说明原修复已不在待验证或待提交", "#S3 为已放弃，已登记的尝试保持放弃前的结论；lib 工作区的修复改动保留"]
        forbidden_effects: ["登记 #V1 或 #V2 的轮次", "#S3 进入等待开发者提交或回到待验证", "#V1、#V2 回到会话处理中"]
        evidence_hints: ["各命令输出与退出码", "任务接口前后", "轮次接口", "修复页截图"]
