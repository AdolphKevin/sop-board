  - id: SOP-149
    title: 任务内核统一后各类任务的恢复、互斥与进度
    actor: 开发者与测试同事
    entry: 看板页面与接口
    scenarios:
      - id: SOP-149-P01
        polarity: positive
        title: 各类任务有统一的任务页、状态名与进度
        actor: 开发者
        priority: P0
        verify: web
        initial_state: ["演示工作区有草稿、合并、执行、修复、沉淀各至少一个任务"]
        steps: ["依次打开各任务页"]
        expected: ["每类任务都有任务页，显示状态、开始时间、已用时长、超时上限、最近活动与可用操作", "合并页默认显示最新的合并任务，即使最新任务是沉淀"]
        forbidden_effects: []
        evidence_hints: ["各任务页截图"]
      - id: SOP-149-P02
        polarity: positive
        title: 运行中重启看板后各类任务正确恢复并可重试
        actor: 开发者
        priority: P0
        verify: api
        initial_state: ["合并、执行、沉淀各有一个运行中的任务"]
        steps: ["停止并重新启动看板", "对已中断的任务各重试一次"]
        expected: ["运行中的任务记为已中断，等待提交与待验证的沉淀保持原状态", "重试时上一次的输出与会话记录归档到 attempts/<序号>/，重新固定输入快照", "登记不重复"]
        forbidden_effects: ["重启后重复登记结果"]
        evidence_hints: ["任务接口响应", "任务目录列表"]
      - id: SOP-149-P03
        polarity: positive
        title: 互斥与优先级按统一规则执行
        actor: 开发者
        priority: P1
        verify: api
        initial_state: ["同一工作区同时排队修复、执行、合并、沉淀，且执行与合并属于同一批次"]
        steps: ["观察任务开始顺序与等待原因"]
        expected: ["资源可用时按修复、执行、合并、沉淀的优先级开始；同一工作区的执行、修复、沉淀不同时运行；同一工作区有修复运行时合并等待修复结束（合并会改变修复所依据的场景）；执行与合并在同一批次不同时运行，沉淀等待同一批次的合并结束", "高优先级任务被互斥阻挡时，与运行中任务不冲突的低优先级任务可以先开始（例如修复运行时，同一工作区的草稿生成可以开始）", "被阻挡的任务保留待提交、等待浏览器等具体状态，显示的状态与原因一致，原因写明正在等待的任务编号；阻挡解除后原因随之更新", "合并状态条的排队位置等于实际会在它之前开始的任务数，与实际开始顺序一致"]
        forbidden_effects: []
        evidence_hints: ["任务接口响应序列"]
      - id: SOP-149-N02
        polarity: negative
        negative_type: stale-input
        title: 修复复验期间输入变化时本次复验作废，不计入连续三次未通过
        actor: 开发者
        priority: P1
        verify: api
        initial_state: ["演示工作区一条失败场景正由看板修复，修复会话已提交，复验正在进行（复测中）"]
        steps: ["复验期间开发者修改同一批次另一条场景的预期并提交场景文件", "等待复验结束，查看修复任务、尝试记录与修复页"]
        expected: ["本次复验记为已作废，原因写明输入变化，不记为未通过", "修复任务转待开发者处理，连续未通过的计数不因此增加", "开发者点击重试后按新输入重新准备"]
        forbidden_effects: ["输入变化被计为一次未通过"]
        evidence_hints: ["修复任务与尝试记录前后", "修复页截图"]
      - id: SOP-149-N01
        polarity: negative
        negative_type: permission
        title: 内网只看到各类任务的白名单字段
        actor: 测试同事
        priority: P0
        verify: api
        initial_state: ["各类任务各有一个，含已结束与运行中"]
        steps: ["tester-a 以非回环地址请求任务列表、各任务详情、任务页与附件"]
        expected: ["只出现白名单字段与时长、最近活动时间", "没有会话编号、续接命令、事件摘要、输入快照、本机路径、命令与凭据变量名", "非共享附件请求被拒"]
        forbidden_effects: []
        evidence_hints: ["响应原文"]
