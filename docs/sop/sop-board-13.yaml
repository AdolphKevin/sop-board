        initial_state: ["批次 cycle-ask 有一个补充澄清合并任务正在运行（由 tester-a 在通用输入框提交“积分清零后不补发”触发）"]
        steps: ["tester-a 把 TC_MEMBER_OPEN_003 的预期改为“提示已是会员；会员状态仍为已开通，发票抬头仍为个人”后重新上传全部用例", "等待各任务结束，查看任务列表、对话记录与场景文件"]
        expected: ["正在运行的补充澄清任务转为待同步，不写入场景", "看板以最新用例与全部澄清记录发起新合并，本轮回复的处理结论来自新合并", "场景文件反映修改后的预期：TC_MEMBER_OPEN_003 的预期为修改后的内容"]
        forbidden_effects: ["以旧用例的合并结果覆盖场景文件"]
        evidence_hints: ["任务列表", "对话记录截图", "场景文件差异"]

  - id: SOP-135
    title: 真实批次试点：只生成场景，不运行验证
    actor: 用户与开发者
