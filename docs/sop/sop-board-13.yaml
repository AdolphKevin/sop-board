        steps: ["tester-a 用通用输入框提交回复：积分清零后不补发", "等待合并结束", "本机查看任务记录与任务目录"]
        expected: ["任务记录写明会话续接失败，已用完整历史新开会话", "新会话的 clarifications.json 含该批次全部历史回复", "此前按澄清更新的用例内容与场景保持不变"]
        forbidden_effects: ["丢失此前已采纳的澄清"]
        evidence_hints: ["任务记录", "clarifications.json", "场景文件"]

  - id: SOP-134
    title: 已有待补充批次与后续变更
    actor: 测试同事
    entry: 合并页与用例上传表单
    scenarios:
      - id: SOP-134-P01
        polarity: positive
        title: 升级前停在待补充的批次可直接在对话中继续
        actor: 测试同事
        priority: P0
        verify: web
        initial_state: ["用升级前的发行版本（main 543daf6）启动看板，向批次 legacy-gap 上传积分周期 3 条用例；真实合并会话结束后、看板读取结果前，若 final.json 的 gaps 为空，执行者将其改为旧格式字符串数组 [\"积分周期的长度、计日时区与切换时刻均未说明，无法判断何时清零\"]（人工构造，报告中注明并保留原始输出），旧看板读取后任务为待补充、未写场景文件；dev-a 在本机暂停自动任务后停止该看板"]
        steps: ["用新版本启动看板（自动任务保持暂停），tester-a 打开 legacy-gap 的合并页", "tester-a 用通用输入框回答旧缺口：积分周期为自然月，按 UTC 计日，每月 1 日 00:00 切换", "dev-a 在本机恢复自动任务，等待各轮合并结束"]
        expected: ["旧缺口以文字显示，可以提交通用回复", "新一轮合并的缺口为结构化格式，可确定的用例落地；该回复为已采纳，积分周期 3 条用例按回复更新并落地为场景"]
        forbidden_effects: ["旧任务或旧数据无法打开"]
        evidence_hints: ["升级前后合并页截图"]
      - id: SOP-134-P02
        polarity: positive
        title: 澄清后重新上传修改过的用例，已采纳的澄清继续生效
        actor: 测试同事
