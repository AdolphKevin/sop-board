# SOP-BOARD-21：待执行与产品变化待判定分开显示
# 预期依据：使用者 2026-11-03 在 cw2 会话中的问题“当前 sop-board 里的待执行的场景数也不对，现在不是已经有 200 多个场景已经验证通过了吗？”
#   以及核对后的选择“改看板展示”（方案 docs/proposals/2026-11-03-pending-impact-display.md D107）。
# 版本 1（2026-11-03）：Claude 依据方案在实现前编写；实现与返工会话只读本文件，与方案不一致处以本文件为准并报告。
#
# “演示工作区”同 sop-board-15.yaml 文件头（两仓 app/lib，入口 api，批次 refund 的 REFUND-P01、REFUND-P02、REFUND-N01，lib 植入签收后 3 天及以上一律拒绝的缺陷）。本文件另需：
#   - 批次 refund 的场景文件另加 REFUND-P03（签收后 1 天允许，应通过），推送后尚无结果；
#   - 看板以 --lan 启动，“场景写入后自动执行”关闭；
#   - “混合状态”：两仓没有未提交改动，按下列顺序经真实入口与 execute prepare/submit 构造——
#     ① 以一轮实际执行登记 REFUND-P01 通过、REFUND-P02 失败、REFUND-N01 通过（执行期间不改产品）；
#     ② 在 app 修改一处与退款资格无关的文件（README.md 加一行）并 git commit；
#     ③ 以一轮实际执行只重新登记 REFUND-N01 通过（按场景编号准备；REFUND-N01 为 source-changed 时按 sop-board-15.yaml 文件头先让它取得实际执行结果，执行者在记录中写明）。
#     结果：REFUND-P01 是旧产品上的通过（产品变化待判定），REFUND-N01 是当前产品上的通过，REFUND-P02 失败，REFUND-P03 没有结果。
# 执行步骤中的“首页”“批次概览”“进度页”指本机地址；“内网概览”指 --lan 的实际非回环地址上的同一批次概览页。

metadata:
  requirement: "sop-board：待执行只计当前内容没有结果的场景，Agent 通过后产品变化的场景单列为产品变化待判定；执行范围不变"
  batch: "sop-board-21"
  version: 1
  owner: "blur.yin"
  sources:
    - ref: "使用者 2026-11-03 在 cw2 会话中的问题与选择“改看板展示”"
      version: "2026-11-03"
      confirmed_by: "blur.yin"
    - ref: "docs/proposals/2026-11-03-pending-impact-display.md D107"
      version: "方案 1"
      confirmed_by: "blur.yin"
  tags: ["sop-board", "statistics", "pages", "session-entry"]

sops:
  - id: SOP-211
    title: 待执行与产品变化待判定分开显示
    actor: 开发者
    entry: "首页批次条目、批次概览、进度页、内网概览、sop-board status 与批次摘要接口"
    must:
      - "待执行只计当前内容没有结果的场景（新增、内容变化、执行中途未执行）"
      - "最近 Agent 结果与最近结果都是通过、但已不能代表当前产品的场景计为产品变化待判定，不计入待执行，也不进复测"
      - "首页、批次概览、进度页、内网页面、命令行与接口显示同一组计数"
      - "执行范围不变：执行待执行场景按钮的条数与 --scope pending 的范围仍包含失败与产品变化待判定"
    scenarios:
      - id: SOP-211-P01
        polarity: positive
        title: 混合状态下各处分别显示待执行与产品变化待判定
        actor: 开发者
        priority: P0
        verify: web
        initial_state: ["演示工作区处于“混合状态”", "看板已启动，没有排队或运行中的执行任务"]
        steps:
          - "打开首页，读取批次 refund 条目的状态行与“执行待执行场景”按钮"
          - "打开批次概览，读取状态行与各队列面板的标题、计数、说明文字和所列场景"
          - "打开进度页，读取开发侧指标"
          - "运行 sop-board status <工作区> 与 sop-board status <工作区> --json，并请求批次摘要接口"
          - "从另一台设备或浏览器打开内网概览"
        expected:
          - "首页与概览的状态行为“有待执行 1 条，产品变化待判定 1 条”"
          - "待执行面板只列 REFUND-P03；产品变化待判定面板位于待执行与问题之间，只列 REFUND-P01，说明为“Agent 已通过，之后产品有变化；下次执行逐条判定影响，不受影响的沿用，受影响的重跑”；问题面板列 REFUND-P02；复测面板列 REFUND-N01，不含 REFUND-P01"
          - "进度页开发侧显示待执行 1、产品变化待判定 1；已执行进度、Agent 验收通过率、一次通过率的数值与改动前的计算口径相同"
          - "命令行该批次一行为“4 条场景；待执行 1；产品变化待判定 1”；JSON 与批次摘要接口的 queue_counts 为 pending 1、source-changed 1、issues 1、retest 1，queues 所列场景与页面一致"
          - "“执行待执行场景”按钮仍显示 3 条（REFUND-P03 新增、REFUND-P02 失败、REFUND-P01 产品变化待判定）"
          - "内网概览显示与本机相同的状态行、队列面板与计数，不显示执行按钮"
        forbidden_effects: ["REFUND-P01 计入待执行或复测", "按钮条数或执行范围随显示改动而变化"]
        evidence_hints: ["首页、概览、进度页与内网概览的截图和文本", "命令行输出", "接口响应"]

      - id: SOP-211-P02
        polarity: positive
        title: 执行待执行场景后，沿用的通过离开产品变化待判定
        actor: 开发者
        priority: P0
        verify: cli
        initial_state: ["SOP-211-P01 完成，状态未变"]
        steps:
          - "运行 sop-board execute prepare <工作区> refund --scope pending --session <A>，读取 pending.json"
          - "按标准判定 REFUND-P01 的影响：产品变化只有 app/README.md，写 impact.json（affected 为 false）与沿用结果；REFUND-P02、REFUND-P03 经真实入口执行并按实际结果写出；运行 execute submit"
          - "打开首页、批次概览与进度页，运行 sop-board status <工作区> --json"
        expected:
          - "pending.json 含 REFUND-P01（source-changed）、REFUND-P02（failed）、REFUND-P03（new），与改动前的执行范围相同"
          - "登记后 REFUND-P01 的最新结果为通过，note 以“沿用：”开头"
          - "产品变化待判定为 0，待执行为 0；REFUND-P01 与 REFUND-P03 进入复测，REFUND-P02 仍在问题"
          - "首页与概览的状态行不再出现“有待执行”或“产品变化待判定”，显示 Agent 已测完及该轮的通过、失败计数"
        forbidden_effects: ["沿用登记后 REFUND-P01 仍显示为产品变化待判定"]
        evidence_hints: ["pending.json", "impact.json 与结果", "页面截图和文本", "命令行输出"]

      - id: SOP-211-N01
        polarity: negative
        title: 只有产品变化待判定时不显示“有待执行”
        actor: 开发者
        priority: P1
        verify: web
        initial_state: ["SOP-211-P02 完成", "之后在 lib 修改一处与退款资格无关的文件（README.md 加一行）并 git commit，看板已发现产品变化"]
        steps:
          - "打开首页与批次概览，读取状态行、待执行面板与产品变化待判定面板"
          - "读取“执行待执行场景”按钮"
        expected:
          - "状态行为“产品变化待判定 3 条”（REFUND-P01、REFUND-P03、REFUND-N01），不出现“有待执行”"
          - "待执行面板显示暂无场景；产品变化待判定面板列出这 3 条；问题面板仍列 REFUND-P02"
          - "按钮显示 4 条（3 条产品变化待判定加 REFUND-P02 失败），可以点击"
        forbidden_effects: ["状态行写成“有待执行 3 条”", "按钮显示没有待执行场景"]
        negative_type: stale-input
        evidence_hints: ["页面截图和文本"]

      - id: SOP-211-N02
        polarity: negative
        title: 执行期间产品有变化的通过，产品内容复原后仍属产品变化待判定
        actor: 开发者
        priority: P1
        verify: cli
        initial_state: ["演示工作区，两仓没有未提交改动", "按 sop-board-15.yaml SOP-151-P04 的做法构造：REFUND-N01 的最新通过登记时 product_changed 非空，之后产品内容已回到该轮开始时的内容"]
        steps:
          - "运行 sop-board status <工作区> --json，读取 refund 的 queue_counts 与 queues"
          - "打开批次概览"
        expected:
          - "REFUND-N01 在 source-changed 队列，不在待执行，也不在复测"
          - "概览的产品变化待判定面板列出 REFUND-N01"
        forbidden_effects: ["因产品摘要复原而把 REFUND-N01 计为复测或已通过"]
        negative_type: stale-input
        evidence_hints: ["命令行输出", "概览截图和文本"]
