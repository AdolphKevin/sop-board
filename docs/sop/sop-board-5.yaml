# SOP-BOARD-5：修复闭环的验收场景
# 预期只依据本仓 docs/proposals/2026-10-19-standalone-sop-verification.md（v8）的 D7、D20、D21、D24、D25、D26、D27、D28 与 docs/designs/SOP-BOARD-5.md（修订 2）的全局范围、I1–I8、D1；所引用的既有行为依据 docs/designs/SOP-BOARD-1.md 至 SOP-BOARD-4.md 的相应节，不依据当前实现的输出。
# 版本 1（2026-10-20）：Claude 依据上述原文与测试代理 sop-board-5-tester 的 85 条用例编写，经 AdolphKevin 授权由 Claude 代批。 同日按测试代理复核补充 SOP-51-N13、SOP-54-P05，改写 SOP-58-P08，依据方案修订 2 的 I1、I4、I8 最新文字。
# 真实 Jira 站点的接入验证按 AdolphKevin 2026-10-19 的决定延到外部接入阶段，本文件一律以模拟 Jira 验证；初始状态写明“本机已登录的 Codex”的场景用真实 Codex，其余用假 codex。
#
# 下文"测试看板"同 SOP-BOARD-1、2 的约定；"开发者令牌"指 SOP_BOARD_ADMIN_TOKEN（与写入令牌不同）；"修复页"指 /p/<项目键>/fixes；"attention"指 GET /api/v1/projects/<项目键>/attention。
# "修复演示仓库"指执行者新建的临时 Git 仓库 /tmp/<随机>/fix-repo：主工作区在分支 main 且干净，git config user.name 为 Dev One、user.email 为 dev1@example.com；已提交的文件有
# src/calc.py（植入缺陷）、tests/test_calc.py、scripts/check.sh（运行测试，按仓库外开关文件 /tmp/<随机>/chk-a.fail 中列出的用例名报告失败，在 {output}/results.xml 写 JUnit 报告）、
# scripts/reload.sh（向仓库外的 /tmp/<随机>/reload.log 追加运行目录与环境变量名）、docs/sop/entries.yaml 与两个批次的场景文件：
# docs/sop/b1.yaml（批次 b1）：节点 F1 含 F1-P01、F1-P02、F1-P03、F1-P04、F1-N01、F1-N02；节点 F2 含 F2-P01、F2-N01，二者的 regression 为 {check: chk-a, cases: [...]}。docs/sop/b2.yaml（批次 b2）：节点 G1 含 G1-P01、G1-N01。
# entries.yaml 声明入口 app（surface http，address_env APP_URL）与顶层检查 chk-a（argv 为 sh scripts/check.sh {output}，format junit，report {output}/results.xml），全部场景的 verify 为 app。
# "checkout 变体""start 变体""in-place 变体"分别把 app 的 candidate 设为 checkout；start（start 为 python3 -m demo_server，监听 SOP_PORT）；in-place（reload 为 sh scripts/reload.sh），随初始提交提交；场景未注明时用 checkout 变体。
# "授权看板"指以 --writable-repo github.com/demo-org/fix-app=<修复演示仓库路径> 与开发者令牌启动的测试看板，项目键 github-com-demo-org-fix-app（下文记 P），缺陷链接前缀为缺省的 https://github.com/demo-org/fix-app/issues/。
# "模拟 Jira"指执行者在本机启动的 HTTP 服务：GET /rest/api/3/issue/<单号> 对 ABC-1、ABC-2 返回标题、描述、状态、两条评论与一个附件名；POST …/comment 返回 201；GET …/transitions 返回按场景预设的流转（缺省为 id 31 目标状态名“待部署”与 id 41“已关闭”）；
# POST …/transitions 返回 204；可按单号与请求预设返回 500 或直接断开连接；记录每个请求的方法、路径、请求头与正文。
# "配 Jira"指授权看板另以 JIRA_URL=<模拟 Jira 地址>、JIRA_EMAIL=a@example.com、JIRA_API_TOKEN=tok-SECRET-5 启动；"配 Jira 与流转"另加 JIRA_FIXED_STATUS=待部署。配 Jira 时缺陷链接填 ABC-1 即规范化为 <模拟 Jira 地址>/browse/ABC-1。
# "假 codex"指执行者写的可执行脚本，放在 PATH 最前：记录每次调用的参数、工作目录、环境变量名与标准输入；每个新会话在 --json 事件中写出 thread.started，修复会话的 thread_id 为 TH-1，复测会话依次为 TH-R1、TH-R2…；
# 修复会话（新会话带 --output-schema 修复模式，或续接 TH-1）按预设在工作目录中改文件并写出最终输出；复测会话按预设在任务目录写 results.jsonl 与证据；可按预设等待、以非零码退出、在写出 thread.started 前退出或不写最终输出。
# "预设一次通过"指：修复会话把全部问题判为 product、修改 src/calc.py 并在 tests 中列出运行结果；复测全部 pass；chk-a 通过。
# "预置问题"指：先以同一数据目录（与同样的 Jira 配置）不带 --writable-repo 启动测试看板，以项目身份 github.com/demo-org/fix-app 推送修复演示仓库的 b1.yaml 与 b2.yaml，
# 登记一轮全部场景 Agent pass，再按场景登记 Agent 结果与人工标记（回归检查结果按 SOP-BOARD-4 I5 的登记形式登记，执行者为“回归检查 chk-a”），停止后以授权看板的参数启动。
# 任务进行中出现的问题经 SOP-BOARD-2 的标记接口（写入令牌）或 SOP-BOARD-1 的轮次接口登记。"运行环境服务"指执行者在本机启动的最小 HTTP 服务，按修复演示仓库主工作区 src/calc.py 的当前内容响应，授权看板以 APP_URL=<其地址> 启动。
# 场景未注明时：修复任务编号记为 #N，修复会话编号为 TH-1，主工作区在 main。

metadata:
  requirement: "sop-board 修复闭环：问题触发与范围、修复会话与转开发者、提交与尝试计数、复测与合入保护、原地替换、候选提升、Jira 回写、状态记录与报告"
  batch: "sop-board-5"
  version: 1
  owner: "AdolphKevin"
  sources:
    - ref: "docs/proposals/2026-10-19-standalone-sop-verification.md 的 D7、D20、D21、D24、D25、D26、D27、D28"
      version: "v8（2026-10-19）"
      confirmed_by: "AdolphKevin"
    - ref: "docs/designs/SOP-BOARD-5.md 的全局范围、I1–I8、D1 节"
      version: "修订 2"
      confirmed_by: "AdolphKevin"
  tags: ["sop-board", "修复闭环", "合入保护", "本机模拟 Jira"]

sops:

  - id: SOP-51
    title: 触发、范围与准备
    actor: "看板"
    entry: "看板每 5 秒的修复调度、修复页与 GET /api/v1/projects/<项目键>/fixes"
    must:
      - "每个授权仓库同一时间只有一个进行中的修复任务"
      - "未授权项目的仓库保持原样"
    scenarios:

      - id: SOP-51-P01
        polarity: positive
        title: "四类未解决的问题跨两个批次纳入同一个修复任务"
        actor: "看板"
        priority: P0
        refs: ["I1", "D1"]
        verify: api
        initial_state: ["预置问题（配 Jira）：b1 的 F1-P01 人工 fail（缺陷 ABC-1）、F1-P02 人工 blocked（缺陷 https://github.com/demo-org/fix-app/issues/2）、F1-P03 Agent fail、F2-P01 的检查结果 fail；b2 的 G1-P01 Agent fail；其余场景最新为 Agent pass", "授权看板（配 Jira）启动，假 codex 的修复会话启动后等待 60 秒"]
        steps: ["启动后等待 10 秒", "请求 GET /api/v1/projects/P/fixes", "打开首页与修复页", "读取该任务目录的 problems.json"]
        expected: ["只有一个修复任务，种类为 fix，仓库为修复演示仓库", "问题为 b1 的 F1-P01、F1-P02、F1-P03、F2-P01 与 b2 的 G1-P01，修复页显示问题数 5", "problems.json 中每个问题带所属批次：四个为 b1，G1-P01 为 b2", "首页项目 P 显示该进行中的修复任务及其状态"]
        forbidden_effects: ["最新为 pass 的场景被纳入", "为同一仓库建第二个修复任务"]
        evidence_hints: ["接口响应", "首页与修复页截图", "problems.json"]

      - id: SOP-51-N01
        polarity: negative
        negative_type: other
        title: "Agent 的 blocked、skip 与受阻的回归检查不触发修复"
        actor: "看板"
        priority: P0
        refs: ["I1"]
        verify: api
        initial_state: ["预置问题：F1-P01 Agent blocked（finding 为环境未就绪）、F1-P02 Agent skip（finding 为依赖未部署）、F2-P01 的检查结果 blocked（finding 为受阻：缺少环境变量 CHK_DB）；其余场景最新为 Agent pass", "授权看板启动"]
        steps: ["等待 15 秒", "请求 GET /api/v1/projects/P/fixes", "打开 b1 总览查看问题队列", "在修复演示仓库运行 git worktree list 与 git branch"]
        expected: ["fixes 返回空列表", "F1-P01、F1-P02、F2-P01 仍在 b1 的问题队列", "worktree 列表只有主工作区，没有 sop-board/fix/ 分支"]
        forbidden_effects: ["建立修复任务或调用 Codex"]
        evidence_hints: ["接口响应", "总览截图", "Git 命令输出"]

      - id: SOP-51-N02
        polarity: negative
        negative_type: stale-input
        title: "只看当前内容指纹的最新结果：内容已变更或已被通过覆盖的不算问题"
        actor: "看板"
        priority: P1
        refs: ["I1"]
        verify: api
        initial_state: ["预置问题：F1-P01 曾有 Agent fail，随后推送的 b1 新版本修改了 F1-P01 的 expected，新指纹尚无结果，修复演示仓库的 b1.yaml 已同步为该版本并提交", "F1-P03 曾有 Agent fail，同一指纹之后又有一轮 Agent pass", "其余场景最新为 Agent pass", "授权看板启动"]
        steps: ["等待 15 秒", "请求 GET /api/v1/projects/P/fixes", "打开 b1 总览"]
        expected: ["fixes 返回空列表", "F1-P03 在复测队列，不在问题队列"]
        forbidden_effects: ["建立修复任务"]
        evidence_hints: ["接口响应", "总览截图"]

      - id: SOP-51-N03
        polarity: negative
        negative_type: permission
        title: "未授权项目的问题留在问题队列，仓库保持原样"
        actor: "看板"
        priority: P0
        refs: ["I1", "I8"]
        verify: api
        initial_state: ["授权看板只授权修复演示仓库（项目 P），假 codex 在 PATH 最前", "修复演示仓库的副本 /tmp/<随机>/q-repo 以项目身份 github.com/demo-org/q-app 推送了 b1.yaml（项目 Q，未授权）：F1-P03 为 Agent fail，F1-P01 被标为失败并带缺陷链接 https://github.com/demo-org/q-app/issues/1", "已记录 q-repo 的 git status、git branch 与 git worktree list"]
        steps: ["等待 15 秒", "不带令牌请求 GET /api/v1/projects/github-com-demo-org-q-app/fixes 并打开 /p/github-com-demo-org-q-app/fixes", "打开首页与项目 Q 的 b1 总览", "在 q-repo 再次运行三条 Git 命令并读取假 codex 记录"]
        expected: ["项目 Q 的 fixes 接口返回 200 与空列表，修复页列表为空", "首页项目 Q 不显示修复任务", "F1-P01、F1-P03 留在项目 Q 的问题队列", "q-repo 三条命令的输出与之前相同，假 codex 没有被调用"]
        forbidden_effects: ["为项目 Q 建修复任务", "q-repo 出现 worktree、分支或文件变化"]
        evidence_hints: ["接口响应", "首页截图", "Git 命令前后输出"]

      - id: SOP-51-N04
        polarity: negative
        negative_type: concurrency
        title: "任务进行中出现的新问题在下一次尝试开始时纳入"
        actor: "看板"
        priority: P0
        refs: ["I1", "I2", "D1"]
        verify: api
        initial_state: ["预置问题：F1-P01 人工 fail（缺陷 https://github.com/demo-org/fix-app/issues/1）", "授权看板，假 codex 预设第 1 次修复会话运行 20 秒、第 1 次复测 F1-P01 为 fail，第 2 次尝试一次通过", "修复任务 #N 已开始第 1 次尝试"]
        steps: ["第 1 次修复会话运行中，把 b1 的 F1-N01 标为失败，缺陷链接填 https://github.com/demo-org/fix-app/issues/3", "等待 10 秒后请求 GET /api/v1/projects/P/fixes", "第 2 次尝试开始后读取 GET /api/v1/tasks/N、第 2 次尝试的输入文件与尝试记录"]
        expected: ["仓库只有任务 #N 一个修复任务", "第 1 次尝试的复测范围不含 F1-N01", "任务 #N 的问题包含 F1-N01，纳入的尝试序号为 2", "第 2 次尝试的输入中“本次尝试新增的问题”列出 F1-N01", "第 2 次尝试的尝试记录写明新纳入 F1-N01"]
        forbidden_effects: ["为 F1-N01 另建修复任务"]
        evidence_hints: ["接口响应", "第 2 次尝试的输入文件"]

      - id: SOP-51-P02
        polarity: positive
        title: "已合入的任务不算进行中，新问题建新任务"
        actor: "看板"
        priority: P1
        refs: ["I1", "I8"]
        verify: api
        initial_state: ["授权看板，假 codex 预设一次通过", "修复任务 #N 已合入，此后没有未解决的问题"]
        steps: ["把 b1 的 F1-N02 标为失败，缺陷链接填 https://github.com/demo-org/fix-app/issues/4", "等待 10 秒后请求 GET /api/v1/projects/P/fixes"]
        expected: ["出现新的修复任务 #M，M 不同于 N，问题包含 F1-N02", "任务 #N 仍为已合入"]
        forbidden_effects: ["F1-N02 并入任务 #N"]
        evidence_hints: ["接口响应"]

      - id: SOP-51-N05
        polarity: negative
        negative_type: duplicate
        title: "已转开发者或所在任务被放弃的问题在出现新结果前不再纳入"
        actor: "看板"
        priority: P1
        refs: ["I1", "I2", "I8"]
        verify: api
        initial_state: ["预置问题：F1-P01 人工 fail（缺陷 https://github.com/demo-org/fix-app/issues/1）、F1-P02 Agent fail", "授权看板，假 codex 预设：任务 #N 中 F1-P01 判为 product 并修复、F1-P02 判为 environment 并附理由与方案，复测与检查通过；之后的修复会话启动后等待 60 秒", "任务 #N 已合入，F1-P02 记为待开发者处理事项"]
        steps: ["等待 15 秒后请求 fixes", "把 F1-P03 标为失败（缺陷 https://github.com/demo-org/fix-app/issues/5），等新任务 #M 进入分析中后以开发者令牌放弃 #M", "等待 15 秒后请求 fixes", "登记一轮 Agent 结果 F1-P02 为 fail，等待 10 秒后请求 fixes"]
        expected: ["#N 合入后 15 秒内没有为 F1-P02 建新任务", "#M 为已放弃，此后 15 秒内没有新任务", "F1-P02 有新结果后出现新任务 #K，问题只有 F1-P02，不含 F1-P03"]
        forbidden_effects: ["同一批问题被反复建任务"]
        evidence_hints: ["按时间记录的 fixes 响应"]

      - id: SOP-51-N06
        polarity: negative
        negative_type: concurrency
        title: "修复任务进行中时同一仓库的执行任务排队等修复结束"
        actor: "开发者"
        priority: P0
        refs: ["I1"]
        verify: api
        initial_state: ["预置问题：F1-P01 人工 fail；b2 的 G1-N01 没有结果", "授权看板，假 codex 预设修复会话运行 20 秒、一次通过", "修复任务 #N 处于分析中"]
        steps: ["开发者以开发者令牌 POST /api/v1/projects/P/batches/b2/executions", "在 #N 已合入之前每秒读取该执行任务与假 codex 记录", "#N 已合入后继续读取执行任务"]
        expected: ["请求返回执行任务", "#N 已合入之前该执行任务没有开始运行，没有启动执行会话", "#N 已合入之后该执行任务开始运行"]
        forbidden_effects: ["执行会话与同一仓库的修复或复测会话同时运行"]
        evidence_hints: ["按时间记录的任务状态", "假 codex 调用时间"]

      - id: SOP-51-N07
        polarity: negative
        negative_type: concurrency
        title: "已开始的执行任务运行到结束，修复任务排队等待"
        actor: "看板"
        priority: P1
        refs: ["I1", "I8"]
        verify: api
        initial_state: ["授权看板，假 codex 预设执行会话运行 20 秒、修复一次通过", "b2 的 G1-N01 没有结果，开发者已发起 b2 的执行任务 #E 且正在运行"]
        steps: ["#E 运行中把 b1 的 F1-P01 标为失败（缺陷 https://github.com/demo-org/fix-app/issues/1）", "修复任务建立后每秒读取修复任务、#E 与假 codex 记录", "#E 结束后继续读取修复任务"]
        expected: ["#E 运行到已完成，没有被中止", "#E 结束前修复任务为排队中并附原因，没有启动修复会话", "#E 结束后修复任务开始，状态为分析中"]
        forbidden_effects: ["修复会话与 #E 的执行会话同时运行"]
        evidence_hints: ["按时间记录的任务状态", "假 codex 调用时间"]

      - id: SOP-51-N08
        polarity: negative
        negative_type: other
        title: "暂停自动任务时修复任务不开始，也不开始新的尝试"
        actor: "开发者"
        priority: P1
        refs: ["I1"]
        verify: api
        initial_state: ["授权看板，假 codex 预设修复会话运行 10 秒、第 1 次复测运行 20 秒且 F1-P01 为 fail，第 2 次尝试一次通过", "开发者已以开发者令牌 POST /api/v1/automation/pause"]
        steps: ["把 F1-P01 标为失败（缺陷 https://github.com/demo-org/fix-app/issues/1），等待 15 秒后读取修复任务与假 codex 记录", "POST /api/v1/automation/resume，等第 1 次复测运行时再次 pause", "第 1 次尝试结束后等待 15 秒，读取任务与假 codex 记录", "再次 resume 并等待任务结束"]
        expected: ["第一次暂停期间修复任务为排队中，假 codex 没有被调用", "恢复后修复任务开始，状态为分析中", "第二次暂停时运行中的复测继续到结束，第 1 次尝试未通过后没有开始第 2 次尝试，没有新的修复会话调用", "再次恢复后开始第 2 次尝试，任务最终已合入"]
        forbidden_effects: ["暂停期间启动修复会话"]
        evidence_hints: ["按时间记录的任务状态", "假 codex 调用时间"]

      - id: SOP-51-N09
        polarity: negative
        negative_type: other
        title: "工作区有未提交的产品改动时任务为待提交，提交后以新提交开始"
        actor: "开发者"
        priority: P0
        refs: ["I1"]
        verify: api
        initial_state: ["授权看板（数据目录 D），假 codex 预设一次通过", "修复演示仓库工作区未提交地修改了 src/calc.py"]
        steps: ["把 F1-P01 标为失败（缺陷 https://github.com/demo-org/fix-app/issues/1），等待 10 秒", "读取修复页、假 codex 记录与 D/worktrees/", "在修复演示仓库提交该修改（提交 C1），等待 10 秒", "读取任务、git worktree list 与 sop-board/fix/N 的起点"]
