      - id: SOP-236-N01
        polarity: negative
        negative_type: permission
        title: 非回环地址不能下载私有原文或用参数伪装本机
        actor: 内网测试同事
        priority: P0
        verify: api
        initial_state: ["SOP-236-P02 的材料齐全，已从本机真实读取结果收集材料位置、实际存在的HTTP/附件链接及任务标识", "浏览器与 HTTP 客户端确实经实际非回环地址连接，没有回环代理"]
        steps:
          - "把本机实际存在的材料链接主机换成实际内网地址，逐项请求；只在本机文件系统可读的库原文、索引/基线、账本、候选/审核材料、清单和巡检材料，逐项核对没有被公开页面/接口/报告打包返回，不要求新增HTTP读取路由"
          - "分别增加 local=1、伪造本机 Host 或转发头重试；从非回环页面实际检查是否有私有下载入口"
        expected:
          - "私有任务附件按既有边界返回403，其他私有读取入口也不得返回材料正文；响应不含私有标记，页面无私有下载入口"
          - "参数、Host 和转发头不能把实际非回环连接变成本机；业务摘要仍可读，没有任何业务记录或文件变化"
        forbidden_effects: ["把库物理位置在产品仓库误认为可公开", "绕过服务端可见性", "失败响应回显私有路径或命令"]
        evidence_hints: ["本机可读链接及状态", "每类非回环原始请求/响应/状态码", "浏览器截图与私有标记全文核对"]
      - id: SOP-236-N02
