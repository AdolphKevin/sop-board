          - "自检状态、作废原因、提交拒绝和队列"

  - id: SOP-232
    title: 收入经过真实运行和独立审核的具体版本
    actor: 脚本改写者与未参与改写的审核者
    entry: "命令行 sop-board playwright specs promote；本机差异、断言去向、运行与审核材料；规范库"
    must:
      - "D114：收入候选及其执行依赖与该场景最近一次真实运行摘要一致，审核绑定候选摘要与时间；verified 须已登记通过，reviewed-failing 须失败且有发现说明"
      - "审核会话不能是任务执行或实现会话，也须未参与该次改写；收入后旧版进入 _history，新版成为下一版保真基线，首次新写也建立基线"
    scenarios:
      - id: SOP-232-P01
        polarity: positive
        title: 未参与本次改写者审核后收入并推进基线和历史
        actor: 实际审核者 R
        priority: P0
        verify: cli
        initial_state:
          - "L0 后经 cases put 和合并确认 TC_WEB_OK_001 新增要求“第一页10名成员角色均为 Member”，A 增加对应断言，E 实际运行通过得到 T 并登记轮次，check 无违规且没有撤销既有预期"
          - "R 未参与本次脚本改写，且与任务执行/实现会话不同；保存其真实参与关系、原库版和基线"
        steps:
          - "运行 playwright specs review --task <任务编号> --scenario spec-demo#TC_WEB_OK_001 --out <审核材料文件>；A 提供候选，R 实际读取差异、每条断言去向及运行依据"
          - "R 核对 T 与候选及全部依赖摘要后，运行 playwright specs promote --task <任务编号> --scenario spec-demo#TC_WEB_OK_001 --reviewed-by <实际审核姓名> --reviewer-session <R> --state verified；读取索引、历史与新基线"
          - "从新收入版派生下一候选，只删除本次新增的全部行角色断言，再运行 playwright specs check --task <下一任务编号> --scenario spec-demo#TC_WEB_OK_001"
        expected:
          - "review 输出候选摘要、基线版本、check 结果、待审核项及对应账本条目、运行依据，全部断言去向可追溯；review 生成材料不等于已完成审核"
          - "实际审核后收入成功，review 绑定姓名、kind=session、R、时间与候选摘要，state=verified、origin=promote；run 指向本场景已登记通过结果；旧版进入 _history/spec-demo/TC_WEB_OK_001/<旧版本>/，新版在 specs/spec-demo/TC_WEB_OK_001.spec.mjs，基线在 baseline/spec-demo/TC_WEB_OK_001/<新版本>/"
          - "下一候选删除新增断言为违规，check 非零退出，证明检查基线已经推进"
        forbidden_effects: ["一直对比最初来源而漏掉后来新增断言", "归档覆盖旧版", "审核姓名代替实际会话独立性"]
        evidence_hints: ["候选、T、完整审核材料", "真实审核输入与会话记录", "收入前后目录及摘要", "下一次 check 原始输出"]
      - id: SOP-232-P02
        polarity: positive
        title: 首次新写脚本真实通过并审核后建立首版基线
        actor: "实际改写者 A 与未参与改写的人工审核者"
        priority: P0
        verify: cli
        initial_state:
          - "L0；TC_WEB_NEW_001 无库脚本也无基线；演示要求及用例已确认"
          - "A 新写完整脚本，E 已经真实浏览器运行通过、保存 T 并登记轮次；人工审核者未参与脚本编写"
        steps:
          - "运行 playwright specs check --task <任务编号> --scenario spec-demo#TC_WEB_NEW_001，再运行 playwright specs review --task <任务编号> --scenario spec-demo#TC_WEB_NEW_001 --out <审核材料文件>；人工审核者对照已确认要求、真实证据和全部断言实际审核"
          - "人工审核者只用 playwright specs promote --task <任务编号> --scenario spec-demo#TC_WEB_NEW_001 --reviewed-by <本人姓名> --state verified，不填 --reviewer-session；从收入首版复制候选删除一个预期断言，再 check"
        expected:
          - "首次 check 对全部断言报无基线，审核材料逐条列出，不能伪造相同；没有基线本身不阻止真实通过并人工审核后的首次收入"
          - "人工审核只填写姓名即可，不要求会话标识；收入后 review.kind=person、记录姓名、时间和候选摘要，建立首版基线"
          - "第二次检查删除断言为违规且非零退出，不能以首次新写为由永久免检"
        forbidden_effects:
          - "无基线直接当保真通过"
          - "首次收入后仍无可比较基线"
          - "人工审核被强制要求 AI 会话标识"
        evidence_hints: ["首版无基线输出", "真实 T 与审核", "首次基线及删断言检查"]
      - id: SOP-232-N01
        polarity: negative
        negative_type: tampered-input
        title: 通过后改动候选脚本或执行依赖都不能借原运行收入
        actor: 独立执行者
        priority: P0
        verify: cli
        initial_state: ["T；候选已独立审核但尚未收入；库、基线、历史与账本已留存"]
        steps:
          - "仅改候选脚本一处内容，仍引用 T 尝试 promote，保留拒收输出"
          - "恢复脚本为 T 原文，仅改页面对象的间接执行依赖，再引用 T 尝试收入"
          - "逐次核对库、基线、历史、审核绑定及看板轮次"
        expected:
