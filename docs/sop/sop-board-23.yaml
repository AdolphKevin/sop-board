          - "资产保存在文件，确需跨任务查询时可新增侧表；不能把新资产塞入旧轮次并伪造过去的审核或通过"
        forbidden_effects: ["强制升数据库格式", "用新版空库冒充兼容验证", "迁移篡改原验收结论"]
