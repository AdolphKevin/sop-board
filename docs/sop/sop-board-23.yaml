          - "分开保存脚本冲突与依赖冲突初态：前者预存 scenarios/TC_WEB_CONFLICT_001.spec.mjs，后者仅在 scenarios/library/ 的实际依赖目标放不同内容文件；保存原字节与摘要"
        steps:
