          - "库当前版、基线和历史均未收入这两份变体，既有轮次与结论不变"
        forbidden_effects: ["用运行前后不同的文件冒领通过", "只比较主脚本漏掉依赖变化"]
        evidence_hints: ["T、两份变体与摘要", "完整命令及非零退出码", "收入前后库和轮次对照"]
      - id: SOP-232-N02
        polarity: negative
        negative_type: permission
        title: "审核会话等于任务执行或实现会话时改姓名仍拒收"
        actor: "实际执行/实现会话与独立审核者 R"
        priority: P0
        verify: cli
        initial_state:
          - "T；本任务实现会话 A 和执行会话 E 如实登记；候选尚未独立审核，库未收入"
          - "记录 A、E 的实际会话标识，R 未参与本次改写且与两者都不同；每次使用未变候选与同一运行依据"
        steps:
          - "分别用 --reviewer-session <A>、--reviewer-session <E> 及不同 --reviewed-by 姓名运行 playwright specs promote --task <任务编号> --scenario spec-demo#TC_WEB_OK_001 --state verified，核对两次拒收原因及库摘要"
          - "把同一候选交实际 R 阅读 review 材料，保留真实交接和审核，再用 --reviewed-by <审核姓名> --reviewer-session <R> 收入"
        expected:
          - "审核会话等于实现会话 A 或执行会话 E 均被拒收且非零退出；变更姓名不能绕过，两次都没有收入"
          - "R 真实未参与该次改写且不同于任务执行/实现会话，绑定同一候选摘要后允许收入；人工审核只填姓名的合法分支由 SOP-232-P02 单独核对"
        forbidden_effects: ["只比较姓名", "伪造新会话标签冒充 R", "把脚本审核自动视作产品独立验收"]
        evidence_hints: ["真实会话参与关系与审核输入", "两次命令输出及库摘要", "候选交接记录"]
      - id: SOP-232-P03
        polarity: "positive"
        title: "真实失败且有发现说明的候选可收入为已审核未通过"
        actor: "独立执行者"
        priority: "P0"
        verify: "cli"
        initial_state:
          - "独立演示状态中 TC_WEB_REVIEW_001 已落地、库中尚无其版本和基线；候选在长名称缺陷下真实运行失败，轮次已登记且有具体发现说明；候选及全部依赖与最近运行摘要相同，check 对全部断言报无基线，R 满足审核独立性并逐条审核"
        steps:
          - "运行 playwright specs review --task <任务编号> --scenario spec-demo#TC_WEB_REVIEW_001 --out <审核材料文件>；R 实际审核，再以 --reviewed-by <姓名> --reviewer-session <R> --state reviewed-failing 运行同条目的 specs promote"
          - "核对索引、基线和原失败，再准备该场景的下一轮执行"
        expected:
          - "收入成功，state=reviewed-failing、origin=promote，run 对应已登记失败且发现说明可追溯；保留审核摘要并建立基线，不产生通过"
          - "下一轮该场景进入 reference 并注明状态不是 verified，不自动预置；看板原失败不变"
        forbidden_effects:
          - "为了建库把失败改为通过"
          - "将 reviewed-failing 计入 seeded"
        evidence_hints:
          - "真实失败及发现说明"
          - "review、promote 输出和索引/基线"
          - "下一轮清单和原结果"
      - id: SOP-232-N03
        polarity: "negative"
        negative_type: "incomplete-input"
        title: "收入状态与已登记运行结论或发现说明不符时拒收"
        actor: "独立执行者"
        priority: "P0"
        verify: "cli"
        initial_state:
          - "分别保存四个候选摘要、独立审核及无违规账本前提都满足的状态：真实通过报告尚未登记轮次、已登记失败、已登记通过、真实失败但未填发现说明；不伪写数据库或更改原场景预期"
        steps:
          - "对未登记通过和已登记失败两分支，以 specs promote --task <任务编号> --scenario <批次>#<场景> --reviewed-by <姓名> --reviewer-session <R> --state verified 尝试收入"
          - "对已登记通过和失败但无发现说明两分支，用相同命令但 --state reviewed-failing 尝试收入；逐次核对库、基线、历史与原结论"
        expected:
          - "verified 仅接受本场景在已登记轮次中的通过；仅有通过报告或已登记失败均拒收且非零退出"
          - "reviewed-failing 要求失败且有发现说明；通过结果或失败缺说明均拒收且非零退出；四分支不收入任何版本或改写原结果"
        forbidden_effects:
          - "静态检查或浏览器报告代替已登记通过"
          - "空发现说明被工具编造"
          - "错误状态被自动改成可收入状态"
        evidence_hints:
          - "四份独立输入、真实运行与登记状态"
          - "拒收命令/退出码/原因"
          - "库与原结论前后对照"

  - id: SOP-233
    title: 比较断言与数据核对并审核每处预期变化
    actor: 脚本改写者、审核者与业务确认人
    entry: "sop-board playwright specs check/promote；文字与结构账本；cases put、decision list 和决定页面"
    must:
      - "D115：输出相同、待审核、违规、无基线四类；比较断言标识、匹配器/参数、对象、步骤与条件，SQL 和数据核对同样处理"
      - "文字替换只绑定具体断言和文字节点，结构改写保留 old/new，每项保留改写者、审核者、时间、候选摘要"
      - "扩大正向可接受文字须写审核理由；预期撤销绑定用例前后指纹和 cases put 决定，缺记录违规；有违规或未审核项不得收入"
    scenarios:
      - id: SOP-233-P01
        polarity: positive
        title: 同次检查区分相同待审核违规和无基线
        actor: 独立执行者
        priority: P0
        verify: cli
        initial_state: ["L0；四份独立候选分别为原样 TC_WEB_OK_001、只改变断言对象、删除一个未记账断言、全新 TC_WEB_NEW_001", "基线含界面断言及成员数量/角色的只读 SQL 数据核对，事先保存每条稳定标识与四类预期"]
        steps:
          - "先用 playwright specs check --library <库目录> 保存库检查，再分别用 playwright specs check --task <任务编号> --scenario spec-demo#<场景> 检查四份独立候选；另在单一任务用 --scenario <批次>#<场景> ... 选择多条，保存实际范围"
          - "逐项对照稳定标识、匹配器参数、被断言对象、所在步骤及 SQL/数据核对，记录候选、基线、账本与命令退出码"
        expected:
          - "原样为相同，对象改变为待审核，未记账删除为违规，新写全部断言为无基线；只检查所选场景，不能合并成笼统的通过"
          - "存在违规的检查非零退出；界面及 SQL 核对条目都在报告中，静态相同不产生真实运行通过；check 为只读，库、候选、账本和看板结论均不被改写"
        forbidden_effects: ["忽略被断言对象或 SQL", "运行 check 改写库或看板结论"]
        evidence_hints: ["四份独立变体", "稳定标识对照与完整 check 输出", "库和结论前后摘要"]
      - id: SOP-233-P02
        polarity: positive
        title: 文字账本只作用于指定断言的指定文字节点
        actor: 实际改写者 A 与审核者 R
        priority: P0
        verify: cli
        initial_state: ["基线 spec 有 A_ROLE/A_BADGE 两个断言都含文字 Member，A_ROLE 另一个文字节点也含 Member", "本次已确认界面文案只改 A_ROLE 的目标节点为 成员，其他节点仍为 Member；演示页面满足该要求"]
        steps:
          - "A 只改 A_ROLE 目标文字节点，在任务 spec-ledger.json 写 {id, batch, scenario, assertion_id, node_path, old, new, reason, ref} 条目；R 对照 review 输出中的具体断言和节点实际审核，并真实运行未变候选"
          - "promote 时将该条目连同审核信息并入 text-ledger.json；另从未收入分支复制候选，额外改 A_BADGE 及 A_ROLE 其他同文案节点，沿用原账本再次 check/review"
        expected:
          - "任务账本只绑定本批本场景的 assertion_id 与 node_path，old/new、reason/ref 完整；第一份变更可逐项审核，收入的库内账本另保存改写者、审核者、时间和候选摘要，其他同文案节点保持原样"
          - "第二份候选额外替换仍为待审核，原条目不能顺带批准；摘要变化后不能沿用旧候选审核收入"
        forbidden_effects: ["按整份 spec 子串替换", "一条文字记录放行所有同文案断言"]
        evidence_hints: ["带稳定标识的基线与两份差异", "精确节点账本和真实审核", "两次 check 与真实运行"]
      - id: SOP-233-P03
        polarity: positive
        title: 结构改写逐条保存 old 和 new 并经审核后收入
        actor: 实际审核者 R
        priority: P0
        verify: cli
        initial_state: ["L0；A 把成员列表的直接断言改为调用页面对象，业务预期和适用条件不变", "结构改写前后脚本及 SQL 数据核对原文已独立保存，初次 check 为待审核"]
        steps:
          - "A 在任务 spec-ledger.json 为每处改写写 {id, batch, scenario, assertion_id, kind: rewrite, old, new, reason, ref, sop_change}；R 对照 review 材料中的对象、步骤、条件及 SQL 核对实际审核"
          - "E 真实运行同一候选通过并登记轮次；check 无违规后 promote，将条目及审核信息并入 assertion-ledger.json，核对新基线和历史"
        expected:
          - "每处结构改写可由 old 追溯 new，并绑定批次、场景和断言；收入的库内条目另保留改写者、审核者、时间、本次候选摘要，不能只写“结构调整”"
          - "全部待审核项均有对应账本并经实际审核、且无违规才可收入；运行依据与当前候选一致，新基线包含改写后的完整预期"
        forbidden_effects: ["静态检查替代真实执行", "只留新结构而丢失旧断言去向"]
        evidence_hints: ["初次与审核后 check", "逐项 old/new 和真实审核", "浏览器 T、收入记录及基线"]
      - id: SOP-233-P04
        polarity: positive
        title: 撤销预期绑定真实业务决定及用例前后指纹
        actor: 业务确认人和实际审核者 R
        priority: P0
        verify: cli
        initial_state: ["L0；业务确认人已明确同意取消 TC_WEB_OK_001 用例中“角色必须为 Member”的要求，保留原话与姓名", "旧用例、旧场景及基线指纹已保存；其他分页与邮箱预期不变"]
        steps:
          - "用 cases put --dry-run 预览只移除该用例预期，再以真实姓名和决定原话正式 put；完成合并落地，保存决定编号及用例前后指纹"
          - "从旧基线移除对应角色断言；任务 spec-ledger.json 写 {id, batch, scenario, assertion_id, kind: withdraw, old, new, reason, ref, sop_change}，sop_change 为 {case, before_fingerprint, after_fingerprint, decision_id}，decision_id 指本次 cases put 决定；R 实际审核"
          - "check，按新 scope 真实运行未改变摘要的候选并登记，再 promote；核对库 assertion-ledger.json 中的条目和审核信息，在本机决定页核对来源"
        expected:
          - "业务决定可在看板追溯到这次 cases put、实际确认人、原话与相关用例，前后指纹与撤销账本一致"
          - "合法撤销被识别为有业务依据的已审核变更，保留其余断言；实际通过后可收入新场景版本并建立新基线"
        forbidden_effects: ["审核者替业务方凭空撤销", "只有自由文本理由而没有看板决定关联", "顺带取消分页或邮箱预期"]
        evidence_hints: ["业务原话、预览与正式 put 输出", "决定页面、指纹和合并配对", "撤销账本、check、运行与 promote"]
      - id: SOP-233-N01
        polarity: negative
        negative_type: tampered-input
        title: 无账本删除界面断言或 SQL 核对均为违规且拒绝收入
        actor: 独立执行者
        priority: P0
        verify: cli
        initial_state: ["L0；原基线完整，无撤销或结构改写账本；原业务要求和场景文件始终保留"]
        steps:
          - "分别复制基线，删除第一页行数界面断言、删除成员总数 SQL 核对；每个变体独立 check，保留违规报告"
          - "每个候选另经真实浏览器运行并完整人工核对原业务要求，取得与该候选摘要一致的本轮运行依据；不批准删除项，在其他收入前提满足后尝试 promote"
          - "逐次核对库、基线和历史摘要；保留第一份失败输出"
        expected:
          - "两种删除都定位到缺失断言或数据核对，分类为违规且 check 非零退出；promote 也非零拒绝，不收入任何变体"
          - "现有库、基线与历史不变；静态违规不能因页面仍显示正常或旧轮通过而被消除"
        forbidden_effects: ["只查语法或匹配器集合", "忽略 SQL/数据核对丢失", "删断言取得通过"]
        evidence_hints: ["两份单一删改的差异", "check 与 promote 非零退出码及原因", "库前后摘要"]
      - id: SOP-233-N02
        polarity: negative
        negative_type: tampered-input
        title: 更换被断言对象或把断言移入条件分支必须待审核
        actor: 独立执行者
        priority: P0
        verify: cli
        initial_state: ["L0；没有相关账本或审核；保存原断言对象、步骤、条件与 SQL 查询对象；另一演示组织同样有20名成员"]
        steps:
          - "分别构造四份候选：保持匹配器和参数只换被断言对象；把原无条件断言放入 if 分支；把断言移到其他步骤；SQL数量断言保持匹配器/参数，只把查询对象从组织demo改为另一个演示组织"
          - "对每份运行 check；另取得该候选摘要对应的本轮真实运行依据并完整人工核对原业务要求，在其他收入前提满足、变更项仍未审核时尝试 promote；不提交虚构通过"
        expected:
          - "四份均被列为待审核，指出对象、条件或步骤变化；SQL数据对象变化同样处理，不因断言数量和匹配器相同就归相同"
          - "待审核项没有对应 spec-ledger.json 记录、实际审核未完成时均非零拒绝 promote，库与基线保持原样"
        forbidden_effects: ["用条件永不成立让断言失效而静态通过", "未审核项被默认接受"]
        evidence_hints: ["原对象/步骤/条件/SQL与四份变体", "逐项 check 与真实运行及完整业务核对", "拒收原因、其他前提及库摘要"]
      - id: SOP-233-N03
        polarity: negative
        negative_type: tampered-input
        title: 正向文字断言增加可接受分支没有审核理由时不能收入
        actor: 实际改写者 A 与审核者 R
        priority: P0
        verify: cli
        initial_state: ["L0；正向角色断言只接受 Member，本次变体改为正则 Member 或 Admin", "已保存独立业务依据；测试目标是检测预期放宽，不把当前页面输出当理由"]
        steps:
          - "check 该变体，取得与该候选摘要一致的本轮真实运行依据并完整核对原业务要求；在其他收入前提满足时先保持无审核，再提交只有姓名和时间但没有放宽理由的审核并尝试 promote"
          - "由 R 阅读本次扩大接受集合的实际差异，记录缺少具体放宽理由，保持未批准；核对库和基线未变"
        expected:
          - "增加可接受文字被视为放宽预期，须审核；无对应账本或缺具体放宽理由时 promote 非零拒收，不能作为普通文字替换自动判相同"
          - "review 材料逐项列出扩大接受集合、对应账本和运行依据；本次缺理由保持未批准，不因只填审核姓名和时间就收入，库与基线不变"
        forbidden_effects: ["正则加分支被当等价", "只写“跟随 UI”而没有具体放宽理由", "把当前失败输出改成预期以通过"]
        evidence_hints: ["原正向断言与扩大的接受集合", "check、无审核/空理由拒收", "实际审核材料与库前后摘要"]
      - id: SOP-233-N04
        polarity: negative
        negative_type: incomplete-input
        title: 撤销缺少正确 cases put 决定或前后指纹时仍为违规
        actor: 独立执行者
        priority: P0
        verify: cli
        initial_state: ["SOP-233-P04 的真实决定、用例前后版本与候选已保存，尚未收入；分别复制独立分支"]
        steps:
          - "分别构造：无看板决定只有本机理由；引用别的用例决定；引用正确决定但旧指纹错误；引用正确决定但新指纹错误"
          - "每个分支运行 check 并尝试 promote；核对库与看板原决定未被改写"
        expected:
          - "四个分支均无法证明对应预期已获业务确认，withdraw 被判违规，check 非零且 promote 非零拒收；不能仅凭已签名账本免检"
          - "原决定及用例历史保留，任何变体没有收入或修改已登记结论"
        forbidden_effects: ["复用其他用例或旧版本的批准", "工具补造业务确认", "忽略前后任一指纹"]
        evidence_hints: ["四份账本输入与正确对照", "check、拒收输出", "决定和库前后摘要"]

  - id: SOP-234
    title: 仅按已审核安全路径巡检定位并阻止业务写入
    actor: 巡检编写者、审核者与实际执行者
    entry: "sop-board playwright patrol plan/run；测试 Chrome；patrol.json；atlas-feedback.jsonl；只读数据库或业务接口"
    must:
      - "D116：巡检条目声明入口/身份、地图页面/控件、到达步骤、检查目标/数量、按业务用途允许的请求、禁止动作、审核者/时间及未覆盖范围"
      - "由 atlas 或 surface-map 生成候选，未审核不执行；只连接已有登录态，按 pages 路径模式和 allow_requests 识别页面/请求；未声明非静态请求发出前中止，越界导航停止，任一失败非零退出，定位缺口写地图反馈"
      - "巡检不得改变业务数据，不登记场景结论，不作为沿用旧通过的理由"
    scenarios:
      - id: SOP-234-P01
        polarity: positive
        title: 从 atlas 和备用界面地图生成有完整安全声明的候选
        actor: 独立执行者
        priority: P0
        verify: cli
        initial_state: ["P0；两份隔离状态分别有已登记 atlas 和仅有 surface-map.md，映射相同成员页面", "记录业务数据、浏览器请求数、现有巡检计划与轮次"]
        steps:
          - "分别从两种地图运行 patrol plan，逐项读取候选 patrol.json 与来源；不审核、不运行"
          - "核对候选条目全部声明及已知未覆盖范围，对未确定的请求业务用途保留待审核"
        expected:
          - "两种地图均可提供候选页面、控件和到达步骤并保留来源；条目覆盖 must 中声明，pages 为允许到达的 URL 路径模式，allow_requests 为 [{method, path, purpose}]，path 按路径模式匹配；未审核不能伪填审核人或时间"
          - "计划生成没有实际访问或点击产品、没有业务数据或场景结果；未知请求用途不自动判安全，不能仅按 GET 放行"
        forbidden_effects: ["生成计划即自动执行", "自动把 GET 全部放行", "以空泛的只读声明替代请求用途"]
        evidence_hints: ["两份地图和 plan 输出", "候选字段逐项对照", "请求、数据和轮次前后对照"]
      - id: SOP-234-P02
        polarity: positive
        title: 已审核安全成员路径复用登录态巡检且业务数据完全不变
        actor: 实际巡检执行者
        priority: P0
        verify: web
        initial_state: ["P0；审核者已实际确认成员列表条目，身份为已有 owner 登录态，允许请求仅为已核对无写入的成员列表读取", "成员20条、目标表格1个、Email/Role列各1个、第一页10行；完整业务数据快照已保存"]
        steps:
          - "读取已审核条目的 pages 与 allow_requests；patrol run 连接已有测试 Chrome 登录态，按声明路径核对目标和数量，保存网络、当前证据设置和巡检报告"
          - "逐项核对 document、script、stylesheet、image、font、media 类静态资源与 xhr/fetch/websocket 等其他请求的放行依据，再只读逐值比较所有业务数据"
        expected:
          - "只执行已审核条目，定位与数量符合时退出 0；document、script、stylesheet、image、font、media 类静态资源直接放行，其他请求仅当 method/path 匹配 allow_requests 才放行；导航地址仍必须符合 pages"
          - "身份保持 owner，无新登录、验证码或额外业务动作；演示业务数据全部前后逐值一致，无新增已读事件/邀请/成员/团队，报告列出已知未覆盖范围"
        forbidden_effects: ["巡检自动登录或改变设置", "只凭未点保存判断只读", "只对比行数忽略字段变化"]
        evidence_hints: ["真实 Chrome 连接与既有身份", "审核计划、网络与巡检原始输出", "数据逐值差异为空的对照及查询"]
      - id: SOP-234-N01
        polarity: negative
        negative_type: permission
        title: 生成但未审核的巡检条目不执行
        actor: 独立执行者
        priority: P0
        verify: web
        initial_state: ["P0；计划含一个已审核成员条目和一个未审核通知条目，通知 unread=true", "保存各条目请求计数与业务全量快照"]
        steps:
          - "运行 patrol run，逐项核对实际执行列表、停止或未执行说明、网络及业务数据"
        expected:
          - "只执行已审核成员条目，通知条目明确未审核且没有执行；没有发出通知详情请求"
          - "通知仍未读且其他业务数据完全不变；未执行项不能被记为巡检成功或场景通过"
