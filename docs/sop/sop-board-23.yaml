        steps:
          - "分别新增 entries.app.spec_library、将其改绑到另一合格演示库；读取配置摘要、最近自检、已准备任务和已有通过的队列，再尝试继续原任务"
          - "恢复各分支配置后留证；后续真实自检只在允许 Git 工作树写入的环境进行，本场景编写会话不运行"
        expected:
