          - "该请求没有到达服务端，notice-01 仍 unread=true、已读事件仍0，其他业务数据逐值不变；不是写入后回滚"
        forbidden_effects: ["只按 GET 放行", "写入后再发现并回滚冒充只读", "继续执行该条目后续动作"]
        evidence_hints: ["独立对象副作用证明及恢复记录", "停止原因、非零退出码、网络与服务端审计", "业务前后逐值对照"]
      - id: SOP-234-N03
