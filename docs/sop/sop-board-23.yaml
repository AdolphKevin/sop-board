        verify: web
        initial_state: ["L0；app 未声明 web_evidence，准备 TC_WEB_OK_001 后 scope 中 video/trace 均为 true", "所需录制依赖和测试 Chrome 就绪，任务内有合格复用脚本"]
        steps:
          - "E 实际运行该脚本，按入口声明另附截图和只读数据核对；转换并经 execute submit 提交"
          - "打开本轮录屏核对业务步骤，打开 trace 核对同次操作，对照 scope、报告、附件与时间"
          - "另从独立初态分别以 video=true/trace=false、video=false/trace=true 准备并真实运行同一场景，核对两项开关各自的录制行为"
        expected:
          - "使用库脚本仍实际启动录屏与 trace，生成对应本轮可读附件，不照搬历史关闭录制的做法"
          - "新证据对应本轮场景指纹与产品快照，截图及业务数据核对完整；有旧库证据不能免除新证据"
          - "两个混合配置分别只启动开启的录制项，关闭项不启动也不要求对应附件，两项开关互不代替"
        forbidden_effects: ["只打印录制警告就关闭", "拿旧录像当新运行", "静态存在空附件即判留证合格"]
        evidence_hints: ["冻结 scope、报告与转换输出", "可播放新录像、可读 trace", "截图与只读查询"]
      - id: SOP-236-P04
        polarity: positive
        title: 原格式5数据在全部新能力操作后保持格式与历史结论
        actor: 独立执行者
        priority: P0
