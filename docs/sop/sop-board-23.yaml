        forbidden_effects: ["让纯库维护触发产品变化待判定", "为避免判定而排除整个 web 仓"]
        evidence_hints: ["四类改动与 Git 记录", "前后产品摘要、库摘要及队列", "原轮次对照"]
      - id: SOP-231-N01
        polarity: negative
