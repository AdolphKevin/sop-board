          - "已审核条目 pages 允许通知容器页面，到达会触发 fetch GET /api/notices/notice-01/open，但 allow_requests 未声明此请求；同样保留一份已审核的未声明 xhr 请求变体"
        steps:
          - "保存全量业务前值与服务端请求审计起点，运行会触发详情加载的巡检条目，保留首次停止现场"
