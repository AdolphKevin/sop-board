        initial_state: ["L0；当前产品的 TC_WEB_OK_001 已真实通过，库目录没有手工加入 snapshot_exclude", "记录产品内容摘要、队列、库摘要及原通过依据；库目录为受版本管理目录"]
        steps:
          - "分别在独立恢复分支中修改已跟踪库脚本/账本、新增未跟踪库文件、移走已跟踪库文件并留存；每次读取 status、产品快照和队列"
          - "在允许 Git 写入的演示环境提交一项纯库改动，再核对内容摘要和队列；保留提交号与库摘要变化"
