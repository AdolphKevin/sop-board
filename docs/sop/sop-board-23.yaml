          - "对会话已准备任务另写本轮候选文件，再以原 E 重复 execute prepare，比较原候选、依赖与冻结清单"
        expected:
          - "脚本冲突将 TC_WEB_CONFLICT_001 单列 conflict 并说明目标文件已存在；依赖冲突将每个受影响场景 TC_WEB_CONFLICT_001、TC_WEB_OK_001 各列一项 conflict 并说明依赖路径；两种分支均不覆盖原文件或计为 seeded"
          - "重复会话准备保持已有候选与冻结材料，不以共享库版本覆盖用户本轮文件"
        forbidden_effects: ["静默覆盖", "把冲突文件与库依赖混装后声明为已核实复用"]
        evidence_hints: ["真实创建请求与任务号", "准备前后原字节、摘要、清单", "重复 prepare 输出"]
      - id: SOP-231-N03
        polarity: negative
