# SOP-BOARD-23：Web 验收规范脚本库、保真检查与只读巡检（D114～D118，同一版交付，含 import）
# 预期依据：docs/proposals/2026-11-04-playwright-spec-library.md 方案 1，第三、五、七节。
# 使用者 2026-11-04 决定原话（方案状态栏）：
#   “把 cw2 自建的验收层（断言保真检查和审核账本、改 UI 后的只读巡检、spec 复用）收进 `sop-board playwright`。”
# 状态栏记录选项原话：“库放产品仓库且不计入快照”“未参与该次改写者可审核”“cw2 最近通过的直接标已核实”“三项一起做”。
# 第七节记录使用者决定；D117 经使用者 2026-11-04 复核改为“改写过的标未核实”；调查报告的建议不作为新增要求。
# Claude 于 2026-11-04 审核版本 1，按补充契约与 D117 复核结论修改后定稿。
# 本次为审核方场景编写者返工；实现者不得修改本文件，后续业务执行与结果登记另行留证。
#
# 搭建、前置状态及恢复见 docs/verification.md 末尾「SOP-BOARD-23」。本会话只编写，不执行、不登记验收结果。
# 演示工作区 demo-web、工作批次 spec-demo；被验收的看板批次为 sop-board-23，两者不得混淆。
# 入口 cli/api/web 用于验证 Flow Board；演示工作区 app/api 用于真实运行可复用脚本。
# 所有支持 --data 的命令显式带本轮隔离目录；specs 命令参数以方案补充契约为准；未约定的操作细节从正式文档核对，缺契约处报告，不从当前实现推导预期。
# 不改全局安装，不碰真实 cw2 目录、cw2-live-chat 工作区与 8787；不新增产品测试。
# A=实际脚本改写会话，E=本轮实际运行会话，R=未参与该次改写且不同于任务执行/实现会话的实际审核会话；产品实现者另行如实登记。
# 不把换标签当独立审核；被测功能的实现者不能执行本批独立验收。所有账号仅为授权的演示账号。
#
# L0：产品 web 仓受版本管理的 acceptance/spec-library/，由 app.spec_library 声明为 web:acceptance/spec-library。
#   当前脚本 specs/<批次>/<场景>.spec.mjs；基线 baseline/<批次>/<场景>/<版本号>/；历史 _history/<批次>/<场景>/<版本号>/。
#   另含 pages/、INDEX.json、text-ledger.json、assertion-ledger.json、patrol.json、support/<标识>/manifest.json。
#   TC_WEB_OK_001/TC_WEB_REF_001/TC_WEB_REVIEW_001/TC_WEB_HISTORY_001/TC_WEB_MISSING_001/TC_WEB_CONFLICT_001/TC_WEB_NEW_001/TC_WEB_CASE_DIFF_001 为固定编号；另有范围外 TC_WEB_OUT_001 与 TC_HTTP_ONLY_001。
#   对应演示用例均经 cases upload 与 merge 落地；上述 WEB 场景均为 app，TC_HTTP_ONLY_001 为 api。
#   TC_WEB_OK_001：组织 demo 有 20 名成员；打开成员页；第一页 10 行、共 2 页，首行邮箱 seed-01@example.invalid、角色 Member；禁止写入业务数据。
#   各脚本与用例的具体变体、断言稳定标识、来源及指纹在手册定义；真实通过与审核材料不得靠写库伪造。
#   OK、CONFLICT、OUT、CASE_DIFF 为同指纹已核实通过（CASE_DIFF 仅用例指纹不同）；REF 为旧场景指纹已核实通过；REVIEW 为已审核未通过；HISTORY 为历史导入未核实；MISSING/NEW 无库条目。
#   support 中只放本轮演示辅助脚本，执行时会写可观察的辅助标记；默认不得执行。
# T：实际通过运行的候选与全部依赖、scope、场景/引用用例指纹、产品快照、报告、新证据和执行者记录；用于 promote，不能借用别轮通过。
# R0：独立演示产品的真实失败→实际修复→待复验状态，保存原修复会话与跨批次范围；不是修改本仓被测实现。
# I0：仓库外仿 cw2 的外部目录；来源索引、来源脚本和改写后的规范脚本均为本任务合成材料。
#   TC_IMP_PASS_001 最近通过且规范脚本已改写，TC_IMP_SAME_001 最近通过且未改写，TC_IMP_BLOCK_001 最近受阻且此前通过，TC_IMP_FAIL_001 最近失败且此前通过，TC_IMP_NONE_001 无运行，TC_IMP_STALE_001 最近通过但场景指纹旧，TC_IMP_UNKNOWN_001 无可查来源结果。
#   除故意缺来源的分支外，来源任务/运行使用演示看板真实登记编号，场景指纹从这些结果取，不能从当前场景或外部自填字段补造。
# P0：已登录 owner 的测试 Chrome、atlas 或 surface-map、patrol 候选/审核记录、全量业务数据只读前后核对方法。
#   通知 notice-01 初始 unread=true；直接打开详情会发 GET /api/notices/notice-01/open 并置 unread=false、生成已读事件；巡检未获准此请求。
#   正向巡检只用经核对无写入的成员列表请求；“只允许 GET”不能证明只读。
# D117（2026-11-04 复核）：来源最近通过且规范版本与来源脚本相同的导入为已核实；改写过的导入为未核实，SOP-235-P01、SOP-235-N01 按此定稿。
# Q1～Q6 均已澄清（Q1～Q5 由 Claude，Q6 由使用者复核）；剩余材料构造细节见手册本节，不自行发明行为或删去断言。

metadata:
  requirement: "sop-board：按场景版本复用已核实脚本，逐项审核断言变化，只读巡检拦截未声明副作用，历史导入留来源且不产生通过结论"
  batch: "sop-board-23"
  version: 1
  owner: "blur.yin"
  sources:
    - ref: "docs/proposals/2026-11-04-playwright-spec-library.md 第三节 D114～D118 及补充契约（Claude，2026-11-04，回应 Q1～Q5）、第五节同一版交付、第七节使用者决定"
      version: "方案 1（2026-11-04）"
      confirmed_by: "blur.yin"
    - ref: '使用者 2026-11-04 决定原话（方案状态栏）：“把 cw2 自建的验收层（断言保真检查和审核账本、改 UI 后的只读巡检、spec 复用）收进 `sop-board playwright`。”'
      version: "2026-11-04"
      confirmed_by: "blur.yin"
    - ref: '使用者 2026-11-04 选项原话（状态栏与第七节）：“库放产品仓库且不计入快照”“未参与该次改写者可审核”“cw2 最近通过的直接标已核实”“三项一起做”'
      version: "2026-11-04；D117 已复核"
      confirmed_by: "blur.yin"
  tags: ["sop-board", "playwright", "spec-library", "fidelity", "patrol", "import", "D114-D118"]

sops:
  - id: SOP-231
    title: 声明规范库并在冻结范围内复用脚本
    actor: 开发者与独立执行者
    entry: "工作区 config.yaml；execute prepare；本机看板执行；修复复验准备；任务目录与轮次"
    must:
      - "D114：Web 入口声明产品仓库规范库，索引保留场景与引用用例指纹、脚本和全部依赖摘要、基线、审核、通过依据及三种状态"
      - "执行与修复复验在范围冻结后只预置本轮批次、编号和场景指纹一致且 state=verified 的版本；仅引用用例指纹不同照常预置并注明；其余按缺失、仅参考或冲突列明"
      - "任务使用冻结副本，不覆盖已有文件，辅助脚本默认停用；复用后仍实际运行并留新证据"
      - "库目录不计入产品快照，产品运行代码与配置仍计入；执行记录另存本轮库版本摘要"
    scenarios:
      - id: SOP-231-P01
        polarity: positive
        title: Web 入口解析产品仓库规范库并保留完整索引依据
        actor: 独立执行者
        priority: P0
        verify: cli
        initial_state: ["L0；独立安装与演示工作区配置合格，库路径未另加 snapshot_exclude", "已保存真实来源轮次、审核材料、用例及库文件摘要"]
        steps:
          - "读取 config.yaml 的 entries.app.spec_library，运行 status --json；从本机读取 INDEX.json 和 specs/<批次>/<场景>.spec.mjs、baseline/<批次>/<场景>/<版本号>/、_history/<批次>/<场景>/<版本号>/"
          - "逐项对照 OK、REF、REVIEW、HISTORY 的来源、指纹和文件内容，重新计算脚本与全部执行依赖摘要，核对同批次同场景只有一个当前版本"
        expected:
          - "app 声明解析到演示 web 仓的受版本管理目录；规范工具来自同一被测安装，任务与证据仍在仓库外"
          - "INDEX.json 顶层为 {version: 1, entries: [...]}；条目包含 batch、scenario、scenario_fingerprint、case_fingerprints（用例编号到指纹）、spec、spec_sha256、deps（相对路径到 sha256）、version、baseline、state、origin、provenance、review、run、support，脚本及全部依赖摘要与独立材料一致"
          - "review 为 {by, kind: person|session, session, at, candidate_sha256}；run 为 {batch, round, result_id, status, product_digest}，没有运行则为 null；support 为 [{id, path, enabled: false}]；基线、审核和运行依据与实际来源对应"
          - "state 只取 verified、reviewed-failing、unverified，origin 只取 promote、import；“已核实通过（历史导入）”为 verified/import，“历史导入、未核实”为 unverified/import；REVIEW 保留真实失败，不伪造通过依据"
        forbidden_effects: ["使用真实 cw2 资产", "仅给主脚本算摘要而遗漏页面对象或间接执行依赖"]
        evidence_hints: ["配置与 Git 跟踪清单", "本机索引与来源逐字段对照", "独立计算的摘要及命令输出"]
      - id: SOP-231-P02
        polarity: positive
        title: 会话准备只预置冻结范围内相同编号和指纹的已核实版本
        actor: 独立执行者
        priority: P0
        verify: cli
        initial_state: ["L0；无进行中的任务，当前自检通过", "选定范围仅 TC_WEB_OK_001、TC_WEB_REF_001、TC_WEB_REVIEW_001、TC_WEB_HISTORY_001、TC_WEB_MISSING_001、TC_HTTP_ONLY_001"]
        steps:
          - "execute prepare demo-web spec-demo --scope TC_WEB_OK_001 TC_WEB_REF_001 TC_WEB_REVIEW_001 TC_WEB_HISTORY_001 TC_WEB_MISSING_001 TC_HTTP_ONLY_001 --session <E>；保存范围、任务文件与 specs-manifest.json"
          - "逐项核对预置脚本、页面对象和其他依赖的摘要及来源；读取仅参考与未预置原因"
        expected:
          - "seeded 集合恰为 TC_WEB_OK_001；TC_WEB_REF_001 因场景指纹不同进入 reference；TC_WEB_REVIEW_001 因 state=reviewed-failing、TC_WEB_HISTORY_001 因 state=unverified 进入 reference；TC_WEB_MISSING_001 因库无该批次与编号进入 missing"
          - "范围外 TC_WEB_OUT_001 和非 Web 的 TC_HTTP_ONLY_001 没有被预置；TC_WEB_OK_001 放在 scenarios/TC_WEB_OK_001.spec.mjs，全部库依赖复制到 scenarios/library/，scenarios/library.mjs 只重新导出冻结副本；脚本只经同目录 ./fixtures.mjs 和 ./library.mjs 导入"
          - "specs-manifest.json 分 seeded、missing、reference、conflict 四类，每项写明原因；本次 conflict 为空，只有 seeded 计入复用数量，未通过或未核实项不计入"
        forbidden_effects: ["只按编号预置 REF", "把非 Web 或范围外脚本带入执行范围", "自动运行任何产品步骤"]
        evidence_hints: ["prepare 输出和冻结 scope/pending", "清单与实际文件集合", "逐文件摘要"]
      - id: SOP-231-P03
        polarity: positive
        title: 冻结副本包含间接依赖且共享库后续变化不影响本轮
        actor: 独立执行者
        priority: P0
        verify: web
        initial_state: ["L0；TC_WEB_OK_001 已准备，保存任务脚本、页面对象、间接依赖和库版本摘要", "support 演示脚本关联 TC_WEB_OK_001，尚无辅助标记；Chrome 与账号已授权"]
        steps:
          - "核对辅助脚本已以 .off 后缀复制；只改共享库中的脚本、页面对象及其间接依赖，加入会使执行失败的演示变体；保持任务副本不动"
          - "E 用任务内预置脚本连接测试 Chrome 实际执行 TC_WEB_OK_001，保存浏览器报告、加载依赖与业务数据前后对照，再提交"
          - "核对本轮所有任务文件与执行记录，另准备下一轮观察采用的库摘要；先留证再恢复共享库；在单独授权的演示分支去掉辅助脚本 .off 后缀后运行并在结果备注说明"
        expected:
          - "本轮仍按 scenarios/ 内旧冻结副本执行并得出实际分页结果；不从共享路径加载改后的脚本或间接依赖"
          - "库内容变化不是配置变化，不使本轮或现行自检因配置变化失效；本轮清单和执行记录仍指向准备时库摘要，下轮采用新内容，不能改写旧任务材料"
          - "默认分支辅助脚本保留 .off 且未运行，辅助标记不存在，业务数据没有改变；显式启用分支去掉后缀并在结果备注说明，只产生授权的演示辅助标记"
        forbidden_effects: ["通过绝对路径继续加载共享库", "默认执行辅助脚本", "库变动使本轮已冻结文件被替换"]
        evidence_hints: ["共享库与任务副本前后摘要", "实际依赖加载记录", "原始报告、新证据与数据对照", "两轮库版本记录"]
      - id: SOP-231-P04
        polarity: positive
        title: 看板执行在等待合并结束并冻结最终范围后才预置
        actor: 未参与实现的看板执行者
        priority: P0
        verify: web
        initial_state: ["L0；真实 Codex 可用；本批一项新增演示用例正由看板真实合并，自动执行关闭", "合并前后预定差异只有新增 TC_WEB_LATE_001；库中已有其同内容已核实脚本及来源，其他场景未变"]
        steps:
          - "在本机页面点击重新验证全部场景，保存真实请求及等待合并状态，核对尚未冻结执行范围或预置"
          - "等待真实合并落地，由看板继续准备并启动真实执行会话；核对最终 scope、清单与任务脚本"
          - "让本轮执行者经测试 Chrome 完成最终范围，保留任务时序和每条新证据"
        expected:
          - "执行等待同批合并，不以旧范围提前预置；合并落地后冻结范围包含 TC_WEB_LATE_001"
          - "预置按最终范围与指纹进行，TC_WEB_LATE_001 能复用；最终范围内不合格版本仍不预置，所有结果按最终冻结范围登记"
          - "真实 Codex、看板 HTTP、页面和浏览器执行分别有证据；复用不产生跳过真实运行的通过"
        forbidden_effects: ["用手写模型输出或回执重放代替本场景", "漏掉合并后新增场景", "以预置代替运行"]
        evidence_hints: ["真实 Codex 记录", "请求与等待/准备/执行时间线", "最终 scope、清单和浏览器报告"]
      - id: SOP-231-P05
        polarity: positive
        title: 会话与看板修复复验都按各批次最终范围预置并实际复验
        actor: 未参与修复的复验者
        priority: P0
        verify: web
        initial_state:
          - "R0；成员和团队两个批次均含编号 TC_WEB_OK_001，内容指纹不同；库在 specs/<成员批次>/TC_WEB_OK_001.spec.mjs 与 specs/<团队批次>/TC_WEB_OK_001.spec.mjs 各有本批同指纹 verified 当前版本及真实来源"
          - "分别保存会话修复待复验和看板修复待复验两份独立状态；真实 Codex 与测试 Chrome 可用"
        steps:
          - "先从会话状态用 execute prepare demo-web --fix <修复编号> --session <E> 准备，读取按批次冻结的范围、清单与副本，再逐条真实运行并提交"
          - "保存首分支现场，恢复看板修复状态；从本机看板启动独立复验，等待真实会话准备并完成浏览器运行"
          - "分别按批次核对两份 TC_WEB_OK_001 的库路径、清单、任务脚本内容、依赖、新证据、实际复验者和原修复者"
        expected:
          - "两种复验都在范围冻结后预置，只处理各自 Web 范围中批次、编号、场景指纹一致且 state=verified 的版本"
          - "成员与团队各自 TC_WEB_OK_001 均预置到本批任务目录的 scenarios/TC_WEB_OK_001.spec.mjs；库中两条同编号当前版本同时存在，各取自己的批次，内容与依赖分别匹配"
          - "跨批次同编号的内容、依赖、证据与结果各归原批次，不互相覆盖或混用；两分支实际执行全部复验范围"
          - "复验者为实际未参与修复者，实现者仍为原修复会话；没有沿用原通过或原执行者身份"
        forbidden_effects: ["把脚本审核者自动填成本轮复验者", "通过复用绕过复验独立性或完整范围"]
        evidence_hints: ["两分支来源修复、范围和清单", "真实原生会话与浏览器证据", "按批次轮次与身份"]
      - id: SOP-231-P06
        polarity: positive
        title: 复用版本重新运行后登记新证据和本轮实际执行者
        actor: 独立执行者
        priority: P0
        verify: web
        initial_state: ["L0；TC_WEB_OK_001 历史通过者与本轮 E 不同；产品实现者已知且不是 E", "本轮通过 --scope all 准备，范围中各场景的实际可执行脚本已补齐，证据开关已冻结"]
        steps:
          - "记录旧轮次与证据摘要；E 经测试 Chrome 实际运行复用脚本及本轮其他脚本，保存 global-setup.mjs 在运行开始时生成的 spec-runs/<运行编号>.json，再用 convert 转换并 execute submit"
          - "用真实轮次 HTTP、本机及非回环页面、报告核对新结果、时间、证据、库版本摘要与独立性，并逐条比对转换结果与对应运行摘要"
        expected:
          - "本轮有新的真实运行、报告和证据，原历史通过保留；全量范围逐条实际执行，不出现沿用旧结果"
          - "执行者为实际 E，产品实现者按事实记录；库作者、历史执行者或审核者不被替填为本轮执行者"
          - "每次运行开始在任务目录 spec-runs/<运行编号>.json 保存本次脚本与全部依赖摘要；convert 把对应摘要关联到结果行，与实际运行文件一致；执行记录另可追溯本次库版本摘要，完整材料仅本机"
        forbidden_effects: ["复制旧证据冒充新运行", "把复用数量计成沿用结果数量", "仅改会话标签制造独立性"]
        evidence_hints: ["旧新轮次与证据摘要", "原始报告及真实时间线", "轮次响应、页面截图与报告"]
      - id: SOP-231-P07
        polarity: positive
