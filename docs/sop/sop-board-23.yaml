        forbidden_effects: ["只靠前端隐藏而接口泄漏", "只替换已知路径字符串而泄漏嵌套字段", "把任务会话隐私与轮次业务身份混为一谈"]
        evidence_hints: ["本机完整原文及摘要", "非回环实际连接信息", "两种地址 HTTP/HTML、浏览器截图和字段对照"]
      - id: SOP-236-P03
        polarity: positive
        title: 复用脚本按默认开启的录屏和轨迹留下新证据
        actor: 本轮实际执行者 E
