# SOP-BOARD-1：看板核心的验收场景
# 预期只依据本仓 docs/proposals/2026-10-19-standalone-sop-verification.md（v7 决定）与 docs/designs/SOP-BOARD-1.md 的 I1、I2、I3、D1、D2（版本 5 起另依据 docs/designs/SOP-BOARD-2.md 的全局范围、I2、I4），不依据当前实现的输出。
# 版本 1（2026-10-19）：Claude 依据上述两份原文编写，AdolphKevin 2026-10-19 确认。
# 版本 2（2026-10-19）：随方案修订 2 修改 SOP-01-P01、SOP-01-N01 的预期，新增 SOP-06-P03；AdolphKevin 同日要求本期修复。
# 2026-10-19：第 1、2 轮验收通过后写回各场景的 regression（不改变场景内容指纹）；SOP-06-P01 为人工回归，由 AdolphKevin 负责。
# 版本 3（2026-10-19）：导入测试代理 sop-board-1-tester 的 51 条用例后核对覆盖，补充 18 条场景（含新节点 SOP-07 项目设置）；预期依据方案修订 3，经 AdolphKevin 授权由 Claude 代批。
# 版本 4（2026-10-19）：测试代理复核配对后，补充 14 条场景并改写 SOP-07-N01 的核对方式；经 AdolphKevin 授权由 Claude 代批。
# 2026-10-19：第 4、5 轮验收通过后写回新增 32 条场景的 regression（不改变场景内容指纹），守护测试见 tests/test_regression_*.py。
# 版本 5（2026-10-19）：随 docs/designs/SOP-BOARD-2.md 修订 1 删除 SOP-04 节点（人工复核改由 docs/sop/sop-board-2.yaml 的 SOP-21、SOP-22 覆盖），改写 SOP-01-N02、SOP-05-P01、SOP-06-P01、SOP-06-P03、SOP-06-P09、SOP-07-P01、SOP-07-N01；经 AdolphKevin 授权由 Claude 代批。
# 版本 6（2026-10-19）：按 SOP-BOARD-2 的用例核对覆盖，新增 SOP-01-P06、SOP-01-P07、SOP-01-N03（已有数据目录升级）与 SOP-07-P02，改写 SOP-01-N02、SOP-07-N01；依据 SOP-BOARD-2 方案修订 3，经 AdolphKevin 授权由 Claude 代批。
#
# 下文"测试看板"指：clone 的 sop-board 检出目录已 uv sync，SOP_BOARD_TOKEN 已设置，用 uv run sop-board --data <新的临时目录> --port <空闲端口> 启动，
# SOP_BOARD_URL 指向它。"演示场景文件"指批次 demo 的 demo.yaml：节点 N1、N2，场景 N1-P01、N1-N01、N2-P01、N2-N01。
# 推送时项目身份为 github.com/demo-org/demo-app，项目键为 github-com-demo-org-demo-app，缺省缺陷链接前缀为 https://github.com/demo-org/demo-app/issues/。
# 登记 Agent 轮次时，product.digest 取推送场景文件时的 product_digest，场景另有说明的除外。向看板发信号时发给运行看板服务的 Python 进程。
# 写入接口的请求正文除场景要求的错误外都合法；'不给 implementer'指省略该字段。
# 测试看板启动时不设置 JIRA_URL。人工标记经 SOP-BOARD-2 的标记接口登记：正文为 scenario、fingerprint、status、marker，fail 与 blocked 另带 defect_url。

metadata:
  requirement: "sop-board 核心：启动与持久化、推送场景文件、证据与 Agent 轮次、场景变更、总览与导出、项目设置"
  batch: "sop-board-1"
  version: 6
  owner: "AdolphKevin"
  sources:
    - ref: "docs/proposals/2026-10-19-standalone-sop-verification.md 第 3、4 节"
      version: "v7（2026-10-19，现行 v8 保留其批准记录）"
      confirmed_by: "AdolphKevin"
    - ref: "docs/designs/SOP-BOARD-1.md 的 I1、I2、I3、D1、D2 节"
      version: "修订 3"
      confirmed_by: "AdolphKevin"
    - ref: "docs/designs/SOP-BOARD-2.md 的全局范围、I2、I4 节"
      version: "修订 3"
      confirmed_by: "AdolphKevin"
  tags: ["sop-board", "看板核心"]

sops:

  - id: SOP-01
    title: 启动与持久化
    actor: "启动看板的成员"
    entry: "uv run sop-board"
    must:
      - "谁 clone 谁启动，缺省只有本机能访问"
      - "重启后数据完整保留"
    scenarios:

      - id: SOP-01-P01
        regression: {"check": "unit", "cases": ["tests.test_startup::test_startup_home_wal_and_shutdown", "tests.test_startup::test_default_binding_refuses_other_local_interface", "tests.test_startup::test_explicit_network_binding_and_interrupt", "tests.test_network_addresses::test_shared_startup_reports_each_ipv4_and_prints_loopback"]}
        polarity: positive
        title: 启动后页面可访问，缺省只监听本机
        actor: 启动看板的成员
        priority: P0
        refs: ["I1"]
        verify: cli
        initial_state: ["clone 的检出目录已 uv sync，SOP_BOARD_TOKEN 已设置", "一个尚不存在的临时数据目录路径与一个空闲端口"]
        steps: ["运行 uv run sop-board --data <数据目录> --port <端口>", "用 curl 访问 http://127.0.0.1:<端口>/", "用本机的内网地址访问同一端口", "停止后加 --host 0.0.0.0 重新启动，再用内网地址访问"]
        expected: ["启动后标准输出写出看板地址", "本机地址返回 200 与项目列表页", "未加 --host 时内网地址的连接被拒绝", "加 --host 0.0.0.0 后标准输出写出本机内网地址对应的可访问地址，用该地址访问返回 200", "数据目录被创建并含 board.sqlite3"]
        forbidden_effects: ["检出目录中出现未被忽略的新文件"]
        evidence_hints: ["命令原文与完整输出", "三次连接的输出", "数据目录清单", "启动前后的 git status"]

      - id: SOP-01-P02
        regression: {"check": "unit", "cases": ["tests.test_reads::test_read_round_and_restart_preserve_all_data"]}
        polarity: positive
        title: 用同一数据目录重启后数据完整保留
        actor: 启动看板的成员
        priority: P0
        refs: ["I1", "D1"]
        verify: api
        initial_state: ["测试看板已推送演示场景文件，并按 SOP-03-P01 登记了第 1 轮"]
        steps: ["请求批次摘要接口并保存响应", "停止看板，用同一数据目录与端口重新启动", "再次请求批次摘要接口"]
        expected: ["两次响应的版本号、场景数、轮次表与各项比率相同"]
        forbidden_effects: ["重启后出现重复的轮次或场景版本"]
        evidence_hints: ["两次响应原文与对比", "重启命令与输出"]

      - id: SOP-01-N01
        regression: {"check": "unit", "cases": ["tests.test_startup::test_startup_failure_exits_one_with_reason[token]", "tests.test_startup::test_startup_failure_exits_one_with_reason[port]", "tests.test_startup::test_startup_failure_exits_one_with_reason[unwritable]", "tests.test_startup::test_startup_unwritable_new_directory_is_removed"]}
        polarity: negative
        negative_type: invalid-input
        title: 启动条件不满足时说明原因并退出
        actor: 启动看板的成员
        priority: P1
        refs: ["I1"]
        verify: cli
        initial_state: ["clone 的检出目录已 uv sync"]
        steps: ["不设置 SOP_BOARD_TOKEN 启动", "设置令牌后用一个已被占用的端口启动", "用一个没有写权限的目录作为数据目录启动"]
        expected: ["三次都以退出码 1 结束", "错误输出分别说明缺少 SOP_BOARD_TOKEN、端口被占用并给出端口号、数据目录不可写并给出路径", "前两次使用的数据目录原本不存在，失败后仍不存在"]
        forbidden_effects: ["看板进程在后台继续运行"]
        evidence_hints: ["三次命令原文、输出与退出码", "进程列表"]

      - id: SOP-01-P03
        regression: {"check": "unit", "cases": ["tests.test_regression_startup::test_signals_preserve_round_and_continue_numbering"]}
        polarity: positive
        title: 收到中断或终止信号后关闭退出，重启后轮次号继续递增
        actor: 启动看板的成员
        priority: P1
        refs: ["I1", "D1"]
        verify: cli
        initial_state: ["测试看板已推送演示场景文件并按 SOP-03-P01 登记了第 1 轮"]
        steps: ["查询数据目录中 board.sqlite3 的 PRAGMA journal_mode", "向看板进程发送 SIGINT，观察进程与端口", "用同一数据目录与端口重新启动，确认第 1 轮仍在，再发送 SIGTERM，观察进程与端口", "再次用同一数据目录启动，登记一个新的 Agent 轮次"]
        expected: ["journal_mode 为 wal", "两次收到信号后进程都退出，端口不再接受连接", "重新启动后第 1 轮的数据完整保留", "新登记的轮次号为 2"]
        forbidden_effects: ["PRAGMA integrity_check 的结果不是 ok"]
        evidence_hints: ["命令原文与完整输出", "信号前后的连接测试输出", "SQLite 查询与输出"]

      - id: SOP-01-P04
        regression: {"check": "unit", "cases": ["tests.test_regression_startup::test_default_port_prints_only_loopback_address", "tests.test_network_addresses::test_shared_startup_reports_each_ipv4_and_prints_loopback"]}
        polarity: positive
        title: 缺省端口与内网访问的输出格式
        actor: 启动看板的成员
        priority: P1
        refs: ["I1"]
        verify: cli
        initial_state: ["clone 的检出目录已 uv sync，SOP_BOARD_TOKEN 已设置，8787 端口空闲"]
        steps: ["不带 --host 与 --port 用新的数据目录启动，记录标准输出后停止", "加 --host 0.0.0.0 --port <空闲端口> 启动，记录标准输出", "对照 ifconfig 列出的 IPv4 地址，用输出中的内网地址访问"]
        expected: ["第一次标准输出有一行 看板地址：http://127.0.0.1:8787/，没有 内网地址： 行", "第二次标准输出有一行 看板地址：http://127.0.0.1:<端口>/", "第二次每个内网地址各占一行 内网地址：http://<地址>:<端口>/，其中包含本机主网卡的内网 IPv4 地址，用它访问返回 200", "输出中没有把 0.0.0.0 写成访问地址"]
        forbidden_effects: []
        evidence_hints: ["两次命令原文与完整输出", "ifconfig 输出", "连接测试输出"]

      - id: SOP-01-P05
        regression: {"check": "unit", "cases": ["tests.test_regression_startup::test_restart_preserves_evidence_and_manual_round"]}
        polarity: positive
        title: 重启后证据与人工轮次保留
        actor: 启动看板的成员
        priority: P1
        refs: ["I1", "D1"]
        verify: api
        initial_state: ["测试看板已推送演示场景文件，按 SOP-03-P01 登记第 1 轮，并对 N1-P01 登记了第 2 轮的人工标记"]
        steps: ["下载第 1 轮的一份证据并计算 sha256，请求第 2 轮详情", "停止看板，用同一数据目录与端口重新启动", "再次下载同一证据并请求第 2 轮详情"]
        expected: ["重启后证据字节的 sha256 与重启前相同", "重启后第 2 轮仍为 manual，结果与重启前相同"]
        forbidden_effects: []
        evidence_hints: ["请求与响应原文", "两次下载文件的 sha256"]

      - id: SOP-01-N02
        regression: {"check": "unit", "cases": ["tests.test_regression_startup::test_startup_failures_leave_paths_unchanged[empty-token]", "tests.test_regression_startup::test_startup_failures_leave_paths_unchanged[readonly-parent]", "tests.test_regression_startup::test_startup_failures_leave_paths_unchanged[plain-file]", "tests.test_regression_startup::test_startup_failures_leave_paths_unchanged[occupied-empty]"]}
        polarity: negative
        negative_type: incomplete-input
        title: 令牌为空或数据目录无法创建时启动失败且不留文件
        actor: 启动看板的成员
        priority: P1
        refs: ["I1"]
        verify: cli
        initial_state: ["clone 的检出目录已 uv sync", "一个只读的父目录 /tmp/<随机>/ro-parent，一个普通文件 /tmp/<随机>/plain-file，一个已存在的空目录 /tmp/<随机>/empty-data"]
        steps: ["SOP_BOARD_TOKEN 设为空字符串，以新的数据目录启动", "设置令牌，以 ro-parent 下尚不存在的 data 目录启动", "设置令牌，以 plain-file 为数据目录、一个空闲端口启动，结束后检查该端口与进程列表", "设置令牌并占用一个端口，以 empty-data 为数据目录、该端口启动"]
        expected: ["四次都以退出码 1 结束，没有输出 看板地址 行", "第一次的错误输出说明令牌缺失", "第二、三次的错误输出含对应路径，第三次写明该路径不是目录；ro-parent 下的 data 仍不存在，plain-file 的内容不变", "第三次结束后没有看板进程残留，所用端口可以被重新监听", "第四次的错误输出含端口号，empty-data 仍为空目录"]
        forbidden_effects: []
        evidence_hints: ["四次命令原文与完整输出", "各路径在命令前后的清单与 sha256", "第三次后的端口监听测试与进程列表"]


      - id: SOP-01-P06
        polarity: positive
        title: SOP-BOARD-1 的数据目录升级后可用，已有数据保持原样
        actor: 启动看板的成员
        priority: P0
        refs: ["scope-global", "D1"]
        verify: api
        initial_state: ["以 SOP-BOARD-1 交付提交检出并 uv sync 的看板建立数据目录：推送演示场景文件两个版本，登记 Agent 轮次与一条按 SOP-BOARD-1 标记接口登记的人工 fail（缺陷链接 https://github.com/demo-org/demo-app/issues/1），证据已上传", "已保存批次摘要、场景列表接口的响应，各轮导出的 ZIP 与各证据的 sha256，然后停止该看板"]
        steps: ["用当前版本的看板以同一数据目录启动", "再次请求批次摘要与场景列表，下载各轮导出与证据", "打开 SOP 场景页与人工 fail 场景的详情页", "上传一份合规用例文件，并在 SOP 场景页对一条场景点通过"]
        expected: ["启动成功，标准输出写出看板地址", "批次摘要的版本号、指标、队列数量、轮次表与误判明细，以及场景列表接口的响应与升级前相同", "各轮导出的 results.jsonl 与升级前的字节相同，证据的 sha256 不变", "旧人工结果的缺陷链接在两个页面上原样显示为 https://github.com/demo-org/demo-app/issues/1", "用例上传返回 200 且 upload 为 1，就地通过提交成功并新增一个人工轮次"]
        forbidden_effects: ["已有轮次、结果或证据被修改或删除"]
        evidence_hints: ["升级前后的接口响应对比", "results.jsonl 与证据的 sha256 对照", "页面截图"]

      - id: SOP-01-P07
        polarity: positive
        title: 重启后用例上传与人工复核保留，Jira 摘要缓存不保留
        actor: 启动看板的成员
        priority: P1
        refs: ["D1", "I4"]
        verify: api
        initial_state: ["测试看板以模拟 Jira 配置三个 Jira 变量启动并推送了演示场景文件；批次 demo 已有两次用例上传，N1-P01 有一条人工通过", "已请求过 GET /api/v1/jira/ABC-1，并保存了 GET …/cases 与场景列表的响应"]
        steps: ["停止看板，用同一数据目录与相同配置重启", "请求 GET …/cases 与场景列表，打开 SOP 场景页", "请求 GET /api/v1/jira/ABC-1，查看模拟 Jira 的请求记录"]
        expected: ["上传列表、并集与 N1-P01 的人工结果与重启前相同", "重启后第一次请求 ABC-1 时模拟 Jira 收到一次新请求"]
        forbidden_effects: []
        evidence_hints: ["重启前后的接口响应", "模拟 Jira 的请求记录"]

      - id: SOP-01-N03
        polarity: negative
        negative_type: incomplete-input
        title: 以旧数据目录启动失败时不改动其中任何文件
        actor: 启动看板的成员
        priority: P1
        refs: ["I1", "scope-global"]
        verify: cli
        initial_state: ["一个由 SOP-BOARD-1 交付提交的看板建立的数据目录，已记下其中的文件清单与每个文件的 sha256"]
        steps: ["不设置 SOP_BOARD_TOKEN，以该数据目录启动当前版本的看板", "再次列出文件并计算 sha256"]
        expected: ["以退出码 1 结束，错误输出说明缺少 SOP_BOARD_TOKEN，没有输出看板地址行", "文件清单与每个文件的 sha256 与启动前相同"]
        forbidden_effects: ["数据目录中出现新文件或新表"]
        evidence_hints: ["命令原文、输出与退出码", "前后的文件清单与 sha256"]

  - id: SOP-02
    title: 推送场景文件
    actor: "开发岗代理"
    entry: "PUT /api/v1/projects/<项目键>/batches/<批次>/scenario-file"
    must:
      - "只有带令牌且内容合格的场景文件被保存"
      - "看板与客户端的内容指纹一致"
    scenarios:

      - id: SOP-02-P01
        regression: {"check": "unit", "cases": ["tests.test_scenario_file::test_push_persists_version_and_independent_fingerprints", "tests.test_pages::test_batch_page_matches_all_metrics_queues_rounds_and_misjudgments[new]"]}
        polarity: positive
        title: 推送合格的场景文件后批次出现，四条场景待执行
        actor: 开发岗代理
        priority: P0
        refs: ["I2", "D2"]
        verify: api
        initial_state: ["测试看板，数据目录为空", "演示场景文件，以及按内容指纹规则独立算出的四个指纹"]
        steps: ["带令牌 PUT /api/v1/projects/github-com-demo-org-demo-app/batches/demo/scenario-file，正文含 project、path、commit、dirty、product_digest、content、fingerprints、pushed_by", "请求批次摘要与场景列表接口", "用浏览器打开批次总览页"]
        expected: ["响应 200，version 为 1，added 列出四条场景", "场景列表中四条场景都在待执行队列", "总览页显示待执行 4、复测 0、问题 0"]
        forbidden_effects: []
        evidence_hints: ["请求与响应原文（令牌脱敏）", "总览页截图", "SQLite 中场景版本与场景的查询结果"]

      - id: SOP-02-N01
        regression: {"check": "unit", "cases": ["tests.test_scenario_file::test_all_write_endpoints_require_token[None]", "tests.test_scenario_file::test_all_write_endpoints_require_token[Bearer REDACTED]"]}
        polarity: negative
        negative_type: permission
        title: 没有令牌或令牌错误时拒绝
        actor: 开发岗代理
        priority: P0
        refs: ["I2"]
        verify: api
        initial_state: ["测试看板，数据目录为空", "与 SOP-02-P01 相同的请求正文"]
        steps: ["不带令牌 PUT", "带错误令牌 PUT", "请求项目列表接口"]
        expected: ["前两次均返回 401，error_code 为 unauthorized", "项目列表为空"]
        forbidden_effects: ["创建项目、批次或场景版本"]
        evidence_hints: ["三次请求与响应原文", "SQLite 查询结果"]

      - id: SOP-02-N02
        regression: {"check": "unit", "cases": ["tests.test_scenario_file::test_push_rejects_wrong_identity_or_fingerprints[fingerprint]"]}
        polarity: negative
        negative_type: tampered-input
        title: 客户端指纹与看板计算不一致时拒绝
        actor: 开发岗代理
        priority: P0
        refs: ["I2", "D1"]
        verify: api
        initial_state: ["测试看板，数据目录为空", "请求正文中 N1-P01 的指纹被改掉一位"]
        steps: ["带令牌 PUT 场景文件"]
        expected: ["返回 409，error_code 为 fingerprint-mismatch，列出 N1-P01"]
        forbidden_effects: ["保存任何场景版本"]
        evidence_hints: ["请求与响应原文", "SQLite 查询结果"]

      - id: SOP-02-N03
