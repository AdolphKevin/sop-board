# SOP-BOARD-1：看板核心的验收场景
# 预期只依据本仓 docs/proposals/2026-10-19-standalone-sop-verification.md（v7 决定）与 docs/designs/SOP-BOARD-1.md 的 I1、I2、I3、D1、D2，不依据当前实现的输出。
# 版本 1（2026-10-19）：Claude 依据上述两份原文编写，AdolphKevin 2026-10-19 确认。
# 版本 2（2026-10-19）：随方案修订 2 修改 SOP-01-P01、SOP-01-N01 的预期，新增 SOP-06-P03；AdolphKevin 同日要求本期修复。
# 2026-10-19：第 1、2 轮验收通过后写回各场景的 regression（不改变场景内容指纹）；SOP-06-P01 为人工回归，由 AdolphKevin 负责。
# 版本 3（2026-10-19）：导入测试代理 sop-board-1-tester 的 51 条用例后核对覆盖，补充 18 条场景（含新节点 SOP-07 项目设置）；预期依据方案修订 3，经 AdolphKevin 授权由 Claude 代批。
#
# 下文"测试看板"指：clone 的 sop-board 检出目录已 uv sync，SOP_BOARD_TOKEN 已设置，用 uv run sop-board --data <新的临时目录> --port <空闲端口> 启动，
# SOP_BOARD_URL 指向它。"演示场景文件"指批次 demo 的 demo.yaml：节点 N1、N2，场景 N1-P01、N1-N01、N2-P01、N2-N01。
# 推送时项目身份为 github.com/demo-org/demo-app，项目键为 github-com-demo-org-demo-app，缺省缺陷链接前缀为 https://github.com/demo-org/demo-app/issues/。

metadata:
  requirement: "sop-board 核心：启动与持久化、推送场景文件、证据与 Agent 轮次、人工复核、场景变更、总览与导出"
  batch: "sop-board-1"
  version: 3
  owner: "AdolphKevin"
  sources:
    - ref: "docs/proposals/2026-10-19-standalone-sop-verification.md 第 3、4 节"
      version: "v7（2026-10-19，现行 v8 保留其批准记录）"
      confirmed_by: "AdolphKevin"
    - ref: "docs/designs/SOP-BOARD-1.md 的 I1、I2、I3、D1、D2 节"
      version: "修订 3"
      confirmed_by: "AdolphKevin"
  tags: ["sop-board", "看板核心"]

sops:

  - id: SOP-01
    title: 启动与持久化
    actor: "启动看板的成员"
    entry: "uv run sop-board"
    must:
      - "谁 clone 谁启动，缺省只有本机能访问"
      - "重启后数据完整保留"
    scenarios:

      - id: SOP-01-P01
        regression: {"check": "unit", "cases": ["tests.test_startup::test_startup_home_wal_and_shutdown", "tests.test_startup::test_default_binding_refuses_other_local_interface", "tests.test_startup::test_explicit_network_binding_and_interrupt", "tests.test_network_addresses::test_shared_startup_reports_each_ipv4_and_prints_loopback"]}
        polarity: positive
        title: 启动后页面可访问，缺省只监听本机
        actor: 启动看板的成员
        priority: P0
        refs: ["I1"]
        verify: cli
        initial_state: ["clone 的检出目录已 uv sync，SOP_BOARD_TOKEN 已设置", "一个尚不存在的临时数据目录路径与一个空闲端口"]
        steps: ["运行 uv run sop-board --data <数据目录> --port <端口>", "用 curl 访问 http://127.0.0.1:<端口>/", "用本机的内网地址访问同一端口", "停止后加 --host 0.0.0.0 重新启动，再用内网地址访问"]
        expected: ["启动后标准输出写出看板地址", "本机地址返回 200 与项目列表页", "未加 --host 时内网地址的连接被拒绝", "加 --host 0.0.0.0 后标准输出写出本机内网地址对应的可访问地址，用该地址访问返回 200", "数据目录被创建并含 board.sqlite3"]
        forbidden_effects: ["检出目录中出现未被忽略的新文件"]
        evidence_hints: ["命令原文与完整输出", "三次连接的输出", "数据目录清单", "启动前后的 git status"]

      - id: SOP-01-P02
        regression: {"check": "unit", "cases": ["tests.test_reads::test_read_round_and_restart_preserve_all_data"]}
        polarity: positive
        title: 用同一数据目录重启后数据完整保留
        actor: 启动看板的成员
        priority: P0
        refs: ["I1", "D1"]
        verify: api
        initial_state: ["测试看板已推送演示场景文件，并按 SOP-03-P01 登记了第 1 轮"]
        steps: ["请求批次摘要接口并保存响应", "停止看板，用同一数据目录与端口重新启动", "再次请求批次摘要接口"]
        expected: ["两次响应的版本号、场景数、轮次表与各项比率相同"]
        forbidden_effects: ["重启后出现重复的轮次或场景版本"]
        evidence_hints: ["两次响应原文与对比", "重启命令与输出"]

      - id: SOP-01-N01
        regression: {"check": "unit", "cases": ["tests.test_startup::test_startup_failure_exits_one_with_reason[token]", "tests.test_startup::test_startup_failure_exits_one_with_reason[port]", "tests.test_startup::test_startup_failure_exits_one_with_reason[unwritable]", "tests.test_startup::test_startup_unwritable_new_directory_is_removed"]}
        polarity: negative
        negative_type: invalid-input
        title: 启动条件不满足时说明原因并退出
        actor: 启动看板的成员
        priority: P1
        refs: ["I1"]
        verify: cli
        initial_state: ["clone 的检出目录已 uv sync"]
        steps: ["不设置 SOP_BOARD_TOKEN 启动", "设置令牌后用一个已被占用的端口启动", "用一个没有写权限的目录作为数据目录启动"]
        expected: ["三次都以退出码 1 结束", "错误输出分别说明缺少 SOP_BOARD_TOKEN、端口被占用并给出端口号、数据目录不可写并给出路径", "前两次使用的数据目录原本不存在，失败后仍不存在"]
        forbidden_effects: ["看板进程在后台继续运行"]
        evidence_hints: ["三次命令原文、输出与退出码", "进程列表"]

      - id: SOP-01-P03
        polarity: positive
        title: 收到中断或终止信号后关闭退出，重启后轮次号继续递增
        actor: 启动看板的成员
        priority: P1
        refs: ["I1", "D1"]
        verify: cli
        initial_state: ["测试看板已推送演示场景文件并按 SOP-03-P01 登记了第 1 轮"]
        steps: ["查询数据目录中 board.sqlite3 的 PRAGMA journal_mode", "向看板进程发送 SIGINT，观察进程与端口", "用同一数据目录与端口重新启动，确认第 1 轮仍在，再发送 SIGTERM，观察进程与端口", "再次用同一数据目录启动，登记一个新的 Agent 轮次"]
        expected: ["journal_mode 为 wal", "两次收到信号后进程都退出，端口不再接受连接", "重新启动后第 1 轮的数据完整保留", "新登记的轮次号为 2"]
        forbidden_effects: ["PRAGMA integrity_check 的结果不是 ok"]
        evidence_hints: ["命令原文与完整输出", "信号前后的连接测试输出", "SQLite 查询与输出"]

  - id: SOP-02
    title: 推送场景文件
    actor: "开发岗代理"
    entry: "PUT /api/v1/projects/<项目键>/batches/<批次>/scenario-file"
    must:
      - "只有带令牌且内容合格的场景文件被保存"
      - "看板与客户端的内容指纹一致"
    scenarios:

      - id: SOP-02-P01
        regression: {"check": "unit", "cases": ["tests.test_scenario_file::test_push_persists_version_and_independent_fingerprints", "tests.test_pages::test_batch_page_matches_all_metrics_queues_rounds_and_misjudgments[new]"]}
        polarity: positive
        title: 推送合格的场景文件后批次出现，四条场景待执行
        actor: 开发岗代理
        priority: P0
        refs: ["I2", "D2"]
        verify: api
        initial_state: ["测试看板，数据目录为空", "演示场景文件，以及按内容指纹规则独立算出的四个指纹"]
        steps: ["带令牌 PUT /api/v1/projects/github-com-demo-org-demo-app/batches/demo/scenario-file，正文含 project、path、commit、dirty、product_digest、content、fingerprints、pushed_by", "请求批次摘要与场景列表接口", "用浏览器打开批次总览页"]
        expected: ["响应 200，version 为 1，added 列出四条场景", "场景列表中四条场景都在待执行队列", "总览页显示待执行 4、复测 0、问题 0"]
        forbidden_effects: []
        evidence_hints: ["请求与响应原文（令牌脱敏）", "总览页截图", "SQLite 中场景版本与场景的查询结果"]

      - id: SOP-02-N01
        regression: {"check": "unit", "cases": ["tests.test_scenario_file::test_all_write_endpoints_require_token[None]", "tests.test_scenario_file::test_all_write_endpoints_require_token[Bearer REDACTED]"]}
        polarity: negative
        negative_type: permission
        title: 没有令牌或令牌错误时拒绝
        actor: 开发岗代理
        priority: P0
        refs: ["I2"]
        verify: api
        initial_state: ["测试看板，数据目录为空", "与 SOP-02-P01 相同的请求正文"]
        steps: ["不带令牌 PUT", "带错误令牌 PUT", "请求项目列表接口"]
        expected: ["前两次均返回 401，error_code 为 unauthorized", "项目列表为空"]
        forbidden_effects: ["创建项目、批次或场景版本"]
        evidence_hints: ["三次请求与响应原文", "SQLite 查询结果"]

      - id: SOP-02-N02
        regression: {"check": "unit", "cases": ["tests.test_scenario_file::test_push_rejects_wrong_identity_or_fingerprints[fingerprint]"]}
        polarity: negative
        negative_type: tampered-input
        title: 客户端指纹与看板计算不一致时拒绝
        actor: 开发岗代理
        priority: P0
        refs: ["I2", "D1"]
        verify: api
        initial_state: ["测试看板，数据目录为空", "请求正文中 N1-P01 的指纹被改掉一位"]
        steps: ["带令牌 PUT 场景文件"]
        expected: ["返回 409，error_code 为 fingerprint-mismatch，列出 N1-P01"]
        forbidden_effects: ["保存任何场景版本"]
        evidence_hints: ["请求与响应原文", "SQLite 查询结果"]

      - id: SOP-02-N03
        regression: {"check": "unit", "cases": ["tests.test_scenario_file::test_invalid_scenario_files_have_lines_and_no_writes[negative]", "tests.test_scenario_file::test_push_rejects_wrong_identity_or_fingerprints[batch]"]}
        polarity: negative
        negative_type: invalid-input
        title: 场景文件不合格或批次不一致时拒绝
        actor: 开发岗代理
        priority: P1
        refs: ["I2"]
        verify: api
        initial_state: ["测试看板，数据目录为空"]
        steps: ["推送删掉 N1 反向场景且没有 negative_exempt 的演示场景文件", "推送 metadata.batch 为 other 的演示场景文件，地址中的批次仍为 demo"]
        expected: ["第一次返回 422，error_code 为 scenario-file-invalid，problems 指出 N1 缺少反向场景并给出行号", "第二次返回 422，error_code 为 project-mismatch，指出批次不一致"]
        forbidden_effects: ["保存任何场景版本"]
        evidence_hints: ["两次请求与响应原文"]

      - id: SOP-02-N04
        regression: {"check": "unit", "cases": ["tests.test_scenario_file::test_duplicate_push_updates_product_without_new_version"]}
        polarity: negative
        negative_type: duplicate
        title: 重复推送相同内容不产生新版本
        actor: 开发岗代理
        priority: P1
        refs: ["I2"]
        verify: api
        initial_state: ["测试看板已推送演示场景文件版本 1"]
        steps: ["再次推送完全相同的内容"]
        expected: ["返回 200，unchanged 为 true，version 仍为 1"]
        forbidden_effects: ["产生版本 2"]
        evidence_hints: ["请求与响应原文", "SQLite 中场景版本的查询结果"]

      - id: SOP-02-P02
        polarity: positive
        title: 项目键按规则归一化，指纹计算统一换行符
        actor: 开发岗代理
        priority: P2
        refs: ["I1", "I2", "D1"]
        verify: api
        initial_state: ["测试看板尚未推送任何场景文件"]
        steps: ["以 project.id 为 GitHub.com/Demo_Org/Demo.App 把演示场景文件推送到 /api/v1/projects/github-com-demo-org-demo-app/batches/demo/scenario-file", "请求项目列表", "把演示场景文件中 N1-P01 的一条 expected 改为含 \\r\\n 的两行文本，按方案先把 \\r\\n 换成 \\n 再计算指纹后推送"]
        expected: ["第一次推送返回 200", "项目列表中该项目的键为 github-com-demo-org-demo-app，身份为推送时的 GitHub.com/Demo_Org/Demo.App", "第二次推送返回 200，没有 fingerprint-mismatch"]
        forbidden_effects: []
        evidence_hints: ["请求与响应原文（令牌脱敏）", "本地指纹计算脚本与输出"]

      - id: SOP-02-N05
        polarity: negative
        negative_type: permission
        title: 全部写入接口都要求令牌，读取接口不需要
        actor: 未授权的访问者
        priority: P0
        refs: ["I2", "I3"]
        verify: api
        initial_state: ["测试看板已推送演示场景文件并按 SOP-03-P01 登记了第 1 轮"]
        steps: ["不带令牌与带错误令牌，分别请求推送场景文件、上传证据、登记轮次、登记人工标记、设置项目缺陷前缀五个写入接口", "不带令牌请求项目列表、批次摘要、场景列表、第 1 轮详情、第 1 轮导出与一份证据下载"]
        expected: ["十个写入请求都返回 401，error_code 为 unauthorized", "被拒绝的请求没有留下数据：场景版本号、轮次表、项目缺陷前缀与 evidence 目录都不变", "六个读取请求都返回 200"]
        forbidden_effects: []
        evidence_hints: ["请求与响应原文（令牌脱敏）", "请求前后的版本号、轮次表、前缀与 evidence 目录清单"]

  - id: SOP-03
    title: 证据与 Agent 轮次
    actor: "开发岗代理"
    entry: "POST /api/v1/evidence、POST /api/v1/projects/<项目键>/batches/<批次>/rounds"
    must:
      - "轮次只引用已上传的证据与当前场景内容"
      - "登记后队列与统计按口径更新"
    scenarios:

      - id: SOP-03-P01
        regression: {"check": "unit", "cases": ["tests.test_evidence::test_evidence_content_addressing_dedup_download_and_first_filename", "tests.test_rounds::test_agent_round_stores_results_evidence_and_statistics", "tests.test_pages::test_batch_page_matches_all_metrics_queues_rounds_and_misjudgments[agent]"]}
        polarity: positive
        title: 登记一轮后队列与统计按口径更新
        actor: 开发岗代理
        priority: P0
        refs: ["I2", "D2"]
        verify: api
        initial_state: ["测试看板已推送演示场景文件版本 1", "四份证据文件：两张截图与两份文本"]
        steps: ["逐个 POST /api/v1/evidence 上传四份证据", "POST 一轮：N1-P01 与 N2-P01 为 pass，N1-N01 为 fail，N2-N01 为 blocked（finding 为 Q1）；implementer 为 Zhang San，执行者为 Li Si", "请求批次摘要接口", "查询 SQLite 中的轮次与结果"]
        expected: ["每次上传返回的 sha256 与本地计算值相同", "轮次接口返回 round 为 1", "复测 2、问题 2、待执行 0", "Agent 验收通过率 2/3，一次通过率 2/3，第 1 轮通过率 2/4", "SQLite 中有 1 个轮次与 4 条结果，独立性均为 independent"]
        forbidden_effects: []
        evidence_hints: ["上传与登记的请求与响应原文", "本地 sha256 计算输出", "批次摘要响应", "SQLite 查询结果"]

      - id: SOP-03-N01
        regression: {"check": "unit", "cases": ["tests.test_rounds::test_round_reports_all_result_problems_and_rolls_back"]}
        polarity: negative
        negative_type: invalid-input
        title: 逐条指出结果的问题
        actor: 开发岗代理
        priority: P0
        refs: ["I2"]
        verify: api
        initial_state: ["测试看板已推送演示场景文件版本 1，并上传了一份证据"]
        steps: ["POST 一轮，四条结果各有一个问题：N1-P01 为 pass 但没有证据；N1-N01 引用未上传的证据 sha256；N2-P01 的 executed_at 晚于服务端时间一小时；N2-N01 为 blocked 但没有 finding"]
        expected: ["返回 422，error_code 为 round-invalid", "problems 分别指向 results[0] 至 results[3] 并说明各自的问题"]
        forbidden_effects: ["登记轮次"]
        evidence_hints: ["请求与响应原文", "SQLite 查询结果"]

      - id: SOP-03-N02
        regression: {"check": "unit", "cases": ["tests.test_rounds::test_round_rejects_stale_file_or_scenario[file]", "tests.test_rounds::test_round_rejects_stale_file_or_scenario[fingerprint]"]}
        polarity: negative
        negative_type: stale-input
        title: 场景内容不是当前版本时拒绝
        actor: 开发岗代理
        priority: P0
        refs: ["I2"]
        verify: api
        initial_state: ["测试看板已推送演示场景文件版本 1 与修改过 N1-P01 的版本 2，证据已上传"]
        steps: ["POST 一轮，scenario_file_sha256 为版本 1 的值", "POST 一轮，scenario_file_sha256 为版本 2，但 N1-P01 的 fingerprint 为版本 1 的值"]
        expected: ["第一次返回 409，error_code 为 scenario-file-stale", "第二次返回 409，error_code 为 scenario-stale，点名 N1-P01"]
        forbidden_effects: ["登记轮次"]
        evidence_hints: ["两次请求与响应原文"]

      - id: SOP-03-N03
        regression: {"check": "unit", "cases": ["tests.test_rounds::test_idempotency_replay_conflict_and_replay_after_new_version"]}
        polarity: negative
        negative_type: duplicate
        title: 同一幂等键只登记一次
        actor: 开发岗代理
        priority: P1
        refs: ["I2"]
        verify: api
        initial_state: ["测试看板已推送演示场景文件版本 1，证据已上传"]
        steps: ["用同一 idempotency_key 与相同正文 POST 两次", "用同一 idempotency_key、改动一条 actual 的正文再 POST 一次", "请求批次摘要接口"]
        expected: ["前两次返回相同的轮次号", "第三次返回 409，error_code 为 idempotency-conflict", "批次只有一个轮次"]
        forbidden_effects: ["产生第二个轮次"]
        evidence_hints: ["三次请求与响应原文", "批次摘要响应"]

      - id: SOP-03-P02
        polarity: positive
        title: 证据按内容存储，相同内容只存一份并可原样下载
        actor: 开发岗代理
        priority: P1
        refs: ["I2", "I3", "D1"]
        verify: api
        initial_state: ["测试看板已启动"]
        steps: ["以百分号编码的 截图.png 为 X-Evidence-Name 上传一张 PNG 图片", "以 another.png 为 X-Evidence-Name 再上传相同字节", "以 run.txt 为 X-Evidence-Name 上传一个文本文件", "下载这两份证据并查看响应的内容类型", "查看数据目录 evidence 下的文件与 SQLite 证据表"]
        expected: ["三次上传都返回 ok、sha256 与 size，sha256 与本地计算值相同", "相同字节只在 evidence/<sha256 前两位>/<sha256> 存一份，证据表中该 sha256 只有一行，文件名为首次上传的 截图.png", "下载的字节与原文件相同；图片的内容类型为 image/png，文本为 text/plain（可带字符集参数）"]
        forbidden_effects: []
        evidence_hints: ["请求与响应原文（令牌脱敏）", "evidence 目录清单", "SQLite 查询与输出"]

      - id: SOP-03-P03
        polarity: positive
        title: 独立性按实现者与执行者姓名判定
        actor: 开发岗代理
        priority: P0
        refs: ["I2"]
        verify: api
        initial_state: ["测试看板已推送演示场景文件，所需证据已上传"]
