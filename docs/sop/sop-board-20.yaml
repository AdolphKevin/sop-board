# SOP-BOARD-20：按条增改用例与增量合并
# 预期依据：使用者 2026-11-03 的问题“为什么要强制改用例文件并上传，再走看板合并流程生成场景？”与随后的要求
#   “在 sop-board 写‘按条增改用例’的方案，制定好方案后开始改造并审核”（方案 docs/proposals/2026-11-03-case-amend.md D103～D105）。
# 版本 1（2026-11-03）：Claude 依据方案在实现前编写；实现与返工会话只读本文件，与方案不一致处以本文件为准并报告。
# 版本 2（2026-11-03）：使用者要求“sop-board 被莫名其妙的触发了自动合并，将这个自动合并的逻辑删掉”（cw2 改 snapshot_exclude 后看板以“配置变化”排了两次全量合并），
#   方案增加 D106：新增 SOP-204；SOP-203 的 must 与 SOP-203-N02 的全量原因由“入口声明或工作区配置有变化”改为“入口声明有变化”。
#
# “演示 Web 工作区”同 sop-board-16.yaml 文件头（工作区 demo-web，入口 app 与 api）。本文件另需：
#   - 工作区“场景写入后自动执行”关闭；默认业务确认人未设置。
#   - “用例原文件”：仓库外的 team-cases.yaml，metadata 为 {module: 团队, feature: 成员与团队, owner: tester-a, last_reviewed: 2026-11-01}，
#     7 条用例，verify 均为 app、角色均为 Owner：
#       section:成员邀请 —— TC_TEAM_INVITE_001 Owner 邀请成员（正向：点「邀请成员」，填 a@example.invalid，点「发送邀请」；预期列表出现该邮箱，状态为待接受）；
#         TC_TEAM_INVITE_002 邀请邮箱格式校验（正向，字段核对：填 not-an-email 后点「发送邀请」；预期提示邮箱格式不正确，不发送）；
#         TC_TEAM_INVITE_003 重复邀请被拒（反向，tags 含 negative：已有待接受的 a@example.invalid，再次邀请；预期提示已邀请，列表不新增）；
#         TC_TEAM_INVITE_004 Owner 一次邀请两名成员（正向：填 b@example.invalid 与 c@example.invalid；预期出现两条待接受记录）。
#       section:团队 —— TC_TEAM_CREATE_001 新建团队（正向：名称 Customer Success A，点「创建」；预期列表显示该团队）；
#         TC_TEAM_CREATE_002 团队名称为空不能创建（反向：名称留空点「创建」；预期提示名称必填，列表不变）。
#       section:成员列表 —— TC_TEAM_LIST_001 成员列表分页（正向：组织有 20 名成员时打开成员页；预期“分页显示”，不写每页条数）。
#   - “按条批次”：demo-web 的批次 case-amend。tester-a 以 sop-board cases upload demo-web case-amend team-cases.yaml --uploaded-by tester-a --session <A>
#     上传用例原文件（上传 #1），会话 A 运行 merge prepare 后写出完整判断并 merge submit，作为“基线合并”：
#     TC_TEAM_INVITE_002 为细节并入 TC_TEAM_INVITE_001，其余为流程；TC_TEAM_LIST_001 因缺少每页条数登记一条业务缺口而暂缓；
#     三个 section 各有节点，成员列表节点给出反向豁免。基线合并落地后，场景文件含 5 条场景，TC_TEAM_LIST_001 待补充。
#   - “基线状态”：按条批次刚完成基线合并时，数据目录与 web 仓的副本。各场景写“基线状态”时，先停止看板与本轮会话的任务，恢复这两份副本。
# 执行步骤中的 put 指 sop-board cases put demo-web case-amend，export 指 sop-board cases export demo-web case-amend，
#   prepare 与 submit 指 sop-board merge prepare/submit demo-web case-amend；命令都带演示数据目录的 --data。
# “执行者”指验收中扮演开发会话的未参与实现的会话，A、B 各用一个稳定标签作为 --session；dev-a、tester-a 是演示署名。
# 写 final.json 时，除场景写明的条目外，nodes、scenarios、negative_exempt、gaps、relocate、notes、responses、case_updates 为空数组，reply 为空字符串。

metadata:
  requirement: "sop-board：按条增改用例时不需整份文件，署名并记下依据，合并只判断变化的用例并沿用其余判断"
  batch: "sop-board-20"
  version: 2
  owner: "blur.yin"
  sources:
    - ref: "使用者 2026-11-03 的问题与要求（cw2 paseo agent e367b611 之后，本会话）"
      version: "2026-11-03"
      confirmed_by: "blur.yin"
    - ref: "docs/proposals/2026-11-03-case-amend.md D103～D106"
      version: "方案 2"
      confirmed_by: "blur.yin"
  tags: ["sop-board", "cases", "merge", "incremental"]

sops:
  - id: SOP-201
    title: 按条增改用例
    actor: 开发会话
    entry: "命令行 sop-board cases put、decision list、task list；用例页、合并页"
    must:
      - "片段或整份用例文件中选定的用例逐条与当前用例比较，只登记新增与改写的用例，署名为使用者给出的姓名，依据登记为决定记录"
      - "改写时列出变化的字段与被替换版本的来源；被替换版本来自合并澄清时明确提示"
      - "内容都未变化时不登记任何记录；不合格的请求被拒且不留任何记录"
      - "按条增改的上传不能写回原文件"
    scenarios:
      - id: SOP-201-P01
        polarity: positive
        title: 只含几条用例的片段登记为一次按条增改
        actor: 开发会话
        priority: P0
        verify: cli
        initial_state: ["基线状态"]
        steps:
          - "写片段 amend-1.yaml，只有 test_cases 两条：TC_TEAM_CREATE_001 的 expected_results 改为“列表显示完整名称 Customer Success A，名称不被截断”，其余字段同原文件；新增 TC_TEAM_CREATE_003（团队名称重复不能创建，反向，tags 含 negative 与 section:团队）"
          - "运行 put --from amend-1.yaml --by dev-a --reason \"团队名称不能截断；重名团队不能创建\" --session <B>"
          - "查看用例页的上传记录与两条用例、sop-board decision list demo-web --batch case-amend、sop-board task list demo-web --batch case-amend"
        expected:
          - "输出 TC_TEAM_CREATE_001 为改写，变化字段只有 expected_results，被替换版本来自上传 #1（team-cases.yaml，tester-a）；TC_TEAM_CREATE_003 为新增；输出给出登记的上传序号"
          - "上传记录新增一次，文件名为“按条增改：amend-1.yaml”，上传人 dev-a，登记 2 条（新增 1、改写 1）；用例并集为 8 条，其余 6 条的内容与来源上传不变"
          - "这次上传的 metadata 与上传 #1 相同"
          - "决定记录出现 --reason 原文，来源为“按条增改”，注明上传序号与 TC_TEAM_CREATE_001、TC_TEAM_CREATE_003，署名 dev-a"
          - "产生一个由会话 B 认领的合并任务"
        forbidden_effects: ["登记片段以外的用例", "改动 team-cases.yaml", "看板为该合并启动 Codex"]
        evidence_hints: ["命令输出", "用例页截图", "decision list 与 task list 输出"]
      - id: SOP-201-P02
        polarity: positive
        title: 从改过的整份原文件中只登记指定用例
        actor: 开发会话
        priority: P0
        verify: cli
        initial_state: ["基线状态"]
        steps:
          - "复制 team-cases.yaml 为 team-cases-edit.yaml，在副本中改三处：TC_TEAM_INVITE_001 的预期加一条“邀请记录显示邀请人 Owner”；TC_TEAM_LIST_001 的标题改为“成员较多时分页显示”；TC_TEAM_CREATE_002 的步骤末尾加一步“刷新页面”；metadata.last_reviewed 改为 2026-11-03"
          - "运行 put --from team-cases-edit.yaml --case TC_TEAM_INVITE_001 --by dev-a --reason \"邀请记录要显示邀请人\" --session <B>"
          - "在用例页查看三条用例与上传记录"
        expected:
          - "只有 TC_TEAM_INVITE_001 登记为改写，上传登记 1 条；输出不列出未选取的用例"
          - "TC_TEAM_LIST_001 与 TC_TEAM_CREATE_002 在看板中仍为原内容，来源仍为上传 #1"
          - "这次上传的 metadata 取自 team-cases-edit.yaml（last_reviewed 为 2026-11-03）"
        forbidden_effects: ["登记未选取的用例", "改动 team-cases-edit.yaml"]
        evidence_hints: ["命令输出", "用例页截图"]
      - id: SOP-201-P03
        polarity: positive
        title: 改写合并澄清改过的用例时明确提示
        actor: 开发会话
        priority: P1
        verify: cli
        initial_state:
          - "基线状态上，会话 B 运行 sop-board merge reply demo-web case-amend --gap none --text \"团队名称为空时，创建按钮不可点击，不弹出提示\" --author dev-a --session <B>，再 prepare，在输出中采纳该回复、按它改写 TC_TEAM_CREATE_002 的步骤与预期并给出全部用例的判断，submit 落地；上传记录出现“合并澄清 第 1 轮”"
        steps:
          - "运行 put --from team-cases.yaml --case TC_TEAM_CREATE_002 --by dev-a --reason \"按原写法再核对\" --session <B>"
        expected:
          - "TC_TEAM_CREATE_002 为改写，被替换版本来自“合并澄清 第 1 轮”上传，输出标出 overrides_clarification，并说明下一轮合并仍按已采纳的答复核对"
        forbidden_effects: ["静默覆盖澄清改写而不提示"]
        evidence_hints: ["命令输出", "用例页上传记录截图"]
      - id: SOP-201-P04
        polarity: positive
        title: 选取的用例都未变化时不登记任何记录
        actor: 开发会话
        priority: P1
        verify: cli
        initial_state: ["基线状态"]
        steps:
          - "记录用例页上传记录、decision list 与 task list"
          - "运行 put --from team-cases.yaml --case TC_TEAM_INVITE_003 --case TC_TEAM_CREATE_001 --by dev-a --reason \"核对\" --session <B>"
          - "再次查看上传记录、decision list 与 task list"
        expected:
          - "退出码为 0，两条都报告为未变化，并说明没有登记上传、决定或合并"
          - "上传记录、决定记录与任务列表与执行前相同"
        forbidden_effects: ["新增上传、决定或合并任务"]
        evidence_hints: ["命令输出", "前后对比"]
      - id: SOP-201-N01
        polarity: negative
        negative_type: invalid-input
        title: 不合格的按条增改被拒且不留记录
        actor: 开发会话
        priority: P0
        verify: cli
        initial_state: ["基线状态", "另有批次 empty-batch，没有任何用例上传"]
        steps:
          - "运行 put --from team-cases.yaml --case TC_TEAM_NOPE_001 --by dev-a --reason 核对 --session <B>"
          - "用 SOP-201-P01 的 amend-1.yaml 运行 put，省略 --by"
          - "用 amend-1.yaml 运行 put --by dev-a --reason \"\""
          - "把 amend-1.yaml 中 TC_TEAM_CREATE_001 的 expected_results 删去后运行 put --by dev-a --reason 核对"
          - "用 amend-1.yaml 运行 sop-board cases put demo-web empty-batch --from amend-1.yaml --by dev-a --reason 核对"
          - "查看上传记录、decision list、task list 与 status 中的批次"
        expected:
          - "五次都被拒，退出码非 0，原因分别是：编号不在文件中；缺少署名且没有默认业务确认人；缺少依据；用例缺少 expected_results 并给出行号；批次还没有用例且片段缺少 metadata"
          - "两个批次都没有新增上传、决定或合并任务"
        forbidden_effects: ["用会话标识或其他姓名代填署名", "登记任何部分结果"]
        evidence_hints: ["每次的命令与输出", "前后对比"]
      - id: SOP-201-N02
        polarity: negative
        negative_type: invalid-input
        title: 按条增改的上传不能写回原文件
        actor: 开发会话
        priority: P1
        verify: cli
        initial_state: ["SOP-201-P01 完成"]
        steps:
          - "记录 amend-1.yaml 与 team-cases.yaml 的 sha256"
          - "运行 export --upload <SOP-201-P01 的上传序号> --write-back"
        expected:
          - "被拒，说明这次上传没有记录原文件路径"
          - "两个文件的 sha256 不变"
        forbidden_effects: ["写入任何文件"]
        evidence_hints: ["命令输出", "sha256 前后对比"]

  - id: SOP-202
    title: 导出指定用例的当前内容
    actor: 开发会话
    entry: "命令行 sop-board cases export --case"
    must:
      - "按给出的顺序导出指定用例在看板中的当前内容（含合并澄清改写），导出文件可直接用于按条增改"
      - "不合格的导出被拒，不写文件"
    scenarios:
      - id: SOP-202-P01
        polarity: positive
        title: 导出指定用例，导出文件可再登记
        actor: 开发会话
        priority: P0
        verify: cli
        initial_state: ["SOP-201-P03 的前置状态（TC_TEAM_CREATE_002 经合并澄清改写）"]
        steps:
          - "运行 export --case TC_TEAM_CREATE_002 --case TC_TEAM_INVITE_001 --out sel.yaml"
          - "查看 sel.yaml"
          - "运行 put --from sel.yaml --by dev-a --reason 核对导出 --session <B>"
        expected:
          - "sel.yaml 只有这两条，顺序为 TC_TEAM_CREATE_002、TC_TEAM_INVITE_001；TC_TEAM_CREATE_002 为澄清改写后的内容；metadata 与上传 #1 相同"
          - "put 报告两条都未变化，不登记任何记录"
        forbidden_effects: ["导出其他用例"]
        evidence_hints: ["sel.yaml", "命令输出"]
      - id: SOP-202-N01
        polarity: negative
        negative_type: invalid-input
        title: 不合格的导出被拒，不写文件
        actor: 开发会话
        priority: P1
        verify: cli
        initial_state: ["基线状态", "当前目录已有文件 exist.yaml"]
        steps:
          - "运行 export --case TC_TEAM_NOPE_001 --out a.yaml"
          - "运行 export --case TC_TEAM_INVITE_001 --upload 1 --out b.yaml"
          - "运行 export --case TC_TEAM_INVITE_001 --write-back"
          - "运行 export --case TC_TEAM_INVITE_001 --out exist.yaml"
        expected:
          - "四次都被拒，退出码非 0，分别说明编号不存在、--case 不能与 --upload 同用、--case 不能与 --write-back 同用、不覆盖已有文件"
          - "a.yaml、b.yaml 不存在，exist.yaml 与 team-cases.yaml 不变"
        forbidden_effects: ["写入或覆盖任何文件"]
        evidence_hints: ["命令输出", "文件清单与 sha256"]

  - id: SOP-203
    title: 增量合并只判断变化的用例
    actor: 开发会话
    entry: "命令行 sop-board merge prepare/submit；任务目录 delta.json、judgment.json；合并页、场景页、用例页"
    must:
      - "上一轮合并已落地、之后只有用例新增或变化时，合并只需判断这些用例，其余判断由看板沿用，补齐后的完整判断按全量合并的同一套规则核对与组装"
      - "增量与全量在 prepare 输出、任务结果与合并页上可见，全量时写明原因"
      - "输出漏掉变化用例或沿用判断失效时拒收，不写入任何内容"
      - "会话要求全量、开发者在看板重新合并，或 SOP、入口声明、场景文件、待处理回复等其他输入变化时为全量"
    scenarios:
      - id: SOP-203-P01
        polarity: positive
        title: 会话增量合并只判断变化的用例
        actor: 开发会话
        priority: P0
        verify: cli
        initial_state:
          - "SOP-201-P01 完成：合并任务由会话 B 认领，尚未准备"
          - "已记录场景文件内容、场景页各场景的内容指纹与用例页的配对"
        steps:
          - "运行 prepare --session <B>，查看输出、任务目录的 delta.json 与 prompt.md"
          - "写 final.json：cases 只有 TC_TEAM_CREATE_001（流程）与 TC_TEAM_CREATE_003（流程，negative_type 为 duplicate），actor 为 Owner，verify 为 app"
          - "运行 submit --task <编号>"
          - "查看场景文件、场景页、用例页、本机与内网的合并页，以及任务目录的 judgment.json；从内网请求下载 judgment.json"
        expected:
          - "prepare 输出 mode 为增量，基线为基线合并的任务，changed_cases 恰为 TC_TEAM_CREATE_001 与 TC_TEAM_CREATE_003"
          - "delta.json 列出基线任务、这两条编号（TC_TEAM_CREATE_001 附基线时的内容）与沿用的判断；prompt.md 含增量说明"
          - "submit 成功；TC_TEAM_CREATE_001 场景的预期为新内容，新增 TC_TEAM_CREATE_003 场景"
          - "TC_TEAM_INVITE_001（含 TC_TEAM_INVITE_002 的细节预期）、TC_TEAM_INVITE_003、TC_TEAM_INVITE_004、TC_TEAM_CREATE_002 的场景内容与内容指纹不变"
          - "TC_TEAM_LIST_001 仍待补充，没有场景；合并结果仍列出它的业务缺口，问题原文不变"
          - "用例页中未变化用例的配对保留，两条新判断的用例有配对"
          - "本机与内网合并页的该任务都显示增量合并，判断 2 条变化用例，沿用 6 条；内网不显示路径与会话信息"
          - "judgment.json 含全部 8 条用例的判断；内网下载被拒"
        forbidden_effects: ["改动未变化用例的场景", "TC_TEAM_LIST_001 生成场景", "看板启动 Codex"]
        evidence_hints: ["prepare 输出", "delta.json、final.json、judgment.json", "场景文件前后 diff", "合并页与用例页截图"]
      - id: SOP-203-P02
        polarity: positive
        title: 变化波及的沿用判断须在输出中改正后才能落地
        actor: 开发会话
        priority: P0
        verify: cli
        initial_state: ["基线状态"]
        steps:
          - "写片段把 TC_TEAM_INVITE_001 改为字段核对：标题“邀请弹窗的初始状态”，步骤“点「邀请成员」”，预期“Email 字段为空，「发送邀请」不可点击”；运行 put --from <片段> --by dev-a --reason \"邀请弹窗初始状态\" --session <B>"
          - "运行 prepare --session <B>；写 final.json，cases 只有 TC_TEAM_INVITE_001，判为细节并入 TC_TEAM_INVITE_004；submit"
          - "在 final.json 的 cases 中加入 TC_TEAM_INVITE_002，判为细节并入 TC_TEAM_INVITE_004；再次 submit"
          - "查看场景文件与合并页"
        expected:
          - "第一次 submit 被拒，问题指出 TC_TEAM_INVITE_002 并入的不是本次的流程场景；场景文件、场景版本与配对不变"
          - "第二次 submit 成功：TC_TEAM_INVITE_001 不再有独立场景；TC_TEAM_INVITE_004 场景的预期含 [用例 TC_TEAM_INVITE_001] 与 [用例 TC_TEAM_INVITE_002] 的预期"
          - "合并页显示增量合并，判断 1 条变化用例，沿用 5 条（输出中给出的 TC_TEAM_INVITE_002 不计入沿用）"
        forbidden_effects: ["第一次提交写入任何内容"]
        evidence_hints: ["两次 submit 输出", "场景文件 diff", "合并页截图"]
      - id: SOP-203-P03
        polarity: positive
        title: 看板调度的 Codex 合并同样增量
        actor: 测试同事
        priority: P0
        verify: web
        initial_state: ["基线状态；看板以 --lan 启动，本机真实 Codex 可用"]
        steps:
          - "tester-a 用第二个浏览器经非回环地址打开用例页，上传 amend-web.yaml：metadata 同 team-cases.yaml，test_cases 只有 SOP-201-P01 中改写后的 TC_TEAM_CREATE_001 与新增的 TC_TEAM_CREATE_003"
          - "等待合并结束，查看合并页、场景文件与任务目录的 delta.json、final.json"
        expected:
          - "合并任务显示增量合并，判断 2 条变化用例，沿用 6 条；任务落地完成"
          - "TC_TEAM_CREATE_001 场景按新内容生成，新增 TC_TEAM_CREATE_003 场景；其余场景内容与内容指纹不变，TC_TEAM_LIST_001 仍待补充"
          - "记录 Codex 输出实际包含的用例条数"
        forbidden_effects: ["改动未变化用例的场景"]
        evidence_hints: ["合并页截图", "场景文件 diff", "任务目录文件"]
      - id: SOP-203-P04
        polarity: positive
        title: 沿用的缺口保持暂缓，改写缺口涉及的用例后重新判断
        actor: 开发会话
        priority: P0
        verify: cli
        initial_state: ["基线状态"]
        steps:
          - "写片段改写 TC_TEAM_CREATE_002 的预期为“提示团队名称必填，列表不变，创建按钮保持可点击”；put --by dev-a --reason 名称必填提示 --session <B>；prepare；final.json 只有 TC_TEAM_CREATE_002（流程）；submit"
          - "查看合并结果的缺口与用例页"
          - "写片段改写 TC_TEAM_LIST_001 的预期为“每页显示 10 条，共 2 页”；put --by dev-a --reason 每页 10 条 --session <B>；prepare，查看 changed_cases 与 delta.json；final.json 只有 TC_TEAM_LIST_001（流程）；submit"
          - "查看场景文件、用例页与批次概览"
        expected:
          - "第一次落地后，TC_TEAM_LIST_001 的业务缺口照样列出，问题原文不变，该用例仍待补充且没有场景"
          - "第二次 prepare 的 changed_cases 只有 TC_TEAM_LIST_001，delta.json 中沿用的缺口不包括它的旧缺口"
          - "第二次落地后 TC_TEAM_LIST_001 生成场景，预期为每页 10 条、共 2 页；批次不再有待补充用例"
        forbidden_effects: ["第一次落地时 TC_TEAM_LIST_001 生成场景"]
        evidence_hints: ["两次合并的结果与缺口", "delta.json", "场景文件 diff", "用例页截图"]
      - id: SOP-203-P05
        polarity: positive
        title: 会话要求全量或开发者重新合并时整批判断
        actor: 开发会话
        priority: P1
        verify: cli
        initial_state: ["SOP-201-P01 完成：合并任务由会话 B 认领，尚未准备；看板以 --lan 启动，本机真实 Codex 可用"]
        steps:
          - "运行 prepare --session <B> --full，查看输出与任务目录"
          - "写只有 TC_TEAM_CREATE_001、TC_TEAM_CREATE_003 两条的 final.json，submit"
          - "改写 final.json，给出全部 8 条用例的判断与三个节点、成员列表的反向豁免、TC_TEAM_LIST_001 的缺口，再次 submit"
          - "开发者在本机合并页点「重新合并」，等待任务结束，查看合并页"
        expected:
          - "prepare 输出 mode 为全量，原因为会话要求全量；任务目录没有 delta.json"
          - "只有两条的输出被拒，问题列出缺少的 6 条用例；完整输出成功落地"
          - "两次合并在合并页分别显示全量合并及原因：会话要求全量、开发者重新合并"
        forbidden_effects: ["只有两条的输出被补齐后落地"]
        evidence_hints: ["prepare 与 submit 输出", "任务目录文件清单", "合并页截图"]
      - id: SOP-203-P06
        polarity: positive
        title: 升级前落地的合并可作为增量的基线
        actor: 开发会话
        priority: P1
        verify: cli
        initial_state: ["用升级前的版本（main 的 c9d42ec 构建）在另一数据目录登记演示 Web 工作区并完成基线合并，之后改用被测版本，数据目录不变"]
        steps:
          - "写片段改写 TC_TEAM_CREATE_001（同 SOP-201-P01），put --by dev-a --reason 名称不截断 --session <B>"
          - "运行 prepare --session <B>，查看输出与 delta.json"
          - "写只有 TC_TEAM_CREATE_001 的 final.json，submit"
        expected:
          - "prepare 输出 mode 为增量，基线为升级前完成的合并任务，delta.json 中沿用的判断与该任务的 final.json 一致"
          - "submit 成功，TC_TEAM_CREATE_001 场景为新内容，其余场景内容与内容指纹不变"
        forbidden_effects: ["因缺少新版的判断记录而改为全量"]
        evidence_hints: ["prepare 输出", "delta.json 与旧任务 final.json 对比", "场景文件 diff"]
      - id: SOP-203-N01
        polarity: negative
        negative_type: incomplete-input
        title: 增量输出漏掉变化用例时拒收
        actor: 开发会话
        priority: P0
        verify: cli
        initial_state: ["SOP-201-P01 完成：合并任务由会话 B 认领，尚未准备"]
        steps:
          - "运行 prepare --session <B>；写 final.json，cases 只有 TC_TEAM_CREATE_003；submit"
          - "查看场景文件、场景版本与用例页"
          - "在同一 final.json 加入 TC_TEAM_CREATE_001 的判断后再次 submit"
        expected:
          - "第一次被拒，问题列出缺少变化用例 TC_TEAM_CREATE_001 的判断；场景文件、场景版本与配对不变"
          - "第二次在同一任务提交成功"
        forbidden_effects: ["用基线判断补齐变化用例"]
        evidence_hints: ["submit 输出", "场景文件与版本前后对比"]
      - id: SOP-203-N02
        polarity: negative
        negative_type: stale-input
        title: 通用答复、人工全量、入口变化或首次合并时写明全量原因
        actor: 开发会话
        priority: P0
        refs: ["docs/proposals/2026-11-04-session-board-friction.md D108、D109（方案 1）"]
        verify: cli
        initial_state: ["基线状态", "另有批次 fresh-batch，没有任何上传"]
        steps:
          - "运行 sop-board merge reply demo-web case-amend --gap none --text \"成员列表每页显示 10 条\" --author dev-a --session <B>，再 prepare --session <B>，查看输出与任务目录"
          - "恢复基线状态；在 web 仓场景文件中给 TC_TEAM_CREATE_002 场景的 steps 加一句并保存；等待扫描 30 秒，查看 status 与 task list；再明确运行 prepare --session <B> --full，查看重建提示"
          - "恢复基线状态；在数据目录 config.yaml 中改入口 app 的 operate 文字，按手册重新自检通过；用 amend-1.yaml 运行 put --by dev-a --reason 核对 --session <B>，再 prepare --session <B>"
          - "运行 sop-board cases upload demo-web fresh-batch team-cases.yaml --uploaded-by tester-a --session <B>，再 sop-board merge prepare demo-web fresh-batch --session <B>"
        expected:
          - "四次 prepare 的 mode 都是全量，原因分别为：存在 --gap none 的通用答复；会话明确要求全量；入口声明有变化；没有可沿用的上一轮合并"
          - "第二个分支手改只登记版本并出现 scenario-edited，30 秒内没有因此新增合并任务；明确 --full 后才准备全量，输出列出 TC_TEAM_CREATE_002 将按用例重建（D108）；具体缺口答复不再笼统按此场景判全量（D109，见 SOP-222）"
          - "四个任务目录都没有 delta.json"
        forbidden_effects: ["在四次已明确全量的准备中按增量沿用判断", "仅因场景手改自动排合并"]
        evidence_hints: ["每次 prepare 输出", "任务目录文件清单"]

  - id: SOP-204
    title: 工作区配置变化与看板启动不触发合并
    actor: 开发者
    entry: "数据目录 config.yaml；看板进程；命令行 sop-board task list、cases put、merge prepare/submit；合并页"
    must:
      - "看板启动、工作区配置变化都不给任何批次排合并"
      - "入口声明以外的配置变化不使进行中的合并待同步，也不使下一次合并改为全量"
      - "入口声明变化时，进行中的合并落地转待同步并说明原因，看板不自动重新合并"
    scenarios:
      - id: SOP-204-P01
        polarity: positive
        title: 改 snapshot_exclude 与重启看板都不排合并，之后按条增改仍为增量
        actor: 开发者
        priority: P0
        verify: cli
        initial_state: ["基线状态；看板以 --lan 启动，自动任务未暂停"]
        steps:
          - "记录 sop-board task list demo-web 中的合并任务"
          - "在数据目录 config.yaml 加入 snapshot_exclude: {web: [docs/test-cases]} 并保存，等待 30 秒，再次查看合并任务与看板日志"
          - "停止看板后按原命令重新启动，等待 30 秒，再次查看合并任务"
          - "用 SOP-201-P01 的 amend-1.yaml 运行 put --by dev-a --reason 名称不截断 --session <B>，再 prepare --session <B>"
        expected:
          - "改配置后与重启后，两个批次都没有新增合并任务，看板日志没有为批次排合并的记录"
          - "prepare 的 mode 为增量，基线为基线合并的任务"
        forbidden_effects: ["看板以“配置变化”或启动为由排合并或启动模型"]
        evidence_hints: ["前后 task list", "看板日志", "prepare 输出"]
      - id: SOP-204-P02
        polarity: positive
        title: 合并进行中改入口以外的配置，合并照常落地
        actor: 开发会话
        priority: P0
        verify: cli
        initial_state: ["SOP-201-P01 完成：合并任务由会话 B 认领，尚未准备"]
        steps:
          - "运行 prepare --session <B>，按 SOP-203-P01 写 final.json"
          - "在数据目录 config.yaml 加入 snapshot_exclude: {web: [docs/test-cases]} 并保存"
          - "运行 submit --task <编号>，查看任务状态、场景文件与 task list"
        expected:
          - "submit 成功落地，任务不是待同步；TC_TEAM_CREATE_001 与 TC_TEAM_CREATE_003 的场景按新判断写入"
          - "之后没有新增合并任务"
        forbidden_effects: ["因配置变化转待同步"]
        evidence_hints: ["submit 输出", "场景文件 diff", "task list"]
      - id: SOP-204-N01
        polarity: negative
        negative_type: stale-input
        title: 合并进行中改了入口声明时转待同步，看板不自动重新合并
        actor: 开发会话
        priority: P0
        verify: cli
        initial_state: ["SOP-201-P01 完成：合并任务由会话 B 认领，尚未准备；看板以 --lan 启动，自动任务未暂停"]
        steps:
          - "运行 prepare --session <B>，按 SOP-203-P01 写 final.json"
          - "在数据目录 config.yaml 中改入口 app 的 operate 文字并保存"
          - "运行 submit --task <编号>，查看任务状态、原因与场景文件；等待 30 秒后查看 task list"
        expected:
          - "提交不落地：这一会话任务作废（看板调度的合并为待同步），原因为入口声明变化，请重新合并；场景文件与场景版本不变"
          - "30 秒内没有新增合并任务"
        forbidden_effects: ["按旧入口声明落地", "看板自动排新的合并"]
        evidence_hints: ["submit 输出", "任务详情", "场景文件前后对比", "task list"]
