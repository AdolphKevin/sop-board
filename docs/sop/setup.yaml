          - "查看两边的 config.yaml（内容与文件权限）与 project.json"
          - "在这些地方查找 PW：两边设置页的页面源码、/api/settings 的响应、sop-board status --json 与 sop-board init <项目> --json 的输出、看板的启动输出，以及从内网地址打开的工作台页面与 /api/board 的响应"
