          - "B 测试连接后列出产品 demo：创建人 林甲、有结果的场景数 1、最近写入时间，并写明本机场景中有 1 条在该产品里已有结果；同时显示绑定后的提示（本机已有的结果不带入共享库）"
          - "加入后 B 的 status 中 shop#A 为通过；B 的看板 shop#A 历史写明产出机器为 A 的机器"
