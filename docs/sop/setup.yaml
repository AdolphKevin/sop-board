      - "没写 password 时照旧用 ~/.pgpass 或 PGPASSFILE；sop-board 不把那里的密码抄进 config.yaml"
      - "有 prepared 的工作或运行中的启动时，不能接入、改连接、换产品或断开"
      - "断开后业务记录回到本机库，共享库里的记录不删不搬；之后可以重新接入"
