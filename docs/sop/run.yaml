# v10 现行场景：运行的准备与提交、代码改动不改变场景状态、独立性三类、run launch 启动器
# 预期依据：docs/design.md（2026-11-10 blur.yin 批准）。版本 1 由未参与实现的审核方在实现前编写；实现与返工会话只读本文件。
#   版本 2 由未参与实现的审核方按 docs/design.md 已定决策 18（使用者 2026-11-11 决定）修订：RUN-02 由“产品变化后按影响判定保留通过”改为“代码改动不改变场景状态”，
#   新增 RUN-02-P02（执行期间的改动只作版本记录）与 RUN-02-N02（kept 不再接受）。
# 共用前置：演示项目同 setup.yaml 文件头（项目 demo，数据目录 $D，场景 shop#X/A/B/W，shop#X 被预埋缺陷打败）；
#   看板已以 sop-board serve demo --data $D --lan 启动；port_step 为 100，已有检出 wt1。
#   “执行者”指按 run 目录提示词经演示项目真实入口执行场景、写出结果的会话或测试者。
#   版本 3 由未参与实现的审核方按 docs/design.md 已定决策 22（使用者 2026-11-12 决定）修订：新增 RUN-05（未执行与受阻按性质划分、故障场景用 env stop 模拟并自动恢复）。
#   RUN-05 中的“库存演示项目”“只搭商城”与 stock#K、stock#S 见 environment.yaml 文件头。
#   版本 4 由未参与实现的审核方按 docs/design.md 已定决策 21（使用者 2026-11-12 决定）修订：RUN-01 的“按检出隔离”改为按分支归属；
#   新增 RUN-03-P02、RUN-03-N02（--implemented-by）与 RUN-06（共享库中断后重新提交只登记一次）。“双机项目”见 setup.yaml 文件头。
#   版本 5 由未参与实现的审核方按 docs/design.md 已定决策 23（使用者 2026-11-12 需求）修订：新增 RUN-07（分步实现时按情况决定验收时机、如实标注、统一验收的范围）。
#   版本 6 由未参与实现的审核方按2026-11-13 真实会话独立验收的发现修订（docs/design.md#独立性（取代交接仪式） 的“范围核对与启动结果”）：
#   新增 RUN-04-N02（范围不合格时 run launch 直接拒绝、不启动会话；场景所在文件不合格返回 scenario-file-invalid）与 RUN-04-N03（启动的会话没有产生运行）；
#   按使用者 2026-11-13 决定新增 RUN-04-N04（启动的会话准备了运行却没提交就退出）。
#   版本 7 按 docs/design.md 已定决策 28（使用者 2026-11-13 决定）修订，由起草该决策的会话在实现前写成：取消“同一检出同时只能有一个 prepared 的运行”，
#   改为按身份分开的多个运行（新增 RUN-01-P02，RUN-01-N01 改为 scenario-in-run 与 pending 跳过别的运行里的场景）。merchant2 见 browser.yaml 文件头。
#   版本 8 按决策 28 统一验收（2026-11-13）的结果、经使用者当日确认修订：RUN-01-N01 原起点让 R1 租下全部身份，wt1 再要身份必然 browser-busy，#   与“身份租约整机独占”矛盾；改为 R1 带 --identity merchant、wt1 带 --identity merchant2，预期不变。
#   版本 9 按 docs/design.md 已定决策 29（使用者 2026-11-14 决定）修订，由起草该决策的会话在实现前写成：新增 RUN-01-P03（同一会话重复准备返回同一个运行）、
#   RUN-01-N02（范围超出自己的运行）、RUN-04-N05（会话异常退出后接续）、RUN-04-N06（接续也异常退出后收尾）、RUN-05-N03（入口整体不可用时中止本轮）
#   与 RUN-08（修复中途不开始新的一轮）；RUN-01-N01 的报错写明准备运行的会话；RUN-04-N04 由“看板不替它放弃”改为看板自动放弃并登记待人处理，仍不自动提交。

metadata:
  requirement: "sop-board v10：会话经 CLI 准备并提交运行，结果按指纹登记，记录取证时的快照、产出机器、检出与分支；代码改动不改变场景状态，执行期间的改动只作版本记录；独立性分独立验收、实现者自检、未声明三类；run launch 由守护进程启动新会话作为独立执行；本机暂时不具备条件的场景记未执行、不改变状态，意外故障记受阻；需要依赖故障的场景用 env stop 模拟，提交时自动恢复；跨机器验收用 --implemented-by 声明实现者；共享库中断后重新提交只登记一次；分几步实现时，会话按情况决定每一步何时验收并如实标注，统一验收时把被后续步骤重做的已通过场景明确列入；同一检出可以有多个 prepared 的运行，按身份分开，pending 不重复取别的运行里的场景；同一会话重复准备返回同一个运行；执行会话异常退出时由看板接续一次，最终失败或留下未提交的运行时看板放弃运行并登记待人处理，不自动提交；另一会话的修复已改动代码而未提交时不开始新的一轮；入口整体不可用连续挡住两条场景时执行会话中止本轮"
  version: 9
  owner: "blur.yin"
  status: confirmed
  sources:
    - ref: "docs/design.md"
      version: "2026-11-10"
      confirmed_by: "blur.yin"
    - ref: "使用者 2026-11-10 对场景集待确认问题的答复"
      version: "2026-11-10"
      confirmed_by: "blur.yin"
    - ref: "docs/design.md 已定决策 18：验收范围由业务变化决定（代码改动不改变场景状态，删除保留通过与守护通过，守护是回归网）"
      version: "2026-11-11"
      confirmed_by: "blur.yin"
    - ref: "docs/design.md 已定决策 22：环境按产品来（未执行与受阻的分界、故障模拟与自动恢复）"
      version: "2026-11-12"
      confirmed_by: "blur.yin"
    - ref: "docs/design.md 已定决策 21：多人共享验收记录（结论按分支归属、跨机器的独立性、提交可重试）"
      version: "2026-11-12"
      confirmed_by: "blur.yin"
    - ref: "docs/design.md 已定决策 23：验收时机按情况决定"
      version: "2026-11-12"
      confirmed_by: "blur.yin"
    - ref: "docs/design.md 已定决策 28：一台机器一套环境，多个 Agent 轮流和并行使用（同一环境里按身份并行多个运行）"
      version: "2026-11-13"
      confirmed_by: "blur.yin"
    - ref: "docs/design.md 已定决策 29：无人值守加固（重复准备、启动接续与收尾、修复中途不开始新的一轮、入口不可用时中止本轮）"
      version: "2026-11-14"
      confirmed_by: "blur.yin"
  tags: ["run", "snapshot", "independence", "launcher", "not-executed", "fault", "parallel", "unattended"]

sops:
  - id: RUN-01
    title: 准备并提交一次运行
    actor: 执行会话
    entry: "sop-board run prepare --scope pending|all|F#ID… --session S、run submit --run N"
    must:
      - "结果绑定场景指纹与运行开始时的产品快照，记录产出机器、检出与分支；通过与失败按分支归属，受阻与跳过只影响产出它的检出"
      - "同一检出可以有多个 prepared 的运行，按身份分开：--identity 只为指定的身份取得浏览器租约，不写时取本轮 Web 入口的全部身份；身份租约整机独占"
      - "--scope pending 展开时跳过本检出其他 prepared 运行里的场景；明确指定的场景已在别的 prepared 运行里时返回 scenario-in-run，写明是哪个运行"
      - "同一会话对同一检出再次准备、范围是它已准备的运行的子集时，返回那个运行（resumed: true），不新建运行、不重新取身份、不重启环境；范围超出时返回 scenario-in-run，写明是本会话自己的运行与两条出路"
    scenarios:
      - id: RUN-01-P01
        polarity: positive
        title: 首次执行全部未执行场景，失败与通过各自登记
        actor: 执行会话
        priority: P0
        verify: cli
        initial_state: ["main 上 shop 的场景都是未执行", "draft-a（metadata.status: draft）在仓库中"]
        steps:
          - "在 main 运行 sop-board run prepare --scope pending --session S1，查看 runs/<编号>/ 目录"
          - "执行者经演示项目入口执行范围内的场景，按实际结果写出结果与证据"
          - "运行 sop-board run submit --run <编号> --implementer I1"
          - "运行 sop-board status --json，在工作台查看 shop#X 与 shop#A，在 main 运行 git status"
        expected:
          - "run 目录中的范围包含 shop 的全部场景，不含 draft-a 的场景，并记录产品快照"
          - "提交后 shop#X 为失败、shop#A 与 shop#B 为通过，结果带指纹与快照，证据可在工作台打开"
          - "运行状态变为 submitted"
          - "git status 无任何由看板产生的改动"
        forbidden_effects: ["看板改写场景文件", "登记范围以外的场景结果", "草稿场景进入执行"]
        refs: ["docs/design.md#核心概念（只有这些）", "docs/design.md#保留能力的简化形态"]
        evidence_hints: ["run 目录清单", "submit 输出", "results 表只读查询"]
      - id: RUN-01-P02
        polarity: positive
        title: 两个会话在同一检出分开身份同时执行，pending 不重复取场景；另一检出用第二个身份并行
        actor: 执行会话
        priority: P0
        verify: cli
        initial_state:
          - "演示项目 web 入口声明了 merchant 与 merchant2 两个合成测试账号；main 与 wt1 的环境都在运行"
          - "main 与 wt1 上 shop 的场景都是未执行；没有 prepared 的运行"
        steps:
          - "在 main 运行 sop-board run prepare --scope shop#W --identity merchant --session S1，得到运行 R1，读取 run.env"
          - "在 main 运行 sop-board run prepare --scope pending --session S2，得到运行 R2，查看 pending.json"
          - "在 wt1 运行 sop-board run prepare --scope shop#W --session S3 --json（不写 --identity）"
          - "在 wt1 运行 sop-board run prepare --scope shop#W --identity merchant2 --session S3，得到运行 R3，读取 run.env；用 ps 查看 CfT 进程"
          - "三位执行者同时执行各自范围内的场景，分别 run submit；在 main 与 wt1 运行 sop-board status --json"
        expected:
          - "R1 的 run.env 中 PW_IDENTITIES 只有 merchant"
          - "R2 的范围是 shop#X、shop#A、shop#B，不含 shop#W；R2 不持有任何浏览器租约"
          - "第 3 步以业务失败退出（退出码 1），错误为 browser-busy，写明 merchant 正被 main 的运行 R1 持有"
          - "R3 的 run.env 中 PW_IDENTITIES 只有 merchant2，endpoint 指向 merchant2 自己的浏览器，与 merchant 的浏览器不是同一个进程"
          - "三个运行都提交成功：main 的 shop#W 来自 R1，shop#X、shop#A、shop#B 来自 R2；wt1 的 shop#W 来自 R3"
        forbidden_effects:
          - "两个运行同时持有同一个身份"
          - "同一个场景同时出现在 R1 与 R2 的范围里"
          - "一个运行的提交覆盖或作废另一个运行"
          - "R3 的 run.env 列出 merchant"
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/design.md#浏览器代理（问题 5、6）", "docs/reference.md#5. 运行"]
        evidence_hints: ["三份运行目录的 pending.json、run.env（凭据脱敏）与 identities.json", "第 3 步的输出", "ps 输出", "两边的 status --json"]
      - id: RUN-01-P03
        polarity: positive
        title: 同一会话重复 run prepare 返回同一个运行，不新建运行、不重新取身份
        actor: 执行会话
        priority: P0
        verify: cli
        initial_state:
          - "main 的环境在运行，没有 prepared 的运行；shop#A、shop#W 未执行"
        steps:
          - "在 main 运行 sop-board run prepare --scope shop#A shop#W --identity merchant --session S1 --json，得到运行 R1；记录输出、运行目录的文件清单与修改时间、本机运行记录的行数、sop-board env status 的启动时间"
          - "原样再运行一次同一条命令"
          - "运行 sop-board run prepare --scope shop#A --session S1 --json，再运行 sop-board run prepare --scope pending --session S1 --json"
          - "查询本机运行记录的行数，运行 sop-board browser status 与 sop-board env status，查看 R1 的运行目录"
          - "执行者执行 shop#A、shop#W 并运行 sop-board run submit --run R1"
        expected:
          - "第 2、3 步的三次准备都成功：返回的 run 是 R1，directory、prompt、scope、identities 与第 1 步相同，并带 resumed: true"
          - "本机运行记录没有新增行；R1 的运行目录没有被重建，文件的修改时间不变"
          - "merchant 的持有者始终是 R1；环境的启动时间不变"
          - "提交成功，shop#A、shop#W 各登记一条结果"
        forbidden_effects: ["返回 scenario-in-run 或 nothing-to-run", "新建第二个运行或第二个运行目录", "重启环境或重新取得身份租约"]
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/reference.md#5. 运行"]
        evidence_hints: ["四次准备的输出", "本机运行记录只读查询", "运行目录清单与修改时间", "browser status 与 env status 输出", "submit 输出"]
      - id: RUN-01-N01
        polarity: negative
        negative_type: concurrency
        title: 指定的场景已在本检出另一个 prepared 运行里时返回 scenario-in-run，pending 跳过它们，别的检出不受影响
        actor: 执行会话
        priority: P1
        verify: cli
        initial_state: ["main 已运行 sop-board run prepare --scope all --identity merchant --session S1，得到运行 R1"]
        steps:
          - "在 main 运行 sop-board run prepare --scope shop#A --session S2 --json"
          - "在 main 运行 sop-board run prepare --scope pending --session S2 --json"
          - "在 wt1 运行 sop-board run prepare --scope all --identity merchant2 --session S3 --json"
        expected:
          - "第 1 条以业务失败退出（退出码 1），error_code 为 scenario-in-run，写明 shop#A 在运行 R1 里，以及 R1 由会话 S1 准备"
          - "第 2 条以业务失败退出，error_code 为 nothing-to-run：pending 跳过 R1 里的场景后范围为空"
          - "R1 仍为 prepared，范围与快照不变；main 没有新建运行"
          - "wt1 的 run prepare 成功"
        forbidden_effects: ["覆盖或作废 R1", "同一个场景同时出现在 main 的两个运行里", "wt1 被 main 的运行阻挡"]
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/design.md#数据库（格式 7）", "使用者 2026-11-10 对场景集待确认问题的答复 第 6 条"]
      - id: RUN-01-N02
        polarity: negative
        negative_type: concurrency
        title: 同一会话指定的范围超出它已准备的运行时返回 scenario-in-run，写明是自己的运行与两条出路
        actor: 执行会话
        priority: P1
        verify: cli
        initial_state: ["main 已运行 sop-board run prepare --scope shop#A --session S1，得到运行 R1；shop#B 未执行"]
        steps:
          - "在 main 运行 sop-board run prepare --scope shop#A shop#B --session S1 --json"
          - "查询本机运行记录"
        expected:
          - "以业务失败退出（退出码 1），error_code 为 scenario-in-run：写明 shop#A 在本会话自己准备的运行 R1 里，并给出两条出路（继续执行并 run submit，或 run abandon --run R1 后重新准备）"
          - "R1 仍为 prepared，范围不变；没有新建运行"
        forbidden_effects: ["把 R1 的范围扩大到 shop#B", "为 shop#B 另建一个运行", "作废或放弃 R1"]
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/reference.md#5. 运行"]

  - id: RUN-02
    title: 代码改动不改变场景状态
    actor: 执行会话
    entry: "sop-board status [--json]、run prepare --scope pending、run submit，工作台详情与历史"
    must:
      - "哪些场景需要执行由场景内容（指纹）决定：场景内容没变、最新结果为通过的场景，在产品代码提交或未提交改动后仍为通过，不进入 pending 范围"
      - "产品快照只记录每条结果取证时的代码版本；快照变化时 run prepare 照旧重启环境"
      - "执行期间变化的路径记在结果的 product_changed 上，只作版本记录，不影响状态、独立性、待沉淀与待人工复核"
      - "每个范围内场景都经真实入口实际执行；results.jsonl 的表外字段（包括 kept）不合格"
      - "运行中途场景文件被改时，只作废指纹变化的场景"
    scenarios:
      - id: RUN-02-P01
        polarity: positive
        title: 提交与未提交的代码改动后，已通过场景保持通过，pending 只含失败场景，run prepare 重启环境
        actor: 执行会话
        priority: P0
        verify: cli
        initial_state:
          - "main 上 shop#A、shop#B、shop#W 各有一条 Agent 独立验收通过（执行者 T1、实现者 I1），shop#X 为失败；没有守护，也没有人工标注"
          - "main 环境在运行，记录其进程号；运行 sop-board status --json，记录快照、counts、review_queue 与 distill_queue"
        steps:
          - "在 lib 的 refundlib/__init__.py 末尾加一行注释并提交；在 app 的 shop/server.py 末尾加一行注释，不提交"
          - "运行 sop-board status --json，在工作台查看 shop#A 与 shop#W 的状态、原因与徽标"
          - "运行 sop-board run prepare --scope pending --session S2，记录环境进程号，查看 run 目录的文件清单、pending.json 与 prompt.md"
        expected:
          - "status --json 的快照与改动前不同；counts、review_queue 与 distill_queue 与改动前相同；queues.retest 为空"
          - "shop#A、shop#B、shop#W 仍为通过，各自仍带“待人工复核”与“待沉淀”；状态原因中没有“产品已变化”“守护未覆盖”一类表述"
          - "run prepare 重启了环境（进程号变化）"
          - "pending.json 的范围只有 shop#X，原因为 failed；不含 shop#A、shop#B、shop#W"
          - "run 目录中没有 previous-results.json、changes.json，prompt.md 中没有影响判定、保留通过或 impact.json 的要求"
        forbidden_effects:
          - "代码改动使 shop#A、shop#B 或 shop#W 转为待复测，或失去“待人工复核”“待沉淀”"
          - "内容未变的已通过场景进入 pending 范围"
          - "run 目录出现 previous-results.json 或 changes.json，或要求写 impact.json"
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/design.md#场景状态（按检出推导，不存储）", "docs/reference.md#场景状态", "docs/reference.md#5. 运行", "docs/standard.md#业务变化与回归"]
        evidence_hints: ["改动前后的 status --json 输出", "git log 与 git status", "环境进程号记录", "run 目录清单、pending.json 与 prompt.md"]
      - id: RUN-02-P02
        polarity: positive
