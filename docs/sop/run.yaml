  - id: RUN-04
    title: run launch 启动独立执行会话
    actor: 协调会话
    entry: "sop-board run launch --scope …、run wait、launch status|stop"
    must:
      - "守护进程按 agents 配置启动无头 claude -p 或 codex exec，会话只拿到 prompt 文件"
      - "会话编号由启动器取得，启动记录就是独立性的证据"
      - "同一检出同时只运行一个启动"
      - "启动前按 run prepare 的同一套规则核对范围，不合格直接拒绝、不启动会话；会话退出时没有产生运行或留下未提交的运行，launch status 标出、run wait 以失败返回"
      - "run 类型的启动，会话进程以非零退出码结束且没有被 launch stop 停止时，看板 60 秒后在同一次启动下再起一个会话接续，最多一次；接续会话拿到同一个运行，已写的结果行保留；会话正常退出不接续"
      - "启动最终失败，或会话正常退出却留下 prepared 的运行时，看板放弃这些运行（释放身份租约、恢复停着的服务，运行目录保留）并登记一条待人处理；不自动提交结果"
    scenarios:
      - id: RUN-04-P01
        polarity: positive
        title: 协调会话用 run launch 启动 Claude 与 Codex 执行会话，结果带启动记录回到工作台
        actor: 协调会话
        priority: P0
        verify: agent
        initial_state: ["config.yaml 的 agents 先设为 claude", "main 没有运行中的启动", "shop#X、shop#A 有待执行内容"]
        steps:
          - "在 app 目录新开 Claude Code 会话（协调会话），请求“启动一个独立会话验收 shop#X 和 shop#A”"
          - "协调会话运行 sop-board run launch --scope shop#X shop#A，再运行 run wait"
          - "查看 launch status、launches 表与运行目录中的 prompt 文件，在工作台查看两条场景的历史"
          - "把 agents 改为 codex 后重复一次"
        expected:
          - "Claude 启动记录有进程号、日志、退出码，会话编号与 --session-id 一致；Codex 启动记录的会话编号来自 thread.started"
          - "新会话的输入只有 prompt 文件，结果的执行者为启动器取得的会话编号，与协调会话不同"
          - "两条场景的历史显示该运行与启动记录，以及独立性"
        forbidden_effects: ["协调会话自己写结果或修改执行会话的结果", "生成 handoff 交接文件", "执行会话沿用协调会话的会话编号"]
        refs: ["docs/design.md#独立性（取代交接仪式）", "docs/design.md#进程与入口", "docs/design.md#验证"]
        evidence_hints: ["协调会话记录", "启动日志", "launches 表只读查询", "工作台历史截图"]
      - id: RUN-04-N01
        polarity: negative
        negative_type: concurrency
        title: 同一检出已有运行中的启动时，第二次启动被拒绝
        actor: 协调会话
        priority: P1
        verify: cli
        initial_state: ["main 有一个 running 的启动 L1"]
        steps: ["在 main 运行 sop-board run launch --scope shop#B --json", "本机工作台对 shop#B 点“AI 重跑此场景”", "在 wt1 运行 sop-board run launch --scope shop#B --json"]
        expected:
          - "main 的两次请求都被拒绝，error_code 为 launch-running，写明运行中的 L1；launch status 只显示 L1"
          - "wt1 的启动成功"
        forbidden_effects: ["main 同时运行两个无头会话", "结束或替换 L1"]
        refs: ["docs/design.md#进程与入口", "docs/design.md#数据库（格式 7）", "使用者 2026-11-10 对场景集待确认问题的答复 第 6 条"]
      - id: RUN-04-N02
        polarity: negative
        negative_type: invalid-input
        title: 范围不合格时 run launch 直接拒绝，不启动会话；场景所在文件不合格时写明是文件的问题
        actor: 协调会话
        priority: P1
        verify: cli
        initial_state:
          - "main 没有运行中的启动，也没有 prepared 的运行；draft-a（metadata.status: draft）在仓库中"
          - "在 app 的场景目录另建一份不合格的场景文件 broken.yaml：一个节点、一条缺少 expected 的场景 BROKEN-1-P01"
          - "记录 launches 表的行数与当前的 claude、codex 进程"
        steps:
          - "在 main 运行 sop-board run launch --scope shop#NOPE-1 --json"
          - "运行 sop-board run launch --scope draft-a#DRAFT-A-1-P01 --json"
          - "运行 sop-board run launch --scope broken#BROKEN-1-P01 --json，再运行 sop-board run prepare --scope broken#BROKEN-1-P01 --session S1 --json"
          - "运行 sop-board launch status，查询 launches 表行数，用 ps 查看 claude、codex 进程"
          - "broken.yaml 仍在时运行 sop-board run prepare --scope pending --session S2 --json，查看运行目录的说明，然后 sop-board run abandon"
        expected:
          - "第一条以业务失败退出（退出码 1），error_code 为 scenario-not-found，写明 shop#NOPE-1"
          - "第二条以业务失败退出，error_code 为 draft-not-runnable"
          - "第三步的 run launch 与 run prepare 都以业务失败退出，error_code 为 scenario-file-invalid，列出 broken.yaml、缺少的字段与行号"
          - "三次 run launch 都没有启动会话：launches 表行数不变，launch status 没有新记录，没有新的 claude 或 codex 进程"
          - "--scope pending 的 run prepare 成功，范围是合格文件中的待执行场景；输出与运行目录说明列出未纳入的 broken.yaml 及其问题"
        forbidden_effects: ["先启动无头会话、到会话里才发现范围不合格", "把不合格文件中的场景报成 scenario-not-found"]
        refs: ["docs/design.md#独立性（取代交接仪式）"]
      - id: RUN-04-N03
        polarity: negative
        negative_type: interrupted
        title: 启动的会话没有产生运行就退出时，launch status 标为未产生运行，run wait 返回失败
        actor: 协调会话
        priority: P1
        verify: cli
        initial_state:
          - "main 没有运行中的启动，也没有 prepared 的运行；shop#A 有待执行内容"
          - "替代做法（代表“会话没有执行就结束”）：config.yaml 的 agents 为 claude，args 设为 [\"--tools\", \"Read\"]，启动的会话只能读文件、运行不了命令，正常结束而没有产生运行"
        steps:
          - "在 main 运行 sop-board run launch --scope shop#A，记下启动编号 L"
          - "运行 sop-board run wait，记录退出码与输出"
          - "运行 sop-board launch status --json，在工作台查看 shop#A"
        expected:
          - "run wait 以业务失败退出（退出码 1），写明 L 没有产生运行"
          - "launch status 中 L 标为未产生运行，附启动日志末尾"
          - "shop#A 没有新增结果，状态不变"
        forbidden_effects: ["L 显示为正常结束且没有任何提示", "run wait 以成功返回"]
        refs: ["docs/design.md#独立性（取代交接仪式）"]
      - id: RUN-04-N04
        polarity: negative
        negative_type: interrupted
        title: 启动的会话准备了运行却没有提交就正常退出时，run wait 返回失败，看板放弃该运行并登记待人处理
        actor: 协调会话
        priority: P1
        verify: cli
        initial_state:
          - "main 没有运行中的启动，也没有 prepared 的运行；shop#A 有待执行内容；没有未解决的待人处理"
          - "替代做法（代表“会话准备后没提交就结束”）：config.yaml 的 agents 为 claude，args 设为 [\"--permission-mode\", \"acceptEdits\", \"--allowedTools\", \"Read\", \"Bash(sop-board run prepare:*)\", \"Bash(sop-board status:*)\"]，启动的会话能准备运行，不能执行与提交；会话没能准备运行时本次作废，换用其他办法让会话在准备后结束并注明"
        steps:
          - "在 main 运行 sop-board run launch --scope shop#A，记下启动编号 L"
          - "运行 sop-board run wait，记录退出码与输出"
          - "运行 sop-board launch status --json 与 sop-board attention list，查询本机运行记录，查看该运行的目录，在工作台查看 shop#A"
        expected:
          - "run wait 以业务失败退出（退出码 1），error_code 为 launch-unsubmitted，写明未提交的运行编号，以及它已由看板放弃"
          - "launch status 中 L 只有一次尝试（正常退出不接续），写明该运行未提交，附启动日志末尾"
          - "该运行为 abandoned，运行目录仍在；待人处理新增一条环境问题，写明启动 L、该运行与 shop#A"
          - "shop#A 没有新增结果，状态不变"
        forbidden_effects: ["run wait 以成功返回", "看板自动提交该运行的结果", "该运行停在 prepared", "正常退出的会话被接续"]
        refs: ["docs/design.md#独立性（取代交接仪式）"]
      - id: RUN-04-N05
        polarity: negative
        negative_type: interrupted
        title: 执行会话中途异常退出，看板 60 秒后接续一次，同一个运行完成并提交
        actor: 协调会话
        priority: P0
        verify: cli
        initial_state:
          - "main 没有运行中的启动，也没有 prepared 的运行；shop#A、shop#B、shop#W 未执行；config.yaml 的 agents 为 claude"
          - "替代做法（代表“会话异常退出”）：用 kill -9 结束 launch status 给出的会话进程"
        steps:
          - "在 main 运行 sop-board run launch --scope shop#A shop#B shop#W，记下启动编号 L；另开终端运行 sop-board run wait --launch L --timeout 0"
          - "等这次启动的运行 R 的 results.jsonl 出现第一行后，用 kill -9 结束 launch status 中 L 的会话进程，记下已写入的行"
          - "此后 60 秒内运行 sop-board launch status --json 与 sop-board browser status"
          - "等 run wait 返回，记录退出码与输出"
          - "查看 launch status --json、启动目录（attempts.json、两份日志与提示词）、本机运行记录与 R 的 results.jsonl，只读查询 results 表，在工作台查看三条场景的历史"
        expected:
          - "会话被结束后 L 仍为 running，R 仍为 prepared 并持有 merchant；约 60 秒后 L 下出现第二次尝试：会话编号与第一次不同，日志另存一份"
          - "第二次尝试的提示词含接续段：上一个会话的结束时间与退出码、运行 R 的编号与目录"
          - "接续会话没有新建运行，本机只有 R 一个运行；被结束前已写入的结果行原样保留"
          - "run wait 以成功返回；输出与 launch status 的 attempts 列出两次尝试，第一次的退出码非零"
          - "三条场景各登记一条结果；结果的执行者是接续会话，提交输出列出先后两个会话；独立性与没有中断时相同"
        forbidden_effects:
          - "第一次异常退出后 L 直接记为 failed，run wait 提前以失败返回"
          - "接续会话新建第二个运行，或重做已写入结果行的场景"
          - "同一条场景登记两条结果"
          - "出现第三次尝试"
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/reference.md#launch / wait"]
        evidence_hints: ["run wait 输出", "launch status --json 的 attempts", "启动目录清单、attempts.json 与两份提示词", "results.jsonl 在结束会话前后的内容", "results 表只读查询", "工作台历史截图"]
      - id: RUN-04-N06
        polarity: negative
        negative_type: interrupted
        title: 接续的会话也异常退出时，启动记为失败，看板放弃运行、释放身份并登记待人处理
        actor: 协调会话
        priority: P0
        verify: cli
        initial_state:
          - "main 没有运行中的启动，也没有 prepared 的运行；shop#A、shop#W 未执行；没有未解决的待人处理；config.yaml 的 agents 为 claude"
          - "替代做法（代表“会话异常退出”）：用 kill -9 结束 launch status 给出的会话进程"
        steps:
          - "在 main 运行 sop-board run launch --scope shop#A shop#W，记下启动编号 L；另开终端运行 sop-board run wait --launch L --timeout 0"
          - "运行 R 准备好之后，用 kill -9 结束第一次尝试的会话进程；第二次尝试的会话启动后同样结束它"
          - "等 run wait 返回，记录退出码与输出；再过 2 分钟运行 sop-board launch status --json"
          - "运行 sop-board attention list、sop-board browser status 与 sop-board status --json，查询本机运行记录，查看 R 的运行目录"
          - "在 main 运行 sop-board run launch --scope shop#W，再运行 sop-board run wait"
        expected:
          - "run wait 以业务失败退出（退出码 1），error_code 为 launch-failed，写明运行 R 已由看板放弃，attempts 列出两次尝试"
          - "L 为 failed，没有第三次尝试"
          - "R 为 abandoned，merchant 不再被任何运行持有；R 的运行目录、已写的结果行与证据都还在"
          - "待人处理新增一条环境问题：写明启动 L 接续一次后仍异常退出、运行 R 已由看板放弃、shop#A 与 shop#W，以及日志末尾一行；文字里没有本机路径"
          - "shop#A、shop#W 没有新增结果，状态不变，仍在 pending 范围"
          - "第 5 步的启动直接成功，不返回 browser-busy 或 scenario-in-run"
        forbidden_effects: ["R 停在 prepared、继续占着 merchant", "看板把 R 里已写的结果行登记为结果", "删除 R 的运行目录", "出现第三次尝试"]
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/reference.md#launch / wait"]
        evidence_hints: ["run wait 输出", "launch status --json", "attention list 输出", "browser status 输出", "本机运行记录只读查询", "R 的运行目录清单"]

  - id: RUN-05
    title: 未执行与受阻按性质划分，故障场景用 env stop 模拟
    actor: 执行会话
    entry: "sop-board run prepare/submit、env stop|start <服务>、env status、attention add；运行目录的提示词与服务清单；工作台场景详情"
    must:
      - "未执行是本机暂时不具备、补齐或换一台机器就能执行的情况：场景需要的服务本机未搭建或被人为停着；缺少入口声明的凭据变量；等人处理的事（真实账号登录、人机验证、只发到本人设备的验证码、身份使用次数到上限，照旧登记待人处理）"
      - "未执行不登记结果，不改变场景状态；场景详情显示最近一次未执行的情况：谁、什么时候、缺什么"
      - "受阻是意外故障或全队都不具备的能力：服务或浏览器异常退出（不论发生在开始前还是执行中，附日志末尾并登记待人处理）；前置数据准备失败、证据丢失、运行作废；入口或观察能力还没建设；需要停外部共享中间件的故障场景"
      - "场景起点要求某个依赖故障时，执行会话用 sop-board env stop|start <服务> 停启，不直接结束进程或改动环境；结果详情显示“执行时 <服务> 已停止”；run submit 时还停着的服务自动恢复并记录"
      - "同一个入口对任何操作都失败、连续挡住 2 条场景时，执行会话中止这个入口的其余场景：前 2 条记受阻，其余写未执行并写明本轮中止，登记一条环境问题，照常提交"
    scenarios:
      - id: RUN-05-P01
        polarity: positive
        title: 只搭商城时，执行会话把依赖库存的场景记未执行，其余场景照常执行
        actor: 执行会话
        priority: P0
        verify: agent
        initial_state:
          - "库存演示项目处于“只搭商城”，环境在运行：shop 为运行中，stock 为本机未搭建；stock#K 与 shop#A 都是未执行"
          - "config.yaml 的 agents 设为 claude；没有未解决的待人处理"
        steps:
          - "在 app 目录新开 Claude Code 会话，请求“验收 stock#K 和 shop#A 并提交结果”"
          - "会话运行 run prepare --scope stock#K shop#A，按运行目录的提示词与服务清单执行并 run submit；会话提问时只回答“按项目规则处理”"
          - "查看 submit 输出与运行目录的 results.jsonl，运行 sop-board status --json，在工作台打开 stock#K 与 shop#A；只读查询 results 表"
          - "在另一份同样状态的项目中对 Codex 会话重复一次"
        expected:
          - "results.jsonl 中 stock#K 一行为 not-executed，finding 写明库存服务本机未搭建；shop#A 一行为 pass 并带证据"
          - "submit 成功：shop#A 登记为通过；未执行清单列出 stock#K 及原因；results 表中没有 stock#K 的结果行"
          - "stock#K 的状态仍为未执行，仍在 pending 范围；场景详情显示最近一次未执行：操作者、时间与原因"
          - "会话记录中没有启动库存服务、登记仓库或修改配置的操作"
        forbidden_effects:
          - "stock#K 记为受阻、失败或通过"
          - "会话因为 stock 没在运行而放弃整轮，不执行 shop#A"
          - "会话自行启动库存服务、登记 stock 仓库或修改 config.yaml"
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/standard.md#首次执行与人工复核"]
        evidence_hints: ["会话记录导出", "results.jsonl 与 submit 输出", "status --json 输出", "工作台 stock#K 详情截图", "results 表只读查询"]
      - id: RUN-05-P02
        polarity: positive
        title: 缺少凭据变量的场景记未执行，已有的通过保持不变，内网不显示变量名
        actor: 执行会话
        priority: P1
        verify: cli
        initial_state:
          - "演示项目（setup.yaml 文件头）main 上 shop#W 有一条 Agent 独立验收通过，带“待人工复核”与“待沉淀”；运行 sop-board status --json 记录 counts"
          - "执行者的环境中没有 web 入口声明的凭据变量 DEMO_MERCHANT_PASSWORD；merchant 的 profile 没有登录态"
        steps:
          - "运行 sop-board run prepare --scope shop#W --session S1，阅读运行目录的提示词"
          - "执行者按提示词在 results.jsonl 写一行 {\"scenario\": \"shop#W\", \"status\": \"not-executed\", \"finding\": \"缺少凭据变量 DEMO_MERCHANT_PASSWORD\"}，运行 sop-board run submit --run <编号> --json"
          - "运行 sop-board status --json；本机与内网设备分别打开工作台的 shop#W；只读查询 results 表"
        expected:
          - "提示词写明：缺少入口声明的凭据变量时写 not-executed，finding 只写变量名"
          - "submit 成功，未执行清单列出 shop#W 及原因；results 表没有新增 shop#W 的结果行"
          - "shop#W 仍为通过，仍带“待人工复核”与“待沉淀”；status --json 的 counts 与提交前相同"
          - "本机的 shop#W 详情显示最近一次未执行：操作者、时间与“缺少凭据变量 DEMO_MERCHANT_PASSWORD”"
          - "内网的 shop#W 详情同样显示这次未执行的人与时间，但不出现变量名 DEMO_MERCHANT_PASSWORD"
        forbidden_effects:
          - "这次未执行使 shop#W 离开通过，或失去“待人工复核”“待沉淀”"
          - "未执行被登记成受阻或跳过的结果"
          - "变量名出现在内网页面或接口，或凭据取值出现在任何输出中"
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/standard.md#测试账号"]
        evidence_hints: ["提示词原文", "results.jsonl 与 submit 输出", "提交前后的 status --json", "本机与内网的 shop#W 详情截图与接口响应", "results 表只读查询"]
      - id: RUN-05-P03
        polarity: positive
        title: 执行会话用 env stop 停掉库存服务验证降级提示，结果注明执行时库存服务已停止，提交后自动恢复
        actor: 执行会话
        priority: P0
        verify: agent
        initial_state:
          - "库存演示项目（三个仓库都已登记）的环境在运行，shop 与 stock 都是运行中；记录商城进程号；stock#S 未执行"
          - "config.yaml 的 agents 设为 claude"
        steps:
          - "在 app 目录新开 Claude Code 会话，请求“验收 stock#S 并提交结果”"
          - "会话运行 run prepare --scope stock#S，按场景起点处理库存服务后经商城入口执行，写出结果并 run submit"
          - "提交后运行 sop-board env status --json，curl 库存服务地址；在工作台打开 stock#S 的结果详情；查看运行的停启记录与会话记录"
          - "在另一份同样状态的项目中对 Codex 会话重复一次"
        expected:
          - "会话记录中先运行 sop-board env stop stock，再执行 stock#S"
          - "stock#S 登记为通过，证据中有下单接口返回的降级提示“库存服务暂不可用，请稍后再试”，并核对了没有生成订单"
          - "结果详情显示“执行时 stock（库存查询与扣减）已停止”"
          - "运行的停启记录有停止 stock 一条，带操作者与时间，停着期间执行的场景为 stock#S；提交时库存服务还停着的，另有一条自动恢复的记录"
          - "提交后 env status 中 stock 为运行中，库存服务地址应答；商城进程号不变"
        forbidden_effects:
          - "会话用 kill、pkill 等方式直接结束库存服务进程"
          - "会话修改 config.yaml、adapter 脚本或产品代码来让库存不可用"
          - "提交后库存服务仍停着"
          - "停启库存服务时商城被重启"
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/design.md#检出与环境（问题 3）"]
        evidence_hints: ["会话记录导出", "下单接口的请求响应与订单查询", "工作台 stock#S 结果详情截图", "运行停启记录的只读查询", "提交后的 env status 与 curl 响应"]
      - id: RUN-05-N01
        polarity: negative
        negative_type: interrupted
        title: 执行中库存服务异常退出，场景记受阻并附日志，不记未执行
        actor: 执行会话
        priority: P0
        verify: cli
        initial_state:
          - "库存演示项目（三个仓库都已登记）的环境在运行，shop 与 stock 都是运行中；stock#K 未执行；没有未解决的待人处理"
        steps:
          - "运行 sop-board run prepare --scope stock#K --session S1，阅读运行目录的提示词"
          - "执行者开始执行 stock#K；在下单之前，测试者用 kill -9 结束库存服务进程（不经 sop-board）"
          - "执行者下单失败后运行 sop-board env status --json，按提示词写出结果，运行 sop-board attention add 登记，再运行 sop-board run submit --run <编号> --json"
          - "在工作台打开 stock#K，运行 sop-board attention list 与 sop-board status --json"
        expected:
          - "提示词写明：服务异常退出记 blocked，finding 附日志末尾，并登记待人处理"
          - "env status 中 stock 为异常退出并给出日志路径"
          - "stock#K 的结果为受阻，finding 写明库存服务异常退出并附日志末尾；submit 输出列出运行期间异常退出的服务 stock"
          - "工作台 stock#K 显示受阻及原因；attention list 有对应的一条待人处理"
        forbidden_effects:
          - "stock#K 记为未执行、失败或通过"
          - "异常退出被当作人为停止：结果详情显示“执行时 stock 已停止”"
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/standard.md#首次执行与人工复核"]
        evidence_hints: ["提示词原文", "kill 前后的 ps 输出", "env status 输出与库存服务日志", "results.jsonl 与 submit 输出", "工作台截图", "attention list 输出"]
      - id: RUN-05-N02
        polarity: negative
        negative_type: interrupted
        title: 库存服务启动时就异常退出，依赖它的场景同样记受阻
        actor: 执行会话
        priority: P1
        verify: cli
        initial_state:
          - "库存演示项目（三个仓库都已登记）的环境没有运行；启动守护进程的环境中设有 DEMO_STOCK_CRASH=1"
          - "stock#K 未执行"
        steps:
          - "运行 sop-board run prepare --scope stock#K --session S1 --json，查看运行目录的服务清单"
          - "执行者按提示词写出 stock#K 的结果，运行 sop-board run submit --run <编号> --json"
          - "在工作台打开 stock#K"
        expected:
