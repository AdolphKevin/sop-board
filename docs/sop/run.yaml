# v10 现行场景：运行的准备与提交、代码改动不改变场景状态、独立性三类、run launch 启动器
# 预期依据：docs/design.md（2026-11-10 blur.yin 批准）。版本 1 由未参与实现的审核方在实现前编写；实现与返工会话只读本文件。
#   版本 2 由未参与实现的审核方按 docs/design.md 已定决策 18（使用者 2026-11-11 决定）修订：RUN-02 由“产品变化后按影响判定保留通过”改为“代码改动不改变场景状态”，
#   新增 RUN-02-P02（执行期间的改动只作版本记录）与 RUN-02-N02（kept 不再接受）。
# 共用前置：演示项目同 setup.yaml 文件头（项目 demo，数据目录 $D，场景 shop#X/A/B/W，shop#X 被预埋缺陷打败）；
#   看板已以 sop-board serve demo --data $D --lan 启动；port_step 为 100，已有检出 wt1。
#   “执行者”指按 run 目录提示词经演示项目真实入口执行场景、写出结果的会话或测试者。

metadata:
  requirement: "sop-board v10：会话经 CLI 准备并提交运行，结果按 检出、指纹 登记并记录取证时的快照；代码改动不改变场景状态，执行期间的改动只作版本记录；独立性分独立验收、实现者自检、未声明三类；run launch 由守护进程启动新会话作为独立执行"
  version: 2
  owner: "blur.yin"
  status: confirmed
  sources:
    - ref: "docs/design.md"
      version: "2026-11-10"
      confirmed_by: "blur.yin"
    - ref: "使用者 2026-11-10 对场景集待确认问题的答复"
      version: "2026-11-10"
      confirmed_by: "blur.yin"
    - ref: "docs/design.md 已定决策 18：验收范围由业务变化决定（代码改动不改变场景状态，删除保留通过与守护通过，守护是回归网）"
      version: "2026-11-11"
      confirmed_by: "blur.yin"
  tags: ["run", "snapshot", "independence", "launcher"]

sops:
  - id: RUN-01
    title: 准备并提交一次运行
    actor: 执行会话
    entry: "sop-board run prepare --scope pending|all|F#ID… --session S、run submit --run N"
    must:
      - "结果绑定场景指纹与运行开始时的产品快照，按检出隔离"
      - "同一检出同时只能有一个 prepared 的运行"
    scenarios:
      - id: RUN-01-P01
        polarity: positive
        title: 首次执行全部未执行场景，失败与通过各自登记
        actor: 执行会话
        priority: P0
        verify: cli
        initial_state: ["main 上 shop 的场景都是未执行", "draft-a（metadata.status: draft）在仓库中"]
        steps:
          - "在 main 运行 sop-board run prepare --scope pending --session S1，查看 runs/<编号>/ 目录"
          - "执行者经演示项目入口执行范围内的场景，按实际结果写出结果与证据"
          - "运行 sop-board run submit --run <编号> --implementer I1"
          - "运行 sop-board status --json，在工作台查看 shop#X 与 shop#A，在 main 运行 git status"
        expected:
          - "run 目录中的范围包含 shop 的全部场景，不含 draft-a 的场景，并记录产品快照"
          - "提交后 shop#X 为失败、shop#A 与 shop#B 为通过，结果带指纹与快照，证据可在工作台打开"
          - "运行状态变为 submitted"
          - "git status 无任何由看板产生的改动"
        forbidden_effects: ["看板改写场景文件", "登记范围以外的场景结果", "草稿场景进入执行"]
        refs: ["docs/design.md#核心概念（只有这些）", "docs/design.md#保留能力的简化形态"]
        evidence_hints: ["run 目录清单", "submit 输出", "results 表只读查询"]
      - id: RUN-01-N01
        polarity: negative
        negative_type: concurrency
        title: 同一检出已有 prepared 运行时不能再准备，其他检出不受影响
        actor: 执行会话
        priority: P1
        verify: cli
        initial_state: ["main 已有 prepared 运行 R1"]
        steps: ["在 main 运行 sop-board run prepare --scope all --session S2 --json", "在 wt1 运行 sop-board run prepare --scope all --session S3 --json"]
        expected:
          - "main 的命令以业务失败退出（退出码 1），error_code 为 run-prepared，写明已有运行 R1"
          - "R1 仍为 prepared，范围与快照不变"
          - "wt1 的 run prepare 成功"
        forbidden_effects: ["覆盖或作废 R1", "wt1 被 main 的运行阻挡"]
        refs: ["docs/design.md#数据库（格式 6，board.sqlite3）", "使用者 2026-11-10 对场景集待确认问题的答复 第 6 条"]

  - id: RUN-02
    title: 代码改动不改变场景状态
    actor: 执行会话
    entry: "sop-board status [--json]、run prepare --scope pending、run submit，工作台详情与历史"
    must:
      - "哪些场景需要执行由场景内容（指纹）决定：场景内容没变、最新结果为通过的场景，在产品代码提交或未提交改动后仍为通过，不进入 pending 范围"
      - "产品快照只记录每条结果取证时的代码版本；快照变化时 run prepare 照旧重启环境"
      - "执行期间变化的路径记在结果的 product_changed 上，只作版本记录，不影响状态、独立性、待沉淀与待人工复核"
      - "每个范围内场景都经真实入口实际执行；results.jsonl 的表外字段（包括 kept）不合格"
      - "运行中途场景文件被改时，只作废指纹变化的场景"
    scenarios:
      - id: RUN-02-P01
        polarity: positive
        title: 提交与未提交的代码改动后，已通过场景保持通过，pending 只含失败场景，run prepare 重启环境
        actor: 执行会话
        priority: P0
        verify: cli
        initial_state:
          - "main 上 shop#A、shop#B、shop#W 各有一条 Agent 独立验收通过（执行者 T1、实现者 I1），shop#X 为失败；没有守护，也没有人工标注"
          - "main 环境在运行，记录其进程号；运行 sop-board status --json，记录快照、counts、review_queue 与 distill_queue"
        steps:
          - "在 lib 的 refundlib/__init__.py 末尾加一行注释并提交；在 app 的 shop/server.py 末尾加一行注释，不提交"
          - "运行 sop-board status --json，在工作台查看 shop#A 与 shop#W 的状态、原因与徽标"
          - "运行 sop-board run prepare --scope pending --session S2，记录环境进程号，查看 run 目录的文件清单、pending.json 与 prompt.md"
        expected:
          - "status --json 的快照与改动前不同；counts、review_queue 与 distill_queue 与改动前相同；queues.retest 为空"
          - "shop#A、shop#B、shop#W 仍为通过，各自仍带“待人工复核”与“待沉淀”；状态原因中没有“产品已变化”“守护未覆盖”一类表述"
          - "run prepare 重启了环境（进程号变化）"
          - "pending.json 的范围只有 shop#X，原因为 failed；不含 shop#A、shop#B、shop#W"
          - "run 目录中没有 previous-results.json、changes.json，prompt.md 中没有影响判定、保留通过或 impact.json 的要求"
        forbidden_effects:
          - "代码改动使 shop#A、shop#B 或 shop#W 转为待复测，或失去“待人工复核”“待沉淀”"
          - "内容未变的已通过场景进入 pending 范围"
          - "run 目录出现 previous-results.json 或 changes.json，或要求写 impact.json"
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/design.md#场景状态（按检出推导，不存储）", "docs/reference.md#场景状态", "docs/reference.md#5. 运行", "docs/standard.md#业务变化与回归"]
        evidence_hints: ["改动前后的 status --json 输出", "git log 与 git status", "环境进程号记录", "run 目录清单、pending.json 与 prompt.md"]
      - id: RUN-02-P02
        polarity: positive
        title: 执行期间产品有变化的通过照常是独立通过，变化的路径只作版本记录
        actor: 执行会话
        priority: P1
        verify: cli
        initial_state: ["main 上 shop#B 未执行", "main 没有 prepared 运行", "运行 sop-board status --json，记录 review、distill 与 stats 中复核覆盖的分母"]
        steps:
          - "运行 sop-board run prepare --scope shop#B --session T1"
          - "执行者经演示项目入口执行 shop#B；执行期间在 lib 的 refundlib/__init__.py 末尾加一行注释并提交"
          - "执行者按实际结果写出 shop#B 的通过结果与证据，运行 sop-board run submit --run <编号> --implementer I1"
          - "运行 sop-board status --json，GET /api/board，在工作台查看 shop#B 的状态、徽标与历史；只读查询 results 表中这条结果"
        expected:
          - "submit 输出的 product_changed 列出 lib 的 refundlib/__init__.py，independence 为独立验收"
          - "results 表中这条结果的 product_changed 记有该路径，快照为 run prepare 时的快照"
          - "shop#B 为通过，带“待沉淀”与“待人工复核”；历史中这条结果的独立性为独立验收"
          - "status --json 的 review 与 distill 各比执行前多 1，review_queue 与 distill_queue 包含 shop#B；/api/board 中 stats.agent_review_coverage 的 denominator 比执行前多 1"
        forbidden_effects: ["shop#B 显示为待复测", "这条通过不计为独立通过，或不进入待沉淀、待人工复核与确认率样本"]
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/reference.md#场景状态", "docs/reference.md#5. 运行", "docs/reference.md#10. 报告与看板页面"]
        evidence_hints: ["执行期间的 git log", "submit 输出", "status --json 与 /api/board 前后对照", "results 表只读查询"]
      - id: RUN-02-N01
        polarity: negative
        negative_type: stale-input
        title: 运行中途改了一条场景，只作废这一条
        actor: 执行会话
        priority: P1
        verify: cli
        initial_state: ["main 已 run prepare，范围为 shop#A 与 shop#B"]
        steps:
          - "执行期间把 shop 文件中 shop#A 的一条 expected 改写并保存"
          - "执行者写出 shop#A 与 shop#B 的通过结果并 run submit"
          - "运行 sop-board status --json"
        expected:
          - "shop#B 的结果登记成功"
          - "shop#A 的结果没有登记，提交输出列出它因指纹变化被作废"
          - "shop#A 按新指纹显示为未执行"
        forbidden_effects: ["shop#A 的结果被登记到新指纹上", "整轮运行被作废"]
        refs: ["docs/design.md#实施阶段（同一分支，每个阶段结束时包都能导入，CLI 可用）", "docs/design.md#核心概念（只有这些）"]
      - id: RUN-02-N02
        polarity: negative
        negative_type: invalid-input
        title: 结果行声明保留旧通过（kept）时提交被拒绝，不复制旧证据
        actor: 执行会话
        priority: P1
        verify: cli
        initial_state: ["main 上 shop#A 有一条带证据的独立通过", "main 已运行 sop-board run prepare --scope shop#A shop#B --session S3，得到运行 R"]
        steps:
          - "执行者经演示项目入口实际执行 shop#B 并写出通过结果与证据；shop#A 不执行，写一行 {\"scenario\": \"shop#A\", \"status\": \"pass\", \"kept\": true, \"actual\": \"沿用上次通过\", \"executed_at\": <当前时间>, \"evidence\": [], \"note\": \"改动不影响退款接口\"}"
          - "运行 sop-board run submit --run R --json"
          - "只读查询 results 表中运行 R 的结果与带 reused_from 的行"
        expected:
          - "submit 以业务失败退出（退出码 1），problems 指出 shop#A 一行的 kept 是不接受的字段"
          - "本次提交不登记任何结果：results 表中没有运行 R 的结果（shop#A 与 shop#B 都没有），也没有新增带 reused_from 的行；运行 R 仍为 prepared"
        forbidden_effects: ["shop#A 不经实际执行就登记为通过", "复制 shop#A 此前的证据作为本运行的证据"]
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/reference.md#5. 运行"]
        evidence_hints: ["results.jsonl 原文", "submit 输出", "results 表只读查询"]

  - id: RUN-03
    title: 独立性按执行者与实现者分三类
    actor: 执行会话
    entry: "sop-board run prepare [--session S]、run submit [--implementer X]，工作台历史"
    must:
      - "执行者取自 CODEX_THREAD_ID 或 SOP_BOARD_SESSION，取不到就要求 --session"
      - "实现者与执行者不同为独立验收，相同为实现者自检，未声明为未声明；独立性只在历史中显示"
    scenarios:
      - id: RUN-03-P01
        polarity: positive
        title: 三次运行分别登记为独立验收、实现者自检与未声明
        actor: 执行会话
        priority: P1
        verify: cli
        initial_state: ["main 没有 prepared 运行"]
        steps:
          - "设置 CODEX_THREAD_ID=T1，不带 --session 运行 run prepare --scope shop#A；执行后 run submit --implementer I1"
          - "运行 run prepare --scope shop#B --session T2；执行后 run submit --implementer T2"
          - "运行 run prepare --scope shop#W --session T3；执行后 run submit（不带 --implementer）"
          - "在工作台查看三条场景的详情与历史"
        expected:
          - "第一次运行的执行者为 T1，独立性为独立验收"
          - "第二次为实现者自检，第三次为未声明"
          - "独立性只出现在各场景的历史中"
        forbidden_effects: ["未声明计为独立验收", "独立性显示在历史以外的位置"]
        refs: ["docs/design.md#独立性（取代交接仪式）", "docs/design.md#看板：三栏场景工作台（问题 2）"]
      - id: RUN-03-N01
        polarity: negative
        negative_type: incomplete-input
        title: 取不到执行者时要求 --session
        actor: 执行会话
        priority: P2
        verify: cli
        initial_state: ["环境中没有 CODEX_THREAD_ID 与 SOP_BOARD_SESSION"]
        steps: ["运行 sop-board run prepare --scope shop#A --json（不带 --session）"]
        expected: ["命令失败并要求提供 --session", "没有新建运行"]
        forbidden_effects: ["以空执行者或占位名创建运行"]
        refs: ["docs/design.md#独立性（取代交接仪式）"]

  - id: RUN-04
    title: run launch 启动独立执行会话
    actor: 协调会话
    entry: "sop-board run launch --scope …、run wait、launch status|stop"
    must:
      - "守护进程按 agents 配置启动无头 claude -p 或 codex exec，会话只拿到 prompt 文件"
      - "会话编号由启动器取得，启动记录就是独立性的证据"
      - "同一检出同时只运行一个启动"
    scenarios:
      - id: RUN-04-P01
        polarity: positive
        title: 协调会话用 run launch 启动 Claude 与 Codex 执行会话，结果带启动记录回到工作台
        actor: 协调会话
        priority: P0
        verify: agent
        initial_state: ["config.yaml 的 agents 先设为 claude", "main 没有运行中的启动", "shop#X、shop#A 有待执行内容"]
        steps:
          - "在 app 目录新开 Claude Code 会话（协调会话），请求“启动一个独立会话验收 shop#X 和 shop#A”"
          - "协调会话运行 sop-board run launch --scope shop#X shop#A，再运行 run wait"
          - "查看 launch status、launches 表与运行目录中的 prompt 文件，在工作台查看两条场景的历史"
          - "把 agents 改为 codex 后重复一次"
        expected:
          - "Claude 启动记录有进程号、日志、退出码，会话编号与 --session-id 一致；Codex 启动记录的会话编号来自 thread.started"
          - "新会话的输入只有 prompt 文件，结果的执行者为启动器取得的会话编号，与协调会话不同"
          - "两条场景的历史显示该运行与启动记录，以及独立性"
        forbidden_effects: ["协调会话自己写结果或修改执行会话的结果", "生成 handoff 交接文件", "执行会话沿用协调会话的会话编号"]
        refs: ["docs/design.md#独立性（取代交接仪式）", "docs/design.md#进程与入口", "docs/design.md#验证"]
        evidence_hints: ["协调会话记录", "启动日志", "launches 表只读查询", "工作台历史截图"]
      - id: RUN-04-N01
        polarity: negative
        negative_type: concurrency
        title: 同一检出已有运行中的启动时，第二次启动被拒绝
        actor: 协调会话
        priority: P1
        verify: cli
        initial_state: ["main 有一个 running 的启动 L1"]
        steps: ["在 main 运行 sop-board run launch --scope shop#B --json", "本机工作台对 shop#B 点“AI 重跑此场景”", "在 wt1 运行 sop-board run launch --scope shop#B --json"]
        expected:
          - "main 的两次请求都被拒绝，error_code 为 launch-running，写明运行中的 L1；launch status 只显示 L1"
          - "wt1 的启动成功"
        forbidden_effects: ["main 同时运行两个无头会话", "结束或替换 L1"]
        refs: ["docs/design.md#进程与入口", "docs/design.md#数据库（格式 6，board.sqlite3）", "使用者 2026-11-10 对场景集待确认问题的答复 第 6 条"]
