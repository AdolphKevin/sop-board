          - "shop#B 登记为通过，disposed 仍有 shop#B（human/pass）和 shop#X（shelved/not-run），两项计数各为 1，total 为准备前的总场景数"
        forbidden_effects: ["自动范围包含 shop#B 或 shop#X", "点名执行取消处置，或把已通过的 shop#B 并入普通通过计数"]
        refs: ["docs/design.md 已定决策 30 第一段：处置", "docs/reference.md#处置", "docs/reference.md#准备"]
