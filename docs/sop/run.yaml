        forbidden_effects: ["main 同时运行两个无头会话", "结束或替换 L1"]
        refs: ["docs/design.md#进程与入口", "docs/reference.md#数据库表", "使用者 2026-11-10 对场景集待确认问题的答复 第 6 条"]
      - id: RUN-04-N02
        polarity: negative
        negative_type: invalid-input
        title: 范围不合格时 run launch 直接拒绝，不启动会话；场景所在文件不合格时写明是文件的问题
        actor: 协调会话
        priority: P1
        verify: cli
        initial_state:
          - "main 没有运行中的启动，也没有 prepared 的运行；draft-a（metadata.status: draft）在仓库中"
          - "在 app 的场景目录另建一份不合格的场景文件 broken.yaml：一个节点、一条缺少 expected 的场景 BROKEN-1-P01"
          - "记录 launches 表的行数与当前的 claude、codex 进程"
        steps:
          - "在 main 运行 sop-board run launch --scope shop#NOPE-1 --json"
          - "在 main 对合法的 shop#A 分别用 --runner other、单独 --model M、以及 --runner codex --effort other 发起启动"
          - "运行 sop-board run launch --scope draft-a#DRAFT-A-1-P01 --json"
          - "运行 sop-board run launch --scope broken#BROKEN-1-P01 --json，再运行 sop-board run prepare --scope broken#BROKEN-1-P01 --session S1 --json"
          - "运行 sop-board launch status，查询 launches 表行数，用 ps 查看 claude、codex 进程"
          - "broken.yaml 仍在时运行 sop-board run prepare --scope pending --session S2 --json，查看运行目录的说明，然后 sop-board run abandon"
        expected:
          - "第一条以业务失败退出（退出码 1），error_code 为 scenario-not-found，写明 shop#NOPE-1"
          - "代理参数不合格的三次调用均返回 invalid-arguments、退出码 2"
          - "指定草稿以业务失败退出，error_code 为 draft-not-runnable"
          - "指定不合格文件的 run launch 与 run prepare 都以业务失败退出，error_code 为 scenario-file-invalid，列出 broken.yaml、缺少的字段与行号"
          - "被拒绝的 run launch 都没有启动会话：launches 表行数不变，launch status 没有新记录，没有新的 claude 或 codex 进程"
          - "--scope pending 的 run prepare 成功，范围是合格文件中的待执行场景；输出与运行目录说明列出未纳入的 broken.yaml 及其问题"
        forbidden_effects: ["先启动无头会话、到会话里才发现范围不合格", "把不合格文件中的场景报成 scenario-not-found"]
        refs: ["docs/design.md#独立性（取代交接仪式）"]
      - id: RUN-04-N03
        polarity: negative
        negative_type: interrupted
        title: 启动的会话没有产生运行就退出时，launch status 标为未产生运行，run wait 返回失败
        actor: 协调会话
        priority: P1
        verify: cli
        initial_state:
          - "main 没有运行中的启动，也没有 prepared 的运行；shop#A 有待执行内容"
          - "替代做法（代表“会话没有执行就结束”）：config.yaml 的 agents 为 claude，args 设为 [\"--tools\", \"Read\"]，启动的会话只能读文件、运行不了命令，正常结束而没有产生运行"
        steps:
          - "在 main 运行 sop-board run launch --scope shop#A，记下启动编号 L"
          - "运行 sop-board run wait，记录退出码与输出"
          - "运行 sop-board launch status --json，在工作台查看 shop#A"
        expected:
          - "run wait 以业务失败退出（退出码 1），写明 L 没有产生运行"
          - "launch status 中 L 标为未产生运行，附启动日志末尾"
          - "shop#A 没有新增结果，状态不变"
        forbidden_effects: ["L 显示为正常结束且没有任何提示", "run wait 以成功返回"]
        refs: ["docs/design.md#独立性（取代交接仪式）"]
      - id: RUN-04-N04
        polarity: negative
        negative_type: interrupted
        title: 启动的会话准备了运行却没有提交就正常退出时，run wait 返回失败，看板放弃该运行并登记待人处理
        actor: 协调会话
        priority: P1
        verify: cli
        initial_state:
          - "main 没有运行中的启动，也没有 prepared 的运行；shop#A 有待执行内容；没有未解决的待人处理"
          - "按 docs/verification.md 控制真实会话在写完 shop#A 的结果行与证据后、首次裁决前正常结束；替身演示只算自检"
        steps:
          - "在 main 运行 sop-board run launch --scope shop#A，记下启动编号 L"
          - "运行 sop-board run wait，记录退出码与输出"
          - "运行 sop-board launch status --json 与 sop-board attention list，查询本机运行记录，查看该运行的目录，在工作台查看 shop#A"
        expected:
          - "run wait 以业务失败退出（退出码 1），error_code 为 launch-unsubmitted，写明未提交的运行编号，以及它已由看板放弃"
          - "launch status 中 L 只有一次尝试（没有首次裁决），写明该运行未提交，附启动日志末尾"
          - "该运行为 abandoned，运行目录和 shop#A 完整结果行、证据仍在；待人处理新增一条环境问题，写明启动 L、该运行与 shop#A"
          - "shop#A 没有新增结果，状态不变"
        forbidden_effects: ["run wait 以成功返回", "看板自动提交该运行的结果", "该运行停在 prepared", "仅凭完整结果行续跑或登记"]
        refs: ["docs/design.md#独立性（取代交接仪式）"]
      - id: RUN-04-N05
        polarity: negative
        negative_type: interrupted
        title: 会话取得进展后退出，三个会话接力完成同一个运行
        actor: 协调会话
        priority: P0
        verify: agent
        initial_state:
          - "main 无正在运行的启动、prepared 运行或待人处理；shop#A、shop#B、shop#W 均待执行，隔离数据可还原"
          - "按 docs/verification.md 安排真实客户端在指定裁决后退出，记录进程结束时刻及退出码；每条超时上限设为 2 秒"
        steps:
          - "运行 sop-board run launch --scope shop#A shop#B shop#W，记录启动 L。首个会话准备 R，经真实入口裁决 shop#A；开始 shop#B 并留下本轮专用测试订单但未裁决，然后正常退出"
          - "在第一次续跑等待期间读取 launch status、run wait --launch L --timeout 1 与 browser status，再读取第二个会话的提示词，核对其先还原 shop#B，再因数据配方实际失败暂记该条为 blocked/precondition，然后让会话以非零退出"
          - "核对第二个会话离开时的进度及工作台。第三个会话取回 R，恢复配方，重新开始并裁决 shop#B（重做用时超过 2 秒），再执行并裁决 shop#W，然后提交。运行 run wait --launch L、launch status 和 launch stats --launch L；逐条核对证据及执行者"
        expected:
          - "同一启动 L 有三个不同会话，前两个退出码依次为 0 和非零，每次间隔按守护进程设置；首次用到的代理、模型和强度在后两次一致"
          - "等待期间 L 保持 running、仍持有 merchant 租约，run wait 未提前返回业务失败；续跑提示给出同一运行 R 的编号与目录、已登记与剩余清单，第二次标明上次开始的 shop#B，第三次标明 shop#B 的暂记类别和阻点；重复准备返回 resumed: true，记录表只有同一个 R"
          - "shop#A 的结论在首次退出前已可查，后来保持原执行者及证据；shop#B 的半成品订单已按验证规则处理。第二个会话只有 shop#B 的本机暂记，进度 registered=1、local=1，工作台没有该受阻结果，attempts 中第二次的 new_verdicts 为 1"
          - "运行提交后恰有三条通过，shop#A 属于第一次会话，shop#B 与 shop#W 属于第三次会话。wait 列全登记清单，进度 total=3、adjudicated=3，统计 sessions=3、continuations=2；单条耗时按各自有效开始与裁决计算；shop#B 的最终条目 timed_out 为 true，并计入超时合计"
        forbidden_effects: ["多起一个运行", "重做已有结论的场景或提前登记 shop#B 的受阻", "覆盖前一个会话的执行者", "在未核对或还原时继续修改测试数据"]
        refs: ["docs/design.md 已定决策 30 第二段 B", "docs/reference.md#launch--wait"]
        evidence_hints: ["尝试记录和提示词", "三次真实会话记录", "数据还原的查询", "进度与统计和结果证据"]
      - id: RUN-04-N06
        polarity: negative
        negative_type: interrupted
        title: 三个会话仍有未裁决场景时结束启动，放弃运行并保留已登记结论
        actor: 协调会话
        priority: P0
        verify: agent
        initial_state:
          - "main 没有运行中的启动、prepared 运行或待人处理；库存演示项目的 shop#A、shop#B、shop#X、shop#W、stock#K 未执行；执行客户端缺少 Web 凭据，按手册准备可控的真实会话退出"
        steps:
          - "启动以上五条场景；前三次会话各经真实入口执行并裁决一条，依次为 shop#A、shop#B、shop#X，每次裁决后让会话以非零结束"
          - "第三次退出前，按实际缺凭据的阻点暂记 shop#W 为 not-executed/environment，再开始 stock#K 并保留不完整的一行，确认 merchant 在该运行租约下；第三次退出后运行 run wait --launch L"
          - "过一个续跑间隔后查看 launch status、attention list、browser status、launch stats --launch L 和工作台；恢复下次执行所需的 Web 凭据，再点名启动 shop#W"
        expected:
          - "wait 退出 1、返回 launch-failed；只有三次尝试，运行 R 已放弃，末次进度总数 5、已登记 3、本机暂记 1；shop#W 在 result.unregistered，stock#K 在 result.unadjudicated"
          - "shop#A、shop#B 仍为通过，shop#X 仍为失败；各有对应证据；shop#W 的暂记和 stock#K 的行草稿保留在运行目录；两条的业务记录和场景状态均无变化，仍在待执行范围"
          - "merchant 租约获释放，下一次启动能直接执行 shop#W；待人处理恰有一条写明启动号、续跑上限、运行号、涉及的场景与日志末尾，并逐条列出暂记项 shop#W 的 environment 与缺凭据原因，正文不含本机路径"
          - "统计显示 3 个会话、2 次续跑、通过 2、失败 1、未登记 1、未裁决 1，inconclusive 的 environment 为 0"
        forbidden_effects: ["第四次尝试", "撤销已登记结果", "把暂记或残行登记为业务结果", "继续占用身份"]
        refs: ["docs/design.md 已定决策 30 第二段 B", "docs/reference.md#launch--wait"]
        evidence_hints: ["三次尝试日志", "wait 与 stats 输出", "租约查询", "待人处理与工作台历史"]
      - id: RUN-04-N07
        polarity: negative
        negative_type: interrupted
        title: 叫停有进展的启动后不再续跑，由操作者收尾
        actor: 协调会话
        priority: P1
        verify: cli
        initial_state: ["真实启动 L 有运行 R，shop#A 已经真实执行并裁决通过，shop#W 因欠缺 Web 凭据而暂记未执行；首个会话仍在运行"]
        steps:
          - "运行不带 --launch 的 launch stop，查看退出码和 launch status"
          - "运行 launch stop --launch L，然后运行 run wait --launch L；超过一次配置的续跑间隔后查看 launch status、browser status 与 attention list"
          - "操作者运行 run abandon --run R，在工作台核对 shop#A 并查看 R 的记录"
        expected:
          - "缺少编号时退出 2，返回 invalid-arguments 并指出 --launch；L 仍在运行"
          - "启动为 stopped，只有一次尝试；R 保持 prepared，租约仍在，无启动收尾条目"
          - "明确放弃后才释放身份；已登记的 shop#A 通过及证据仍可查，shop#W 的暂记留在 R 的目录和 result.unregistered，业务未执行记录及场景状态无变化"
        forbidden_effects: ["守护进程擅自续跑或放弃运行", "清掉已登记结论或将暂记裁决登记到业务库"]
        refs: ["docs/reference.md#launch--wait"]
      - id: RUN-04-N08
        polarity: negative
        negative_type: interrupted
        title: 首个会话在首次裁决前异常退出时接续一次，第二个会话仍无裁决则结束启动
        actor: 协调会话
        priority: P1
        verify: cli
        initial_state:
          - "main 没有运行中的启动，也没有 prepared 的运行；shop#A、shop#B 有待执行内容；没有未解决的待人处理"
          - "按 docs/verification.md 控制真实会话的退出；替身演示只算自检"
        steps:
          - "运行 sop-board run launch --scope shop#A shop#B，记下启动 L；让首个会话在准备运行之后、首次裁决之前以非零退出码结束，在续跑等待期间运行 launch status 与 run wait --launch L --timeout 1"
          - "第二个会话取回同一个运行，经真实入口执行并裁决 shop#A、shop#B 后提交；运行 run wait --launch L 与 launch status"
          - "点名 shop#A、shop#B 再发起启动 L2；让首个会话在首次裁决前以非零退出码结束，第二个会话也在首次裁决前正常退出；运行 run wait --launch L2、launch status 与 attention list"
        expected:
          - "L 的首个会话没有新裁决、退出码非零，L 保持 running 并在续跑间隔后起第二个会话；续跑提示写明上一个会话的结束时间、退出码和它准备的运行，第二个会话的准备返回同一个运行与 resumed: true"
          - "L 最终为 exited，共两次尝试；两条场景的结果由第二个会话登记，运行为 submitted"
          - "L2 只有两次尝试：第二个会话没有新裁决就结束后不再接续，run wait 以业务失败返回，运行被放弃，待人处理新增一条写明启动 L2 与该运行"
        forbidden_effects: ["首个会话异常退出后直接结束启动", "没有进展的第二个会话之后再起第三个会话", "接续的会话另建运行而原运行仍占着身份"]
        refs: ["docs/reference.md#launch--wait"]

  - id: RUN-05
    title: 未执行与受阻按性质划分，故障场景用 env stop 模拟
    actor: 执行会话
    entry: "sop-board run prepare/submit、env stop|start <服务>、env status、attention add；运行目录的提示词与服务清单；工作台场景详情"
    must:
      - "未执行是本机暂时不具备、补齐或换一台机器就能执行的情况：场景需要的服务本机未搭建或被人为停着；缺少入口声明的凭据变量；等人处理的事（真实账号登录、人机验证、只发到本人设备的验证码、身份使用次数到上限，类别为 human，提交时自动登记待人处理）"
      - "未执行不登记结果，不改变场景状态；场景详情显示最近一次未执行的情况：谁、什么时候、缺什么与类别。受阻也要填写类别"
      - "受阻是意外故障或全队都不具备的能力：服务或浏览器异常退出（不论发生在开始前还是执行中，附日志末尾）；前置数据准备失败、证据丢失；入口或观察能力还没建设；需要停外部共享中间件的故障场景"
      - "场景起点要求某个依赖故障时，执行会话用 sop-board env stop|start <服务> 停启，不直接结束进程或改动环境；结果详情显示“执行时 <服务> 已停止”；run submit 时还停着的服务自动恢复并记录"
      - "同一个入口对任何操作都失败、连续挡住 2 条场景时，执行会话中止这个入口的其余场景：前 2 条记受阻，其余写未执行并写明本轮中止，登记一条环境问题，照常提交"
    scenarios:
      - id: RUN-05-P01
        polarity: positive
        title: 只搭商城时，执行会话把依赖库存的场景记未执行，其余场景照常执行
        actor: 执行会话
        priority: P0
        verify: agent
        initial_state:
          - "库存演示项目处于“只搭商城”，环境在运行：shop 为运行中，stock 为本机未搭建；stock#K 与 shop#A 都是未执行"
          - "config.yaml 的 agents 设为 claude；没有未解决的待人处理"
        steps:
          - "在 app 目录新开 Claude Code 会话，请求“验收 stock#K 和 shop#A 并提交结果”"
          - "会话运行 run prepare --scope stock#K shop#A，按运行目录的提示词与服务清单执行并 run submit；会话提问时只回答“按项目规则处理”"
          - "查看 submit 输出与运行目录的 results.jsonl，运行 sop-board status --json，在工作台打开 stock#K 与 shop#A；只读查询 results 表"
          - "在另一份同样状态的项目中对 Codex 会话重复一次"
        expected:
          - "results.jsonl 中 stock#K 一行为 not-executed，cause 为 environment，finding 写明库存服务本机未搭建；shop#A 一行为 pass 并带证据"
          - "submit 成功：shop#A 登记为通过；未执行清单列出 stock#K 及原因；results 表中没有 stock#K 的结果行"
          - "stock#K 的状态仍为未执行，仍可由 pending 选中；场景详情显示最近一次未执行：操作者、时间、环境类别与原因"
          - "会话记录中没有启动库存服务、登记仓库或修改配置的操作"
        forbidden_effects:
          - "stock#K 记为受阻、失败或通过"
          - "会话因为 stock 没在运行而放弃整轮，不执行 shop#A"
          - "会话自行启动库存服务、登记 stock 仓库或修改 config.yaml"
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/standard.md#首次执行与人工复核"]
        evidence_hints: ["会话记录导出", "results.jsonl 与 submit 输出", "status --json 输出", "工作台 stock#K 详情截图", "results 表只读查询"]
      - id: RUN-05-P02
        polarity: positive
        title: 缺少凭据变量的场景记未执行，已有的通过保持不变，内网不显示变量名
        actor: 执行会话
        priority: P1
        verify: cli
        initial_state:
          - "演示项目（setup.yaml 文件头）main 上 shop#W 有一条 Agent 独立验收通过，带“待人工复核”与“待沉淀”；运行 sop-board status --json 记录 counts"
          - "执行者的环境中没有 web 入口声明的凭据变量 DEMO_MERCHANT_PASSWORD；merchant 的 profile 没有登录态"
        steps:
          - "运行 sop-board run prepare --scope shop#W --session S1，阅读运行目录的提示词"
          - "执行者按提示词在 results.jsonl 写一行 {\"scenario\": \"shop#W\", \"status\": \"not-executed\", \"cause\": \"environment\", \"finding\": \"缺少凭据变量 DEMO_MERCHANT_PASSWORD\"}，运行 sop-board run submit --run <编号> --json"
          - "运行 sop-board status --json；本机与内网设备分别打开工作台的 shop#W；只读查询 results 表"
        expected:
          - "提示词写明：缺少入口声明的凭据变量时写 not-executed、cause: environment，finding 只写变量名"
          - "submit 成功，未执行清单列出 shop#W、environment 及原因；results 表没有新增 shop#W 的结果行"
          - "shop#W 仍为通过，仍带“待人工复核”与“待沉淀”；status --json 的 counts 与提交前相同"
          - "本机的 shop#W 详情显示最近一次未执行：操作者、时间与“缺少凭据变量 DEMO_MERCHANT_PASSWORD”"
          - "内网的 shop#W 详情同样显示这次未执行的人与时间，但不出现变量名 DEMO_MERCHANT_PASSWORD"
        forbidden_effects:
          - "这次未执行使 shop#W 离开通过，或失去“待人工复核”“待沉淀”"
