  - id: RUN-04
    title: run launch 启动独立执行会话
    actor: 协调会话
    entry: "sop-board run launch --scope …、run wait、launch status|stop|stats"
    must:
      - "守护进程按 agents 配置或本次指定的代理参数启动无头 claude -p 或 codex exec，会话只拿到 prompt 文件；本次参数及其接续用值留在尝试记录"
      - "会话编号由启动器取得，启动记录就是独立性的证据"
      - "同一检出同时只运行一个启动"
      - "启动前按 run prepare 的同一套规则核对范围，不合格直接拒绝、不启动会话；会话退出时没有产生运行或留下未提交的运行，launch status 标出、run wait 以失败返回"
      - "run 类型的启动，会话结束时仍有未裁决场景且本会话至少新裁决一条（含本机暂记），守护进程在同一次启动下续跑；最多三个会话，不限退出码；暂记场景可重做，已有结论的场景保持原登记"
      - "续跑条件不满足而留有 prepared 运行时，看板放弃运行、释放身份、恢复服务并登记一条待人处理说明暂记场景的类别与原因，保留已登记结论及本机材料；launch stop 由使用者决定如何收尾"
    scenarios:
      - id: RUN-04-P01
        polarity: positive
        title: 协调会话用 run launch 启动 Claude 与 Codex 执行会话，结果带启动记录回到工作台
        actor: 协调会话
        priority: P0
        verify: agent
        initial_state: ["agents.run 配置为 claude、effort 为 medium，已记录 config.yaml 摘要；被测 Codex 可用并已确认本次使用的具体模型名 M 与 high 强度", "main 没有运行中的启动或 prepared 运行", "shop#X、shop#A、shop#B、shop#W 均未执行，没有其他已确认场景；shop#B 由人验收，shop#W 已搁置"]
        steps:
          - "在 app 目录新开 Claude Code 会话作为协调会话；请求“用 Codex（模型 M、强度 high）启动独立会话验收本分支待执行场景”"
          - "协调会话运行 sop-board run launch --scope pending --runner codex --model M --effort high，再运行 run wait；启动期间记录客户端进程的代理、模型和强度参数"
          - "请求再启动一个会话点名验收 shop#X 和 shop#A，这次不指定代理参数，并运行 run wait"
          - "查看 launch status、两次 attempts.json、真实会话记录和运行提示词。用 launch stats 按两次启动编号、按今天及明天各查询一次，核对 config.yaml 摘要与工作台历史"
        expected:
          - "Claude 启动记录有进程号、日志、退出码，会话编号与 --session-id 一致；Codex 启动记录的会话编号来自 thread.started"
          - "新会话的输入只有 prompt 文件，结果的执行者为启动器取得的会话编号，与协调会话不同"
          - "两条场景的历史显示该运行与启动记录，以及独立性"
          - "第一次自动展开的启动范围与执行范围恰为 shop#X、shop#A；尝试参数为 codex/M/high，真实启动参数与记录一致"
          - "第二次仍用配置的 claude 与 medium，两个命令的 attempts 和对应文件一致，配置摘要与启动前相同"
          - "两次统计分别显示 codex/M 与 claude（未显式传模型时 null），各有 1 个会话、0 次续跑、范围 2、通过 1、失败 1，各场景耗时等于记录的裁决时刻减开始时刻；合计通过 2、失败 2，按明天筛选为零"
        forbidden_effects: ["协调会话自己写结果或修改执行会话的结果", "生成 handoff 交接文件", "执行会话沿用协调会话的会话编号", "把 shop#B 或 shop#W 纳入自动启动，或把一次指定的代理配置写回项目"]
        refs: ["docs/design.md#独立性（取代交接仪式）", "docs/design.md#进程与入口", "docs/design.md#验证"]
        evidence_hints: ["协调会话记录", "启动日志", "launches 表只读查询", "工作台历史截图"]
      - id: RUN-04-N01
        polarity: negative
        negative_type: concurrency
        title: 同一检出已有运行中的启动时，第二次启动被拒绝
        actor: 协调会话
        priority: P1
        verify: cli
        initial_state: ["main 有一个 running 的启动 L1"]
        steps: ["在 main 运行 sop-board run launch --scope shop#B --json", "本机工作台对 shop#B 点“AI 重跑此场景”", "在 wt1 运行 sop-board run launch --scope shop#B --json"]
        expected:
          - "main 的两次请求都被拒绝，error_code 为 launch-running，写明运行中的 L1；launch status 只显示 L1"
