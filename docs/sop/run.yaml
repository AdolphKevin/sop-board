          - "stock#K 的结果为受阻，finding 附库存服务的日志末尾；工作台 stock#K 显示受阻及原因"
        forbidden_effects:
          - "因为异常退出发生在执行开始之前而把 stock#K 记为未执行"
          - "run prepare 因 stock 异常退出而失败"
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）"]
        evidence_hints: ["run prepare 输出与服务清单", "库存服务日志", "results.jsonl 与 submit 输出", "工作台截图"]
      - id: RUN-05-N03
        polarity: negative
        negative_type: interrupted
        title: 入口整体不可用连续挡住两条场景时，执行会话中止本轮，其余场景记未执行
        actor: 执行会话
        priority: P1
        verify: agent
        initial_state:
          - "演示项目的环境在运行；shop#X、shop#A、shop#B 都是 API 场景，都未执行；没有未解决的待人处理；config.yaml 的 agents 设为 claude"
          - "替代做法（代表“入口在、对任何操作都失败”）：环境就绪后让演示商城的接口对任何请求都返回 500（例如把它的数据文件改名），做法写进取证记录"
        steps:
          - "在 main 运行 sop-board run launch --scope shop#X shop#A shop#B，再运行 sop-board run wait"
          - "查看 wait 输出、运行目录的 results.jsonl 与启动日志，运行 sop-board attention list 与 sop-board status --json，在工作台打开三条场景"
        expected:
          - "results.jsonl 中先执行的两条为 blocked，finding 写明接口返回 500 的现象并附日志末尾；第三条为 not-executed，finding 写明入口 api 不可用、本轮中止"
          - "启动日志里没有针对第三条场景的入口请求"
          - "提交成功：两条登记为受阻；未执行清单列出第三条及原因，它的状态仍为未执行、仍在 pending 范围"
          - "待人处理有一条环境问题，写明入口 api 不可用"
        forbidden_effects: ["三条都记为受阻", "任何一条记为失败或通过", "会话自行修改演示商城或重启环境", "会话不提交就退出"]
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）"]
        evidence_hints: ["启动日志", "results.jsonl 与 wait 输出", "attention list 输出", "status --json 输出", "工作台截图"]

  - id: RUN-06
    title: 共享库中断后重新提交，结果只登记一次
    actor: 执行会话
    entry: "sop-board run submit --run N；共享库容器的停启"
    must:
      - "run submit 依次做三步：证据文件存入本机证据目录；一个事务把结果、证据索引和运行记录写入业务记录库；更新本机运行状态、释放租约、恢复服务"
      - "写入业务记录库失败时运行保持 prepared，结果留在运行目录，恢复后重新 run submit"
      - "每次运行在共享库里以“机器标识 + 本机运行编号”唯一，重复提交不重复登记"
    scenarios:
      - id: RUN-06-P01
        polarity: positive
        title: 共享库正常时一次提交即登记，另一台机器随即看到，证据留在本机
        actor: 执行会话
        priority: P1
        verify: cli
        initial_state:
          - "双机项目：shop#B 在共享库中没有结果；B 没有 prepared 运行"
        steps:
          - "在 B 运行 sop-board run prepare --scope shop#B --session TB，执行者经演示项目入口执行 shop#B 并写出通过结果与一份证据"
          - "在 B 运行 sop-board run submit --run <编号> --json"
          - "在 A 运行 sop-board status --json；只读查询共享库中这次运行的记录；列出 A、B 两个数据根目录的 evidence 目录"
        expected:
          - "submit 成功，运行状态为 submitted"
          - "A 的 status 中 shop#B 为通过"
          - "共享库中这次运行的记录带 B 的机器标识与 B 的本机运行编号，证据索引写明产出机器为 B 的机器"
          - "证据文件在 B 的 evidence 目录里，A 的 evidence 目录里没有"
        forbidden_effects: ["证据文件写进共享库或 A 的机器", "运行记录缺少机器标识"]
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/design.md#数据库（格式 7）"]
        evidence_hints: ["submit 输出", "A 的 status --json", "共享库的只读查询", "两边 evidence 目录清单"]
      - id: RUN-06-N01
        polarity: negative
        negative_type: disconnect
        title: 提交时共享库断开，运行保持 prepared；恢复后重新提交，结果只登记一次
        actor: 执行会话
        priority: P0
        verify: cli
        initial_state:
          - "双机项目：B 有 prepared 运行 R（范围 shop#B），results.jsonl 已写好 shop#B 的通过结果并附一份证据；shop#B 在共享库中没有结果"
        steps:
          - "停掉共享库容器，在 B 运行 sop-board run submit --run R --json"
          - "查看运行 R 的状态与运行目录"
          - "启动共享库容器，在 B 再次运行 sop-board run submit --run R --json"
          - "在 A 运行 sop-board status --json；只读查询共享库中这次运行的记录与 shop#B 的结果行数"
        expected:
          - "第一次提交以业务失败退出（退出码 1），error_code 为 database-unreachable，输出写明共享库的主机"
          - "运行 R 仍为 prepared，results.jsonl 与证据文件仍在运行目录"
          - "第二次提交成功，shop#B 登记为通过"
          - "共享库中这次运行只有一条运行记录和一条 shop#B 的结果；A 的 status 中 shop#B 为通过"
        forbidden_effects:
          - "第一次失败后运行被标为 submitted 或 abandoned"
          - "结果登记两次"
          - "失败的提交在共享库留下半截记录（有结果没有运行记录，或反之）"
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）"]
        evidence_hints: ["两次 submit 的输出", "运行目录清单", "共享库的只读查询", "A 的 status --json"]
      - id: RUN-06-N02
        polarity: negative
        negative_type: duplicate
        title: 已提交的运行再次提交被拒绝，不新增结果
        actor: 执行会话
        priority: P1
        verify: cli
        initial_state: ["双机项目：B 的运行 R 已提交成功，登记了 shop#B 的通过"]
        steps:
          - "在 B 再次运行 sop-board run submit --run R --json"
          - "只读查询共享库中这次运行的结果行数"
        expected:
          - "命令以业务失败退出（退出码 1），error_code 为 run-not-prepared"
          - "共享库中这次运行仍只有一条 shop#B 的结果"
        forbidden_effects: ["同一运行的结果被登记第二次"]
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）"]

  - id: RUN-07
    title: 分步实现时按情况决定验收时机，并如实标注每一步
    actor: 协调会话
    entry: "真实 Claude Code 或 Codex 会话，使用随包 sop-board 技能；sop-board status、run launch|prepare --scope"
    must:
      - "交付条件不变：分步验收只改变每条场景在哪一步执行，不减少要经独立真实入口执行的场景；先验的通过要到交付时仍然可信"
      - "开始实现前，会话对每一步判断“做完就验”还是“并到后面一起验”，把安排和理由告诉使用者，由使用者确认或调整；不照搬“每一步都验”或“全部做完才验”"
      - "判断依据：是否先单独交付、后面的步骤是否重做这一步验过的实现、后面的步骤是否以这一步正确为前提、各步改动是否重叠、是否高风险内容、验收一轮的成本"
      - "每一步如实标注为已独立验收、只做了实现者自检或未验证；推迟验收的步骤写明“未经独立验收”，不说成可以验收或可以交付"
      - "代码改动不改变场景状态：先验通过、之后被后续步骤重做了实现的场景，要么守护有效且 retest 通过，要么在统一验收时明确列入范围重新执行，不能只跑 --scope pending"
    scenarios:
      - id: RUN-07-P01
        polarity: positive
        title: 三步改动里一步要先单独交付、两步前后重做同一块实现，会话给出有理由的混合安排，推迟验收的那一步报告为未经独立验收
        actor: 协调会话
        priority: P1
        verify: agent
        initial_state:
          - "演示项目（setup.yaml 文件头）已登记，看板已启动，sop-board skills install 已执行；app 与 lib 没有未提交改动"
          - "shop#A、shop#B、shop#W 各有一条 Agent 独立验收通过，shop#X 为失败；没有守护"
        steps:
          - "在 app 目录新开 Claude Code 会话，说明要做三步改动并请它先给出验收安排、暂不动手：第一步调整商家订单页的退款状态文案，今天做完就交给测试同学看；第二步把 lib 里退款期限的判断改成读取配置；第三步重写 lib 的退款规则模块，第二步改的函数会被整个替换；第二、三步都做完才对外交付"
          - "会话给出安排后，回答“按你的安排，先只做第二步”"
          - "会话完成第二步并报告后，运行 sop-board status --json 与 sop-board launch status，查看会话记录"
          - "在另一份新生成的演示项目中对 Codex 会话重复一次"
        expected:
          - "会话在改动任何文件之前给出验收安排：第一步做完就单独验收，理由提到它要先单独交付；第二步不单独验收、并到第三步之后一起验收，理由提到第三步会重做第二步的实现"
          - "会话把安排交使用者确认后才开始实现"
          - "第二步完成后，会话的报告写明第二步只做了实现者自检、未经独立验收，没有把它说成可以验收或可以交付"
          - "会话没有为第二步发起独立验收：launch status 没有新的启动，shop 的场景没有新增结果"
        forbidden_effects:
          - "会话不作分析，对三步一律“每步做完就验”或一律“全部做完再验”"
          - "会话不说明安排就开始实现"
          - "第二步未经独立验收却被报告为已验收或可以交付"
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/standard.md#分步实现时的验收时机"]
        evidence_hints: ["会话记录导出", "第二步的 git diff", "status --json 与 launch status 输出", "results 表只读查询"]
      - id: RUN-07-N01
        polarity: negative
        negative_type: stale-input
        title: 先验通过的场景被后续步骤重做了实现，统一验收时会话把它明确列入范围，不因 pending 为空就宣布完成
        actor: 协调会话
        priority: P1
        verify: agent
        initial_state:
          - "演示项目已登记，看板已启动，sop-board skills install 已执行"
          - "shop#A 有一条 Agent 独立验收通过，取证于第一步之后；之后第二步重写了 shop#A 所验证的退款规则实现（改动在工作区，只做了实现者自检）；没有守护"
          - "sop-board status --json 的待复测、失败、受阻、未执行队列都为空"
        steps:
          - "在 app 目录新开 Claude Code 会话，告诉它：第一步验收过 shop#A，第二步重写了退款规则，现在两步都做完了，请统一验收"
          - "会话按实际情况处理；提问时只回答“按项目规则处理”"
          - "查看会话记录、launch status 与运行目录的范围，在工作台查看 shop#A 的历史"
        expected:
          - "会话指出 shop#A 的通过取证于第二步之前，而第二步重做了它依赖的实现，需要重新执行"
          - "会话发起的运行范围明确包含 shop#A（--scope 列出 shop#A 或用 all），不是只用 pending"
          - "执行后 shop#A 新增一条结果，取证的产品快照包含第二步的改动"
        forbidden_effects:
          - "会话只按 --scope pending 准备，因范围为空就宣布验收完成"
          - "会话把第一步时的那条通过当作统一验收的结果"
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/standard.md#分步实现时的验收时机", "docs/standard.md#业务变化与回归"]
        evidence_hints: ["会话记录导出", "launch status 与运行目录的 pending.json", "工作台 shop#A 历史截图", "results 表只读查询"]

  - id: RUN-08
    title: 修复中途不开始新的一轮
    actor: 协调会话
    entry: "sop-board run prepare、run launch [--allow-open-fix]、fix prepare、fix submit、env status"
    must:
      - "轮次已经在执行时修复会话改代码不受影响：这一轮照常提交，变化的路径记进 product_changed"
      - "本机本检出有另一会话的 open 修复、它登记以来已改动产品文件，而这次准备要启动或重启环境时，run prepare 与 run launch 返回 fix-in-progress，不建运行、不启动会话、不动环境；报错写明修复编号、修复会话与已改动的文件数；--wait 不为这个条件排队"
      - "修复提交后照常准备；修复还没有改动文件时不拦；修复会话自己准备的运行不受限；--allow-open-fix 越过并在运行记录里记下修复编号"
    scenarios:
      - id: RUN-08-P01
        polarity: positive
        title: 执行中修复会话改了代码，这一轮照常提交；修复提交后下一轮照常准备，环境按修复后的代码重启
        actor: 协调会话
        priority: P0
        verify: cli
        initial_state:
          - "main 上 shop#X 为失败（独立执行），shop#A、shop#B 未执行；app 与 lib 没有未提交改动；环境在运行；没有进行中的修复，没有 prepared 的运行"
        steps:
          - "在 main 运行 sop-board run prepare --scope shop#A --session S1，得到运行 R1"
          - "以会话 F 运行 sop-board fix prepare shop#X --session F，得到修复 N；在 lib 改掉预埋缺陷（不提交）"
          - "执行者执行 shop#A，运行 sop-board run submit --run R1 --json"
          - "以会话 F 写 fix.json 并运行 sop-board fix submit --fix N"
          - "运行 sop-board run prepare --scope shop#B --session S2 --json，得到运行 R2；运行 sop-board env status"
        expected:
          - "R1 提交成功，shop#A 登记为通过；提交输出的 product_changed 列出 lib 中被改动的文件"
          - "第 5 步准备成功，不返回 fix-in-progress；环境按含修复改动的代码重启"
        forbidden_effects: ["R1 因修复会话改代码而作废或被拒绝提交", "修复已提交后仍拒绝准备"]
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/reference.md#5. 运行", "docs/standard.md#首次执行与人工复核"]
        evidence_hints: ["两次准备与提交的输出", "fix submit 输出", "env status 输出", "results 表只读查询"]
      - id: RUN-08-N01
        polarity: negative
        negative_type: concurrency
        title: 另一会话的修复改了代码还没提交时，run prepare 与 run launch 都返回 fix-in-progress，环境保持原样
        actor: 协调会话
        priority: P0
        verify: cli
        initial_state:
          - "main 上 shop#X 为失败，shop#A 未执行；环境在运行，记下 env status 的启动时间；没有 prepared 的运行，没有运行中的启动"
          - "会话 F 已运行 sop-board fix prepare shop#X --session F 得到修复 N，并在 lib 改了一个产品文件（不提交）；修复 N 为 open"
          - "记录 launches 表与本机运行记录的行数，以及当前的 claude、codex 进程"
        steps:
          - "在 main 运行 sop-board run prepare --scope shop#A --session S1 --json"
          - "运行 sop-board run prepare --scope shop#A --session S1 --wait 30 --json，记录用时"
          - "运行 sop-board run launch --scope shop#A --json"
          - "运行 sop-board env status 与 sop-board launch status，查询 launches 表与本机运行记录的行数，用 ps 查看 claude、codex 进程"
        expected:
          - "三条命令都以业务失败退出（退出码 1），error_code 为 fix-in-progress：写明修复 N、会话 F、已改动 1 个产品文件，并给出出路（等它 fix submit 后再准备）"
          - "带 --wait 的那次立即返回，不排队等待"
          - "没有新建运行，没有新的启动记录，没有新的 claude 或 codex 进程；环境的启动时间不变"
        forbidden_effects: ["环境按改到一半的代码重启", "先启动无头会话、到会话里才被拒绝", "修复 N 被放弃或改动"]
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/reference.md#5. 运行"]
        evidence_hints: ["三条命令的输出与用时", "env status 输出", "launch status 输出", "launches 表与本机运行记录只读查询", "ps 输出"]
      - id: RUN-08-P02
        polarity: positive
        title: 修复还没改代码时不拦，修复会话自己准备不受限，--allow-open-fix 越过并留下记录
        actor: 协调会话
        priority: P1
        verify: cli
        initial_state:
          - "main 上 shop#X 为失败，shop#A、shop#B 未执行；环境在运行；没有 prepared 的运行"
          - "会话 F 已运行 sop-board fix prepare shop#X --session F 得到修复 N，还没有改任何文件"
        steps:
          - "在 main 运行 sop-board run prepare --scope shop#A --session S1 --json，随后 sop-board run abandon --run <编号>"
          - "会话 F 在 lib 改一个产品文件（不提交）；以会话 F 运行 sop-board run prepare --scope shop#X --session F --json，随后 sop-board run abandon --run <编号>"
          - "会话 F 在 lib 再改一行（不提交）后，运行 sop-board run prepare --scope shop#B --session S2 --allow-open-fix --json，得到运行 R；执行者执行 shop#B 并运行 sop-board run submit --run R"
          - "在工作台查看 shop#B 的历史，查询本机运行记录中 R 的记录"
        expected:
          - "第 1 步准备成功：修复 N 还没有改动产品文件"
          - "第 2 步准备成功：准备的会话就是修复会话"
          - "第 3 步准备成功，环境按当前代码重启；R 的记录写有越过的修复编号 N，shop#B 的历史显示“准备时修复 #N 进行中”"
        forbidden_effects: ["修复没有改动文件时返回 fix-in-progress", "修复会话自己的准备被拒绝", "--allow-open-fix 的运行不留下越过记录"]
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/reference.md#5. 运行"]
        evidence_hints: ["三次准备的输出", "本机运行记录只读查询", "工作台 shop#B 历史截图"]
