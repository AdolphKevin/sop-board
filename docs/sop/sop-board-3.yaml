# SOP-BOARD-3：Codex 任务、可写授权与以用例为准的合并的验收场景
# 预期只依据本仓 docs/proposals/2026-10-19-standalone-sop-verification.md（v8）的 D15、D16、D17、D20、D21、S7 与 docs/designs/SOP-BOARD-3.md 的 I1–I5、D1、D2，不依据当前实现的输出。
# 版本 1（2026-10-19）：Claude 依据上述两份原文编写，经 AdolphKevin 授权由 Claude 代批。
# 版本 2（2026-10-20）：按测试代理 sop-board-3-tester 的 78 条用例与方案修订 2 核对覆盖，补充 30 条场景、修改 25 条，经 AdolphKevin 授权由 Claude 代批。
#
# 下文"测试看板"同 SOP-BOARD-1、2 的约定；"开发者令牌"指 SOP_BOARD_ADMIN_TOKEN（与写入令牌不同）。
# "演示仓库"指执行者新建的临时 Git 仓库 /tmp/<随机>/demo-repo：已有一次提交，含 README.md、src/app.py、docs/sop/entries.yaml（入口 web、api），
# 没有 docs/sop/<批次>.yaml。"授权看板"指以 --writable-repo github.com/demo-org/demo-app=<演示仓库路径> 与开发者令牌启动的测试看板。
# "演示用例文件"同 SOP-BOARD-2：TC_DEMO_LOGIN_001（section:登录、happy-path）、TC_DEMO_LOGIN_002（section:登录、negative）、TC_DEMO_ORDER_001（section:订单、happy-path）。
# "假 codex"指执行者写的可执行脚本，放在 PATH 最前：记录收到的参数、环境变量名与标准输入是否为空设备，按预设写出 --json 事件与 -o 指定的最终消息，可按设置等待或失败；用于运行器场景，替代真实 Codex。
# "假 codex" 另可按执行者设置：记录环境变量的值与工作目录；在 events.jsonl 中写出指定 thread_id 的 thread.started 事件；运行时另起一个子进程并记录两者的进程号；
# 向标准错误写入内容；不写最终消息或写出指定文本；以指定退出码结束；执行 --version 时以指定退出码失败；按运行次序写出不同的最终消息。
# "合规判断字段"指假 codex 写出的符合输出模式的最终消息：每条用例的 actor 为 测试岗、verify 为任务目录 entries.yaml 中的第一个入口名，反向用例的 negative_type 为 invalid-input；
# 每个 section 的节点 actor 为 测试岗、entry 为 浏览器；每条原有非用例场景为 kept；没有反向场景的节点给出未标 inferred 的 negative_exempt 理由；不补写 initial_state，merge_into、relocate 与 gaps 为空。
# "<任务目录>"指 <数据目录>/tasks/<任务编号>/。

metadata:
  requirement: "sop-board Codex 任务、可写授权与以用例为准的合并：授权与开发者令牌、Codex 运行器、合并规则、草稿与写入、SOP 原文与版本"
  batch: "sop-board-3"
  version: 2
  owner: "AdolphKevin"
  sources:
    - ref: "docs/proposals/2026-10-19-standalone-sop-verification.md 的 D15、D16、D17、D20、D21 与第 4 节 S7"
      version: "v8（2026-10-19）"
      confirmed_by: "AdolphKevin"
    - ref: "docs/designs/SOP-BOARD-3.md 的 I1–I5、D1、D2 节"
      version: "修订 3"
      confirmed_by: "AdolphKevin"
  tags: ["sop-board", "Codex", "可写授权", "合并"]

sops:

  - id: SOP-31
    title: 可写授权与开发者令牌
    actor: "启动看板的开发者"
    entry: "uv run sop-board --writable-repo 与开发者操作接口"
    must:
      - "未授权时项目仓库保持原样"
      - "开发者操作只接受开发者令牌"
    scenarios:

      - id: SOP-31-P01
        polarity: positive
        title: 授权仓库登记为项目并发现其场景文件
        actor: 启动看板的开发者
        priority: P0
        refs: ["I1", "D2"]
        verify: cli
        initial_state: ["演示仓库中另写了一份合格的 docs/sop/demo.yaml（批次 demo）并已提交，工作区干净", "测试看板中尚无该项目与批次 demo"]
        steps: ["以开发者令牌与 --writable-repo github.com/demo-org/demo-app=<演示仓库路径> 启动看板", "请求项目列表与批次 demo 的摘要，打开首页", "在演示仓库修改 demo.yaml 中一条场景的 expected（不提交），等待 10 秒后再请求批次摘要", "用 sop-verify 对演示仓库计算产品指纹，与看板登记版本的产品指纹对照"]
        expected: ["标准输出有一行 可写授权：github.com/demo-org/demo-app（<演示仓库路径>）", "项目列表中有该项目，名称为演示仓库的目录名，首页标为可写", "批次 demo 随发现建立并有版本 1，内容与 docs/sop/demo.yaml 相同，推送人为工作区，提交号为演示仓库 HEAD，dirty 为假", "docs/sop/entries.yaml 没有被当作场景文件登记，也没有不合格提示", "修改后出现版本 2，推送人为工作区，dirty 为真，该场景回到待执行", "看板登记的产品指纹与 sop-verify 计算的相同"]
        forbidden_effects: ["演示仓库中出现看板写入的文件或新提交"]
        evidence_hints: ["命令原文与完整输出", "接口响应", "演示仓库的 git status 与 git log"]

      - id: SOP-31-N01
        polarity: negative
        negative_type: incomplete-input
        title: 授权缺开发者令牌、令牌相同或路径不是仓库根目录时启动失败且不留文件
        actor: 启动看板的开发者
        priority: P0
        refs: ["I1"]
        verify: cli
        initial_state: ["演示仓库", "一个不是 Git 仓库的空目录", "一个不存在的路径", "一个已存在的空目录"]
        steps: ["带 --writable-repo 启动但不设开发者令牌", "把开发者令牌设为空字符串启动", "开发者令牌与写入令牌设为相同值启动", "把 --writable-repo 指向演示仓库的子目录 src 启动", "把 --writable-repo 指向不是 Git 仓库的目录启动", "把 --writable-repo 指向不存在的路径启动", "以已存在的空目录为数据目录，两个令牌设为相同值再启动一次"]
        expected: ["七次都以退出码 1 结束，没有输出 看板地址 行", "错误输出分别说明缺开发者令牌（前两次）、两个令牌相同（第三次与第七次）、路径不是 Git 工作区根目录并给出该路径（第四至六次）", "前六次使用的数据目录原本不存在，失败后仍不存在；已存在的空目录失败后仍为空"]
        forbidden_effects: []
        evidence_hints: ["七次命令原文与完整输出", "数据目录检查"]

      - id: SOP-31-N02
        polarity: negative
        negative_type: permission
        title: 开发者操作拒绝写入令牌、错误令牌与缺失令牌
        actor: 测试岗
        priority: P0
        refs: ["I2"]
        verify: api
        initial_state: ["授权看板已从演示仓库登记批次 demo，并上传了演示用例文件", "批次 demo 有一个失败的合并任务 T1 与一个排队中的合并任务 T2（运行名额被另外三个批次的合并任务占用）"]
        steps: ["不带令牌分别请求 POST …/batches/demo/merges、POST /api/v1/tasks/T1/retry 与 POST /api/v1/tasks/T2/cancel", "用写入令牌重复这三个请求", "用既不是写入令牌也不是开发者令牌的值请求 POST …/batches/demo/merges", "请求任务列表"]
        expected: ["不带令牌的三个请求都返回 401，error_code 为 unauthorized", "用写入令牌的三个请求都返回 403，error_code 为 admin-required", "错误令牌的请求返回 401，error_code 为 unauthorized", "没有新建任务，T1 仍为失败，T2 仍为排队中"]
        forbidden_effects: ["产生新的合并任务"]
        evidence_hints: ["请求与响应原文（令牌脱敏）", "请求前后的任务列表"]

      - id: SOP-31-N03
        polarity: negative
        negative_type: permission
        title: 未授权的项目只生成草稿，项目仓库保持原样
        actor: 开发者
        priority: P0
        refs: ["I1", "I4"]
        verify: api
        initial_state: ["不带 --writable-repo 启动的测试看板，开发者令牌已设置", "假 codex 在 PATH 最前，返回合规判断字段", "演示仓库的路径为人所知，但看板没有获得授权", "已向项目 github-com-demo-org-demo-app 的批次 demo 推送演示场景文件并附带入口声明，当前版本号为 N"]
        steps: ["记录演示仓库的 git status、分支与 worktree 列表", "上传演示用例文件，等待合并任务结束", "下载该任务的 scenario-file，请求批次摘要，再次查看演示仓库的 git status、分支与 worktree 列表"]
        expected: ["合并任务为已完成，结果是草稿，scenario-file 可下载", "批次当前版本号仍为 N", "页面上该项目标为只读", "演示仓库的 git status、分支与 worktree 列表与上传前相同"]
        forbidden_effects: ["演示仓库出现任何变化"]
        evidence_hints: ["任务接口响应", "下载的草稿", "演示仓库命令输出"]

      - id: SOP-31-P02
        polarity: positive
        title: 页面保存开发者令牌并用于开发者操作，写入令牌用法不变
        actor: 开发者
        priority: P1
        refs: ["I2"]
        verify: web
        initial_state: ["授权看板已从演示仓库登记批次 demo 并上传了演示用例文件，批次 demo 有场景版本与一个失败的合并任务", "浏览器 localStorage 中没有 sop-board.admin-token，身份栏已填写标记人与写入令牌"]
        steps: ["打开合并页，不填开发者令牌点 重新合并，再点失败任务的 重试", "在身份栏的开发者令牌栏填写开发者令牌，查看 localStorage", "在合并页点失败任务的 重试，再点 重新合并，观察请求头", "在 SOP 场景页对一条场景点 通过，观察请求头"]
        expected: ["前两次点击页面都提示 请先在身份栏填写开发者令牌，没有发出请求，任务列表没有变化", "localStorage 的 sop-board.admin-token 为所填的开发者令牌", "重试与重新合并请求的 Authorization 头为 Bearer <开发者令牌>，重试后该任务为排队中或运行中，页面显示新的或已有的合并任务", "人工标记请求的 Authorization 头仍为写入令牌，标记成功"]
        forbidden_effects: []
        evidence_hints: ["截图", "请求记录", "localStorage 内容（令牌脱敏）"]

      - id: SOP-31-P03
        polarity: positive
        title: 可重复授权多个仓库，已登记项目名称不变，未授权项目显示只读
        actor: 启动看板的开发者
        priority: P1
        refs: ["I1"]
        verify: cli
        initial_state: ["两个令牌已设置且不同", "/tmp/<随机>/app-a 与 /tmp/<随机>/app-b 都是已有一次提交的 Git 仓库根目录", "测试看板此前已接收推送，登记了项目 github.com/demo-org/app-a（推送时项目名称为 甲应用）与项目 github.com/demo-org/other（批次 b1），随后停止"]
        steps: ["以同一数据目录与 --writable-repo github.com/demo-org/app-a=<app-a 路径> --writable-repo github.com/demo-org/app-b=<app-b 路径> 启动看板", "请求项目列表", "打开首页，再打开 github.com/demo-org/other 的批次 b1 页面"]
        expected: ["标准输出有两行 可写授权：，分别为 github.com/demo-org/app-a（<app-a 路径>）与 github.com/demo-org/app-b（<app-b 路径>）", "项目列表中 app-a 的名称仍为 甲应用；app-b 为新登记的项目，名称为 app-b", "首页 app-a、app-b 显示可写，other 显示只读", "other 的批次 b1 页面显示只读"]
        forbidden_effects: ["已登记项目的名称被改为仓库目录名"]
        evidence_hints: ["命令原文与标准输出", "项目列表接口响应", "首页与批次页截图"]

      - id: SOP-31-P04
        polarity: positive
        title: 重新合并与排队或运行中的任务输入相同时返回该任务，已合并完成的输入仍新建任务
        actor: 开发者
        priority: P0
        refs: ["I2", "I4"]
        verify: api
        initial_state: ["假 codex 在 PATH 最前，每次运行等待 30 秒后写出合规判断字段", "不带 --writable-repo 启动的测试看板，开发者令牌已设置，批次 demo 已推送演示场景文件并附带入口声明", "已向批次 demo 上传演示用例文件，由此建立的合并任务 T1 为运行中"]
        steps: ["以开发者令牌请求 POST /api/v1/projects/github-com-demo-org-demo-app/batches/demo/merges", "请求 GET /api/v1/tasks?project=github-com-demo-org-demo-app&batch=demo", "等待 T1 结束后再以开发者令牌请求同一重新合并接口，并请求任务列表与新任务的任务接口"]
        expected: ["第一次重新合并返回 ok 为 true，task 的编号为 T1", "此时批次 demo 只有 T1 一个合并任务，T1 的种类为 merge，触发原因为上传用例", "T1 为已完成后，再次重新合并返回新任务 T2，种类为 merge，触发原因为重新合并，输入摘要与 T1 相同", "任务列表中出现 T2"]
        forbidden_effects: ["与运行中的 T1 输入相同时另建任务"]
        evidence_hints: ["请求与响应原文（令牌脱敏）", "每次请求后的任务列表"]

      - id: SOP-31-P05
        polarity: positive
        title: 重试失败、已中断与 Codex 不可用的任务时以相同输入重新排队
        actor: 开发者
        priority: P0
        refs: ["I2", "I3"]
        verify: api
        initial_state: ["不带 --writable-repo 启动的测试看板，开发者令牌已设置，批次 r1、r2、r3 各已推送演示场景文件（附带入口声明）并上传演示用例文件", "r1 的合并任务 T1 因假 codex 以退出码 1 结束而为失败；r2 的合并任务 T2 因看板在其运行期间重启而为已中断；r3 的合并任务 T3 因 PATH 中没有 codex 而为 Codex 不可用", "假 codex 已放回 PATH 最前，此后每次运行等待 10 秒后写出合规判断字段"]
        steps: ["记录三个任务的输入摘要", "以开发者令牌依次请求 POST /api/v1/tasks/T1/retry、T2/retry 与 T3/retry", "立即请求三个任务的任务接口，等待 20 秒后再请求一次"]
        expected: ["三次请求都返回 ok 为 true，三个任务随即为排队中或运行中", "三个任务的编号与输入摘要与重试前相同", "20 秒后三个任务都为已完成"]
        forbidden_effects: ["重试时改用新的输入"]
        evidence_hints: ["请求与响应原文（令牌脱敏）", "重试前后的任务接口响应"]

      - id: SOP-31-P06
        polarity: positive
        title: 放弃排队中、运行中、已中断、待同步与待补充的任务，运行中的进程组被终止
        actor: 开发者
        priority: P0
        refs: ["I2", "I3"]
        verify: api
        initial_state: ["执行者事先用不同设置的假 codex 在授权看板中准备出：批次 c3 的已中断任务 T3；演示仓库批次 demo 的待同步任务 T4（合并运行期间把 docs/sop/demo.yaml 改为不合格内容）；批次 c5 的待补充任务 T5", "随后假 codex 改为卡住：运行时另起一个子进程，二者都记录进程号并一直等待", "批次 c1、c6、c7 的合并任务 T1、T6、T7 为运行中，批次 c2 的合并任务 T2 为排队中"]
        steps: ["记录 docs/sop/demo.yaml 的 sha256", "以开发者令牌依次请求 POST /api/v1/tasks/<编号>/cancel 放弃 T2、T1、T3、T4、T5", "按记录的进程号检查 T1 的假 codex 与其子进程", "等待 10 秒后请求五个任务的任务接口，查看 T2 的任务目录与 docs/sop/demo.yaml"]
        expected: ["五次请求都返回 ok 为 true，五个任务都为已放弃", "T1 的假 codex 与其子进程都已不存在", "T2 的任务目录中没有 events.jsonl，T2 没有启动过 Codex", "docs/sop/demo.yaml 的 sha256 与放弃前相同", "10 秒后五个任务仍为已放弃"]
        forbidden_effects: ["已放弃的任务再次运行或写入演示仓库"]
        evidence_hints: ["请求与响应原文（令牌脱敏）", "进程列表", "任务目录清单", "demo.yaml 前后的 sha256"]

      - id: SOP-31-P07
        polarity: positive
        title: 运行中每 5 秒发现工作区新内容，同一内容只登记一次
        actor: 启动看板的开发者
        priority: P1
        refs: ["I1"]
        verify: api
        initial_state: ["演示仓库中另写了一份合格的 docs/sop/demo.yaml（批次 demo）并已提交，工作区干净", "授权看板已启动并登记批次 demo 的版本 1"]
        steps: ["修改 demo.yaml 中一条场景的 expected（文件仍合格，不提交），等待 10 秒后查看批次 demo 的场景版本", "以完全相同的内容重写该文件，等待 10 秒后再查看", "用 sop-verify 向看板推送另一份合格内容 V3，随后把与 V3 相同的内容写入 docs/sop/demo.yaml，等待 10 秒后再查看"]
        expected: ["第一次修改后出现版本 2，推送人为工作区，提交号为演示仓库 HEAD，dirty 为真", "重写相同内容后没有新版本", "V3 由推送登记为版本 3；写入工作区后没有再登记推送人为工作区的版本"]
        forbidden_effects: ["同一内容登记为两个版本"]
        evidence_hints: ["每一步后的批次版本信息", "演示仓库的 git status 与 git rev-parse HEAD"]

      - id: SOP-31-P08
        polarity: positive
        title: 授权仓库的产品指纹与 sop-verify 相同，只随产品文件变化
        actor: 启动看板的开发者
        priority: P0
        refs: ["D2", "I1"]
        verify: cli
        initial_state: ["演示仓库已提交 .gitignore（忽略 build/）与一份合格的 docs/sop/demo.yaml（批次 demo）；另有已修改未提交的 src/app.py、未跟踪且未忽略的 notes.txt 与被忽略的 build/out.log", "授权看板已启动并登记批次 demo 的版本 1，记下看板为该版本登记的产品指纹 F1"]
        steps: ["在演示仓库用 sop-verify 计算产品指纹，与 F1 对照，并查看版本 1 的 dirty", "修改 demo.yaml 中一条场景（仍合格）、docs/sop/entries.yaml 与 build/out.log，等待 10 秒后读取新版本的产品指纹 F2，并用 sop-verify 计算", "删除已跟踪的 README.md（不提交），再修改 demo.yaml，等待 10 秒后读取新版本的产品指纹 F3，并用 sop-verify 计算", "新增未跟踪文件 extra.txt，再修改 demo.yaml，等待 10 秒后读取新版本的产品指纹 F4，并用 sop-verify 计算"]
        expected: ["F1 与 sop-verify 的计算结果相同，版本 1 的 dirty 为真", "F2 等于 F1，且与 sop-verify 的计算结果相同", "F3 不等于 F2，F4 不等于 F3，二者分别与 sop-verify 在相同仓库状态下的计算结果相同"]
        forbidden_effects: []
        evidence_hints: ["两种计算的输出", "接口响应", "每一步的 git status"]

      - id: SOP-31-N04
        polarity: negative
        negative_type: invalid-input
        title: 授权参数写法或运行时限取值不合规时启动失败
        actor: 启动看板的开发者
        priority: P1
        refs: ["I1", "I3"]
        verify: cli
