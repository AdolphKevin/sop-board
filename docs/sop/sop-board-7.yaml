# SOP-BOARD-7：v9 主流程的验收场景
# 预期依据 docs/proposals/2026-10-20-v9-workspace.md（v9）D30–D35 与 docs/designs/SOP-BOARD-7.md（修订 1）。按验证分级只写业务流程；页面文案、接口字段等细节由快速组测试覆盖。
# "单仓工作区"：执行者把本仓 clone 到临时目录作为被测项目；"多仓演示工作区"：执行者新建的临时目录，含两个 Git 仓库 app（HTTP 服务，引用 lib）与 lib（被 app 调用的函数，含一处植入缺陷），主工作区均在 main 且干净。
# 搭建由新开的代理会话按 `sop-board guide` 完成；执行者在搭建完成前不手写配置。SOP-76 为真实项目轮次，由 AdolphKevin 执行，流程与缺陷到时由他确认。

metadata:
  requirement: "sop-board v9：工作区与项目适配、免令牌、跨仓修复、用例分层"
  batch: "sop-board-7"
  version: 1
  owner: "AdolphKevin"
  sources:
    - ref: "docs/proposals/2026-10-20-v9-workspace.md 的 D30–D35"
      version: "v9（2026-10-20）"
      confirmed_by: "AdolphKevin"
  tags: ["sop-board", "v9"]

sops:
  - id: SOP-71
    title: 代理搭建并启动看板
    actor: 开发者
    entry: 在工作区打开的代理会话与 sop-board 命令
    scenarios:
      - id: SOP-71-P01
        polarity: positive
        title: 代理按随包指引为单仓工作区搭建，自检通过后启动
        actor: 开发者
        priority: P0
        verify: agent
        initial_state: ["单仓工作区已准备，本机没有该工作区的看板目录", "sop-board 候选版可用 uv tool install 从本地检出安装"]
        steps: ["在单仓工作区打开新的代理会话，说：按 sop-board 的安装说明为这个工作区安装并搭建", "回答代理的提问", "代理报告后运行 sop-board check，再运行 sop-board"]
        expected: ["代理运行了 sop-board guide，并只在 ~/.sop-board/<工作区名>/ 下写文件", "sop-board check 六步全部通过，退出码 0", "代理的报告分为已验证的事实、推断及依据、待回答的问题", "sop-board 启动后页面显示环境就绪，页面与启动过程没有任何令牌输入"]
        forbidden_effects: ["工作区内的仓库出现新文件或改动", "执行者手写配置"]
      - id: SOP-71-N01
        polarity: negative
        negative_type: duplicate
        title: 适配要用的端口已被占用时自检列出占用者
        actor: 开发者
        priority: P1
        verify: cli
        initial_state: ["SOP-71-P01 的搭建已完成", "另一个进程监听适配声明的端口"]
        steps: ["运行 sop-board check", "运行 sop-board 并打开页面"]
        expected: ["自检的端口一步失败，写出占用端口的进程，退出码 1", "页面显示自检未通过，执行与修复保持停用"]
        forbidden_effects: ["看板结束或改动占用端口的进程"]

  - id: SOP-72
    title: 上传用例、合并并在适配环境中执行
    actor: 测试同事、开发者
    entry: 看板页面
    scenarios:
      - id: SOP-72-P01
        polarity: positive
        title: 只填标记人上传用例，看板合并后在适配环境中执行
        actor: 测试同事
        priority: P0
        verify: web
        initial_state: ["SOP-71-P01 的看板运行中，环境就绪", "执行者准备 5 条描述该工作区业务流程的用例文件"]
        steps: ["打开看板，只填标记人", "上传用例文件", "等待合并与执行完成"]
        expected: ["每条用例生成同编号场景并写入配置的场景目录", "执行任务使用运行中的环境，每条场景有结果与证据", "页面显示 Agent 已测完及通过与不通过数量"]
        forbidden_effects: ["执行改动工作区仓库中的产品文件", "页面要求输入令牌"]
      - id: SOP-72-N01
        polarity: negative
        negative_type: stale-input
        title: 涉及的仓库有未提交的产品改动时执行等待提交，提交后用新代码重启环境再执行
        actor: 开发者
        priority: P1
        verify: web
        initial_state: ["SOP-72-P01 已完成", "执行者在工作区仓库改动一个产品文件且未提交"]
        steps: ["点执行待执行场景", "提交该改动"]
        expected: ["任务显示待提交并列出该仓库与文件", "提交后环境先以新提交重启，再开始执行"]
        forbidden_effects: ["在未提交的代码上登记执行结果"]

  - id: SOP-73
    title: 复核与访问范围
    actor: 测试同事
    entry: 看板页面（本机与内网）
    scenarios:
      - id: SOP-73-P01
        polarity: positive
        title: 复核时一键通过，不通过只填缺陷链接
        actor: 测试同事
        priority: P0
        verify: web
        initial_state: ["SOP-72-P01 已完成"]
        steps: ["在 SOP 场景页对一条场景点通过", "对另一条选不通过并填缺陷链接"]
        expected: ["两条状态就地更新，页面不跳转", "不通过的场景进入问题队列"]
        forbidden_effects: ["要求填写令牌或标记人以外的身份信息"]
      - id: SOP-73-N01
        polarity: negative
        negative_type: permission
        title: 内网与跨站请求不能触发开发者操作
        actor: 内网同事
        priority: P0
        verify: api
        initial_state: ["看板以 --lan 运行，执行者用本机的内网地址访问"]
        steps: ["用内网地址打开页面并复核一条场景", "用内网地址请求执行接口", "用本机地址请求执行接口但带另一个站点的 Origin"]
        expected: ["内网页面可以查看与复核，不显示开发者按钮与环境日志", "两次执行请求都返回 403，环境与任务没有变化"]
        forbidden_effects: ["启动执行或修复任务"]

  - id: SOP-74
    title: 跨仓修复、复测与合入
    actor: 开发者
    entry: 看板页面与多仓演示工作区
    scenarios:
      - id: SOP-74-P01
        polarity: positive
        title: 根因在 lib 的缺陷由一个修复任务跨仓修复，复测通过后合入并用基线重启
        actor: 开发者
        priority: P0
        verify: web
        initial_state: ["多仓演示工作区已由代理搭建并启动看板", "一条调用 lib 的场景因植入缺陷执行失败"]
        steps: ["测试同事把该场景标为不通过并填缺陷链接", "等待修复任务结束"]
        expected: ["任务目录含 app 与 lib 两个 worktree，适配准备已运行", "根因分析指出 lib 中的文件，只有 lib 产生提交", "lib 的快速检查通过后，环境用 worktree 启动，新会话复测通过", "lib 的 main 快进到修复提交，app 的 main 不变，环境用基线目录重启", "场景回到复测队列"]
        forbidden_effects: ["复测通过前任何仓库的 main 改变", "推送到远端"]
      - id: SOP-74-N01
        polarity: negative
        negative_type: concurrency
        title: 有一个仓库不能快进时都不合入
        actor: 开发者
        priority: P1
        verify: web
        initial_state: ["与 SOP-74-P01 相同，修复同时改动 app 与 lib", "复测期间执行者在 app 的主工作区留下未提交的产品改动"]
        steps: ["等待修复任务结束"]
        expected: ["任务停在待开发者合入，逐仓列出原因", "app 与 lib 的 main 都没有变化"]
        forbidden_effects: ["只合入其中一个仓库"]
      - id: SOP-74-N02
        polarity: negative
        negative_type: other
        title: 根因在本机配置时转给开发者
        actor: 开发者
        priority: P1
        verify: web
        initial_state: ["多仓演示工作区中，app 的被 Git 忽略的本机配置把 lib 服务地址写错"]
        steps: ["把受影响的场景标为不通过", "等待修复任务"]
        expected: ["修复会话判为环境或配置问题，指出配置项，任务转待开发者处理"]
        forbidden_effects: ["产生代码提交", "页面或报告中出现配置文件里的凭证值"]

  - id: SOP-75
    title: 用例分层与报告
    actor: 测试同事、开发者
    entry: 看板页面
    negative_exempt: "分类错误由开发者在合并页改类别，属于 P01 的一部分；格式校验由快速组测试覆盖"
    scenarios:
      - id: SOP-75-P01
        polarity: positive
        title: 细节类用例列入交给单元测试，报告列出它们
        actor: 测试同事
        priority: P1
        verify: web
        initial_state: ["SOP-72-P01 的看板运行中"]
        steps: ["上传含 3 条流程类与 2 条字段格式类用例的文件", "开发者把一条被判为细节类的用例改为流程类", "导出报告"]
        expected: ["合并页两栏显示两类用例，每条附理由；细节类不生成场景", "改类别后重新合并，该用例生成场景", "报告的用例覆盖标出细节类用例，未验证范围列出它们"]
        forbidden_effects: ["细节类用例进入执行"]

  - id: SOP-76
    title: 真实多仓项目上的主流程
    actor: AdolphKevin
    entry: 真实项目工作区
    negative_exempt: "反向情形按验收计划 N1–N3 在同一轮执行，场景内容到时由 AdolphKevin 确认"
    scenarios:
      - id: SOP-76-P01
        polarity: positive
        title: 在真实多仓项目上走通搭建到合入
        actor: AdolphKevin
        priority: P0
        verify: agent
        initial_state: ["按验收计划第 3 节准备试跑工作区", "流程、用例与缺陷由 AdolphKevin 在该环节确认"]
        steps: ["按验收计划 E1–E8 执行"]
        expected: ["验收计划 E1–E8 的预期全部成立"]
        forbidden_effects: ["改动日常开发目录或分支", "推送到远端"]
