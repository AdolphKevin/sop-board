          - "工作台与业务 SOP 页的展开收起互相影响"
          - "展开或收起时浏览器向看板发出写入请求"
        refs: ["docs/design.md#已定决策（2026-11-10 用户答复）", "docs/design.md#看板：三栏场景工作台（问题 2）", "使用者 2026-11-11 需求（cw2 实际使用复盘）"]
        evidence_hints: ["内网设备各步骤的截图与页面文本", "左栏滚动位置读数", "浏览器请求记录（轮询请求，没有写入请求）"]
      - id: WB-05-P02
        polarity: positive
        title: 有筛选或搜索时，一键展开收起只作用于当前显示的结果，不改记住的状态
        actor: 测试同学
        priority: P1
