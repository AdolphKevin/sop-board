    must:
      - "结论（Agent 的通过与失败、人工标注、修复关闭）在产品内共享：一台机器登记后，同一分支的其他机器看到相同的状态"
      - "证据文件留在产出它的机器上：别的看板的页面直接从产出机器的看板读取；那台看板没开、没加 --lan 或地址失效时，显示“证据在 <机器显示名> 的机器上”"
