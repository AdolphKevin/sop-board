          - "内网设备的浏览器从未打开过本看板（localStorage 为空），窗口高度已缩小到全部展开时左栏树出现纵向滚动条"
        steps:
          - "在内网设备打开 /p/demo，查看左栏树各文件与节点的展开状态和切换按钮的文字"
          - "点切换按钮"
          - "刷新页面；再停留 20 秒，期间浏览器至少发出一次轮询请求"
          - "手动展开 shop 文件与其中的 SHOP-W1 节点，查看切换按钮；点击 shop#W"
          - "点「全部展开」，把左栏树向下滚动一段并记录滚动位置，点击树中靠下的一条场景"
          - "手动收起 draft-a 文件，查看切换按钮；刷新页面"
          - "打开业务 SOP 页，查看左栏树与切换按钮；点「全部展开」，再点「全部收起」，刷新页面；再回到工作台"
