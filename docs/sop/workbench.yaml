# v10 现行场景：三栏场景工作台（场景树、筛选、详情、证据、复测标注、待人工复核与人工确认率、内网范围、本机 AI 重跑）
# 预期依据：docs/design.md（2026-11-10 blur.yin 批准）。版本 1 由未参与实现的审核方在实现前编写；实现与返工会话只读本文件。
#   版本 3 按 docs/design.md 已定决策 13（补回人工复核，2026-11-10 blur.yin 批准）与 docs/reference.md 的统计口径，由未参与实现的审核方在实现前修订。
#   版本 4 由未参与实现的审核方按 docs/design.md 已定决策 15～17（使用者 2026-11-11 需求）修订：新增 WB-05（左栏一键全部展开或收起、隐藏与显示左栏）。
#   版本 5 由未参与实现的审核方按 docs/design.md 已定决策 18（使用者 2026-11-11 决定）修订：代码改动不改变场景状态，删除“守护通过”筛选与保留通过；
#   “已有结果”中 shop#A 在旧快照上的通过现为通过并待人工复核；“复核样本”与 WB-04 改为待人工复核不随代码改动消失、人工标注按 of_result 配对。
#   版本 6 由未参与实现的审核方按 docs/design.md 已定决策 19、20（使用者 2026-11-12 需求与决定）修订：新增 WB-06（左栏拖拽调宽、标题悬停显示全文）；
#   WB-03 的内网写入范围加入同意与撤销自己的同意。草稿审阅的场景在 authoring.yaml 的 AUT-02。
#   版本 7 由未参与实现的审核方按 docs/design.md 已定决策 22（使用者 2026-11-12 决定）修订：新增 WB-07（最近一次未执行、执行时停着的服务、本机页面的服务状态）。
#   WB-07 中的“库存演示项目”与 stock#S 见 environment.yaml 文件头。
#   版本 8 由未参与实现的审核方按 docs/design.md 已定决策 21（使用者 2026-11-12 决定）修订：结论按分支归属、本分支优先，“已有结果”中 wt1 的那条结果由 shop#B 改为 shop#A，
#   WB-01-P01 的检出切换改为“本分支有结论用本分支的，没有的用其他分支的并标出来源”；新增 WB-08（跨机器查看结果与证据、别的机器上的受阻不改变本机状态、另一分支的失败不覆盖本分支）。
#   “双机结果”（WB-08 使用，双机项目见 setup.yaml 文件头）：A 在 main 分支提交了运行 RA（执行者 TA、实现者 I1，独立验收）：shop#A 通过（附请求响应证据）、
#   shop#W 通过（附截图与录像）、shop#X 失败；B 没有提交过运行；两边都没有守护与人工标注。
# 共用前置：演示项目同 setup.yaml 文件头（项目 demo 是数据目录 $D 中唯一的项目）；看板已以 sop-board serve demo --data $D --lan 启动。
#   “内网”指另一台设备用 --lan 打印的实际非回环地址访问；“本机”指回环地址。
#   “业务 SOP 页”指看板的 SOP 原文页，演示项目中列出 app 场景目录下的 refund.md 与 refund-待确认问题.md。
#   左栏树的“分组”指可展开或收起的项：工作台中是文件与节点，业务 SOP 页中是各文档及其树上可展开的各项。
#   “已有结果”：main 上 shop#X 为失败（Agent 结果，附请求响应证据），shop#W 为通过（附截图、录像与 trace），shop#A 的通过取证于旧快照
#   （之后 app 有一次提交）且没有守护，shop#B 未执行；另有一份草稿文件 draft-a；wt1 检出（分支 wt1）已建立并有一条 shop#A 的通过结果。
#   其中 shop#W 的通过（当前快照）与 shop#A 的通过（旧快照）都是 Agent 经演示项目入口的独立验收通过（执行者 T1、实现者 I1）；
#   wt1 中 shop#A 的通过是实现者自检；main 与 wt1 都还没有任何人工标注。由此 main 的确认率样本恰为这 2 条通过，shop#A 与 shop#W 都待人工复核。
#   “复核样本”：重新生成的演示项目，main 上依次有：快照 S0 上运行 R0（执行者 T0、实现者 I1）对 shop#W 的 Agent 独立通过；
#   在 app 的 README.md 加一行并提交得到快照 S1 后，运行 R1（执行者 T1、实现者 I1）实际执行 shop#A 并通过，执行期间在 lib 的 refundlib/__init__.py
#   末尾加一行注释并提交（快照变为 S2，R1 中 shop#A 的结果记有该路径的 product_changed）；运行 R2（执行者 T2，--implementer T2）执行 shop#B 并通过（实现者自检）。
#   shop#X 未执行；没有守护，也没有任何人工标注。由此 main 的确认率样本恰为 R0 的 shop#W 与 R1 的 shop#A 两条。
#   比率写作“分子/分母（百分比）”，只核对分子与分母的数值，不限定排版。

metadata:
  requirement: "sop-board v10：测试同学在三栏场景工作台按场景找到、查看四要素与证据、复测标注并查看历史，按“待人工复核”找到待复核的 Agent 独立通过并看到人工确认率与复核覆盖，内网全程可用；工作台与业务 SOP 页的左栏树可一键全部展开或收起，左栏可隐藏与恢复、可拖拽调宽，标题悬停显示全文，状态记在浏览器中；内网只显示业务字段，不能发起 AI 重跑"
  version: 8
  owner: "blur.yin"
  status: confirmed
  sources:
    - ref: "docs/design.md"
      version: "2026-11-10"
      confirmed_by: "blur.yin"
    - ref: "使用者 2026-11-10 对工作台试用的反馈"
      version: "2026-11-10"
      confirmed_by: "blur.yin"
    - ref: "docs/design.md 已定决策 13：补回人工复核（待人工复核徽标与筛选、Agent 独立通过的人工确认率与复核覆盖）"
      version: "2026-11-10"
      confirmed_by: "blur.yin"
    - ref: "使用者 2026-11-11 需求（cw2 实际使用复盘：左栏展开收起与隐藏、真人完成后不关浏览器、声明的测试账号即授权）"
      version: "2026-11-11"
      confirmed_by: "blur.yin"
    - ref: "docs/design.md 已定决策 18：验收范围由业务变化决定（代码改动不改变场景状态，待人工复核不随代码改动消失，删除守护通过与保留通过）"
      version: "2026-11-11"
      confirmed_by: "blur.yin"
    - ref: "docs/design.md 已定决策 19、20：左栏可调宽度；草稿审阅并入工作台（使用者 2026-11-12 需求与决定）"
      version: "2026-11-12"
      confirmed_by: "blur.yin"
    - ref: "docs/design.md 已定决策 22：环境按产品来（最近一次未执行、执行时停着的服务、服务状态）"
      version: "2026-11-12"
      confirmed_by: "blur.yin"
    - ref: "docs/design.md 已定决策 21：多人共享验收记录（结论按分支归属、本分支优先，非结论只影响产出它的检出，证据留在产出机器）"
      version: "2026-11-12"
      confirmed_by: "blur.yin"
  tags: ["workbench", "web", "lan", "annotation", "review", "sidebar", "resize"]

sops:
  - id: WB-01
    title: 在场景树中按状态、搜索和检出找到场景
    actor: 测试同学
    entry: "看板 / 与 /p/demo?checkout=<名称>"
    negative_exempt: "只读浏览；内网访问范围的拒绝分支见 WB-03-N01"
    scenarios:
      - id: WB-01-P01
        polarity: positive
        title: 状态筛选（含待人工复核）计数与命令行一致，概况显示复核统计，检出切换与分享链接可用
        actor: 测试同学
        priority: P1
        verify: web
        initial_state: ["演示项目处于“已有结果”"]
        steps:
          - "本机浏览器打开 /"
          - "查看左栏 文件→节点→场景 树与顶部各状态筛选的计数，并与 sop-board status 和 sop-board status --json 对照"
          - "点筛选“失败”，再点筛选“待人工复核”，再清除筛选并搜索 shop#W 的标题中的一个词"
          - "打开工作台概况，查看待人工复核数、Agent 独立通过的人工确认率与复核覆盖"
          - "用检出切换选 wt1，查看“待人工复核”筛选计数与概况"
          - "复制 shop#W 详情页的地址，在新标签页打开"
        expected:
          - "/ 直接进入 /p/demo 工作台"
          - "树按 文件→节点→场景 排列，每条场景带状态点；筛选项为 待复测、失败、待人工复核、待沉淀、通过、未执行、草稿，各带计数，与命令行一致（shop#A 与 shop#W 计入通过，待复测计数为 0，draft-a 的场景计入草稿）"
          - "“失败”筛选只列 shop#X；“待人工复核”筛选计数为 2、只列 shop#A 与 shop#W；搜索结果包含 shop#W"
          - "树中 shop#W 与 shop#A 都显示通过并带“待人工复核”标记；shop#A 的状态原因中没有“产品已变化”一类表述"
          - "status 文字输出含“待人工复核 2”；status --json 的 review 为 2，review_queue 只含 shop#A 与 shop#W"
          - "main 的概况显示待人工复核 2；复核覆盖为 0/2（0%），人工确认率还没有人工结论的样本（分母为 0）"
          - "切换后地址带 checkout=wt1：shop#A 显示 wt1 分支自己的通过，不带“待人工复核”（它是实现者自检通过）；shop#X 与 shop#W 在 wt1 分支上没有结论，显示 main 分支的失败与通过，并在状态旁标出来源分支 main；shop#B 为未执行"
          - "wt1 的“待人工复核”计数为 1（只有 shop#W），概况的复核覆盖为 0/1"
          - "分享地址带 #shop#W，在新标签页直接打开 shop#W 详情"
        forbidden_effects:
          - "页面出现 批次、轮次、待同步、已作废、沿用、执行入口、任务状态、守护通过、保留通过 等术语"
          - "shop#A 因取证之后的产品提交显示为待复测或不带“待人工复核”"
          - "wt1 分支自己有结论的 shop#A 显示成 main 分支的结果，或把 main 分支那条 shop#A 的通过计入 wt1 的待人工复核与复核统计"
          - "来自 main 分支的结果没有标出来源分支"
          - "“待人工复核”标记取代或隐藏“通过”状态"
        refs: ["docs/design.md#看板：三栏场景工作台（问题 2）", "docs/design.md#场景状态（按检出推导，不存储）", "docs/reference.md#场景状态", "docs/reference.md#10. 报告与看板页面"]
        evidence_hints: ["工作台截图与页面文本", "status 与 status --json 输出"]

      - id: WB-01-P02
        polarity: positive
        title: 点击场景只切换右栏详情，左栏树的展开状态与滚动位置保持不变
        actor: 测试同学
        priority: P1
        verify: web
        initial_state: ["演示项目处于“已有结果”", "浏览器窗口高度已缩小到左栏树出现纵向滚动条", "左栏树中至少有一个节点被折叠"]
        steps:
          - "本机浏览器打开 /p/demo，手动折叠一个节点并把左栏树向下滚动一段，记录各节点展开或折叠的状态与滚动位置"
          - "点击树中靠下的一条场景"
          - "再点击另一条场景，并回到上一条"
        expected:
          - "每次点击后右栏显示被点击场景的详情，地址带该场景的 #<场景键>"
          - "点击前后左栏树各节点的展开或折叠状态不变，先前折叠的节点仍然折叠"
          - "点击前后左栏树的滚动位置不变，没有回到最上面"
        forbidden_effects: ["点击场景后所有节点被展开", "点击场景后左栏树滚动回到最上面"]
        refs: ["使用者 2026-11-10 对工作台试用的反馈"]
        evidence_hints: ["点击前后的截图与页面文本", "左栏树滚动位置的读数"]

  - id: WB-02
    title: 测试同学从内网复测并标注
    actor: 测试同学
    entry: "内网地址上的工作台场景详情"
    negative_exempt: "缺陷链接与姓名均不必填，原有的“缺链接被拒绝”分支已取消；复测通过、不通过、阻塞、需求变更四种状态没有对应的业务拒绝；跨源或非 JSON 的标注请求被拒见 WB-03-N01"
    must:
      - "右栏顺序固定：标题与徽标、当前状态与原因、四要素（预期与禁止逐条并附守护覆盖标记）、最新结果与证据、复测标注、本机按钮、历史"
      - "复测状态可选 通过、不通过、阻塞、需求变更；缺陷链接和复测人姓名都不必填"
      - "复测人姓名在页面上填一次，所有场景共用，不需要再填第二次，除非使用者主动修改；姓名存在浏览器 localStorage"
      - "复测标注表单中每个输入框独占一行，不与其他输入框并排"
      - "Agent 独立真实入口通过、尚无人工标注的通过场景带“待人工复核”；任一人工标注后消失；人工标注不通过时场景直接显示为失败"
      - "Agent 独立通过的人工确认率与复核覆盖内网与本机显示相同的数值"
    scenarios:
      - id: WB-02-P01
        polarity: positive
        title: 内网找到失败场景，看完证据标注不通过，再标注另一条通过并查看历史
        actor: 测试同学
        priority: P0
        verify: web
        initial_state: ["演示项目处于“已有结果”", "测试同学的浏览器从未打开过本看板（localStorage 为空）"]
        steps:
          - "在另一台设备打开内网地址，点筛选“失败”，打开 shop#X"
          - "从上到下阅读右栏：标题徽标、状态原因、起点、步骤、预期、禁止、最新结果与证据"
          - "在复测标注表单选“不通过”，填缺陷链接 https://issues.example/DEMO-2 和姓名 张测，提交"
          - "刷新页面，展开历史"
          - "打开 shop#W，查看状态栏与“待人工复核”筛选计数，播放录像、打开 trace，选“通过”提交"
          - "刷新页面，查看 shop#W 的状态栏、“待人工复核”筛选计数与工作台概况；本机同时打开概况对照"
        expected:
          - "右栏依次为：标题与 P 级、入口、正反向徽标；当前状态与原因；起点、步骤、预期、禁止（预期与禁止逐条列出）；最新结果与证据画廊；复测标注表单；历史（折叠）"
          - "复测标注表单的状态选项包含 通过、不通过、阻塞、需求变更"
          - "shop#X 的证据画廊显示请求与响应"
          - "提交后 shop#X 显示失败并附缺陷链接 https://issues.example/DEMO-2；历史中有 张测 的不通过标注与时间，原 Agent 结果仍在"
          - "shop#W 的录像在页面内播放、可拖动进度（视频请求返回 206 分段响应），trace 可打开"
          - "标注 shop#W 时没有再输入姓名，提交后历史中有 张测 的通过标注"
          - "标注前内网 shop#W 显示通过并带“待人工复核”，“待人工复核”计数为 2；标注后 shop#W 仍为通过，“待人工复核”标记消失，计数为 1（只剩 shop#A）"
          - "内网概况的 Agent 独立通过的人工确认率为 1/1（100%）、复核覆盖为 1/2（50%），与本机概况数值相同；shop#X 的不通过标注不计入（它的 Agent 结果是失败）"
          - "results 表中两条标注为 kind=manual 的新行"
        forbidden_effects: ["要求填写姓名以外的身份信息", "标注改写或删除原 Agent 结果", "第二个场景的标注仍要求重新输入姓名", "标注后 shop#W 仍显示“待人工复核”"]
        refs: ["docs/design.md#看板：三栏场景工作台（问题 2）", "docs/design.md#场景状态（按检出推导，不存储）", "docs/design.md#署名", "docs/reference.md#10. 报告与看板页面"]
        evidence_hints: ["内网设备截图与页面文本", "视频请求的响应头", "results 表只读查询"]
      - id: WB-02-P02
        polarity: positive
        title: 不填缺陷链接和姓名也能对待人工复核的 Agent 通过标注不通过，场景直接显示失败
        actor: 测试同学
        priority: P1
        verify: web
        initial_state: ["演示项目处于“已有结果”", "内网浏览器的 localStorage 为空，没有填过姓名"]
        steps: ["内网打开 shop#W（通过，带“待人工复核”），选“不通过”，缺陷链接与姓名都留空，提交", "刷新页面，展开历史，查看“待人工复核”与“失败”筛选计数和工作台概况"]
        expected:
          - "提交成功，没有要求填写缺陷链接或姓名的提示"
          - "shop#W 直接显示失败，不再带“待人工复核”；历史中新增一条不通过标注及时间，原 Agent 结果仍在"
          - "“待人工复核”计数为 1（只剩 shop#A）；“失败”筛选列出 shop#X 与 shop#W"
          - "概况的人工确认率为 0/1（0%），复核覆盖为 1/2（50%）"
          - "results 表新增一条 kind=manual 的行"
        forbidden_effects: ["因缺陷链接为空而拒绝提交", "因姓名为空而拒绝提交", "人工不通过后 shop#W 仍显示通过或待人工复核"]
        refs: ["使用者 2026-11-10 对工作台试用的反馈", "docs/design.md#场景状态（按检出推导，不存储）", "docs/design.md#已定决策（2026-11-10 用户答复）"]
        evidence_hints: ["内网设备截图与页面文本", "results 表只读查询"]
      - id: WB-02-P03
        polarity: positive
        title: 把场景标注为阻塞或需求变更
        actor: 测试同学
        priority: P1
        verify: web
        initial_state: ["演示项目处于“已有结果”", "内网浏览器已存有姓名 张测"]
        steps:
          - "内网打开 shop#B，选“阻塞”，缺陷链接留空，提交"
          - "打开 shop#W（通过，带“待人工复核”），选“需求变更”，缺陷链接留空，提交"
          - "刷新页面，分别展开两个场景的历史，查看“待人工复核”筛选计数与工作台概况"
          - "本机 GET /api/board，查看 counts.review 与 stats"
        expected:
