          - "点击后全部文件与节点收起，树中只剩文件行，按钮变为「全部展开」"
          - "刷新后与轮询后树仍全部收起，按钮仍为「全部展开」"
          - "手动只展开 shop 与 SHOP-W1 后按钮仍为「全部展开」；点击 shop#W 后右栏显示其详情，shop 与 SHOP-W1 仍展开，其余文件与节点仍收起"
          - "点「全部展开」后全部文件与节点展开，按钮变为「全部收起」；点击靠下的场景后右栏显示该场景，各分组仍全部展开，左栏滚动位置不变"
          - "手动收起 draft-a 后按钮变为「全部展开」；刷新后 draft-a 仍收起，其余文件与节点仍展开"
          - "业务 SOP 页首次打开时按该页的缺省状态显示：只展开当前打开的文档，其余文档收起，按钮显示「全部展开」，不受工作台展开收起的影响"
          - "在业务 SOP 页点「全部展开」后该页全部分组展开、按钮变为「全部收起」；再点后全部分组收起、按钮变为「全部展开」；刷新后该页仍全部收起"
          - "回到工作台时树仍为 draft-a 收起、其余展开，不受业务 SOP 页操作的影响"
