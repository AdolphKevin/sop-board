          - "点击后当前显示的 shop 文件与 SHOP-R1 节点收起，按钮变为「全部展开」"
          - "清除筛选后树立即按记住的状态显示：全部文件与节点展开（包括筛选时被收起的 shop 与 SHOP-R1），按钮为「全部收起」；刷新后仍是如此"
          - "搜索时点切换按钮只改变搜索结果中显示的分组"
