# SOP-BOARD-2：人工复核改版与用例协作的验收场景
# 预期只依据本仓 docs/proposals/2026-10-19-standalone-sop-verification.md（v8）与 docs/designs/SOP-BOARD-2.md 的 I1–I6、D1，不依据当前实现的输出。
# 版本 1（2026-10-19）：Claude 依据上述两份原文编写，经 AdolphKevin 授权由 Claude 代批；按测试代理 sop-board-1-tester 确认延期时提出的条件加强了 SOP-22-P01、SOP-22-N01、SOP-22-N02。
# 版本 2（2026-10-19）：按测试代理 sop-board-2-tester 的 61 条用例与 SOP-BOARD-1 测试代理的 9 条标记用例核对覆盖，补充 36 条场景、修改 16 条，依据方案修订 3，经 AdolphKevin 授权由 Claude 代批。
# 真实 Jira 的接入验证按 AdolphKevin 2026-10-19 的决定延到外部接入阶段，本文件只以模拟 Jira 验证。
#
# 下文"测试看板"指：clone 的 sop-board 检出目录已 uv sync，SOP_BOARD_TOKEN 已设置，用 uv run sop-board --data <新的临时目录> --port <空闲端口> 启动，
# SOP_BOARD_URL 指向它。"演示场景文件"指批次 demo 的 demo.yaml：节点 N1、N2，场景 N1-P01、N1-N01、N2-P01、N2-N01，
# 推送时项目身份为 github.com/demo-org/demo-app，项目键为 github-com-demo-org-demo-app。
# "演示轮次"指按 SOP-BOARD-1 的接口登记的一个 Agent 轮次：N1-P01 pass、N1-N01 fail、N2-P01 pass、N2-N01 blocked（finding 为"环境未就绪"）。
# "演示用例文件"指符合测试岗 Schema 的 cases-a.yaml：metadata 含 module、feature、owner、last_reviewed；test_cases 含 TC_DEMO_LOGIN_001（tags 含 section:登录、happy-path）、
# TC_DEMO_LOGIN_002（section:登录、negative）、TC_DEMO_ORDER_001（section:订单、happy-path）。
# "模拟 Jira"指执行者在本机启动的 HTTP 服务：对 GET /rest/api/3/issue/ABC-1 返回 {"key":"ABC-1","fields":{"summary":"登录按钮无响应","status":{"name":"待确认"}}}，
# 对其他单号返回 404，并记录收到的请求头；测试看板以 JIRA_URL=<模拟 Jira 地址>、JIRA_EMAIL、JIRA_API_TOKEN（任意测试值）启动。
# "七场景数据"指：测试看板中同一项目（github.com/demo-org/demo-app）的批次 f7 推送了场景文件 f7.yaml：节点 N1 含正向 N1-P01、N1-P02 与反向 N1-N01、N1-N02，
# 节点 N2 含正向 N2-P01、N2-P02 与反向 N2-N01；第 1 轮为 Agent 轮次（执行者 Li Si）：N1-P02 pass、N1-N01 fail、N1-N02 blocked（finding 为"环境未就绪"）、
# N2-P01 pass、N2-P02 pass、N2-N01 skip（finding 为"依赖未部署"），N1-P01 没有结果；第 2 轮为 Tester A 经标记接口对 N2-P01 的人工 pass；
# 第 3 轮为 Tester A 对 N2-P02 的人工 fail，缺陷链接 https://github.com/demo-org/demo-app/issues/1。
# "五场景数据"指：测试看板以 JIRA_URL=https://acme.atlassian.net 启动；同一项目的批次 p5 推送了场景文件 p5.yaml（推送提交号 c0ffee1）：节点 F1 含正向
# TC_DEMO_FLOW_001、TC_DEMO_FLOW_002、TC_DEMO_FLOW_003 与反向 TC_DEMO_FLOW_004、TC_DEMO_FLOW_005；第 1 轮为 Agent 轮次（执行者 Li Si）：001、002、003 pass，
# 004 fail，005 blocked（finding 为"测试环境不可用"）；第 2 轮为张三经标记接口对 001 的人工 pass；第 3 轮为张三对 002 的人工 fail，缺陷链接 ABC-1，备注"复现两次"；
# 批次 p5 上传过一次用例文件 p5-cases.yaml（上传序号 1），含 TC_DEMO_FLOW_001、002、003、009 四条。

metadata:
  requirement: "sop-board 人工复核改版与用例协作：SOP 场景页就地复核、标记接口、用例上传、缺陷链接与 Jira、状态与进度、报告与测试岗结果文件"
  batch: "sop-board-2"
  version: 2
  owner: "AdolphKevin"
  sources:
    - ref: "docs/proposals/2026-10-19-standalone-sop-verification.md 的 D6、D7、D8、D13、D18、D26、D27 与第 4 节 S3"
      version: "v8（2026-10-19）"
      confirmed_by: "AdolphKevin"
    - ref: "docs/designs/SOP-BOARD-2.md 的 I1–I6、D1 节"
      version: "修订 3"
      confirmed_by: "AdolphKevin"
  tags: ["sop-board", "人工复核", "用例协作"]

sops:

  - id: SOP-21
    title: SOP 场景页与就地复核
    actor: "测试同事"
    entry: "浏览器打开批次的 SOP 场景页"
    must:
      - "全部场景都能看到说明并就地复核，包括 Agent 已通过的场景"
      - "通过一键提交；失败与受阻只填缺陷链接，备注选填"
      - "复核不跳转页面"
    scenarios:

      - id: SOP-21-P01
        polarity: positive
        title: SOP 场景页按节点列出全部场景说明与状态
        actor: 测试同事
        priority: P0
        refs: ["I1"]
        verify: web
        initial_state: ["测试看板已推送演示场景文件并登记演示轮次"]
        steps: ["在浏览器打开总览页，点导航中的 SOP 场景", "查看页面内容"]
        expected: ["页面按 N1、N2 分组列出四条场景", "每条显示编号、标题、极性、优先级、角色、验证入口、初始状态、步骤、预期与禁止产生的影响", "每条显示最新 Agent 结果：N1-P01 与 N2-P01 为通过，N1-N01 为失败，N2-N01 为受阻", "每条显示所在队列", "导航中 SOP 场景处于高亮"]
        forbidden_effects: ["页面加载外网资源"]
        evidence_hints: ["整页截图", "页面文本", "浏览器请求记录"]

      - id: SOP-21-P02
        polarity: positive
        title: 筛选的数量与列表正确
        actor: 测试同事
        priority: P1
        refs: ["I1"]
        verify: web
        initial_state: ["测试看板已推送演示场景文件并登记演示轮次", "尚无人工结果"]
        steps: ["在 SOP 场景页依次点全部、未人工复核、Agent 已通过、不通过、受阻", "复制带 ?filter=agent-pass 的地址在新标签页打开"]
        expected: ["全部 4 条", "未人工复核 4 条", "Agent 已通过 2 条：N1-P01、N2-P01", "不通过 1 条：N1-N01", "受阻 1 条：N2-N01", "新标签页直接显示 Agent 已通过的 2 条"]
        forbidden_effects: []
        evidence_hints: ["每个筛选的截图与页面文本"]

      - id: SOP-21-P03
        polarity: positive
        title: 对 Agent 已通过的场景一键标记通过，页面不跳转
        actor: 测试同事
        priority: P0
        refs: ["I1", "I2"]
        verify: web
        initial_state: ["测试看板已推送演示场景文件并登记演示轮次", "SOP 场景页的身份栏已填写标记人张三与写入令牌"]
        steps: ["在 N1-P01 下点通过", "观察页面地址与 N1-P01 的显示", "查看筛选数量", "查询 SQLite 中最新的人工轮次与结果"]
        expected: ["点击后无需填写任何内容即提交", "页面地址不变", "N1-P01 原处显示最新人工结果：通过、标记人张三、本地时间", "未人工复核的数量从 4 变为 3", "SQLite 中新增一个人工轮次，结果的执行者为张三，实际结果为人工复核通过"]
        forbidden_effects: ["浏览器发生页面跳转或整页重新加载", "N1-P01 的 Agent 结果被改写"]
        evidence_hints: ["点击前后的截图", "浏览器请求记录", "SQLite 查询与输出"]

      - id: SOP-21-P04
        polarity: positive
        title: 标记失败时只填缺陷链接，备注可留空
        actor: 测试同事
        priority: P0
        refs: ["I1", "I2"]
        verify: web
        initial_state: ["测试看板已推送演示场景文件并登记演示轮次", "身份栏已填写标记人与写入令牌"]
        steps: ["在 N2-P01 下点失败", "在展开的缺陷链接栏填 https://github.com/demo-org/demo-app/issues/7，备注留空", "点提交"]
        expected: ["点失败后在 N2-P01 下展开缺陷链接与备注两栏，没有其他必填栏", "提交成功，页面不跳转", "N2-P01 原处显示最新人工结果为失败及缺陷链接", "总览页误判明细增加一项 N2-P01", "复测通过率为 0/1"]
        forbidden_effects: ["要求填写实际结果或验证环境"]
        evidence_hints: ["展开栏的截图", "提交后的截图", "总览页文本"]

      - id: SOP-21-N01
        polarity: negative
        negative_type: empty-input
        title: 失败或受阻没有缺陷链接时不提交，取消收起填写栏
        actor: 测试同事
        priority: P0
        refs: ["I1"]
        verify: web
        initial_state: ["测试看板已推送演示场景文件并登记演示轮次", "身份栏已填写标记人与写入令牌"]
        steps: ["在 N1-P01 下点受阻", "缺陷链接留空，备注填写'等环境'，点提交", "在 N2-P01 下点失败，缺陷链接只填三个空格，点提交", "点 N2-P01 的取消"]
        expected: ["两次提交都在对应场景下提示'请填写缺陷链接'", "N1-P01 已填的备注保留", "点取消后 N2-P01 的填写栏收起，通过、失败、受阻三个按钮恢复", "没有发出标记请求", "N1-P01 与 N2-P01 的人工结果与筛选数量不变"]
        forbidden_effects: ["SQLite 新增人工轮次"]
        evidence_hints: ["提示截图", "浏览器请求记录", "SQLite 轮次数"]

      - id: SOP-21-N02
        polarity: negative
        negative_type: permission
        title: 令牌错误时在原处提示且保留内容
        actor: 测试同事
        priority: P1
        refs: ["I1", "I2"]
        verify: web
        initial_state: ["测试看板已推送演示场景文件并登记演示轮次", "身份栏的写入令牌填写为错误值"]
        steps: ["在 N2-P01 下点失败，填写缺陷链接 https://github.com/demo-org/demo-app/issues/8", "点提交"]
        expected: ["N2-P01 下提示令牌无效", "已填的缺陷链接保留", "页面不跳转"]
        forbidden_effects: ["SQLite 新增人工轮次"]
        evidence_hints: ["提示截图", "SQLite 轮次数"]

      - id: SOP-21-N03
        polarity: negative
        negative_type: incomplete-input
        title: 身份栏未填写时先提示填写
        actor: 测试同事
        priority: P2
        refs: ["I1"]
        verify: web
        initial_state: ["测试看板已推送演示场景文件", "浏览器的 localStorage 中没有标记人与令牌"]
        steps: ["打开 SOP 场景页，在 N1-P01 下点通过"]
        expected: ["页面提示先在身份栏填写标记人与写入令牌", "没有发出标记请求"]
        forbidden_effects: ["SQLite 新增人工轮次"]
        evidence_hints: ["提示截图", "浏览器请求记录"]

      - id: SOP-21-P05
        polarity: positive
        title: 场景详情页使用同一组复核控件
        actor: 测试同事
        priority: P1
        refs: ["I1", "I4"]
        verify: web
        initial_state: ["测试看板以 JIRA_URL=https://acme.atlassian.net 启动，已推送演示场景文件并登记演示轮次", "身份栏已填写标记人张三与写入令牌"]
        steps: ["打开 N1-N01 的场景详情页", "点通过", "打开 N2-P01 的场景详情页，点失败", "缺陷链接填 ABC-77，备注留空，点提交"]
        expected: ["详情页显示通过、失败、受阻三个按钮，没有实际结果与验证环境输入栏", "点通过后页面不跳转，详情页的结果历史出现该人工结果", "点失败后只展开缺陷链接与备注两栏及提交、取消按钮", "提交后页面不跳转，N2-P01 的结果历史出现人工结果不通过（失败）、标记人张三，缺陷链接为 https://acme.atlassian.net/browse/ABC-77"]
        forbidden_effects: []
        evidence_hints: ["详情页截图", "提交后的截图"]

      - id: SOP-21-P06
        polarity: positive
        title: 每份证据都可下载，超过 200 行的文本注明截断，文本证据带 charset=utf-8
        actor: 测试同事
        priority: P1
        refs: ["I1"]
        verify: web
        initial_state: ["测试看板已推送演示场景文件", "已登记一轮：N1-P01 为 pass，证据为 run.log（300 行）、notes.md（150 行）、data.json、events.ndjson、plain.txt（均为含中文的 UTF-8 文本）与一张 PNG 图片"]
        steps: ["打开 N1-P01 的详情页，查看每份证据的预览与链接", "逐个请求六份证据的下载地址，记录 Content-Type 与正文字节", "在浏览器中直接打开 run.log 的下载地址"]
        expected: ["六份证据都有下载链接，PNG 图片直接显示", "run.log 的预览只显示前 200 行并注明'只显示前 200 行'；notes.md 的预览显示全部 150 行，没有该注明", "run.log、notes.md、data.json、events.ndjson、plain.txt 的响应内容类型都带 charset=utf-8", "直接打开 run.log 时中文显示正常", "下载的字节与上传的文件相同"]
        forbidden_effects: []
        evidence_hints: ["截图", "响应头", "下载文件的 sha256"]


      - id: SOP-21-P07
        polarity: positive
        title: 批次四个页面共用一行导航，当前页高亮
        actor: 测试同事
        priority: P1
        refs: ["I1"]
        verify: web
        initial_state: ["测试看板已推送演示场景文件"]
        steps: ["打开批次总览 /p/github-com-demo-org-demo-app/b/demo", "依次点导航中的 SOP 场景、用例、进度，再点总览", "在每个页面查看导航行的链接与高亮"]
        expected: ["四个页面顶部都有同一行导航，含总览 /p/github-com-demo-org-demo-app/b/demo、SOP 场景 …/scenarios、用例 …/cases、进度 …/progress 四项", "每个页面只有当前页对应的导航项高亮", "从总览经导航进入 SOP 场景页，从 SOP 场景页经导航回到总览"]
        forbidden_effects: ["页面加载外网资源"]
        evidence_hints: ["四个页面的截图与导航行的 HTML", "浏览器请求记录"]

      - id: SOP-21-P08
        polarity: positive
        title: SOP 场景页显示节点信息、refs、回归声明与两类最新结果的完整字段
        actor: 测试同事
        priority: P0
        refs: ["I1", "I4"]
        verify: web
        initial_state: ["测试看板以模拟 Jira 配置启动并准备了七场景数据，其中 f7.yaml 中 N1-P02 的 refs 为 R1，N2-P01 声明了 regression（check 为 unit，cases 为 tests.test_demo::test_n2）", "张三经标记接口对 N1-P02 登记人工 fail，缺陷链接为 ABC-1"]
        steps: ["打开 /p/github-com-demo-org-demo-app/b/f7/scenarios", "逐个节点、逐条场景核对显示内容", "点 N1-P02 的场景编号"]
        expected: ["场景按 N1、N2 两组显示，每组显示节点编号、标题、角色与入口描述，与 f7.yaml 相同", "每条场景显示编号、标题、极性、优先级、角色、验证入口、初始状态、步骤、预期、禁止产生的影响与 refs，内容与 f7.yaml 相同；N1-P02 的 refs 显示 R1", "N1-P02 的最新 Agent 结果显示通过、执行者 Li Si 与本地时间；最新人工结果显示不通过（失败）、标记人张三、本地时间与缺陷链接 <JIRA_URL>/browse/ABC-1，链接旁显示'登录按钮无响应 · 待确认'", "N2-P01 显示回归声明，内容与 f7.yaml 相同", "所在队列：N1-P01 为待执行；N1-P02、N1-N01、N1-N02、N2-P02、N2-N01 为问题；N2-P01 为已复核通过", "N1-P01 的最新 Agent 结果与最新人工结果两栏为空，N1-N01 的最新人工结果栏为空", "页面上的时间都写成看板所在机器本地时区的 YYYY-MM-DD HH:MM:SS ±HH:MM，不带微秒", "点 N1-P02 的编号进入 /p/github-com-demo-org-demo-app/b/f7/s/N1-P02"]
        forbidden_effects: ["页面源码中出现 JIRA_API_TOKEN 的值"]
        evidence_hints: ["整页截图", "页面文本", "f7.yaml 原文对照"]

      - id: SOP-21-P09
        polarity: positive
        title: 筛选按当前指纹的最新结果计数，地址带 filter 参数可分享
        actor: 测试同事
        priority: P0
        refs: ["I1"]
        verify: web
        initial_state: ["测试看板已准备七场景数据"]
        steps: ["打开 /p/github-com-demo-org-demo-app/b/f7/scenarios（不带参数），读取筛选栏各项的数量", "依次点未人工复核、Agent 已通过、不通过、受阻、全部，记录列表中的场景与地址栏", "在另一个浏览器直接打开 …/scenarios?filter=fail", "在另一个浏览器直接打开 …/scenarios?filter=xyz"]
        expected: ["不带参数时列出全部 7 条，全部处于选中状态", "数量为：全部 7、未人工复核 5、Agent 已通过 3、不通过 2、受阻 1", "未人工复核列出 N1-P01、N1-P02、N1-N01、N1-N02、N2-N01；Agent 已通过列出 N1-P02、N2-P01、N2-P02；不通过列出 N1-N01、N2-P02；受阻列出 N1-N02", "点击各筛选后地址栏依次为 ?filter=unreviewed、?filter=agent-pass、?filter=fail、?filter=blocked、?filter=all", "直接打开 ?filter=fail 时只列出 N1-N01、N2-P02，不通过处于选中状态", "直接打开 ?filter=xyz 时列出全部 7 条"]
        forbidden_effects: []
        evidence_hints: ["每个筛选的截图、页面文本与地址栏"]

      - id: SOP-21-P10
        polarity: positive
        title: 对没有结果与 Agent 已通过的场景一键通过，队列与筛选数量就地更新
        actor: 测试同事
        priority: P0
        refs: ["I1", "I2"]
        verify: web
        initial_state: ["测试看板已准备七场景数据", "SOP 场景页的身份栏已填写标记人张三与写入令牌"]
        steps: ["打开 f7 的 SOP 场景页，记下地址与筛选数量", "在 N1-P02 下点通过", "在 N1-P01 下点通过", "打开 N1-P02 的场景详情页，请求新轮次的轮次接口"]
