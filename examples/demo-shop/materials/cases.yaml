  - id: TC_REFUND_QUERY_001
    title: 查询不存在订单的退款返回空列表
    priority: P2
    type: functional
    preconditions: ["订单 Z 不存在"]
    steps: ["GET /api/refunds?order_id=Z"]
    expected_results: ["返回 200 与空数组"]
    tags: ["flow"]
